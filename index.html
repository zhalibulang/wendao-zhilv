<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>问道之旅 · 四十五日 · 于不浪</title>
<style>
:root{
  --bg:#1a0f2e; --bg2:#241845; --bg3:#2d1f5c;
  --fg:#e8f7d8; --fg2:#c8d8b8; --dim:#9a8abe;
  --neon:#ff5fa8; --cyber:#3df0ff; --gold:#ffd23f; --ok:#7fff7f; --danger:#ff5252;
  --border:#4a2d7a; --border-lit:#7a3dbf;
  --pixel:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --shadow:2px 2px 0 #000;
  --ink2:var(--dim); --serif:var(--pixel); --accent:var(--cyber); --hair:var(--border);
}
/* @font-face 已废弃：改用 iOS 系统字体族，保证清晰易读与跨设备一致性 */
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);font-size:clamp(14px,4.4vw,20px);line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#game{max-width:860px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.hidden{display:none!important}
.serif{font-family:var(--pixel)}
.intlink{color:var(--cyber);text-decoration:underline dotted;text-underline-offset:3px}
.intlink:hover{color:var(--neon)}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--border-lit);padding-bottom:8px;text-shadow:1px 1px 0 #000}
.hd .t{font-weight:600;font-size:clamp(16px,4.8vw,22px);letter-spacing:.14em;color:var(--cyber)}
.hd .t small{font-size:11px;color:var(--dim);letter-spacing:.18em;margin-left:8px}
.hd .stats{font-size:12.5px;color:var(--fg2);display:flex;gap:14px;font-variant-numeric:tabular-nums}
.hd .stats b{color:var(--gold)}
.hd .stats button{background:none;border:none;font:inherit;color:var(--fg2);cursor:pointer;text-decoration:underline;padding:0}
.hd .stats button:hover{color:var(--neon)}
.navline{display:flex;gap:2px;margin:8px 0 0;overflow-x:auto}
.navline button{background:none;border:none;font:inherit;font-size:13px;color:var(--fg2);padding:5px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.navline button.on{color:var(--cyber);border-bottom-color:var(--neon);font-weight:600}
.navline button .dot{display:inline-block;width:6px;height:6px;background:var(--neon);border-radius:50%;margin-left:4px;vertical-align:2px}

/* chat stream */
.stream{flex:1;min-height:0;overflow-y:auto;padding:14px 4px 8px;scroll-behavior:smooth;overscroll-behavior:contain}
.sys{font-size:12px;color:var(--dim);text-align:center;margin:12px 0;letter-spacing:.08em}
.sys.daysep{border-bottom:1px dashed var(--border);padding-bottom:8px;margin-top:22px;letter-spacing:.15em}
.msg{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.msg .avatar{flex:none;width:40px;height:40px;border:2px solid var(--border-lit);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--cyber);box-shadow:2px 2px 0 #000}
.msg .body{max-width:78%}
.msg .name{font-size:12px;color:var(--dim);margin-bottom:2px}
.msg .name b{color:var(--cyber);font-weight:600}
.bubble{background:var(--bg2);border:2px solid var(--border);padding:9px 13px;font-size:14.5px;box-shadow:2px 2px 0 #000}
.bubble.narration{background:none;border:none;color:var(--dim);font-size:13.5px;padding:2px 0;font-style:italic}
.msg.me{flex-direction:row-reverse}
.msg.me .body{text-align:right}
.msg.me .bubble{background:var(--neon);border-color:var(--neon);color:#1a0f2e;text-align:left}
.msg.sysline{justify-content:center}
.msg.sysline .bubble{background:var(--bg2);border:none;font-size:12px;color:var(--dim);padding:4px 10px}

/* quest card in stream */
.qcard{border:2px solid var(--border-lit);background:var(--bg);margin-top:8px;padding:10px 12px;max-width:100%;box-shadow:3px 3px 0 #000;position:relative}
.qrefs{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.qref{border:1px solid var(--cyber);background:rgba(0,229,255,.08);color:var(--cyber);font-size:11.5px;padding:3px 10px;border-radius:12px;cursor:pointer}
.qref:active{transform:scale(.96)}
@keyframes qflashK{0%,100%{box-shadow:3px 3px 0 #000}30%{box-shadow:0 0 0 4px var(--gold);border-color:var(--gold)}}
.qflash{animation:qflashK 1.6s ease}
.qcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 3px);z-index:0}
.qcard>*{position:relative;z-index:1}
.qcard.locked{border-color:var(--border);opacity:.6}
.qcard .qn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;color:var(--fg)}
.qcard .qn .rk{font-size:11px;color:var(--neon)}
.qcard .qg{font-size:12.5px;color:var(--fg2);margin:4px 0 8px}
.qcard .qr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gold)}
.qcard .qr .dur{color:var(--dim)}
.qcard.done{opacity:.75;border-color:var(--border)}
.qcard.done .qn::after{content:" ✓";color:var(--ok)}
.qcard.now{border-color:var(--neon)}
/* 置底当前任务卡（需求2a） */
.pinwrap{margin-top:16px;border:2px solid var(--neon);background:rgba(0,229,255,.05);box-shadow:0 0 12px rgba(0,229,255,.22);padding:8px 10px}
.pinwrap .pinhead{font-size:11px;letter-spacing:.2em;color:var(--neon);margin-bottom:2px}
.pinwrap .qcard{margin-top:6px;box-shadow:2px 2px 0 #000}
.pinwrap.idle{border-color:var(--border-lit);background:var(--bg2);box-shadow:none}
.pinwrap.idle .pinhead{color:var(--gold)}
.pinwrap .pintip{font-size:12.5px;color:var(--fg2);padding:4px 2px}
/* 已完成任务折叠（需求2c） */
.qfold{margin-top:10px}
.qfoldhead{display:flex;align-items:center;gap:7px;border:1px dashed var(--border-lit);background:var(--bg2);padding:7px 10px;font-size:12px;color:var(--fg2);cursor:pointer;max-width:100%}
.qfoldhead:hover{background:var(--bg)}
.qfoldhead .fcar{color:var(--gold);font-size:10px;flex:none}
.qfoldhead .ftext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qfoldhead .fhint{margin-left:auto;font-size:10.5px;color:var(--dim);flex:none}
.qfoldbody{margin-top:6px}
/* 最新回复自动关联当前任务 chip（需求2b） */
.qref.cur{border-color:var(--neon);color:var(--neon);background:rgba(0,229,255,.14)}
.nowtag{font-size:10.5px;color:#1a0f2e;background:var(--neon);padding:2px 8px;margin-left:8px;letter-spacing:.12em;box-shadow:1px 1px 0 #000;font-weight:600}
.donetag{color:var(--ok);font-size:12px;margin-right:8px;white-space:nowrap}
.btn{display:inline-block;border:2px solid var(--border-lit);background:linear-gradient(180deg,var(--bg3) 0%,var(--bg2) 100%);color:var(--fg);font:inherit;font-size:13.5px;
  padding:6px 16px;cursor:pointer;letter-spacing:.06em;transition:none;
  box-shadow:inset 2px 2px 0 var(--border-lit),inset -2px -2px 0 #000,3px 3px 0 #000}
.btn:hover{filter:brightness(1.3)}
.btn:active{transform:translate(2px,2px);box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 var(--border-lit)}
.btn.primary{background:linear-gradient(180deg,var(--neon),#c91e6b);border-color:var(--neon);color:#fff}
.btn.primary:hover{filter:brightness(1.2)}
.btn.primary:active{box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 var(--neon)}
.btn.gold{background:linear-gradient(180deg,var(--gold),#b8902a);border-color:var(--gold);color:#1a0f2e}
.btn.ghost{border-color:var(--dim);color:var(--dim)}
.btn.ghost:hover{border-color:var(--fg2);color:var(--fg2);filter:none}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn:disabled:hover{filter:none}
.btn:disabled:active{transform:none;box-shadow:inset 2px 2px 0 var(--border-lit),inset -2px -2px 0 #000,3px 3px 0 #000}

/* input bar */
.inputbar{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--border);margin-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.inputbar input{flex:1;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:9px 12px}
.inputbar input:focus{outline:none;border-color:var(--neon)}
.inputbar .hint{font-size:11.5px;color:var(--dim);padding-top:12px;white-space:nowrap}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,5,20,.8);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.dlg{background:var(--bg2);border:2px solid var(--border-lit);width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:20px 22px 20px 22px;box-shadow:4px 4px 0 #000;position:relative}
.dlg::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px);z-index:0}
.dlg>*{position:relative;z-index:1}
.dlg h2{font-size:clamp(18px,5.5vw,24px);margin:0 0 2px;padding-right:48px;font-weight:600;color:var(--cyber);text-shadow:2px 2px 0 #000}
.dlg .mt{font-size:12px;color:var(--dim);letter-spacing:.12em;margin-bottom:10px;padding-right:48px}
.dlg .close{position:sticky;top:0;float:right;margin:-20px -22px 0 0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:2px solid var(--border-lit);font-size:22px;line-height:1;cursor:pointer;color:var(--fg2);z-index:10;box-shadow:2px 2px 0 #000;-webkit-tap-highlight-color:transparent;border-radius:0}
.dlg .close:hover{color:var(--neon);border-color:var(--neon)}
.dlg .close:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #000}

/* scroll book pages */
.book{background:var(--bg3);border:2px solid var(--border);padding:14px 16px;margin:10px 0;box-shadow:inset 1px 1px 0 var(--border-lit)}
.book .bp{font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--neon);margin-bottom:8px;text-shadow:1px 1px 0 #000;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.book .bp .pid{font-weight:600}
.book .bp em{font-style:normal;color:var(--gold);font-weight:600}
.book .pt{border-bottom:1px dashed var(--border);padding:7px 0;font-size:14px;line-height:1.6}
.book .pt .pid{font-weight:600;margin-right:8px}
.book .pt .pid .s3{color:var(--neon)}
.book .pt em{font-style:normal;color:var(--gold);font-weight:600}
.book .npcnote{font-size:12.5px;color:var(--dim);border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;font-style:italic}
.book .anchor{background:var(--bg2);border:1px solid var(--border-lit);padding:8px 10px;margin-top:8px;font-size:13px}
.book .anchor b{color:var(--neon)}
/* 打字机效果：当前打字元素高亮 + 末尾闪烁光标 */
.book .pt.tw-active,.book .npcnote.tw-active,.book .anchor.tw-active{background:rgba(0,229,255,.04);border-radius:2px}
.tw-active::after{content:'▋';color:var(--neon);animation:twblink .8s steps(2) infinite;margin-left:1px;font-weight:400}
@keyframes twblink{50%{opacity:0}}
.tw-done{opacity:1!important;transition:none}
.book .oralrow{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.book .oralrow .en{display:block;color:var(--fg);font-size:14px;line-height:1.6}
.book .oralrow .zh{display:block;color:var(--dim);font-size:12.5px;margin-top:4px}

/* 朗读/复述工作台 */
.oralkit{border:2px solid var(--border);background:var(--bg);padding:12px;margin-top:10px}
.oraltxt{position:relative;border:1px dashed var(--border-lit);padding:10px 12px;margin-bottom:8px;line-height:1.7;transition:filter .2s}
.oraltxt.masked .en{filter:blur(7px);user-select:none;pointer-events:none}
.oraltxt.masked .zh{opacity:.35}
.oraltxt .maskhint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--neon);font-size:14px;letter-spacing:.1em;pointer-events:none;text-shadow:1px 1px 0 #000}
.oraltxt.masked .maskhint{display:flex}
.kitbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.kitbar .btn{padding:5px 10px;font-size:12.5px}
.rectimer{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:52px}
.wave{width:100%;height:48px;background:var(--bg2);border:1px solid var(--border);display:block;margin:6px 0}
.kwgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kwchip{border:1px solid var(--border-lit);background:var(--bg2);color:var(--fg2);padding:4px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.kwchip.hit{background:var(--ok);color:#1a0f2e;border-color:var(--ok);text-decoration:line-through}
.kwchip.miss{opacity:.45}
.recscore{font-size:14px;margin-top:6px;padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg3)}
.recscore.good{border-left-color:var(--ok)}
.recscore.bad{border-left-color:var(--danger)}
.speedbtns button.cur{background:var(--neon);color:#fff;border-color:var(--neon)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.pager button{min-width:34px}
.pager .pg{font-size:12.5px;color:var(--dim)}

/* quiz inside modal */
.quiz{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.quiz .qz{font-size:14px;margin:8px 0}
.quiz .qz .kk{font-size:11px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:3px}
.quiz input{width:100%;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:7px 10px;margin-top:4px}
.quiz input:focus{outline:none;border-color:var(--neon)}
.quiz .fb{font-size:13px;margin-top:6px;display:block;line-height:1.7}
.quiz .fb.ok{color:var(--ok)} .quiz .fb.no{color:var(--danger)}
.quiz .fb .btn{margin-top:6px}
.jbtns{display:flex;gap:10px;margin-top:6px}

/* timer */
.timer{font-size:clamp(28px,8vw,40px);text-align:center;font-variant-numeric:tabular-nums;padding:4px 0;color:var(--cyber);text-shadow:2px 2px 0 #000}
.tstate{text-align:center;font-size:12px;color:var(--dim)}

/* lists */
.li{border-bottom:1px solid var(--border);padding:7px 2px;font-size:13.5px}
.li b{color:var(--neon);margin-right:8px}
.ach{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:8px 2px}
.ach .ic{width:28px;height:28px;flex:none;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ach.got .ic{background:var(--neon);color:#1a0f2e;border-color:var(--neon)}
.ach.got b{color:var(--gold)}
.ach .ts{margin-left:auto;font-size:11px;color:var(--dim)}
.heart{border-bottom:1px solid var(--border);padding:9px 2px}
.heart .hn{font-weight:600;color:var(--cyber)}
.heart .ht{font-size:11.5px;color:var(--dim)}
.heart .hl{font-size:14px;margin-top:3px;font-style:italic}
.heart.locked .hl{color:var(--border);font-style:normal}
.shoprow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:7px 2px}
.shoprow input{flex:1;border:none;background:none;font:inherit;border-bottom:1px dashed var(--border);font-size:14px;color:var(--fg)}
.shoprow .cost{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.flashcard{border:2px solid var(--border-lit);padding:22px 18px;text-align:center;margin:12px 0;min-height:150px;background:var(--bg3);box-shadow:3px 3px 0 #000}
.flashcard .fc-id{font-size:12px;color:var(--dim);letter-spacing:.1em}
.flashcard .fc-main{font-size:16px;margin-top:10px;color:var(--fg)}
.flashcard .fc-rev{margin-top:12px;font-size:13px;color:var(--cyber);border-top:1px dashed var(--border);padding-top:10px}
.wrongrow{border-bottom:1px solid var(--border);padding:7px 2px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.wrongrow .retry{margin-left:auto}
.savegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.note{font-size:12px;color:var(--dim);background:var(--bg3);padding:6px 10px;margin:10px 0;border-left:3px solid var(--neon)}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--bg3);color:var(--fg);padding:10px 15px;font-size:13.5px;max-width:300px;animation:tin .25s;border:2px solid var(--border-lit);box-shadow:3px 3px 0 #000}
.toast.gold{background:var(--gold);color:#1a0f2e;border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
footer{color:var(--border);text-align:center;font-size:10.5px;letter-spacing:.2em;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.recctl{display:flex;gap:8px;align-items:center;margin-top:8px}
@media(max-width:560px){.dlg{padding:14px}.msg .body{max-width:88%}.timer{font-size:28px}}

.journey{display:flex;flex-direction:column;gap:14px;margin:12px 0}
.jrow{display:flex;align-items:center;gap:10px}
.jact{width:46px;flex:none;text-align:center}
.jact svg{display:block;margin:0 auto;stroke:var(--cyber)!important}
.jact .an{font-size:11px;color:var(--dim)}
.jnodes{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.jnode{width:34px;height:34px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:var(--bg);font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 #000;transition:none}
.jnode:hover{background:var(--bg3)}
.jnode.cur{border-color:var(--neon);color:var(--neon);font-weight:600;box-shadow:0 0 8px var(--neon),2px 2px 0 #000}
.jnode.done{background:var(--ok);color:#1a0f2e;border-color:var(--ok)}
.jnode.part{background:var(--bg3);border-color:var(--neon)}
.jnode.future{opacity:.4}
.jnode.boss{border-width:2px;border-color:var(--gold)}
.badgewall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2px solid var(--border);padding:14px 10px;text-align:center;background:var(--bg2)}
.badge .bic{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--border)}
.badge.got{border-color:var(--neon)}
.badge.got .bic{border-color:var(--neon);color:var(--neon);background:var(--bg3)}
.badge.got b{color:var(--fg)}
.badge b{font-weight:600;font-size:14px;display:block;color:var(--fg)}
.badge .bd{font-size:12px;color:var(--dim)}
.descbox{background:var(--bg3);border:1px solid var(--border);padding:10px 12px;margin:10px 0;font-size:13.5px}
.descbox .dbg{font-style:italic;color:var(--dim);margin-bottom:6px}
.descbox .dgl{margin:4px 0}
.descbox .dgl b,.descbox .dst b{color:var(--neon);margin-right:6px}
.descbox .dac{border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;color:var(--ok)}

.wow{font-size:14.5px}
.wow .wbg{background:var(--bg3);border-left:3px solid var(--neon);padding:8px 12px;margin:8px 0;font-style:italic;color:var(--cyber)}
.wow .wsec{margin:10px 0}
.wow .wl{font-weight:600;color:var(--neon);letter-spacing:.08em;margin-right:8px}
.wow .witem{color:var(--gold);font-weight:600}
.wow ul{margin:4px 0 4px 18px;padding:0}
.wow li{margin:3px 0}
.wow a{color:var(--cyber);text-decoration:underline}
.gl{border-bottom:1px dashed var(--neon);cursor:help;color:var(--neon)}

/* 藏经阁增强 */

.statbar .sbar{width:clamp(46px,16vw,72px);height:9px;background:var(--bg3);border:1px solid var(--border);position:relative;overflow:hidden}
.statbar .sbar b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--danger),var(--gold));transition:width .3s}
.statbar .sbar.en b{background:linear-gradient(90deg,var(--neon),var(--cyber))}

/* ===== 配置中心 ===== */
.cfgtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cfgtabs button{font:inherit;font-size:12.5px;padding:5px 12px;background:var(--bg3);border:2px solid var(--border);color:var(--fg2);cursor:pointer}
.cfgtabs button.on{background:var(--bg2);border-color:var(--neon);color:var(--neon);box-shadow:2px 2px 0 #000}
.cfgpane{display:none}.cfgpane.on{display:block}
.npcfgcard{border:1px solid var(--border);padding:8px 10px;margin:6px 0;border-radius:4px;background:var(--bg2)}
.cfgrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.cfgrow label{font-size:12.5px;color:var(--dim);min-width:64px}
.cfgrow input[type=text],.cfgrow input[type=password],.cfgrow input[type=number],.cfgrow textarea,.cfgrow select{
  font:inherit;font-size:13.5px;background:var(--bg);border:1px solid var(--border-lit);color:var(--fg);padding:7px 9px;min-width:0;flex:1}
.cfgrow textarea{width:100%;min-height:64px;resize:vertical}

.cfgchips button{font:inherit;font-size:11.5px;padding:3px 9px;background:var(--bg3);border:1px solid var(--border);color:var(--fg2);cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0}
.avcell{border:2px solid var(--border);background:var(--bg2);padding:7px;text-align:center;font-size:11.5px}
.avcell .avbox{width:56px;height:56px;margin:0 auto 5px;border:1px solid var(--border-lit);background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center}
.avcell .avbox img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.avcell .avnm{color:var(--cyber);margin-bottom:3px}
.avcell button{font:inherit;font-size:10.5px;padding:3px 6px;margin:2px 1px 0;background:var(--bg3);border:1px solid var(--border);color:var(--fg2);cursor:pointer}
.avpreview{width:120px;height:120px;border:2px solid var(--border-lit);overflow:hidden;background:var(--bg3);position:relative}
.avpreview img{width:100%;height:100%;object-fit:cover}
.attrctl{display:flex;align-items:center;gap:8px;font-size:13.5px}
.attrctl button{font:inherit;width:30px;height:28px;background:var(--bg3);border:2px solid var(--border-lit);color:var(--neon);cursor:pointer;font-size:15px;line-height:1}
.attrctl b{display:inline-block;min-width:26px;text-align:center;color:var(--gold);font-size:15px}

/* 任务面板（行者手札·任务卷） */

.loadmeter .lmrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:3px}
.loadmeter .lmtrack{height:12px;background:var(--bg3);border:1px solid var(--border);position:relative}
.loadmeter .lmfill{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));transition:width .3s}

.boardgroup{margin:14px 0}
.boardgroup>h3{font-size:14px;color:var(--cyber);margin:0 0 6px;letter-spacing:.1em;text-shadow:1px 1px 0 #000;border-left:3px solid var(--neon);padding-left:8px}
.qrow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg);padding:8px 10px;margin:6px 0;flex-wrap:wrap}

/* 打字复述区 */

/* ===== 可折叠任务树 ===== */
.treetools{display:flex;gap:8px;justify-content:flex-end;margin:6px 0}
.tree{border:1px solid var(--border);background:var(--bg);max-height:320px;overflow-y:auto;padding:4px}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px;cursor:pointer;border-bottom:1px dashed var(--border);transition:background .15s}
.trow:hover{background:var(--bg2)}
.ttog{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--cyber);font-size:12px;border:1px solid var(--border);background:var(--bg3);transition:transform .2s}
.tnode[data-expanded="false"]>.trow .ttog{transform:rotate(0deg)}
.tnode[data-expanded="true"]>.trow .ttog .tcar{display:inline-block;transform:rotate(90deg)}
.tnode:not([data-has-children="true"]) .ttog{visibility:hidden}
.tchildren{margin-left:18px;border-left:2px dotted var(--border-lit);padding-left:6px}
.tnode[data-expanded="false"]>.tchildren{display:none}
.tnode[data-level="0"]>.trow{font-weight:600;color:var(--cyber);font-size:13.5px}
.tnode[data-level="1"]>.trow{color:var(--fg2);font-size:13px}
.tnode[data-level="2"]>.trow{color:var(--fg);font-size:12.5px}
.tdot{width:9px;height:9px;flex:none;border:2px solid var(--border)}
.trow.done .tdot{background:var(--ok);border-color:var(--ok)}
.trow.cur .tdot{background:var(--neon);border-color:var(--neon);box-shadow:0 0 5px var(--neon)}
.trow.locked .tdot{background:transparent}
.tlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.locked .tlabel{color:var(--dim)}

/* ===== 藏经阁卡片堆 ===== */
.carddeck{display:flex;flex-direction:column;align-items:center;margin:12px 0}
.cardstack{position:relative;width:100%;max-width:520px;height:320px;margin-bottom:10px}
.qcard3d{position:absolute;inset:0;background:var(--bg2);border:2px solid var(--border-lit);padding:16px 18px;overflow-y:auto;box-shadow:4px 4px 0 #000;transition:transform .25s ease,opacity .25s}
.qcard3d.c0{z-index:3;transform:translateY(0)}
.qcard3d.c1{z-index:2;transform:translate(6px,6px);opacity:.6;border-color:var(--border)}
.qcard3d.c2{z-index:1;transform:translate(12px,12px);opacity:.35;border-color:var(--border)}
.qcard3d .ccat{font-size:11px;color:var(--neon);letter-spacing:.12em;margin-bottom:6px}
.qcard3d .cid{font-weight:600;color:var(--cyber);font-size:13px;margin-bottom:6px}
.qcard3d .cen{font-size:14px;line-height:1.7;color:var(--fg);white-space:pre-wrap}
.qcard3d .czh{font-size:13px;color:var(--fg2);margin-top:10px;line-height:1.7;white-space:pre-wrap}
.qcard3d .canchor{margin-top:10px;font-size:12.5px;background:var(--bg3);border-left:3px solid var(--gold);padding:6px 9px;color:var(--fg2)}
.qcard3d .cstar{color:var(--gold)}
.cardtools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:520px}
.cardpos{font-size:12.5px;color:var(--dim);text-align:center;margin:4px 0;font-variant-numeric:tabular-nums}
.cardsearch{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.cardsearch input{flex:1;min-width:160px;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;padding:7px 10px}
.cardsearch select{border:2px solid var(--border);background:var(--bg3);color:var(--fg);font:inherit;font-size:13px;padding:7px}
.fliphint{font-size:11.5px;color:var(--dim);text-align:center}

/* ===== 吟游独立线 ===== */
.oraltree .trow.oral{border-left:3px solid var(--cyber)}
.fab{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:50;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(180deg,var(--neon),#c91e6b);color:#fff;border:2px solid #fff;font-size:24px;
  box-shadow:3px 3px 0 #000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab:active{transform:translate(2px,2px)}
.oralprog{height:10px;background:var(--bg3);border:1px solid var(--border);margin:6px 0}
.oralprog div{height:100%;background:linear-gradient(90deg,var(--cyber),var(--neon))}

/* ===== 内容编辑器 ===== */
.editor textarea{width:100%;min-height:180px;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;line-height:1.7;padding:10px;resize:vertical}
.editor .estatus{font-size:12px;margin:6px 0}
.editor .estatus.saved{color:var(--ok)} .editor .estatus.dirty{color:var(--gold)}
.vhist{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;max-height:160px;overflow-y:auto}
.vhist .vitem{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dotted var(--border);font-size:12px}
.vhist .vitem.cur{background:var(--bg3)}
.vhist .vat{color:var(--dim);flex:none;width:96px}
.vhist .vprev{flex:1;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editbtn{font-size:11px;padding:2px 8px}

/* ===== 像素头像（对话流/面板通用） ===== */
.pixav{width:100%;height:100%;image-rendering:pixelated;display:block}
/* 对话中的 NPC 名可点击发起对话 */
.nl{color:var(--cyber);cursor:pointer;border-bottom:1px dashed var(--cyber)}
.nl:active{opacity:.7}
/* typing 提示 */
.bubble.typing{display:flex;gap:5px;padding:10px 14px}
.bubble.typing span{width:6px;height:6px;background:var(--cyber);animation:typ 1s infinite}
.bubble.typing span:nth-child(2){animation-delay:.2s}
.bubble.typing span:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
/* NPC 角色成长 */
.growth{font-size:12.5px;color:var(--fg2);background:var(--bg3);border-left:3px solid var(--gold);padding:6px 9px;margin-top:8px}
.growth b{color:var(--gold)}
.gstory{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
/* ===== 特效层 ===== */
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden}
.fxf{position:absolute;font-weight:600;color:var(--gold);text-shadow:2px 2px 0 #000,0 0 10px rgba(255,210,63,.35);animation:fxfUp 1.4s ease-out forwards;font-size:clamp(16px,4.6vw,22px);letter-spacing:.1em;transform:translate(-50%,0);white-space:nowrap}
.fxf.cy{color:var(--cyber);text-shadow:2px 2px 0 #000,0 0 10px rgba(61,240,255,.35)}
.fxf.ok{color:var(--ok)}
@keyframes fxfUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,-12px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-84px) scale(1)}}
.fxp{position:absolute;width:8px;height:8px;box-shadow:2px 2px 0 rgba(0,0,0,.45);animation:fxpFly 1.05s ease-out forwards;will-change:transform,opacity}
@keyframes fxpFly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(240deg)}}
.fxflash{position:absolute;inset:0;background:radial-gradient(circle,rgba(255,210,63,.22),transparent 70%);animation:fxfo .95s ease-out forwards}
@keyframes fxfo{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.fxlv{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;animation:fxlvIn 2.3s ease-out forwards;width:100%}
.fxlv .l1{font-size:clamp(26px,8vw,46px);color:var(--gold);text-shadow:3px 3px 0 #000,0 0 22px rgba(255,210,63,.55);letter-spacing:.24em;font-weight:700}
.fxlv .l2{font-size:clamp(13px,4vw,18px);color:var(--cyber);text-shadow:2px 2px 0 #000;margin-top:8px;letter-spacing:.3em}
@keyframes fxlvIn{0%{opacity:0;transform:translate(-50%,-28%) scale(.7)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.07)}28%{transform:translate(-50%,-50%) scale(1)}76%{opacity:1}100%{opacity:0;transform:translate(-50%,-72%) scale(.96)}}
.fxseal{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--ok);color:var(--ok);font-size:clamp(30px,9vw,54px);font-weight:700;padding:6px 20px;letter-spacing:.34em;text-shadow:2px 2px 0 #000;box-shadow:0 0 0 2px rgba(127,255,127,.25),4px 4px 0 rgba(0,0,0,.5);background:rgba(20,30,20,.35);animation:fxsealIn 1.65s ease-out forwards}
@keyframes fxsealIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.3)}22%{opacity:.96;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}72%{opacity:.96}100%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(.94)}}

<body>
<div id="game"></div>
<div class="toasts" id="toasts"></div>
<script src="game-data.js"></script>
<script src="wd-cfg.js"></script>
<script src="wd-mem.js"></script>
<script src="wd-quiz.js"></script>
<script src="wd-chat.js"></script>
<script src="wd-avatar.js"></script>
<script src="wd-fx.js"></script>
<script>

"use strict";
/* ================= 问道之旅 v2 · 对话流引擎 ================= */
const D = window.GAME_DATA;
const $ = (s,el=document)=>el.querySelector(s);
/* 交互兼容垫片：全站按钮统一监听 pointerdown（消除 300ms 延迟）。
   个别旧浏览器/内嵌 WebView 只派发 mouse 事件而无 pointer 事件，
   此处于捕获阶段补发 pointerdown；现代浏览器原生 pointerdown 先行，
   500ms 内的同源 mousedown 视为兼容事件直接忽略，杜绝重复触发。*/
(function(){
  let lastPD=0;
  document.addEventListener("pointerdown",()=>{ lastPD=Date.now(); },true);
  document.addEventListener("mousedown",e=>{
    if(Date.now()-lastPD<500) return;
    const t=e.target;
    if(!t||!t.dispatchEvent) return;
    try{ t.dispatchEvent(new (window.PointerEvent||MouseEvent)("pointerdown",{bubbles:true,cancelable:true,view:window})); }catch(_){}
  },true);
})();
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mdClean = s=>String(s).replace(/\*\*/g,"").replace(/^#{1,6}\s+/gm,"").replace(/^[-*]\s+/gm,"· ").replace(/`/g,"");
/* ================= 音效引擎（Web Audio 合成，无外部文件，离线可用） ================= */
let _ac=null;
function ac(){ if(!_ac){ try{ _ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(_ac&&_ac.state==="suspended") _ac.resume(); return _ac; }
function tone(freq,dur,type,vol,when){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();
  o.type=type||"square"; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||0.06,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.1));
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+(dur||0.1)+0.02);
}
const SFX={
  tap:()=>tone(660,0.06,"square",0.04),
  start:()=>{tone(523,0.09,"square",0.05);tone(784,0.12,"square",0.05,0.09);},
  stop:()=>tone(392,0.12,"square",0.05),
  ok:()=>{tone(523,0.08,"triangle",0.07);tone(659,0.08,"triangle",0.07,0.08);tone(784,0.16,"triangle",0.07,0.16);},
  no:()=>{tone(220,0.15,"sawtooth",0.05);tone(180,0.2,"sawtooth",0.05,0.1);},
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,0.14,"triangle",0.07,i*0.1));},
  mask:()=>tone(880,0.05,"sine",0.04),
  flip:()=>{tone(740,0.05,"triangle",0.05);tone(988,0.07,"triangle",0.05,0.05);},
};
const NPC = Object.fromEntries(D.npcs.map(n=>[n.id,n]));
const DAYS = D.days, byDay = Object.fromEntries(DAYS.map(d=>[d.day,d]));
const QMAP = Object.fromEntries(D.quests.map(q=>[q.id,q]));
/* ---------- NPC 职能重构：全程引导者「云蘅」+ 全角色×四章互动矩阵 ----------
   所有 NPC 自序章起即由云蘅引见现身（不再按幕锁于雾中），
   但各章互动话题仍随当前幕推进；任务解锁门禁不受影响。 */
if(!NPC.yunheng){
  const GUIDE={id:"yunheng",name:"云蘅",title:"引路人",intro:"导游异次元的接引者，行走在五幕之间。不授业，只引路——把合适的人，在合适的时刻，带到你面前。"};
  D.npcs.unshift(GUIDE); NPC.yunheng=GUIDE;

const qDone=id=>!!st.done[id];
function dayProg(d){ let n=0; d.quests.forEach(q=>{if(qDone(q.id))n++;}); return {n,all:d.quests.length}; }
function totals(){ let a=0,c=0; DAYS.forEach(d=>{const p=dayProg(d); a+=p.all; c+=p.n;}); return {c,a}; }
function streak(){
  const ds=[...new Set(Object.values(st.done).map(v=>v.slice(0,10)))].sort(); let s=0;
  for(let i=ds.length-1;i>=0;i--){ if(i===ds.length-1||Math.round((new Date(ds[i+1])-new Date(ds[i]))/864e5)===1) s++; else break; }
  return s;
}
function questUnlocked(q){
  if(!q.prev||!q.prev.length) return true;
  return q.prev.every(p=>qDone(p));
}

/* ---------- stream derivation ---------- */
function buildStream(){
  const out=[];
  for(let day=1;day<=st.unlocked;day++){
    const d=byDay[day]; if(!d) continue;
    const prog=dayProg(d);
    const hasUndone=d.quests.some(q=>!qDone(q.id));
    out.push({t:"sysday",x:`第 ${d.day} 日 · ${d.date} · 星期${d.week} · ${D.acts[d.act]}`});
    if(hasUndone) out.push({t:"npc",npc:d.npc,x:d.line});
    d.quests.forEach(q=>{
      const un=questUnlocked(q), done=qDone(q.id);
      if(done){
        out.push({t:"sys",x:`✓ ${q.name} 已完成 · +${q.xp}修行 +${q.coin}铜钱`,qid:q.id});
        return;
      }
      if(un){
        out.push({t:"npc",npc:q.npc,x:pubLine(q,d)});
        out.push({t:"quest",qid:q.id});
      }
    });
    if(prog.n===prog.all&&prog.all>0){
      out.push({t:"sys",x:`第${d.day}日修行圆满（${prog.all}/${prog.all}）`});
      if(day===45) out.push({t:"npc",npc:"qingxuan",x:"四十五日，功德圆满。金榜台上，我为你备了一盏灯。"});
    } else if(prog.n<prog.all&&day<st.unlocked){
      out.push({t:"sys",x:`此日尚有 ${prog.all-prog.n} 项未竟——随时可补`});
    }
  }
  const t=totals();
  if(t.c===t.a&&t.a>0) out.push({t:"sys",x:`全程圆满（${t.a}/${t.a}）· 导游试炼功德圆满`});
  return out;
}

/* 全链路中第一个「已解锁未完成」的关卡（群聊 NPC 接话/任务发布的事实源） */
function firstActiveQuest(){
  if(!st) return null;
  for(let day=1;day<=st.unlocked;day++){
    const d=byDay[day]; if(!d) continue;
    for(const q of d.quests){ if(!qDone(q.id)&&questUnlocked(q)) return q; }
  }
  return null;
}
function inputHint(){
  return "自由发言，总会有人接话……（@青玄 可指定同道，@所有人 全员回应）";
}
/* typing 指示：AI 接话期间在流尾显示省略气泡（不落存档） */
let TYPING=null;
function typing(on,multi){
  TYPING=on?{multi:!!multi}:null;
  if($("#stream")) renderChat(true);

/* 自由发言智能路由：无 @提及时，按职能关键词→当前关卡接洽人→引路人云蘅 兜底，
   保证玩家每一句自由发言都至少有一位职能匹配的 NPC 出面回应 */
const NPC_ROLE_KW={
  smq:["山河","地形","山","水","长城","十三陵","地貌","剑"],
  tiemian:["法条","法规","法律","政策","条例","处罚","规定","合同"],
  liuruyan:["行会","旅行社","接待","沟通","客人","服务","人际","礼仪"],
  moxiaogu:["遗迹","故宫","天坛","机关","建筑","文物","年表","历史"],
  xuanji:["错题","星盘","题","考","卦","复习","记忆","背诵","英文","单词"],
  qingxuan:["主线","剧情","背景","故事","世界观","文脉","符文"],
  yunheng:["引路","怎么玩","操作","下一步","开始","指引","求助","帮"]
};
function routeNpc(text){
  const raw=String(text||"");
  /* 直接呼叫任一 NPC 的原名/自定义名/称号（不带 @ 也算点名） */
  if(window.WDCfg){
    for(const id of Object.keys(NPC)){
      const n=NPC[id];
      const names=[n.name,n.title, WDCfg.npcName(id,""), WDCfg.npcTitle(id,"")].filter(x=>x&&x.length>=2);
      if(names.some(nm=>raw.includes(nm))) return id;
    }
  }
  for(const id in NPC_ROLE_KW){
    if(NPC_ROLE_KW[id].some(k=>raw.includes(k))) return id;
  }
  const aq=firstActiveQuest();
  if(aq&&NPC[aq.npc]) return aq.npc;
  return "yunheng";
}
/* NPC 显示名/称号：玩家自定义优先，原始数据仅以 ID 索引 */
function dName(id){ const n=NPC[id]; return (window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,n?n.name:id):(n?n.name:id); }
function dTitle(id){ const n=NPC[id]; return (window.WDCfg&&WDCfg.npcTitle)?WDCfg.npcTitle(id,n?(n.title||""):""):(n?(n.title||""):""); }
/* 玩家口吻开场白：点击 NPC 名字时自动生成一句符合当下情境的玩家发言 */
function playerOpener(npcId){
  const nm=dName(npcId);
  const aq=firstActiveQuest();
  const pool=aq?[
    nm+"，「"+aq.name+"」这一关我想先听你说说该怎么下手",
    nm+"，现下这桩「"+aq.name+"」，我该备些什么",
    "正卡在「"+aq.name+"」——"+nm+"，给我指条路",
    nm+"，这关的底细你给我透一透呗"
  ]:[
    nm+"，接下来我该往哪走",
    nm+"，今日的事都交割了，再给我派一桩？",
    nm+"，闲着也是闲着，说说前头的局势吧"
  ];
  const seed=Date.now()+hashStr(pool.join());
  return pool[seed%pool.length];
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
/* 统一应答：把玩家发言落档 → 指定 NPC 群聊接话（永不冷场）；落档注入当前任务 refs（需求2b） */
function npcAnswer(targets,text){
  const all=targets.length>1;
  typing(true,all);
  toast(all?"各位已收到喊话……":"正在与"+dName(targets[0])+"对话……");
  let done=0;
  targets.forEach(id=>{
    aiRespond(id,text,all).then(r=>{
      const aqR=firstActiveQuest();
      const m={role:"npc",npc:id,text:r.text,at:new Date().toISOString(),day:st.day};
      if(!r.refs&&aqR) m.refs=[{qid:aqR.id}];   // 关联当前在途任务，流内可跳转
      st.dialogue.push(m);
      if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
      save();
      if(r.degraded) toast(dName(id)+"以本地话术接了话（AI暂不可用）");
      if(++done===targets.length){ typing(false); renderChat(); } else renderChat(true);
    }).catch(()=>{ if(++done===targets.length){ typing(false); renderChat(); } });
  });
}
function sendChat(){
  const inp=$("#chatInput"); const v=inp.value.trim(); if(!v) return;
  st.notes[st.day+"_"+Date.now()]=v;
  inp.value="";
  const mentioned=parseMention(v);
  // 任意自由发言均永久入档——群聊式发言环境，不再只有 @提及 才有回应
  st.dialogue.push({role:"player",text:v,at:new Date().toISOString(),day:st.day});
  if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  save(); renderChat(true);
  // @全员 → 各 NPC 并行接话；@单人 → 指定回应；无 @ → 云蘅代为引荐职能NPC
  if(mentioned==="__ALL__") npcAnswer(Object.keys(MENTION_ALIASES),v);
  else if(mentioned) npcAnswer([mentioned],v);
  else yunhengProxy(v);
}
/* 云蘅代@机制：未指定 NPC 时，云蘅先接话引荐，再由职能 NPC 回应 */
function yunhengProxy(text){
  const target=routeNpc(text);
  /* 如果路由结果就是云蘅自己，只回一句即可 */
  if(target==="yunheng"){ npcAnswer(["yunheng"],text); return; }
  const nm=dName(target);
  /* 云蘅先以引路人身份接住话，并替玩家引荐职能 NPC */
  const proxyText="@"+nm+" 这位道友问了「"+String(text).replace(/^@[^\s，。,,\s]+\s*/,"").slice(0,20)+"」——你来说说";
  typing(true,true);
  toast("云蘅正在为你引荐"+nm+"……");
  aiRespond("yunheng",proxyText,true).then(r=>{
    const aqP=firstActiveQuest();
    const m={role:"npc",npc:"yunheng",text:r.text,at:new Date().toISOString(),day:st.day};
    if(!r.refs&&aqP) m.refs=[{qid:aqP.id}];
    st.dialogue.push(m);
    if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
    save(); renderChat(true);
    /* 紧接着职能 NPC 回应玩家原话 */
    aiRespond(target,text,true).then(r2=>{
      const aqP2=firstActiveQuest();
      const m2={role:"npc",npc:target,text:r2.text,at:new Date().toISOString(),day:st.day};
      if(!r2.refs&&aqP2) m2.refs=[{qid:aqP2.id}];
      st.dialogue.push(m2);
      if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
      save(); typing(false); renderChat();
    }).catch(()=>{ typing(false); renderChat(); });
  }).catch(()=>{ typing(false); renderChat(); });
}

/* 点击对话流中的 NPC 名：自动生成玩家情境开场白并触发该 NPC 的标准回应 */

function renderChat(keep){
  const view=$("#stream");

/* ==================== 书页打字机效果 ====================
   初始逐字显示（~300字/分，提速1倍）；每次点击展开当前正在打字的一个完整文本段，
   随后继续下一段的打字机效果，直至所有预设文本段均完成展开。
   - 标签（<span><em>等）即时输出，仅文字逐字显示，保证 HTML 结构完整
   - 点击委托绑定在 pageHost 上，typewriter 重建 innerHTML 后术语仍可点 */
let twTimer=null, twState=null;
const TW_SPEED=200; /* ms/char ≈ 300字/分（偏快的平均打字速度，提速1倍） */
function stopTypewriter(){
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  if(twState&&twState.items){ twState.items.forEach(it=>{ if(it.el) it.el.classList.remove('tw-active'); }); }
  twState=null;
}
function startTypewriter(host){
  stopTypewriter();
  if(!host||typeof host.querySelectorAll!=='function') return;
  const els=host.querySelectorAll('.book .pt, .book .npcnote, .book .anchor');
  if(!els||!els.length) return;
  /* 预解析：标签即时输出，文字逐字 */
  const items=Array.from(els).map(el=>{
    const html=el.innerHTML;
    const tokens=[];
    let i=0;
    while(i<html.length){
      if(html[i]==='<'){
        const end=html.indexOf('>',i);
        if(end>=0){ tokens.push({t:1,h:html.slice(i,end+1)}); i=end+1; }
        else{ tokens.push({t:0,c:html[i]}); i++; }
      } else { tokens.push({t:0,c:html[i]}); i++; }
    }
    el.innerHTML='';
    el.classList.add('tw-active');
    return {el,html,tokens,pos:0};
  });
  twState={items,idx:0,built:'',done:false};
  twStep();
}
function twStep(){
  if(!twState||twState.done) return;
  if(twState.idx>=twState.items.length){
    twState.done=true;
    /* 全部打完：恢复术语点击绑定 */
    const host=document.querySelector('#pageHost');
    if(host) twBindGlossary(host);
    return;
  }
  const it=twState.items[twState.idx];
  /* 每tick输出一个文字字符（标签即时输出不计等待） */
  while(it.pos<it.tokens.length){
    const tk=it.tokens[it.pos];
    if(tk.t===1){ twState.built+=tk.h; it.pos++; }
    else { twState.built+=tk.c; it.pos++; break; }
  }
  it.el.innerHTML=twState.built;
  if(it.pos>=it.tokens.length){
    /* 当前段落打完，移除光标，进入下一段 */
    it.el.classList.remove('tw-active');
    twState.idx++; twState.built='';
    twTimer=setTimeout(twStep,300); /* 段落间短暂停顿 */
  } else {
    twTimer=setTimeout(twStep,TW_SPEED);
  }
}
function typewriterExpand(){
  if(!twState||twState.done) return;
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  /* 每次点击：立即展开当前正在打字的这一段（填充完整内容），随后继续下一段的打字机效果。
     若当前段已打完（idx 已指向下一段），则跳过展开直接继续打下一段；直至所有段完成。 */
  const it=twState.items[twState.idx];
  if(it){ it.el.innerHTML=it.html; it.el.classList.remove('tw-active'); it.pos=it.tokens.length; }
  twState.idx++; twState.built='';
  SFX.tap();
  if(twState.idx>=twState.items.length){
    /* 所有预设文本段均完成展开 */
    twState.done=true;
    const host=document.querySelector('#pageHost');
    if(host) twBindGlossary(host);
  } else {
    /* 200ms 后开始下一段的打字机效果 */
    twTimer=setTimeout(twStep,200);
  }
}
/* 术语点击绑定（独立函数，typewriter 完成后可重新调用） */
function twBindGlossary(host){
  if(!host||typeof host.querySelectorAll!=='function') return;
  host.querySelectorAll('.gl').forEach(sp=>{
    if(sp._glBound) return; sp._glBound=true;
    sp.onpointerdown=(e)=>{
      e.stopPropagation();
      const g=D.glossary[sp.dataset.g]; if(!g) return;
      const gc=document.createElement('div'); gc.className='gcard';
      gc.innerHTML='<div class="gw">'+esc(sp.dataset.g)+'</div>'
        +'<div class="gs"><b>是什么</b>'+esc(g.what)+'</div>'
        +'<div class="gs"><b>装到哪</b>'+esc(g.where)+'</div>'
        +'<div class="gs"><b>为什么</b>'+esc(g.why)+'</div>';
      document.body.appendChild(gc);
      setTimeout(()=>{ try{gc.remove();}catch(e){} },6000);
      gc.onpointerdown=()=>gc.remove();
    };
  });
}

  function kwExtract(en){
    const stop=new Set(["the","a","an","and","or","of","to","in","on","at","for","with","is","are","was","were","be","been","it","its","this","that","these","those","we","you","they","he","she","as","by","from","has","have","had","will","would","can","could","our","their","his","her","not","but","also","been","which","when","where","who","there","here","than","then","into","about"]);
    const words=String(en).toLowerCase().replace(/[^a-z'\- ]/g," ").split(/\s+/).filter(w=>w.length>=4&&!stop.has(w));
    const seen=new Set(), out=[];
    for(const w of words){ const k=w.replace(/[^a-z']/g,""); if(!seen.has(k)){ seen.add(k); out.push(k); } if(out.length>=8) break; }
    return out;
  }
  function drawWave(canvas, analyser){
    const ctx2d=canvas.getContext("2d");
    const W=canvas.width=canvas.offsetWidth, H=canvas.height=canvas.offsetHeight||48;
    const data=new Uint8Array(analyser.frequencyBinCount);
    function loop(){
      analyser.getByteFrequencyData(data);
      ctx2d.clearRect(0,0,W,H); ctx2d.fillStyle="#241845"; ctx2d.fillRect(0,0,W,H);
      const bars=40, bw=W/bars;
      for(let i=0;i<bars;i++){
        const v=data[Math.floor(i/bars*data.length)]/255;
        const h=Math.max(2,v*H);
        ctx2d.fillStyle = v>0.6?"#ff5fa8":(v>0.3?"#3df0ff":"#4a2d7a");
        ctx2d.fillRect(i*bw+1, H-h, bw-2, h);
      }
      if(canvas.dataset.live==="1") requestAnimationFrame(loop);
    }
    loop();
  }
  function fmtTime(s){ const m=Math.floor(s/60), ss=Math.floor(s%60); return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
  function bindOralKit(host){
    const enEl=$("#oralEn",host), txtBox=$("#oralTxt",host), cv=$("#waveCv",host);
    const recBtn=$("#recBtn",host), pauseBtn=$("#pauseBtn",host), redoBtn=$("#redoBtn",host), timer=$("#recTimer",host);

    let fsz=15, rec=null, chunks=[], stream=null, analyser=null, audioUrl=null, audio=null, audioNode=false, rate=1, tick=null, secs=0, checked=new Set();
    // 录音能力检测：浏览器仅在「安全上下文」（https 或 localhost）且授权麦克风后开放 MediaRecorder
    const recCap = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
    if(!recCap){
      stateEl.innerHTML = "⚠️ 当前环境无法录音（浏览器要求 https 或 localhost，并需授权麦克风）。<br>解决：用 Safari 打开 https 链接 / 添加到主屏幕后允许麦克风；或直接点上方「⌨️ 打字复述」默写对照。";
      stateEl.style.color = "var(--gold)";
      [recBtn,recBig].forEach(b=>{ if(b){ b.disabled=true; b.textContent="🎙️ 录音不可用（见下方说明）"; } });
    }
    const kws=kwExtract(enEl.textContent);
    // 关键词自评 chips
    kwGrid.innerHTML=kws.map(k=>`<button class="kwchip" type="button" data-k="${esc(k)}">${esc(k)}</button>`).join("");
    kwGrid.querySelectorAll(".kwchip").forEach(ch=>{
      ch.onpointerdown=()=>{ SFX.tap(); ch.classList.toggle("hit"); const k=ch.dataset.k; if(ch.classList.contains("hit"))checked.add(k);else checked.delete(k); score(); };
    });
    function score(){
      if(!checked.size){ scoreBox.style.display="none"; return; }
      const pct=Math.round(checked.size/kws.length*100);
      const cls=pct>=70?"good":(pct>=40?"":"bad");
      const tip=pct>=70?"脱口而出——可以过关！":(pct>=40?"大半在口——再读两遍。":"卡壳较多——回到原文重读。");
      if(pct>=70) SFX.ok(); else if(pct<40) SFX.no();
      scoreBox.style.display="block"; scoreBox.className="recscore "+cls;
      scoreBox.textContent=`复述覆盖率 ${pct}%（${checked.size}/${kws.length} 关键词）· ${tip}`;
    }
    // 字号
    host.querySelectorAll("[data-fz]").forEach(b=>b.onpointerdown=()=>{ SFX.tap(); fsz=Math.max(11,Math.min(24,fsz+(b.dataset.fz==="+"?1.5:-1.5))); enEl.style.fontSize=fsz+"px"; });
    // 遮文复述
    const maskBtn=host.querySelector("[data-mask]");
    maskBtn.onpointerdown=()=>{ SFX.mask(); const on=txtBox.classList.toggle("masked"); maskBtn.classList.toggle("primary",on); maskBtn.textContent=on?"显示原文":"遮文复述"; };

/* ---------- 任务结算（finBtn 抽取为全局函数，便于测试与复用） ---------- */
function settleQuest(q,quizPerfect,ov){
  st.xp+=q.xp; st.coin+=q.coin; st.done[q.id]=new Date().toISOString();
  /* NPC 记忆：任务完成——通关时长由进入时间戳自动算出，首通且全对记一次性通关 */
  if(window.WDMem){ WDMem.finish(q.npc,q.id,{onePass:quizPerfect}); if(questTimer){clearInterval(questTimer);questTimer=0;} }
  st.fav[q.npc]=(st.fav[q.npc]||0)+1;
  record("任务完成", q.name+"（+"+q.xp+" 修行 +"+q.coin+" 铜钱）");
  if(st.day===q.day&&q.kind==="main"&&st.unlocked===q.day&&st.unlocked<45) st.unlocked++;
  maybeUnlockDay();
  // 玩家行动自动入流：先落模板战报，AI 在线时异步润色（群聊里玩家先报，NPC 再接）
  const aid=pushAction("我交割了「"+q.name+"」（+"+q.xp+"修行 +"+q.coin+"铜钱）。");
  refineAction(aid,q);
  // 三节点之②③合并为一条群聊消息（NPC 不连发多条）：认可 + 后续任务预告，refs 携带任务跳转
  const fresh=D.quests.filter(qq=>!qDone(qq.id)&&questUnlocked(qq)&&qq.prev&&qq.prev.includes(q.id));
  let ackText=(doneLine(q,byDay[q.day])||"很好。")+"「"+q.name+"」已交付（+"+q.xp+"修行 +"+q.coin+"铜钱）。";
  const refs=[{qid:q.id}];
  const nq=fresh[0]||null;
  if(nq){
    const nd=byDay[nq.day];
    ackText+=" "+(pubLine(nq,nd)||"新的一程开启了。")+"「"+nq.name+"」已现形，随到随打。";
    refs.push({qid:nq.id});
  }
  st.dialogue.push({role:"npc",npc:q.npc,text:ackText,refs,at:new Date().toISOString(),day:st.day});
  if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  /* 引路人云蘅结算接棒（需求1）：任务NPC结算回复之后立即给出——任务总结+经验分析+下一任务引导。
     本地模板同步落流（<200ms），AI 在线时异步润色就地替换（不耗灵力，同战报润色模式） */
  const ymsg={id:"yh_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),role:"npc",npc:"yunheng",
    text:yunhengSettleLocal(q,nq,quizPerfect),refs:[{qid:q.id}].concat(nq?[{qid:nq.id}]:[]),
    at:new Date().toISOString(),day:st.day};
  st.dialogue.push(ymsg);
  if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  refineYunheng(ymsg.id,q,nq,quizPerfect);
  // NPC 个人故事线：随任务里程碑自然续写
  WDChat.storyAppend(q.npc,"与玩家并肩，见证了「"+q.name+"」的交付");
  // 交付特效：完成印章 + 修行/铜钱飘字 + 金粒子
  WDFx.questDone(q.xp,q.coin);
  SFX.win(); if(ov)ov.remove(); checkAch(); checkLevelUp(); save(); render();
  toast(doneLine(q,byDay[q.day])||"完成");
}
/* 云蘅结算本地模板（降级兜底 + AI 润色前的即时版本）：三段式——总结/经验/引导 */
function yunhengSettleLocal(q,nq,perfect){
  const d=byDay[q.day], p=dayProg(d);
  const total=D.quests.filter(x=>qDone(x.id)).length;
  const parts=[];
  parts.push("「"+q.name+"」收进行囊了（+"+q.xp+"修行 +"+q.coin+"铜钱）。"+(doneLine(q,d)||"干净利落。"));
  parts.push(perfect
    ?"试炼全对——这一式的根基扎得稳。当日 "+p.n+"/"+p.all+"，全程已破 "+total+"/"+D.quests.length+"。"
    :"试炼里有磕绊，错处已记上星盘——回头清一遍，别让遗忘怪过夜。当日 "+p.n+"/"+p.all+"，全程已破 "+total+"/"+D.quests.length+"。");
  if(nq) parts.push("下一关「"+nq.name+"」（"+nq.tlabel+"，约"+nq.dur+"分钟）已现形——"+WDChat.howTo(nq)+"。路我已看好，随时动身。");
  else parts.push("今日功课已尽——去巡夜温故，或上星盘清错题，明日雾散再战。");
  return parts.join("");
}
/* 云蘅结算 AI 润色：就地替换本地模板，保持结构不变 */
function refineYunheng(id,q,nq,perfect){
  if(!dsReady()) return;

function maybeUnlockDay(){
  const d=byDay[st.unlocked];
  if(d){ const p=dayProg(d); if(p.n===p.all&&p.all>0&&st.unlocked<45) st.unlocked++; }
  if(st.day<st.unlocked) st.day=st.unlocked;
}
function checkAch(){
  D.achievements.forEach(a=>{
    if(st.ach[a.id]) return;
    let ok=false; const t=totals(); const c=streak();
    switch(a.id){
      case "first": ok=t.c>=1; break;
      case "chain": ok=DAYS.some(d=>{const p=dayProg(d); return p.all>0&&p.n===p.all;}); break;
      case "main10": ok=D.quests.filter(q=>q.kind==="main"&&qDone(q.id)).length>=10; break;
      case "tower": ok=qDone("D20BOSS"); break;
      case "guild": ok=qDone("D30BOSS"); break;
      case "ruins": ok=qDone("D41BOSS"); break;
      case "oral10": ok=D.quests.filter(q=>q.type==="oral"&&qDone(q.id)).length>=10; break;
      case "quiz50": ok=st.quizOk>=50; break;
      case "streak7": ok=c>=7; break;
      case "streak14": ok=c>=14; break;
      case "clueall": ok=(st.libSearches||0)>=10; break;
      case "end": ok=fullDone(1,45); break;
    }
    if(ok){ st.ach[a.id]=new Date().toISOString(); record("成就解锁", a.name); toast("成就解锁 · "+a.name,"gold"); }
  });
}
function fullDone(a,b){ for(let i=a;i<=b;i++){ const d=byDay[i]; const p=dayProg(d); if(p.n<p.all) return false; } return true; }

/* ---------- panels ---------- */
function panel(html){
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="dlg"><button class="close" type="button">×</button>${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  $(".close",ov).onpointerdown=close;
  ov.onpointerdown=e=>{ if(e.target===ov) close(); };  // 点击遮罩背景关闭
  return ov;
}
/* ==================== 内容编辑 / 版本系统 ==================== */
/* st.edits[id] = [{at:ISO, text}, ...] 最新在前；默认永远显示最新版本 */
function editVer(id){ return (st.edits&&st.edits[id])||[]; }
function getEdit(id, original){
  const v=editVer(id);
  return v.length? v[0].text : original;
}
function hasEdit(id){ return editVer(id).length>0; }
function saveEdit(id, text){
  text=String(text);
  if(!st.edits) st.edits={};
  const arr=st.edits[id]||(st.edits[id]=[]);
  if(arr.length && arr[0].text===text) return false;   // 与最新一致，不重复记录
  arr.unshift({at:new Date().toISOString(), text});
  save(); return true;
}
function rollbackEdit(id, index){
  const arr=editVer(id); if(!arr[index]) return;
  const text=arr[index].text;
  arr.unshift({at:new Date().toISOString(), text});   // 回退即把旧版复制为最新
  save();
}
/* ==================== 藏经阁内容卡片池 ==================== */
const CATEGORIES=[
  ["pts","考点卷"],["oral","吟游句"],["full","吟游卷全文"],["clue","线索册"]
];
function buildCardPool(){
  const cards=[];
  D.pointsLib.forEach(x=>{
    cards.push({uid:"point:"+x.id, cat:"pts", catLabel:"考点卷 · "+x.id.slice(0,2), id:x.id,
      title:"★".repeat(+x.star)+" "+x.id+(x.status==="⚠️"?" ⚠待核":""),
      body:getEdit("point:"+x.id, mdClean(x.text)),
      extra:x.anchor?("记忆锚："+mdClean(x.anchor)):"", editable:true, editId:"point:"+x.id});
  });
  D.oralLib.forEach(x=>{
    cards.push({uid:"oral:"+x.id, cat:"oral", catLabel:"吟游句 · "+x.topic, id:x.id,
      title:x.id+" · "+x.topic,
      body:getEdit("oral:"+x.id+":en", x.en),
      extra:getEdit("oral:"+x.id+":zh", x.zh), editable:true, editId:"oral:"+x.id+":en"});
  });
  D.oralFull.forEach(o=>{
    o.sections.forEach((s,i)=>{
      cards.push({uid:"full:"+o.id+":"+i, cat:"full", catLabel:"吟游卷 · "+o.name, id:o.id+" §"+(i+1),
        title:o.name+" · 第"+(i+1)+"节"+(s.h?" · "+s.h:""),
        body:getEdit("full:"+o.id+":"+i, s.text||s.en||""),
        extra:s.h?("小节："+s.h):"", editable:true, editId:"full:"+o.id+":"+i});
    });
  });
  D.clues.forEach(x=>{
    cards.push({uid:"clue:"+x.id, cat:"clue", catLabel:"线索册", id:x.id,
      title:x.id+" "+x.title, body:mdClean(x.text),
      extra:"关联考点："+(x.covers||[]).join(" · "), editable:false});
  });
  return cards;
}
function renderLib(){
  st._libCat = st._libCat || "all";
  st._libQ = st._libQ || "";
  st._libIdx = st._libIdx || 0;
  const stream=$("#stream");
  const all=buildCardPool();
  const q=st._libQ.toLowerCase().trim();
  const catSel=[["all","全部（"+all.length+"）"]].concat(CATEGORIES.map(c=>{
    const n=all.filter(x=>x.cat===c[0]).length; return [c[0], c[1]+"（"+n+"）"];
  }));
  let pool=all.filter(c=>{
    if(st._libCat!=="all" && c.cat!==st._libCat) return false;
    if(q){ const hay=(c.id+c.title+c.body+c.extra+c.catLabel).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(st._libIdx>=pool.length) st._libIdx=Math.max(0,pool.length-1);
  const idx=st._libIdx, cur=pool[idx];

  function cardHtml(c, cls){
    if(!c) return "";
    const edited=hasEdit(c.editId);
    return `<div class="qcard3d ${cls}">
      <div class="ccat">${esc(c.catLabel)}${edited?' <span style="color:var(--ok)">· 已校订</span>':""}</div>
      <div class="cid">${esc(c.title)}</div>
      <div class="cen">${esc(c.body)}</div>
      ${c.extra?`<div class="czh">${esc(c.extra)}</div>`:""}
    </div>`;
  }
  // 卡堆：当前 + 后两张预览
  const stack=[0,1,2].map(k=>cardHtml(pool[idx+k], "c"+k)).join("");

  stream.innerHTML=`
  <div class="sys daysep">藏经阁 · 卡牌修行</div>
  <div class="cardsearch">
    <input id="cardQ" placeholder="搜索编号 / 关键词 / 英文句…" value="${esc(st._libQ)}">
    <select id="cardCat">${catSel.map(o=>`<option value="${o[0]}"${st._libCat===o[0]?" selected":""}>${esc(o[1])}</option>`).join("")}</select>
  </div>
  <div class="carddeck">
    <div class="cardstack" id="cardStack">${cur?stack:`<div class="qcard3d c0"><div class="cen" style="text-align:center;color:var(--dim)">没有匹配的卡片——换个词或类别</div></div>`}</div>
    <div class="cardpos">${cur?`第 ${idx+1} / ${pool.length} 张`:"0 / 0"}</div>
    <div class="cardtools">
      <button class="btn sm ghost" id="cPrev" type="button" ${idx<=0?"disabled":""}>← 上一张</button>
      <button class="btn sm primary" id="cFlip" type="button" ${pool.length===0?"disabled":""}>翻下一张 ⤵</button>
      <button class="btn sm gold" id="cRand" type="button" ${pool.length===0?"disabled":""}>🎲 随机抽</button>
      <button class="btn sm" id="cEdit" type="button" ${cur&&cur.editable?"":"disabled"}>✏️ 校订此卡</button>
    </div>
    <div class="fliphint">点「翻下一张」从卡堆顶部依次取出 · 「随机抽」从全部卡片中抽取 · 校订内容会自动存档并可回退版本</div>
  </div>`;

  const goto=(n)=>{ st._libIdx=Math.max(0,Math.min(n,pool.length-1)); save(); renderLib(); };
  $("#cPrev",stream).onpointerdown=()=>{ SFX.tap(); goto(idx-1); };
  $("#cFlip",stream).onpointerdown=()=>{ SFX.flip?SFX.flip():SFX.tap(); goto(idx+1); };
  $("#cRand",stream).onpointerdown=()=>{ SFX.win?SFX.win():SFX.ok(); goto(Math.floor(Math.random()*pool.length)); };
  $("#cEdit",stream).onpointerdown=()=>{ if(cur) openEditor(cur); };
  $("#cardQ",stream).oninput=e=>{ st._libQ=e.target.value; st._libIdx=0; renderLib(); const inp=$("#cardQ",stream); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); };
  $("#cardCat",stream).onchange=e=>{ SFX.tap(); st._libCat=e.target.value; st._libIdx=0; save(); renderLib(); };
}
/* ==================== 内容编辑器（含版本历史 / 回退） ==================== */
/* 据 editId 取官方原文（用于「恢复官方原文」） */
function originalOf(editId){
  const parts=editId.split(":");
  if(parts[0]==="point"){ const x=D.pointsLib.find(p=>p.id===parts[1]); return x?mdClean(x.text):""; }
  if(parts[0]==="oral"){ const x=D.oralLib.find(p=>p.id===parts[1]); return x?(parts[2]==="zh"?x.zh:x.en):""; }
  if(parts[0]==="full"){ const o=D.oralFull.find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; return s?(s.text||s.en||""):""; }
  return "";
}
function openEditor(card){
  const origText = originalOf(card.editId) || card.body;
  const current = getEdit(card.editId, origText);
  const ov=panel(`<h2>校订 · ${esc(card.id)}</h2><div class="mt">${esc(card.catLabel)} · 修改实时存档，默认永远显示最新版本，可随时回退</div>
    <div class="editor">
      <textarea id="edArea" placeholder="在此校订内容（导游词/考点原文）…">${esc(current)}</textarea>
      <div class="estatus saved" id="edStatus">● 已加载当前版本</div>
      <div class="kitbar">
        <button class="btn sm primary" id="edSave" type="button">保存新版本</button>
        <button class="btn sm ghost" id="edReset" type="button">恢复官方原文</button>
        <button class="btn sm ghost" id="edClose" type="button">关闭</button>
      </div>
      <div class="vhist" id="vHist"></div>
    </div>`);
  const area=$("#edArea",ov), status=$("#edStatus",ov), hist=$("#vHist",ov);
  let dirty=false;
  const markDirty=()=>{ dirty=true; status.className="estatus dirty"; status.textContent="● 有未保存修改…"; };
  area.oninput=markDirty;
  function drawHist(){
    const vers=editVer(card.editId);
    if(!vers.length){ hist.innerHTML=`<div class="vitem"><span class="vat">官方原文</span><span class="vprev">（尚无校订版本）</span></div>`; return; }
    hist.innerHTML=`<div style="font-size:12px;color:var(--cyber);margin-bottom:4px">版本历史（最新在前，点「恢复」回退）</div>`+
      vers.map((v,i)=>`<div class="vitem ${i===0?"cur":""}">
        <span class="vat">${i===0?"当前 · ":"v"+(vers.length-i)+" · "}${v.at.slice(0,16).replace("T"," ")}</span>
        <span class="vprev">${esc(v.text.slice(0,40))}…</span>
        <button class="btn sm ghost editbtn" data-v="${i}" type="button" ${i===0?"disabled":""}>${i===0?"最新":"恢复"}</button>
      </div>`).join("");
    hist.querySelectorAll("[data-v]").forEach(b=>b.onpointerdown=()=>{
      SFX.tap(); rollbackEdit(card.editId, +b.dataset.v);
      area.value=getEdit(card.editId,origText); dirty=false;
      status.className="estatus saved"; status.textContent="● 已回退并保存为最新版本";
      drawHist(); toast("已回退到所选版本");
    });
  }
  $("#edSave",ov).onpointerdown=()=>{
    const txt=area.value.trim();
    if(!txt){ toast("内容不能为空"); return; }
    if(saveEdit(card.editId, txt)){ SFX.ok(); dirty=false; status.className="estatus saved"; status.textContent="● 已保存 "+new Date().toLocaleTimeString(); drawHist(); toast("新版本已存档"); }
    else { status.className="estatus saved"; status.textContent="● 内容未变化"; }
  };
  $("#edReset",ov).onpointerdown=()=>{
    if(!confirm("恢复为官方原文？此操作会把原文存为最新版本。")) return;
    SFX.tap(); saveEdit(card.editId, origText); area.value=origText; dirty=false;
    status.className="estatus saved"; status.textContent="● 已恢复官方原文"; drawHist(); toast("已恢复官方原文");
  };
  $("#edClose",ov).onpointerdown=()=>{
    if(dirty && !confirm("有未保存的修改，确定关闭？")) return;
    ov.remove(); if(view==="lib") renderLib();
  };
  drawHist();
}
function renderNight(){
  // 到期复习卡（已完成 study 任务）+ 预习卡（已解锁未完成 study 任务）——保证任意进度打开均有内容
  const due=[], later=[], pre=[];
  const today=new Date().toISOString().slice(0,10);
  DAYS.forEach(d=>{ if(d.day>st.unlocked) return;
    d.quests.forEach(q=>{ if(q.type!=="study") return;
      (D.lectures[q.id]||[]).forEach(p=>{ (p.items||[]).forEach(it=>{
        if(qDone(q.id)){ const rec=st.cards[it.id]||{due:"2026-01-01",iv:1};
          if(rec.due<=today) due.push(it); else later.push(it);
        } else pre.push(it);
      });});
    });
  });
  const consolidated=Object.values(st.cards||{}).filter(r=>r&&r.iv>=2).length;
  const prog=window.WDQuiz?WDQuiz.progress():null;
  const progHtml=prog?` · 智能提问：答${prog.total}题，正确率${prog.rate}%，连对${prog.streak}题`:"";
  const ov=panel(`<h2>巡夜 · 记忆卡匣</h2><div class="mt">到期复习 ${due.length} 张 · 待来日 ${later.length} 张 · 预习 ${pre.length} 张 · 已巩固 ${consolidated} 张${progHtml}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      ${window.WDQuiz?`<button class="btn sm primary" id="iqBtn" type="button">✦ 智能提问</button><span style="color:var(--ink2);font-size:12.5px">NPC 依你的记忆内容主动出题，认知递进</span>`:""}
    </div>
    <div id="fcHost"></div>`);
  const host=$("#fcHost",ov);
  /* 智能提问入口：基于记忆卡匣+错题生成认知递进式提问，NPC 依职能匹配出题 */
  const iqBtn=$("#iqBtn",ov);
  if(iqBtn) iqBtn.onpointerdown=()=>{ SFX.tap(); startIntelligentQuiz(due,pre,later,host); };
  const deck=[...due.map(it=>({it,mode:"due"})), ...pre.map(it=>({it,mode:"pre"}))];
  let i=0, showRev=false;
  function draw(){
    if(i>=deck.length){
      host.innerHTML=deck.length
        ? `<div class="missing" style="text-align:center;padding:30px">今夜巡完（复习 ${due.length} · 预习 ${pre.length}）。安心睡。</div>`
        : `<div class="missing" style="text-align:center;padding:30px">卡匣尚空——完成修行类任务后，考点卡会在此安家。</div>
           <div style="text-align:center;margin-top:10px"><button class="btn sm primary" id="fcGo" type="button">去今日修习</button></div>`;
      const g=$("#fcGo",host); if(g) g.onpointerdown=()=>{ SFX.tap(); ov.remove(); toast("完成今日任务后，新的考点卡会自动入匣"); };
      return;
    }
    const cur=deck[i], it=cur.it, rev=showRev;
    if(cur.mode==="pre"){
      host.innerHTML=`<div class="flashcard"><div class="fc-id">预习 · ${esc(it.id)} · ${"★".repeat(+it.star||1)}</div>
        <div class="fc-main">${esc(rev?it.text:"预习这条考点……")}</div>
        ${rev?`<div class="fc-rev">${esc(it.text)}</div>`:""}
        <div style="margin-top:12px">${rev?`<button class="btn sm primary" id="fNext" type="button">记下了（完成后自动入复习队列）</button>`:`<button class="btn sm primary" id="fFlip" type="button">翻面</button>`}</div></div>
        <div class="tstate">${i+1} / ${deck.length}</div>`;
      const fl=$("#fFlip",host); if(fl) fl.onpointerdown=()=>{ SFX.tap(); showRev=true; draw(); };
      const nx=$("#fNext",host); if(nx) nx.onpointerdown=()=>{ SFX.tap(); i++; showRev=false; draw(); };
      return;
    }
    host.innerHTML=`<div class="flashcard"><div class="fc-id">${esc(it.id)} · ${"★".repeat(+it.star)}</div>
      <div class="fc-main">${esc(rev?it.text:"回忆这条考点……")}</div>
      ${rev?`<div class="fc-rev">${esc(it.text)}</div>`:""}
      <div style="margin-top:12px">${rev?`
        <button class="btn sm" id="fAgain" type="button">生疏（明日再来）</button>
        <button class="btn sm primary" id="fGood" type="button">记住了（延后间隔）</button>`
        :`<button class="btn sm primary" id="fFlip" type="button">翻面</button>`}</div></div>
      <div class="tstate">${i+1} / ${deck.length}</div>`;
    const flip=$("#fFlip",host); if(flip) flip.onpointerdown=()=>{ SFX.tap(); showRev=true; draw(); };
    const ag=$("#fAgain",host); if(ag) ag.onpointerdown=()=>{ SFX.tap(); st.cards[it.id]={due:new Date(Date.now()+864e5).toISOString().slice(0,10),iv:1}; i++; showRev=false; save(); draw(); };
    const gd=$("#fGood",host); if(gd) gd.onpointerdown=()=>{ SFX.tap(); const r=st.cards[it.id]||{iv:1}; const nv=Math.min(15,r.iv*2); st.cards[it.id]={due:new Date(Date.now()+nv*864e5).toISOString().slice(0,10),iv:nv}; i++; showRev=false; save(); draw(); };
  }
  draw();
}
/* ==================== 智能提问交互（NPC 依记忆内容主动出题，认知递进）==================== */
function startIntelligentQuiz(due,pre,later,host){
  if(!window.WDQuiz){ toast("智能提问模块未加载"); return; }
  /* 合并所有可用考点卡作为题源 */
  const allCards=[...(due||[]),...(pre||[]),...(later||[])];
  if(!allCards.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">卡匣尚空——完成修行类任务后，考点卡会在此安家。</div>`; return; }
  /* 生成5道认知递进式提问（混合记忆卡匣+错题） */
  const questions=WDQuiz.ask(allCards,st.wrong,D.pointsLib,5);
  if(!questions.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">暂无可提问的考点。</div>`; return; }
  let qi=0, okN=0;
  function drawQ(){
    if(qi>=questions.length){
      const prog=WDQuiz.progress();
      host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">
        <div style="font-size:14px;margin-bottom:6px">智能提问终了：答对 ${okN}/${questions.length}</div>
        <div style="font-size:12px;color:var(--ink2)">累计答题 ${prog.total} · 正确率 ${prog.rate}% · 连对 ${prog.streak}（最高 ${prog.bestStreak}）</div>
        <div style="font-size:12px;color:var(--ink2);margin-top:4px">已掌握 ${prog.mastered} 个考点 · 学习中 ${prog.learning} 个</div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn sm" id="iqBack" type="button">← 返回卡匣</button>
        <button class="btn sm primary" id="iqAgain" type="button">再来一轮</button>
      </div>`;
      $("#iqBack",host).onpointerdown=()=>{ SFX.tap(); host.innerHTML=""; renderNight(); };
      $("#iqAgain",host).onpointerdown=()=>{ SFX.tap(); startIntelligentQuiz(due,pre,later,host); };
      return;
    }
    const q=questions[qi];
    const npcName=dName(q.npcId), npcTitle=dTitle(q.npcId);
    const avatarURL=(window.WDAvatar&&WDAvatar.avatarURL)?WDAvatar.avatarURL(q.npcId):"";
    const lvLabel=["基础","进阶","挑战"][q.lv-1]||q.lv;
    const lvColor=q.lv===1?"var(--ok)":(q.lv===2?"var(--gold)":"var(--danger)");
    host.innerHTML=`<div class="iqcard">
      <div class="iqhead">
        ${avatarURL?`<img src="${avatarURL}" alt="" style="width:32px;height:32px;image-rendering:pixelated;border-radius:4px">`:""}
        <div class="iqnpc">${esc(npcName)}${npcTitle?" · "+esc(npcTitle):""}</div>
        <span class="iqlv" style="color:${lvColor}">${esc(q.typeLabel)} · ${lvLabel}</span>
      </div>
      <div class="iqq">${esc(q.q)}</div>
      <div class="iqhint" style="color:var(--dim);font-size:11px;margin-top:4px">考点 ${esc(q.pid)} · 关键词：${esc(q.keyword)}</div>
      <textarea id="iqAns" rows="3" placeholder="用你的话作答……（可不答，直接跳过查看参考）" style="width:100%;font:inherit;font-size:12px;background:var(--bg);border:1px solid var(--border-lit);color:var(--fg);padding:8px;border-radius:4px;margin-top:8px"></textarea>
      <div class="kitbar" style="margin-top:8px">
        <button class="btn sm primary" id="iqSubmit" type="button">作答</button>
        <button class="btn sm" id="iqKnow" type="button">✓ 会了</button>
        <button class="btn sm ghost" id="iqSkip" type="button">不会，看参考</button>
      </div>
      <div id="iqFb" class="small" style="margin-top:8px;font-size:12px;line-height:1.7"></div>
    </div>`;
    const fb=$("#iqFb",host);
    let answered=false;
    $("#iqSubmit",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      const ans=$("#iqAns",host).value.trim();
      if(!ans){ fb.innerHTML=`<div style="color:var(--gold)">没写也没关系——下面是参考答案，看一眼也算温习。</div>`; showRef(false); return; }
      /* 自评反馈：展示参考答案供玩家自评 */
      fb.innerHTML=`<div style="color:var(--cyber)"><b>你的回答：</b>${esc(ans)}</div>
        <div style="color:var(--ink2);margin-top:4px">对照参考自评——你觉得答得对吗？</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn sm primary" id="iqRight" type="button">答对了</button>
          <button class="btn sm ghost" id="iqWrong" type="button">答偏了</button>
        </div>`;
      $("#iqRight",host).onpointerdown=()=>{ SFX.tap(); SFX.ok(); okN++; WDQuiz.record(q.pid,true); if(window.WDMem)WDMem.right(q.npcId,q.topic); showRef(true,true); };
      $("#iqWrong",host).onpointerdown=()=>{ SFX.tap(); SFX.no(); WDQuiz.record(q.pid,false); if(window.WDMem)WDMem.wrong(q.npcId,q.topic,q.lv); showRef(true,false); };
    };
    $("#iqKnow",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      okN++; WDQuiz.record(q.pid,true);
      if(window.WDMem)WDMem.right(q.npcId,q.topic);
      showRef(true,true);
    };
    $("#iqSkip",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      WDQuiz.record(q.pid,false);
      if(window.WDMem)WDMem.wrong(q.npcId,q.topic,q.lv);
      showRef(false,false);
    };
    function showRef(selfAssessed,correct){
      const interval=WDQuiz.interval(q.pid);
      const nextReview=interval===1?"明日":(interval===3?"3日后":"7日后");
      const msg=correct?'<span style="color:var(--ok)">很好——这个考点将在'+nextReview+'复习。</span>':'<span style="color:var(--gold)">没关系，多见几次就熟了——明日再来。</span>';

function wTopic(x){ return (x.pid&&x.pid.includes("-")?x.pid.split("-").slice(0,2).join("-"):(x.pid||x.qid))||"杂"; }
/* 兜底题库：AI 失败且本任务静态题为空时，同幕复用题池，保证温故试炼永不 0/0 空转 */
function fallbackQuiz(q){
  const own=D.quizzes[q.id]||[];
  if(own.length) return own;
  const pool=[];
  DAYS.forEach(d=>d.quests.forEach(x=>{ if(x.act===q.act){ const zz=D.quizzes[x.id]; if(zz&&zz.length) pool.push(...zz); } }));
  const src=pool.length?pool:Object.values(D.quizzes).flat().filter(v=>v&&v.length);
  const out=[], used=new Set();
  while(out.length<4&&used.size<src.length){ const k=Math.floor(Math.random()*src.length); if(used.has(k))continue; used.add(k); out.push(src[k]); }
  return out;
}
function renderStar(){
  const byTopic={};
  st.wrong.forEach(x=>{ const t=wTopic(x); byTopic[t]=(byTopic[t]||0)+1; });
  const top=Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>t+"×"+n).join(" · ");
  const ov=panel(`<h2>星盘 · 错题</h2><div class="mt">玄机夫人记下的每一道错题，答对后方可移出星盘${st.wrong.length?`<br>共 ${st.wrong.length} 题${top?` · 高发：${esc(top)}`:""}`:""}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><button class="btn sm primary" id="starQuizBtn" type="button">✦ 随机小考</button><span style="color:var(--ink2);font-size:12.5px">无错题也可主动演练，答错自动入盘</span></div><div id="wHost"></div>`);

  // 小考题池：已解锁日全部静态可试题（跨任务复用）
  function quizPool(){
    const pool=[];
    DAYS.forEach(d=>{ if(d.day>st.unlocked) return;
      d.quests.forEach(q=>{ const zz=D.quizzes[q.id]; if(zz&&zz.length) pool.push(...zz); }); });
    return pool;
  }
  function miniQuiz(){
    const pool=quizPool();
    if(!pool.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">题池待充盈——先解锁更多日程。</div>`; return; }
    const picked=[], used=new Set();
    while(picked.length<3&&used.size<pool.length){ const k=Math.floor(Math.random()*pool.length); if(used.has(k))continue; used.add(k); picked.push(pool[k]); }
    let qi=0, okN=0;
    function drawOne(){
      if(qi>=picked.length){
        host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">小考终了：答对 ${okN}/${picked.length}。${okN===picked.length?"星盘为你增辉。":"错者已记入星盘，玄机夫人会安排它们再见你。"}</div>
          <div style="margin-top:8px"><button class="btn sm" id="mqBack" type="button">← 返回星盘</button></div>`;
        $("#mqBack",host).onpointerdown=()=>{ SFX.tap(); listView(); };
        save(); return;
      }
      const z=picked[qi], isJudge=z.kind==="judge";
      host.innerHTML=`<div class="qz"><span class="kk">小考 ${qi+1}/${picked.length}${z.pid?` · ${esc(z.pid)}`:""}</span>${esc(z.q)}</div>
        ${isJudge?`<div class="jbtns"><button class="btn" id="qt" type="button">真</button><button class="btn" id="qf" type="button">伪</button></div>`
          :`<input id="qin" style="width:100%;border:1px solid var(--hair);font:inherit;padding:8px" placeholder="作答" autocomplete="off"><div style="margin-top:8px"><button class="btn primary" id="qok" type="button">作答</button></div>`}
        <div class="fb" id="qfb" style="display:block;margin-top:10px;line-height:1.7"></div>`;
      const fb=$("#qfb",host); let done=false;
      const judge=v=>{ if(done)return; done=true; (v?SFX.ok():SFX.no());
        if(v){ okN++; fb.className="fb ok"; }
        else{ st.wrong.push({qid:"star",pid:z.pid||"",text:z.q,okA:(isJudge?(z.a?"真":"伪"):z.a),at:new Date().toISOString(),src:"小考"}); fb.className="fb no";
          if(window.WDMem){ const pt=D.pointsLib.find(p=>p.id===z.pid);
            WDMem.wrong("xuanji",wTopic({pid:z.pid||""}),pt?+pt.star:null); } }
        fb.style.color=v?"var(--ok)":"var(--danger)";
        fb.innerHTML=(v?"✓ 对了。":"✗ 不对。")+`正确答案：<b style="color:var(--gold)">${esc(String(isJudge?(z.a?"真":"伪"):z.a))}</b>。${esc(z.why||"")}`;
        const nx=document.createElement("button"); nx.className="btn sm primary"; nx.type="button"; nx.textContent="知道了"; nx.style.marginTop="6px";
        nx.onpointerdown=()=>{ SFX.tap(); qi++; drawOne(); };
        fb.appendChild(document.createTextNode(" ")); fb.appendChild(nx); save();
      };
      if(isJudge){ $("#qt",host).onpointerdown=()=>judge(true); $("#qf",host).onpointerdown=()=>judge(false); }
      else{ const inp=$("#qin",host); inp.focus();
        const sub=()=>judge(z.accept.some(a=>normalize(a)===normalize(inp.value))||normalize(inp.value).includes(normalize(z.a)));
        $("#qok",host).onpointerdown=sub; inp.onkeydown=e=>{ if(e.key==="Enter") sub(); }; }
    }
    drawOne();
  }
  // 列表视图
  function listView(){
    const w=st.wrong.slice(-40).reverse();
    host.innerHTML=w.length? w.map((x,i)=>`<div class="wrongrow"><div><b>${esc(x.pid||"")}</b> ${esc(x.text.slice(0,70))}<br><span style="color:var(--ink2);font-size:12px">正确：${esc(String(x.okA).slice(0,40))} · ${esc(wTopic(x))} · ${esc(x.at.slice(0,10))}</span></div><button class="btn sm retry" data-i="${st.wrong.length-1-i}">再答</button></div>`).join("")
      :`<div class="missing" style="text-align:center;padding:30px">星盘干净——继续保持。<br>也可点上方「随机小考」，让玄机夫人先考你几题。</div>`;
    host.querySelectorAll(".retry").forEach(b=>{ b.onpointerdown=()=>{ SFX.tap(); retryView(+b.dataset.i); }; });
  }
  // 再答视图（同一弹窗内切换，避免叠加）
  function retryView(idx){
    const x=st.wrong[idx]; if(!x){ listView(); return; }
    const isJudge=(x.okA==="真"||x.okA==="伪");
    host.innerHTML=`<button class="btn sm ghost" id="rBack" type="button">← 返回错题列表</button>
      <div class="qz" style="margin-top:10px"><span class="kk">出自 ${esc(x.qid||"")} ${esc(x.pid||"")}</span>${esc(x.text)}</div>
      ${isJudge
        ? `<div class="jbtns"><button class="btn" id="rt" type="button">真</button><button class="btn" id="rf" type="button">伪</button></div>`
        : `<input id="rin" style="width:100%;border:1px solid var(--hair);font:inherit;padding:8px" placeholder="作答" autocomplete="off"><div style="margin-top:8px"><button class="btn primary" id="rok" type="button">作答</button></div>`}
      <div class="fb" id="rfb" style="display:block;margin-top:10px;line-height:1.7"></div>`;
    $("#rBack",host).onpointerdown=()=>{ SFX.tap(); listView(); };
    let rAns=false;
    const rfb=$("#rfb",host);
    const finish=(ok)=>{
      if(rAns) return; rAns=true;   // 反馈态锁定
      const rt=$("#rt",host), rf=$("#rf",host), rok=$("#rok",host), rin=$("#rin",host);
      [rt,rf,rok].forEach(b=>{ if(b) b.disabled=true; }); if(rin) rin.disabled=true;
      if(ok) SFX.ok(); else SFX.no();
      rfb.className = ok ? "fb ok" : "fb no";
      rfb.style.color = ok ? "var(--ok)" : "var(--danger)";
      rfb.innerHTML=(ok?"✓ 这次对了——错题移出星盘。":"✗ 仍不对——再记一次。")
        +`正确答案：<b style="color:var(--gold)">${esc(String(x.okA))}</b>。`;
      const got=document.createElement("button");
      got.className="btn sm primary"; got.type="button"; got.textContent="知道了";
      got.style.marginTop="6px";
      got.onpointerdown=()=>{
        SFX.tap();
        if(ok){ st.wrong.splice(idx,1); if(window.WDMem)WDMem.right("xuanji",wTopic(x)); }      // 答对：移除该错题，记忆同步销账
        else { x.at=new Date().toISOString(); } // 答错：更新时间置顶，不重复新增
        save(); listView();
      };
      rfb.appendChild(document.createTextNode(" ")); rfb.appendChild(got);
    };
    const rt=$("#rt",host);
    if(rt){
      rt.onpointerdown=()=>finish(x.okA==="真");
      $("#rf",host).onpointerdown=()=>finish(x.okA==="伪");
    } else {
      const rin=$("#rin",host); rin.focus();
      const sub=()=>finish(normalize(rin.value)===normalize(x.okA));
      $("#rok",host).onpointerdown=sub;
      rin.onkeydown=e=>{ if(e.key==="Enter") sub(); };
    }
  }
  listView();
}

function downloadFile(name,text,mime){
  try{
    const b=new Blob([text],{type:mime||"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast("导出失败："+e.message); }

function memFmt(s){
  if(s<60) return s+"秒";
  if(s<3600) return Math.floor(s/60)+"分"+(s%60?Math.round(s%60)+"秒":"");
  return Math.round(s/360)/10+"小时";
}

/* ==================== DeepSeek 集成 ====================
   可选增强：配置密钥后，NPC 人设/对话与任务说明由 DeepSeek 生成。
   无密钥 / 离线 / 接口失败时全部自动降级为内置内容，核心离线流程不受影响。
   密钥仅存本浏览器 localStorage（本地个人 PWA），不上传任何第三方。 */
const DS_MODEL="deepseek-chat";
function dsReady(){ return !!(st.dsKey && st.dsKey.trim()); }
function quizStage(qid){ const n=st.quizAttempts[qid]||0; return n===0?"first":n===1?"second":"multi"; }
async function dsChat(messages, wantJson){
  if(!dsReady()) throw new Error("未配置密钥");
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(), 22000);
  try{
    const r=await fetch("https://api.deepseek.com/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+st.dsKey.trim()},
      body:JSON.stringify({model:DS_MODEL,messages,temperature:0.85,
        ...(wantJson?{response_format:{type:"json_object"}}:{})}),
      signal:ctrl.signal});
    if(r.status===401) throw new Error("密钥无效(401)");
    if(r.status===402||r.status===429) throw new Error("额度不足或限流("+r.status+")");
    if(!r.ok) throw new Error("接口异常("+r.status+")");
    const j=await r.json();
    const c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!c) throw new Error("返回为空");
    return c.trim();
  }finally{ clearTimeout(timer); }
}
/* 结构化游戏背景信息文件（供 DeepSeek 读取世界观/机制/NPC 基础）——正文装配在 wd-chat.js */
function buildWorldBrief(){ return WDChat.worldBrief(); }
/* NPC 职能定位（导游异次元世界观，与人设生成/任务说明共用） */
const NPC_ROLE={
  yunheng:"引路人——导游异次元的接引者，为误入此界的玩家开启导游试炼之路",
  qingxuan:"文脉导游——理清四十五日试炼的主线脉络，让散落的导游知识重归文脉",
  smq:"山河导游——专长北京地理山川、长城、十三陵等山河形胜",
  tiemian:"律法导游——专长旅游法规、政策条例，错一条法条便放遗忘怪出关",
