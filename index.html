<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>问道之旅 · 二十五日</title>
<style>
:root{
  --bg:#f6efe4; --bg2:#efe5d2; --bg3:#e5d8bf;
  --fg:#3b3226; --fg2:#6b5c48; --dim:#78684e;
  --neon:#c96f7f; --cyber:#5f8f8f; --gold:#b98a3f; --ok:#6f9a62; --danger:#b85c5c;
  --border:#d8cbb2; --border-lit:#c1ab85;
  --pixel:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --shadow:0 1px 3px rgba(60,45,25,.14);
  --ink2:var(--dim); --serif:var(--pixel); --accent:var(--cyber); --hair:var(--border);
}
/* @font-face 已废弃：改用 iOS 系统字体族，保证清晰易读与跨设备一致性 */
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);font-size:clamp(14px,4.4vw,20px);line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#game{max-width:1280px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
@media(min-width:1500px){#game{max-width:min(1500px,94vw)}}
.hidden{display:none!important}
.serif{font-family:var(--pixel)}
.intlink{color:var(--cyber);text-decoration:underline dotted;text-underline-offset:3px}
.intlink:hover{color:var(--neon)}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--border-lit);padding-bottom:8px;text-shadow:0 1px 0 rgba(60,45,25,.35)}
.hd .t{font-weight:600;font-size:clamp(16px,4.8vw,22px);letter-spacing:.14em;color:var(--cyber)}
.hd .t small{font-size:11px;color:var(--dim);letter-spacing:.18em;margin-left:8px}
.hd .stats{font-size:12.5px;color:var(--fg2);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:14px;row-gap:4px;font-variant-numeric:tabular-nums}
.hd .stats b{color:var(--gold)}
.hd .stats .gametime{font-size:15.5px;font-weight:600;color:var(--cyber);letter-spacing:.06em}
.hd .stats .gametime b{color:var(--neon);font-size:17px}
.tplot{font-size:11.5px;color:var(--dim);padding:2px 0 4px 22px;line-height:1.5;font-style:italic}
.hd .stats button{background:none;border:none;font:inherit;color:var(--fg2);cursor:pointer;text-decoration:underline;padding:0}
.hd .stats button:hover{color:var(--neon)}
.hdacts{white-space:nowrap;display:inline-flex;gap:10px;align-items:center}
.navline{display:flex;gap:2px;margin:8px 0 0;overflow-x:auto}
.navline button{background:none;border:none;font:inherit;font-size:13px;color:var(--fg2);padding:9px 12px;min-height:40px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.navline button.on{color:var(--cyber);border-bottom-color:var(--neon);font-weight:600}
.navline button .dot{display:inline-block;width:6px;height:6px;background:var(--neon);border-radius:50%;margin-left:4px;vertical-align:2px}
/* v62 T16：宽屏左侧常设任务面板（≥1024px 分栏，窄屏隐藏） */
#sidePanel{display:none}
#sidePanel .sphd{font-size:12px;letter-spacing:.16em;color:var(--gold);padding:2px 2px 6px;border-bottom:2px solid var(--border-lit)}
#sidePanel .sphd b{color:var(--neon)}
#sidePanel .spprog{font-size:11.5px;color:var(--dim);padding:8px 2px 2px;display:flex;justify-content:space-between;align-items:center}
#sidePanel .spbar{height:5px;background:rgba(60,45,25,.14);border-radius:3px;overflow:hidden;margin:4px 2px 8px}
#sidePanel .spbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--neon));border-radius:3px;transition:width .4s ease}
/* 3 日任务卡 */
#sidePanel .spcard{border:1px solid var(--border);border-radius:10px;padding:8px 10px 6px;margin:0 2px 10px;background:rgba(255,255,255,.02)}
#sidePanel .spcard.today{border-color:var(--neon);background:rgba(42,161,152,.06)}
#sidePanel .spchd{display:flex;align-items:baseline;gap:6px;font-size:12px;margin-bottom:2px}
#sidePanel .spchd b{font-size:12.5px;color:var(--fg)}
#sidePanel .spcdate{color:var(--gold);font-size:11px}
#sidePanel .spcmeta{margin-left:auto;color:var(--dim);font-size:10.5px}
#sidePanel .spcempty{font-size:11.5px;color:var(--dim);padding:8px 2px}
#sidePanel .spcsrc{font-size:10px;color:var(--dim);border-top:1px dashed var(--border);margin-top:4px;padding-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidePanel .spcrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--border);cursor:pointer;border-radius:6px}
#sidePanel .spcrow:hover{background:rgba(255,255,255,.03)}
#sidePanel .spcrow.done{opacity:.55}
#sidePanel .spcc{flex:none;width:4px;height:32px;border-radius:2px;margin-top:1px}
#sidePanel .spcbody{flex:1;min-width:0}
#sidePanel .spct1{font-size:12.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidePanel .spct2{font-size:10.5px;color:var(--dim);margin-top:1px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#sidePanel .spct2 em{font-style:normal;font-size:10.5px}
#sidePanel .spctag{font-style:normal;font-size:9.5px;padding:0 5px;border-radius:8px;border:1px solid var(--border);color:var(--dim);white-space:nowrap}
#sidePanel .spctag.knew{border-color:var(--neon);color:var(--neon)}
#sidePanel .spctag.krev{border-color:var(--gold);color:var(--gold)}
#sidePanel .spctag.ktest{border-color:#e05d6b;color:#e05d6b}
#sidePanel .spctag.kdone{border-color:var(--ok);color:var(--ok)}
#sidePanel .spcdot{flex:none;font-size:12px;color:var(--dim);margin-top:6px}
#sidePanel .spcrow.done .spcdot{color:var(--ok)}
/* TTS 朗读高亮：正在读的内容块 */
.tts-speaking{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;background:rgba(217,164,65,.07)}
#sidePanel .splist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 0 8px}
#sidePanel .sprow{display:flex;align-items:center;gap:8px;padding:8px 8px;border-bottom:1px dashed var(--border);cursor:pointer}
#sidePanel .sprow:active{background:rgba(95,143,143,.10)}
#sidePanel .sprow .spdot{flex:none;width:20px;text-align:center;font-size:12px;color:var(--dim)}
#sidePanel .sprow.done .spdot{color:var(--ok)}
#sidePanel .sprow.ready .spdot{color:var(--gold)}
#sidePanel .sprow.now .spdot{color:var(--neon)}
#sidePanel .sprow.locked{opacity:.55}
#sidePanel .sprow .spname{flex:1;min-width:0;font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sidePanel .sprow.now .spname{color:var(--neon);font-weight:600}
#sidePanel .sprow .spmeta{flex:none;font-size:10.5px;color:var(--dim)}
#sidePanel .spempty{font-size:12px;color:var(--dim);padding:14px 4px;text-align:center}
@media(min-width:1024px){
  #game{display:grid;grid-template-columns:284px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto;column-gap:20px}
  #sidePanel{display:flex;flex-direction:column;grid-column:1;grid-row:1/6;min-height:0;padding:6px 14px 6px 2px;border-right:2px solid var(--border)}
  #game>.hd{grid-column:2;grid-row:1}
  #game>.navline{grid-column:2;grid-row:2}
  #game>#stream{grid-column:2;grid-row:3}
  #game>.inputbar{grid-column:2;grid-row:4}
  #game>footer{grid-column:2;grid-row:5}
}

/* chat stream */
.stream{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 4px 8px;scroll-behavior:smooth;overscroll-behavior:contain}
/* v62：全局滚动条样式（Y2K 护眼，滚动期间指示器清晰可见） */
*{scrollbar-width:thin;scrollbar-color:rgba(185,138,63,.55) rgba(60,45,25,.12)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:rgba(60,45,25,.10);border-radius:6px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(185,138,63,.72),rgba(95,143,143,.72));border-radius:6px;border:1px solid rgba(20,12,30,.25)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--gold),var(--cyber))}
::-webkit-scrollbar-corner{background:transparent}
.sys{font-size:12px;color:var(--dim);text-align:center;margin:12px 0;letter-spacing:.08em}
.sys.daysep{border-bottom:1px dashed var(--border);padding-bottom:8px;margin-top:22px;letter-spacing:.15em}
.msg{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.msg .avatar{flex:none;width:40px;height:40px;border:2px solid var(--border-lit);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--cyber);box-shadow:0 2px 0 rgba(60,45,25,.16)}
.msg .avatar[data-av]{cursor:pointer}
.msg .avatar[data-av]:active{opacity:.75}
.msg .body{max-width:78%}
.msg .name{font-size:12px;color:var(--dim);margin-bottom:2px}
.msg .name b{color:var(--cyber);font-weight:600}
.bubble{background:var(--bg2);border:2px solid var(--border);padding:9px 13px;font-size:14.5px;box-shadow:0 2px 0 rgba(60,45,25,.16)}
.bubble.narration{background:none;border:none;color:var(--dim);font-size:13.5px;padding:2px 0;font-style:italic}
.msg.me{flex-direction:row-reverse}
.msg.me .body{text-align:right}
.msg.me .bubble{background:var(--neon);border-color:var(--neon);color:#3b3226;text-align:left}
.msg.sysline{justify-content:center}
.msg.sysline .bubble{background:var(--bg2);border:none;font-size:12px;color:var(--dim);padding:4px 10px}

/* quest card in stream */
.qcard{border:2px solid var(--border-lit);background:var(--bg);margin-top:8px;padding:10px 12px;max-width:100%;box-shadow:0 3px 0 rgba(60,45,25,.15);position:relative}
.qrefs{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.qref{border:1px solid var(--cyber);background:rgba(95,143,143,.10);color:var(--cyber);font-size:11.5px;padding:3px 10px;border-radius:12px;cursor:pointer}
.qref:active{transform:scale(.96)}
@keyframes qflashK{0%,100%{box-shadow:0 3px 0 rgba(60,45,25,.15)}30%{box-shadow:0 0 0 4px var(--gold);border-color:var(--gold)}}
.qflash{animation:qflashK 1.6s ease}
.qcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 3px);z-index:0}
.qcard>*{position:relative;z-index:1}
.qcard.locked{border-color:var(--border);opacity:.6}
.qcard .qn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;color:var(--fg)}
.qcard .qn .rk{font-size:11px;color:var(--neon)}
.qcard .qg{font-size:12.5px;color:var(--fg2);margin:4px 0 8px}
.qcard .qr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gold)}
.qcard .qr .dur{color:var(--dim)}
.qcard.done{opacity:.75;border-color:var(--border)}
.qcard.done .qn::after{content:" ✓";color:var(--ok)}
.qcard.now{border-color:var(--neon)}
/* 置底当前任务卡（需求2a） */
.pinwrap{margin-top:16px;border:2px solid var(--neon);background:rgba(185,138,63,.10);box-shadow:0 0 12px rgba(185,138,63,.25);padding:8px 10px}
.pinwrap .pinhead{font-size:11px;letter-spacing:.2em;color:var(--neon);margin-bottom:2px}
.pinwrap .qcard{margin-top:6px;box-shadow:0 2px 0 rgba(60,45,25,.16)}
.pinwrap.idle{border-color:var(--border-lit);background:var(--bg2);box-shadow:none}
.pinwrap.idle .pinhead{color:var(--gold)}
.pinwrap .pintip{font-size:12.5px;color:var(--fg2);padding:4px 2px}
/* v52 R4：剧情回廊（独立于行为流的剧情折叠区） */
.plotcorridor{border-color:var(--gold);background:rgba(255,215,0,.05);box-shadow:0 0 12px rgba(255,215,0,.18)}
.plotcorridor .pinhead{color:var(--gold);cursor:pointer;user-select:none}
.plotcorridor .msg{margin:6px 0 2px}
/* v52 R3：任务开场 cue 气泡（状态/安排/余量/预告/激励五行） */
.cue-banner{white-space:pre-line;line-height:1.7;border-left:3px solid var(--neon);background:rgba(185,138,63,.10);font-size:13px}
/* v58c：纪日索引卡（云汀手札，一纪日一张，逐任务点选） */
.qindex{border:2px solid var(--neon);background:var(--bg);margin-top:6px;padding:10px 12px;max-width:100%;box-shadow:0 3px 0 rgba(60,45,25,.18)}
.qindex .qihd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.qindex .qititle{font-weight:600;font-size:14px;color:var(--neon);letter-spacing:.06em}
.qindex .qiprog{font-size:12px;color:var(--gold);white-space:nowrap}
.qindex .qicue{font-size:12.5px;line-height:1.7;color:var(--fg2);border-left:3px solid var(--gold);background:rgba(185,138,63,.08);padding:4px 8px;margin-bottom:8px}
.qindex .qirow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-top:1px dashed var(--border)}
.qindex .qirow.done{opacity:.6}
.qindex .qirow.done .qin::after{content:" ✓";color:var(--ok)}
.qindex .qidot{width:18px;text-align:center;color:var(--gold);flex:none}
.qindex .qiinfo{flex:1;min-width:0}
.qindex .qin{font-size:13.5px;color:var(--fg)}
.qindex .qim{font-size:11.5px;color:var(--dim);margin-top:1px}
.qindex .qibtn{flex:none}
/* v52 R6：吟游修习室 站/段/句 三层 */
.osec{border:1px solid var(--border);border-radius:4px;margin:6px 0;background:var(--bg2)}
.osec.passed{border-color:var(--ok)}
.osec-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none;font-size:13.5px}
.osec-head .fcar{color:var(--neon);width:12px}
.osec-badge{margin-left:auto;font-size:11px;color:var(--gold)}
.osec.passed .osec-badge{color:var(--ok)}
.osec-body{padding:4px 10px 10px;border-top:1px dashed var(--border)}
.osent{padding:6px 4px;border-bottom:1px dotted var(--border)}
.osent-en{font-size:14px;line-height:1.7;color:var(--fg)}
.osent-zh{font-size:12px;color:var(--dim);line-height:1.6;margin-top:2px}
.osent-act{margin-top:3px;display:flex;gap:6px}
/* 已完成任务折叠（需求2c） */
.qfold{margin-top:10px}
.qfoldhead{display:flex;align-items:center;gap:7px;border:1px dashed var(--border-lit);background:var(--bg2);padding:7px 10px;font-size:12px;color:var(--fg2);cursor:pointer;max-width:100%}
.qfoldhead:hover{background:var(--bg)}
.qfoldhead .fcar{color:var(--gold);font-size:10px;flex:none}
.qfoldhead .ftext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qfoldhead .fhint{margin-left:auto;font-size:10.5px;color:var(--dim);flex:none}
.qfoldbody{margin-top:6px}
/* 最新回复自动关联当前任务 chip（需求2b） */
.qref.cur{border-color:var(--neon);color:var(--neon);background:rgba(201,111,127,.14)}
.nowtag{font-size:10.5px;color:#3b3226;background:var(--neon);padding:2px 8px;margin-left:8px;letter-spacing:.12em;box-shadow:0 1px 0 rgba(60,45,25,.16);font-weight:600}
.donetag{color:var(--ok);font-size:12px;margin-right:8px;white-space:nowrap}
.btn{display:inline-block;border:2px solid var(--border-lit);background:linear-gradient(180deg,#efe5d2 0%,#e5d8bf 100%);color:var(--fg);font:inherit;font-size:13.5px;
  padding:6px 16px;cursor:pointer;letter-spacing:.06em;transition:none;
  box-shadow:0 1px 3px rgba(60,45,25,.18);border-radius:8px}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(60,45,25,.22)}
.btn.primary{background:linear-gradient(180deg,#d9899a,#c96f7f);border-color:#c96f7f;color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:active{box-shadow:0 1px 2px rgba(60,45,25,.22)}
.btn.gold{background:linear-gradient(180deg,#c9a15f,#b98a3f);border-color:#b98a3f;color:#3b3226}
.btn.ghost{border-color:var(--dim);color:var(--dim)}
.btn.ghost:hover{border-color:var(--fg2);color:var(--fg2);filter:none}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn:disabled:hover{filter:none}
.btn:disabled:active{transform:none;box-shadow:0 1px 3px rgba(60,45,25,.18)}

/* input bar */
.inputbar{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--border);margin-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.inputbar input{flex:1;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:9px 12px}
.inputbar input:focus{outline:none;border-color:var(--neon)}
.inputbar .hint{font-size:11.5px;color:var(--dim);padding-top:12px;white-space:nowrap}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,5,20,.8);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}

/* ===== v56：序章视觉小说播放器已整段移除，相关样式一并删除 ===== */

.dlg{background:var(--bg2);border:2px solid var(--border-lit);width:100%;max-width:820px;max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;padding:24px 26px 24px 26px;box-shadow:0 4px 0 rgba(60,45,25,.14);position:relative}
.dlg::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px);z-index:0}
.dlg>*{position:relative;z-index:1}
.dlg h2{font-size:clamp(18px,5.5vw,24px);margin:0 0 2px;padding-right:48px;font-weight:600;color:var(--cyber);text-shadow:0 1px 0 rgba(60,45,25,.35)}
.dlg .mt{font-size:12px;color:var(--dim);letter-spacing:.12em;margin-bottom:10px;padding-right:48px}
.dlg .close{position:absolute;top:10px;right:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border-lit);font-size:22px;line-height:1;cursor:pointer;color:var(--dim);z-index:12;box-shadow:0 1px 3px rgba(60,45,25,.18);-webkit-tap-highlight-color:transparent;border-radius:8px}
.dlg .close:hover{color:var(--danger);border-color:var(--danger)}
.dlg .close:active{transform:scale(.94)}

/* ===== v25 书页卡片标签样式（记忆锚 / 科目 / 备考要览） ===== */
.v25tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;padding:2px 10px;border-radius:12px;border:1px solid;line-height:1.6;white-space:nowrap;margin-right:6px;vertical-align:middle}
.v25tag-subj{color:var(--cyber);background:rgba(95,143,143,.12);border-color:rgba(95,143,143,.4)}
.v25tag-tip{color:var(--gold);background:rgba(185,138,63,.13);border-color:rgba(185,138,63,.44)}
.v25tag-anchor{color:#6a3fc4;background:rgba(106,63,196,.1);border-color:rgba(106,63,196,.38)}
.v25anchor-body{color:var(--cyber);font-size:clamp(14px,3.8vw,16px);line-height:1.8;font-weight:500}
.v25tip-body{color:var(--gold);font-size:clamp(13px,3.5vw,15px);line-height:1.7}
/* ===== 笔记配图（校订编辑器插入）=====
   显示区域长宽上下限：宽 min(100%,560px)、高 ≤42vh；下限 96×64。
   width/height 双 auto 保持固有比例自适应缩放，object-fit:contain 兜底不裁切 */
.vimg{display:block;width:auto;height:auto;max-width:min(100%,560px);max-height:42vh;min-width:96px;min-height:64px;object-fit:contain;margin:10px auto;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04)}
#edArea .vimg{cursor:pointer}
#edArea .vimg::selection{background:rgba(61,240,255,.2)}

/* ===== 考点配图图区（图文分离）：有图才渲染，无图整块消失 =====
   独立显示区域：不与文字混排；多图横向排列自动换行；单图也有尺寸上下限、按原比例自适应 */
.v25gallery{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;margin:2px 0 12px;padding:10px;background:rgba(255,255,255,.4);border:1px solid var(--border);border-radius:12px;max-width:100%;box-sizing:border-box}
.v25gal-img{display:block;height:auto;width:auto;max-width:100%;max-height:230px;object-fit:contain;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:zoom-in;flex-shrink:0}
/* v25-67 图区大图预览：轻量全屏遮罩，复用项目 panel() + 遮罩关闭语义 */
.v25img-zoom .dlg{background:transparent;border:none;padding:0;box-shadow:none}
.v25img-zoom .close{position:fixed;top:14px;right:14px;font-size:26px;width:36px;height:36px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center}
.v25img-zoom img{display:block;max-width:min(94vw,1400px);max-height:min(92vh,900px);object-fit:contain;border-radius:10px;margin:0 auto;background:#fff;box-shadow:0 8px 32px rgba(0,0,0,.4)}
/* —— v25-65 插页式图文并排（任务弹窗 drawRead 与考点卡共用）——
   有图：图左文右，图列是「册页裱边」（米白衬底+细框+内衬高光），图片撑满图列不再缩角落；
   无图：单列纯文页，图列整个不渲染，绝无空壳。窄屏（≤640px）退化为上图下文。 */
.v25spread{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:12px;align-items:stretch;min-width:0}
.v25spread .v25gallery{flex-direction:column;justify-content:center;align-items:center;margin:0;padding:9px;background:linear-gradient(180deg,rgba(255,253,246,.9),rgba(255,250,240,.65));border:1px solid var(--border);border-radius:12px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);max-width:100%;width:100%;box-sizing:border-box}
.v25spread .v25gal-img{max-width:100%;max-height:280px;width:auto;height:auto;object-fit:contain;box-shadow:0 1px 3px rgba(60,45,25,.08)}
.v25spread .v25rd-paper{min-width:0;overflow-wrap:break-word;word-break:break-word}
.pt-spread{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.pt-spread .v25gallery{flex-direction:column;justify-content:center;align-items:center;margin:0;padding:7px;background:rgba(255,253,246,.85);border-radius:10px}
.pt-spread .v25gal-img{max-width:min(100%,170px);max-height:200px}
.pt-spread .pt-body{min-width:0}
@media (max-width:640px){
  .v25spread,.pt-spread{grid-template-columns:1fr}
  .v25spread .v25gallery{flex-direction:row}
}
/* ===== 考点弹窗制式（宣纸卷轴·校勘本）：弱 chrome、强标题、纸页正文、勘注卡 ===== */
/* 面包屑（弹窗抬头）：单元号为主、体量为辅 */
.dlg h2.v25crumb{font-size:clamp(12.5px,3.6vw,14px);font-weight:500;color:var(--dim);letter-spacing:.06em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:54px;text-shadow:none;margin-bottom:0;line-height:1.6}
.v25crumb-n{font-weight:700;color:var(--fg2)}
.v25crumb-m::before{content:"·";margin-right:7px;color:var(--border-lit)}
/* —— 原文阅读 —— */
.v25rd{display:flex;flex-direction:column;gap:13px;padding-bottom:4px}
.v25rd-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);letter-spacing:.06em}
.v25rd-step{font-weight:600;color:var(--fg2);letter-spacing:.1em}
.v25rd-count{font-variant-numeric:tabular-nums}
.v25rd-rule{flex:1;min-width:10px;height:1px;background:linear-gradient(90deg,var(--border),rgba(216,203,178,0))}
.v25rd-bar .btn.sm{padding:2px 9px;font-size:12px}
.v25rd-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--border)}
.v25rd-title{margin:0;font-size:clamp(19px,5.2vw,25px);font-weight:700;line-height:1.28;letter-spacing:.01em;color:var(--fg)}
.v25rd-head .v25tag{transform:translateY(-3px);margin-right:0}
.v25rd-paper{background:#fffaf1;border:1px solid var(--border);border-radius:12px;padding:15px 17px;font-size:clamp(15px,4.1vw,17.5px);line-height:1.95;white-space:pre-wrap;min-height:122px;max-height:min(56vh,470px);overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 1px 2px rgba(60,45,25,.05);cursor:pointer;transition:border-color .18s}
.v25rd-paper:hover{border-color:var(--border-lit)}
.v25rd-paper .vimg{margin:12px auto;max-height:min(36vh,340px)}
.v25rd-hint{font-size:11px;color:var(--dim);opacity:.75;letter-spacing:.04em;text-align:right}
/* 勘注卡（记忆锚 / 备考要览）：标签栏 + 正文右栏，字基线统一 */
.v25note{display:grid;grid-template-columns:70px 1fr;gap:2px 12px;align-items:start;padding:11px 14px;border-radius:10px;font-size:clamp(13px,3.6vw,14.5px);line-height:1.75}
.v25note .v25tag{margin:3px 0 0;justify-self:start}
.v25note-a{background:rgba(122,41,255,.055);border:1px solid rgba(122,41,255,.2)}
.v25note-t{background:rgba(185,138,63,.07);border:1px solid rgba(185,138,63,.26)}
.v25note .v25anchor-body{display:block;color:#5a3fbb;font-weight:600}
.v25note .v25tip-body{display:block;color:var(--fg2)}
.v25note .v25tip-body b{color:var(--gold);font-weight:700}
.v25rd-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid var(--border)}
/* —— 导游词节级任务（篇 → 节 → 段 → 句） —— */
.v25pblock{margin-bottom:14px}
.v25pblock:last-child{margin-bottom:0}
.v25subhead{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.04em;margin:0 0 6px 2px}
.v25pnote{font-size:11.5px;color:var(--dim);opacity:.8;margin:-2px 0 6px 2px}
/* v104：整段阅读/重读整体性显示——一个白底文章容器内按自然段落衔接，不再每段独立成卡 */
.v25whole{max-height:none;min-height:0;cursor:default}
.v25seg{margin:0 0 1.05em 0;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;min-height:1.1em}
.v25seg:last-child{margin-bottom:0}
.v25sent-no{font-size:11.5px;color:var(--dim);letter-spacing:.04em}
.v25ctx summary{cursor:pointer;font-size:12px;color:var(--dim);padding:2px 0}
.v25ctx[open] summary{margin-bottom:6px}
.v25ctx .v25rd-paper{max-height:180px;cursor:default;font-size:13.5px}
/* 复述遮盖：先糊住原文，点按钮复原 */
.v25cover{position:relative}
.v25cover .v25cover-txt{filter:blur(7px);opacity:.4;pointer-events:none;user-select:none}
.v25cover-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;box-shadow:0 2px 10px rgba(60,45,25,.2)}
.v25diffbox{background:#fffaf1;border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:clamp(14px,4vw,16px);line-height:1.95;max-height:min(46vh,420px);overflow:auto;white-space:pre-wrap}
.v25diff-miss{background:transparent;color:#4a9eff;border-bottom:1.5px dotted rgba(74,158,255,.55)}
.v25diff-extra{background:rgba(231,76,60,.18);color:#b8342a;text-decoration:line-through;border-radius:2px}
.v25cov{font-size:12px;color:var(--dim);letter-spacing:.04em}
/* —— 试炼答题 —— */
.v25qz{display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.v25q-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);letter-spacing:.06em}
.v25q-kind{font-weight:700;color:var(--fg2);letter-spacing:.08em}
.v25q-stem{background:#fffaf1;border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:clamp(15px,4.1vw,17px);line-height:1.85;box-shadow:0 1px 2px rgba(60,45,25,.05)}
.v25q-opts{display:flex;flex-direction:column;gap:7px}
.v25q-judge{flex-direction:row}
.v25q-judge .optbtn{flex:1;padding:11px 13px;font-size:14.5px;font-weight:600}
.optcard{display:flex;align-items:flex-start;gap:9px;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:#fffdf7;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.optcard:hover{border-color:var(--border-lit)}
.optcard:active{transform:translateY(1px)}
.optcard:has(input:checked){border-color:var(--neon);background:rgba(201,111,127,.07);box-shadow:inset 0 0 0 1px rgba(201,111,127,.3)}
.optcard input{margin:3px 0 0;flex:0 0 auto;accent-color:var(--neon);width:16px;height:16px}
.optcard-t{font-size:clamp(14px,3.9vw,15.5px);line-height:1.7}
.v25q-blank{width:100%;padding:11px 13px;font:inherit;font-size:clamp(14px,4vw,16px);background:#fffaf1;border:1px solid var(--border-lit);border-radius:10px;color:var(--fg)}
.v25q-blank:focus{outline:2px solid rgba(201,111,127,.35);outline-offset:1px}
.v25res{border-radius:12px;padding:13px 15px;font-size:clamp(13px,3.7vw,14.5px);line-height:1.8;border:1px solid}
.v25res-ok{background:rgba(111,154,98,.07);border-color:rgba(111,154,98,.32)}
.v25res-no{background:rgba(184,92,92,.06);border-color:rgba(184,92,92,.3)}
.v25res-hd{font-weight:700;margin-bottom:5px}
.v25res-ok .v25res-hd{color:var(--ok)}
.v25res-no .v25res-hd{color:var(--danger)}
.v25res-wait{background:var(--bg3);border-color:var(--border);color:var(--dim);font-size:13px;padding:11px 14px;border-radius:12px}

/* ===== GAL 版式：quest modal 宽屏变左右两栏（Phase 0 T1）=====
   左 1/3 = 配合区（NPC + 关卡元信息 + 奖励）
   右 2/3 = stageHost（书页/对话/试炼） */
.dlg.gal{max-width:min(1100px,95vw);padding:0;overflow:hidden}
/* v71：gal-right 基础布局移出媒体查询——内联样式已删，
   flex 列布局在窄屏同样生效（gal 弹窗窄屏为纵向堆叠，gal-right 占剩余高度） */
.dlg.gal .gal-right{position:relative;display:flex;flex-direction:column;overflow:hidden;padding:20px 22px}
@media(min-width:900px){
  .dlg.gal{display:flex;flex-direction:row}
  .dlg.gal .gal-left{
    width:32%;min-width:220px;max-width:280px;
    border-right:2px solid var(--border);
    padding:22px 16px;
    display:flex;flex-direction:column;gap:14px;
    background:linear-gradient(180deg,rgba(61,240,255,.05),transparent);
  }
  .dlg.gal .gal-right{
    flex:1;min-width:0;
    max-height:88vh;max-height:88dvh;
  }
  .dlg.gal .gal-right .close{top:12px;right:14px}
  .dlg.gal .gal-right #stageHost{flex:1;min-height:0;overflow-y:auto}
}

/* ===== 试炼幻境视觉层（Phase 1 case-illusion 最小版）===== */
.dlg.gal.illusion .gal-right{
  background:radial-gradient(120% 80% at 50% 0%,rgba(120,40,200,.18),transparent 55%),#0a0618;
}
.dlg.gal.illusion .gal-right::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 4px,rgba(120,40,200,.05) 4px,rgba(120,40,200,.05) 5px);
  animation:illuFogFlow 14s linear infinite;
}
@keyframes illuFogFlow{ 0%{background-position:0 0} 100%{background-position:0 40px} }
.dlg.gal.illusion .gal-right .gal-right-inner{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.illu-top{position:absolute;top:6px;left:14px;right:14px;z-index:5;pointer-events:none}
.illu-hp-label{font-size:10px;color:var(--gold);letter-spacing:.12em;margin-bottom:2px;text-align:right}
.illu-hp-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.illu-hp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyber),var(--neon));transition:width .4s ease}
/* v80：雾怪收进右侧窄轨——不再压在题干/反馈正文上；答错后残留缩为小灰影 */
.illu-fog-area{position:absolute;top:34px;bottom:52px;right:1px;width:26px;pointer-events:none;overflow:hidden;z-index:3}
.illu-fog{position:absolute;left:0;top:0;transform:translateX(20px) scale(.8);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.illu-fog.show{transform:translateX(0) scale(.8);opacity:1}
.illu-fog.defeat{transform:translateY(-30px) scale(.5);opacity:0;transition:transform .5s ease,opacity .4s}
.illu-fog.defeat.crit{transform:translateY(-46px) scale(1);filter:hue-rotate(40deg);opacity:0}
.illu-fog.fail{animation:illuShake .5s ease}
.illu-fog.done{transform:scale(.46);opacity:.22;filter:grayscale(.6)}
@keyframes illuShake{10%,90%{transform:translateX(-3px) scale(.8)} 20%,80%{transform:translateX(3px) scale(.8)} 30%,50%,70%{transform:translateX(-2px) scale(.8)} 40%,60%{transform:translateX(2px) scale(.8)}}
.illu-fog-ball{font-size:20px;line-height:1;filter:drop-shadow(0 0 6px rgba(180,80,220,.6))}
.illu-fog.done .illu-fog-ball{font-size:18px}
.illu-fog-idx{font-size:8px;color:var(--dim);text-align:center;margin-top:1px;letter-spacing:.04em}
.dlg.gal.illusion #stageHost{padding-right:30px}
.illu-combo{position:absolute;bottom:10px;right:16px;font-size:11px;color:var(--gold);letter-spacing:.1em;z-index:5}
.illu-combo.crit{font-size:14px;color:var(--neon);text-shadow:0 0 8px var(--neon);animation:illuCritPulse .8s ease}
@keyframes illuCritPulse{0%{transform:scale(1.4)} 100%{transform:scale(1)}}

/* scroll book pages */
.book{background:var(--bg3);border:2px solid var(--border);padding:14px 16px;margin:10px 0;box-shadow:inset 1px 1px 0 var(--border-lit)}
.book .bp{font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--neon);margin-bottom:8px;text-shadow:0 1px 0 rgba(60,45,25,.35);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.book .bp .pid{font-weight:600}
.book .bp em{font-style:normal;color:var(--gold);font-weight:600}
.book .pt{border-bottom:1px dashed var(--border);padding:7px 0;font-size:14px;line-height:1.6}
.book .pt .pid{font-weight:600;margin-right:8px}
.book .pt .pid .s3{color:var(--neon)}
.book .pt em{font-style:normal;color:var(--gold);font-weight:600}
.book .npcnote{font-size:12.5px;color:var(--dim);border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;font-style:italic}
.book .anchor{background:var(--bg2);border:1px solid var(--border-lit);padding:8px 10px;margin-top:8px;font-size:13px}
.book .anchor b{color:var(--neon)}
/* 打字机效果：当前打字元素高亮 + 末尾闪烁光标 */
.book .pt.tw-active,.book .npcnote.tw-active,.book .anchor.tw-active{background:rgba(95,143,143,.08);border-radius:2px}
.tw-active::after{content:'▋';color:var(--neon);animation:twblink .8s steps(2) infinite;margin-left:1px;font-weight:400}
@keyframes twblink{50%{opacity:0}}
.tw-done{opacity:1!important;transition:none}
.book .oralrow{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.book .oralrow .en{display:block;color:var(--fg);font-size:14px;line-height:1.6}
.book .oralrow .zh{display:block;color:var(--dim);font-size:12.5px;margin-top:4px}

/* 朗读/复述工作台 */
.oralkit{border:2px solid var(--border);background:var(--bg);padding:12px;margin-top:10px}
.oraltxt{position:relative;border:1px dashed var(--border-lit);padding:10px 12px;margin-bottom:8px;line-height:1.7;transition:filter .2s}
.oraltxt.masked .en{filter:blur(7px);user-select:none;pointer-events:none}
.oraltxt.masked .zh{opacity:.35}
.oraltxt .maskhint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--neon);font-size:14px;letter-spacing:.1em;pointer-events:none;text-shadow:0 1px 0 rgba(60,45,25,.35)}
.oraltxt.masked .maskhint{display:flex}
.kitbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.kitbar .btn{padding:5px 10px;font-size:12.5px}
/* v25-68 编辑器色卡按钮：6 小圆点 + hover 变亮 + active 按压 */
.edsq{width:18px;height:18px;border-radius:50%;border:1.5px solid #555;cursor:pointer;padding:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .1s,box-shadow .15s;flex-shrink:0}
.edsq:hover{transform:scale(1.15);box-shadow:0 2px 6px rgba(0,0,0,.2);filter:brightness(1.08)}
.edsq:active{transform:scale(.9);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.edbg{border-width:1.5px}
.edbg[data-bg="__clear"]{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.rectimer{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:52px}
.wave{width:100%;height:48px;background:var(--bg2);border:1px solid var(--border);display:block;margin:6px 0}
.kwgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kwchip{border:1px solid var(--border-lit);background:var(--bg2);color:var(--fg2);padding:4px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.kwchip.hit{background:var(--ok);color:#3b3226;border-color:var(--ok);text-decoration:line-through}
.kwchip.miss{opacity:.45}
.recscore{font-size:14px;margin-top:6px;padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg3)}
.recscore.good{border-left-color:var(--ok)}
.recscore.bad{border-left-color:var(--danger)}
.speedbtns button.cur{background:var(--neon);color:#fff;border-color:var(--neon)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.pager button{min-width:34px}
.pager .pg{font-size:12.5px;color:var(--dim)}

/* quiz inside modal */
.quiz{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.quiz .qz{font-size:14px;margin:8px 0}
.quiz .qz .kk{font-size:11px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:3px}
.quiz input{width:100%;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:7px 10px;margin-top:4px}
.quiz input:focus{outline:none;border-color:var(--neon)}
.quiz .fb{font-size:13px;margin-top:6px;display:block;line-height:1.7}
.quiz .fb.ok{color:var(--ok)} .quiz .fb.no{color:var(--danger)}
.quiz .fb .btn{margin-top:6px}
.jbtns{display:flex;gap:10px;margin-top:6px}
/* v53：选择题选项为完整陈述句（最长 50 字），改为纵向排列、左对齐自动换行 */
.jbtns.choicebtns{flex-direction:column;gap:8px}
.jbtns.choicebtns .btn{width:100%;text-align:left;white-space:normal;word-break:break-all;overflow-wrap:break-word;line-height:1.6;padding:10px 14px;min-height:0;font-size:13px;max-width:100%;display:block}

/* v53：gal-left 头像下方立绘占位——雾袍剪影（素材就绪后替换为真实立绘） */
.gal-portrait{flex:1;min-height:180px;margin:6px 0;border-radius:10px;
  background:
    linear-gradient(180deg,transparent 60%,rgba(60,45,25,.10)),
    radial-gradient(60% 46% at 50% 34%, var(--border-lit) 0 42%, transparent 43%),   /* 头 */
    radial-gradient(72% 62% at 50% 78%, var(--border-lit) 0 52%, transparent 53%); /* 袍身 */
  background-color:rgba(185,138,63,.08);
  border:1px solid var(--border);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);
  position:relative;overflow:hidden;
}
.gal-portrait::after{content:"立绘";position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:10px;letter-spacing:.2em;color:var(--dim)}
.gal-portrait.hasimg::after{content:none}
.gal-portrait.hasimg{background:none;border:none;box-shadow:none;display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
/* v58g：立绘完整显示——contain 不裁头脚（旧版无尺寸规则靠 overflow 硬裁，
   全身立绘只剩腰以下）；透明背景直接透出纸面 */
.gal-portrait.hasimg img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:top center;border-radius:10px;background:transparent}
/* v58：窄屏不再完全藏起立绘——已上传时以紧凑横幅展示，无图仍隐藏占位剪影 */
@media(max-width:899px){
  .gal-portrait{display:none}
  .gal-portrait.hasimg{display:flex;min-height:0;height:150px;margin:8px 12px;align-items:center}
  .gal-portrait.hasimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
  /* v69 iPhone 滚动修复：gal 弹窗窄屏下整体可滚——此前 .dlg.gal overflow:hidden，
     而 #stageHost 的 overflow-y:auto 只在 ≥900px 生效，窄屏内容超高即被裁死、无法滚动 */
  .dlg.gal{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .dlg.gal .gal-left{flex:none}
  .dlg.gal .gal-right{max-height:none;overflow:visible}
}

<script>

"use strict";
/* ================= 问道之旅 v2 · 对话流引擎 ================= */
const D = window.GAME_DATA;
const $ = (s,el=document)=>el.querySelector(s);
/* 交互兼容垫片：全站按钮统一监听 pointerdown（消除 300ms 延迟）。
   个别旧浏览器/内嵌 WebView 只派发 mouse 事件而无 pointer 事件，
   此处于捕获阶段补发 pointerdown；现代浏览器原生 pointerdown 先行，
   500ms 内的同源 mousedown 视为兼容事件直接忽略，杜绝重复触发。*/
(function(){
  let lastPD=0;
  document.addEventListener("pointerdown",()=>{ lastPD=Date.now(); },true);
  document.addEventListener("mousedown",e=>{
    if(Date.now()-lastPD<500) return;
    const t=e.target;
    if(!t||!t.dispatchEvent) return;
    try{ t.dispatchEvent(new (window.PointerEvent||MouseEvent)("pointerdown",{bubbles:true,cancelable:true,view:window})); }catch(_){}
  },true);
})();
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mdClean = s=>String(s).replace(/\*\*/g,"").replace(/^#{1,6}\s+/gm,"").replace(/^[-*]\s+/gm,"· ").replace(/`/g,"");
/* —— 富文本渲染：纯文本转义、含 HTML 时白名单净化（加粗/斜体/下划线/高亮/标色/背景色）—— */
function rich(s){
  s=String(s==null?"":s);
  if(!/<[a-z][\s\S]*?>/i.test(s)) return esc(s);   /* 纯文本走转义 */
  return s
    .replace(/<script[\s\S]*?<\/script>/gi,"")
    .replace(/<!--[\s\S]*?-->/g,"")
    .replace(/<[^>]*>/g, tag=>{
      const m=/^<\s*(\/?)\s*([a-zA-Z0-9]+)/.exec(tag); if(!m) return "";
      const close=m[1], name=m[2].toLowerCase();
      const allow=["b","strong","i","em","u","mark","span","div","br","p","sub","sup","hr","font","img"];
      if(!allow.includes(name)) return "";
      if(name==="img"){ /* 笔记配图：协议白名单防 javascript: 注入；保留 class 与尺寸/浮动 style（编辑器所见即所得） */
        if(close) return "";
        const src=(tag.match(/src\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i)||[]).slice(1).filter(Boolean)[0]||"";
        if(!/^(https?:|data:image\/)/i.test(src)) return "";
        const cls=(tag.match(/class\s*=\s*(?:"([^"]*)"|'([^']*)')/i)||[])[1]||"vimg";
        const stl=(tag.match(/style\s*=\s*(?:"([^"]*)"|'([^']*)')/i)||[]).slice(1).filter(Boolean)[0]||"";
        const keep=(stl.match(/(?:^|;)\s*(?:width|height|float|margin[^:]*)\s*:[^;]+/gi)||[]).join(";");
        return '<img src="'+src.replace(/["'<>]/g,"")+'" class="'+cls.replace(/["'<>]/g,"")+'"'+(keep?' style="'+keep.replace(/["'<>]/g,"")+'"':"")+' alt="笔记配图">'; }
      if(name==="span"){ const stl=(tag.match(/style\s*=\s*(?:"([^"]*)"|'([^']*)')/i)||[]).slice(1).filter(Boolean)[0]||"";
        const keep=(stl.match(/(?:^|;)\s*(?:color|background-color|background|font-weight|font-size|text-align|text-decoration(?:-color)?|letter-spacing)\s*:[^;]+/gi)||[]).join(";");
        return close?'</span>':'<span style="'+keep.replace(/["'<>]/g,"")+'">'; }
      if(name==="font"){ /* Safari 未开 styleWithCSS 时 execCommand 生成 <font color/face>：转成 span 样式保住颜色 */
        if(close) return '</span>';
        const col=(tag.match(/color\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i)||[]).slice(1).filter(Boolean)[0]||"";
        return '<span style="'+(col?"color:"+col.replace(/["'<>]/g,""):"")+'">'; }
      return '<'+close+name+'>';
    });
}
/* 富文本 HTML → 纯文本（写入运行库 canonical 时用，保证出题/复述/评分仍基于干净文本） */
function _htmlToText(s){
  s=String(s==null?"":s);
  if(!/<[a-z][\s\S]*?>/i.test(s)) return s;
  return s.replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'");
}
/* —— 图文分离显示：把富文本里的 <img> 抽到独立图区，正文不再夹图（任务书页/考点弹窗共用）——
   用户配图后：图片进 .v25gallery 图区（按原比例、有尺寸上下限），文字回归连续阅读流；
   没有配图 → pointGalleryHtml 返回空串，图区整个不渲染，版面不留空壳。 */
function splitPointImgs(html){
  const imgs=[];
  const body=String(html||"").replace(/<img[^>]*>/gi, tag=>{
    const src=(tag.match(/src\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i)||[]).slice(1).filter(Boolean)[0]||"";
    if(src) imgs.push(src);
    return "";
  }).replace(/(?:<br>\s*){2,}/gi,"<br>").trim();   /* 抽图后可能残留连续空行，收拢 */
  return {body, imgs};
}
function pointGalleryHtml(imgs){
  if(!imgs||!imgs.length) return "";
  /* v25-67：直接挂 inline onpointerdown → _v25Zoom(src)，零事件委托复杂度 */
  return '<div class="v25gallery">'+imgs.map(src=>{
    const safeSrc=String(src).replace(/["'<>]/g,"");
    return '<img class="v25gal-img" src="'+safeSrc+'" alt="配图" loading="lazy" onpointerdown="try{SFX&&SFX.tap();}catch(_){}_v25Zoom&&_v25Zoom(\''+safeSrc.replace(/\\'/g,"\\\\'")+'\');event.preventDefault();event.stopPropagation();">';
  }).join("")+'</div>';
}
/* 高亮/显示函数共用的富文本适配：含 HTML 标签的入参视为 rich() 已净化的校订文本，直接放行；
   纯文本照旧 esc 转义。防止「esc 把用户编辑的 <b>/<span> 变成字面字符」的样式丢失。 */
function richAware(s){ return /<[a-z][\s\S]*?>/i.test(String(s||""))? String(s) : esc(s); }
/* ================= 音效引擎（Web Audio 合成，无外部文件，离线可用） ================= */
let _ac=null;
function ac(){ if(!_ac){ try{ _ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(_ac&&_ac.state==="suspended") _ac.resume(); return _ac; }
function tone(freq,dur,type,vol,when){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+(when||0), o=c.createOscillator(), g=c.createGain();

/* —— 2. 时钟：25 自然日周期（v25 废纪日机制，不再有游戏日×5/雾涌日）—— */
function ensureClocks(){
  if(!st.day||isNaN(st.day)||st.day<1) st.day=1;
  const _N2=(window.V25&&V25.planHorizon)?V25.planHorizon().N2:25;
  if(st.day>_N2) st.day=_N2;                     /* 周期上限：按 11/20 最终截止日动态计算 */
  if(!st.lastNaturalDay) st.lastNaturalDay=new Date().toISOString().slice(0,10);
  st.fogDay=Math.max(1,_N2+1-st.day);            /* v25：仅存为兼容字段，UI 不再展示 */
  st.gameDay=st.day;                             /* v25：纪日=自然日，废除 ×5 */
  try{ console.log("[v25] clocks:",{naturalDay:st.day}); }catch(e){}
}
function advanceNaturalDay(){
  /* v50：每过 1 个现实自然日，游戏自然日 +1（DAYS 按自然日组织任务），雾涌日 -1（最低 1），恢复心气/灵力 */
  const today=new Date().toISOString().slice(0,10);
  ensureClocks();
  if(today===st.lastNaturalDay) return 0;
  const elapsed=Math.max(1, Math.round((new Date(today)-new Date(st.lastNaturalDay))/86400000));
  /* v50 修正：1 现实日 = 1 自然日推进（旧版错误地 +5 导致跳过任务） */
  const natAdv=elapsed;
  const oldDay=st.day||1;
  st.day=Math.min(25, oldDay+natAdv);            /* v25：上限 25 自然日 */
  st.fogDay=Math.max(1, 26-st.day);              /* v25：由自然日派生，不再独立倒计时 */
  /* v25：纪日/解锁机制已废——自然日只随现实日期推进，任务放号由 V25.sheet 自管 */
  /* 离线恢复：心气+30%、灵力全额恢复 */
  const hpCap=maxHP(); st.hp=Math.min(hpCap,(st.hp||0)+Math.round(hpCap*0.3*elapsed));
  const enCap=maxEnergy(); st.energy=enCap;
  st.lastNaturalDay=today;
  try{ if(window.V25&&V25.settleAcct) V25.settleAcct(); }catch(e){}  /* 每日一结算：卡池增删账目 → 重算任务量 */
  save();
  return elapsed;
}

  for(const [from] of STYLE_BLACKLIST){
    if(s.indexOf(from)>=0) hits.push(from);
  }
  for(const [re] of STYLE_REGEX){

    re.lastIndex=0;
  }
  return hits;
}

  /* 3) directorPlan —— 群聊导演提示词 → 四十五日；任务类型元标签 → 咒纹拓印 */
  chat.directorPlan=async function(userText,opts){
    const CTX=CTX_REF();
    opts=opts||{};
    if(!CTX||!CTX.dsReady()) return null;
    const {NPC}=CTX;
    const targets=opts.targets||[];
    const kind=opts.kind||"chat";

    if(cached&&(Date.now()-cached.at)<60000) return cached.plan;
    const cards=Object.keys(NPC).map(id=>{
      const npc=NPC[id]; if(!npc) return null;

      const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;

    const userDoc=(window.WDCfg&&WDCfg.directorDoc)?WDCfg.directorDoc():"";
    let sys=userDoc&&userDoc.trim()
      ?userDoc.trim()
      :("你是日式RPG《问道之旅·二十五日》的群聊导演。看完下面的信息，决定接下来哪些NPC该开口、按什么顺序、用什么反应类型。\n"
        +"【反应类型】respond(正常接话) / interject(插话，多为半句或语气词) / react(对他人的反应) / guide(把话题轻拽回正事，但不许生硬)。\n"
        +"【活人感·铁律】"
        +"1）NPC首先是有自己生活的居民，不是任务派发器或报告器——她们可以聊自己正在做的事、想起的事、对眼前场景的感想，不必每次都和任务相关；"
        +"2）反应必须多样：有人接话、有人吐槽、有人只给一个语气词、有人冷淡、有人听错重点、有人接别人的话茬、有人突然想起别的事；"
        +"3）禁止让NPC轮流报告进度、轮流说鼓励话、轮流报数值——几个人不能说几个意思相近的句子；"
        +"4）hint是给NPC这一句的方向（≤20字），不是替她写台词，不要写「请说……」「你要表达……」这种指令；"
        +"5）通常1-2人开口，极少超过3人。被@的人通常必回应；未被@的人只在她的性格确实会被勾起时插话。\n"
        +"【任务完成场景特别注意】不要让NPC说「XX已交付」「任务完成」这种报告式台词——那是系统该干的事。NPC的第一反应应该像队友看到同伴刚干完活：也许随口夸一句、也许吐槽选这关太折腾、也许接别人的话茬、也许什么都不说只应一声、也许突然想起自己有别的事要忙。");
    if(kind==="questreact"&&!(userDoc&&userDoc.trim())){
      sys+="任务NPC的反应尤其要活人：刚见证了队友通关，她第一反应不是「已交付」——可能是「嚯，这一关居然真被你闯过来了。」「行吧，算是过了。」「……你手怎么脏的？」这种。";
    }
    sys+="\n"+this.masterRule();
    sys+="\n只输出JSON。";
    let user="在场角色与各自说话方式：\n"+cards.map(c=>JSON.stringify(c)).join("\n")
      +"\n\n近期群聊（供互文，不要重复其中说法）：\n"+(scene.map(s=>s.who+"："+s.text).join("\n")||"（无）")
      +"\n\n玩家刚发："+userText
      +"\n\n输出JSON：{\"plan\":[{\"npc\":\"id\",\"type\":\"respond\",\"hint\":\"这一句的方向≤20字\"}]}";
    if(kind==="questreact"&&opts.quest){
      const q=opts.quest;
      const meta=(q.type==="gear"?"法器整备 · 晨雾初整":
        q.type==="study"?"秘境探幽 · 雾径开荒":
        q.type==="review"?"雾回潮 · 旧秘回望":
        q.type==="drill"?"谜题净化 · 试炼雾巢":
        q.type==="oral"?"咒祷辞吟诵 · 镇城大咒":
        q.type==="boss"?"攻城之战 · 守关大阵":
        q.type==="clue"?"咒纹拓印 · 结界拓片":
        q.type==="flash"?"夜巡驱雾":
        q.type==="reward"?"雾散赏至":"初程");
      user+="\n\n【任务完成场景补充】刚完成的关卡是「"+(this.questDisplayName(q)||"")+"」——这是原始关卡名（教育/考试术语），绝对不要让NPC说这个名字。它在世界里的游戏化类型是："+meta+"。";

      let o;

      catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(!m) return null; o=JSON.parse(m[0]); }
      const seen=new Set();
      const plan=(o.plan||[]).filter(p=>p&&p.npc&&NPC[p.npc]&&!seen.has(p.npc)&&seen.add(p.npc))
        .slice(0,4)
        .map(p=>({npc:p.npc,type:p.type||"respond",hint:String(p.hint||"").slice(0,40)}));
      if(!plan.length) return null;
      const result={plan};
      this._dPlanCache.set(ck,{plan:result,at:Date.now()});
      return result;
    }catch(e){ return null; }
  };

  /* 4) directorRespond —— 全员群聊单次生成提示词 → 四十五日 */
  chat.directorRespond=async function(targetIds,userText){
    const CTX=CTX_REF();
    if(!CTX||!CTX.dsReady()||!targetIds||targetIds.length<2) return null;
    const {NPC}=CTX;

        const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;
        const persona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(id):"";
        /* v55：群聊导演卡补注入 WDTerms 专属约束——群聊回复此前不做人设约束，是「人设部分生效」根因 */

                   :(persona||npc.intro||""),

      }).filter(Boolean);
      if(!cards.length) return null;
      const sys="你是日式RPG《问道之旅·二十五日》的群聊导演。一群早就认识彼此的角色，在同一个群聊里看到玩家的同一条消息，各自留下反应。"
        +"铁律："
        +"1）每个人只说她这个人才会说的话——反应类型必须错开：有人接话、有人吐槽、有人只给一个语气词、有人冷淡、有人听错重点或答非所问、有人顺着别人的话补刀、有人把话题拽回正事；"
        +"2）严禁所有人表达同一个意思（尤其禁止轮流鼓励/安慰/说'不要气馁'/'相信自己'），也严禁每个人都把话说完整；"
        +"3）长度2～50字，越短越好，允许只有一两个字、半句、犹豫改口；玩家说的是现实见闻时，先当八卦接，不许翻译成剧情或任务；"
        +"4）允许角色之间互相接茬、拆台、偷笑、无奈，体现她们彼此的关系；玩家是群里一员，不是宇宙中心；"
        +"5）遵守各自语言人格卡的节奏与禁忌；禁老师腔/客服腔/心理医生腔/AI腔/命令句/表面卖萌口癖；不要为了显得有性格而集体表演性格，平淡应一声也允许；"
        +"6）"+this.masterRule()
        +"7）只输出JSON。";
      const user="在场角色与各自说话方式：\n"+cards.map(c=>JSON.stringify(c)).join("\n")
        +"\n\n近期群聊（供互文，不要重复其中说法）：\n"+(scene.map(s=>s.who+"："+s.text).join("\n")||"（无）")

  /* 5) directorAudit —— 审核提示词 → 四十五日；圣女恢复分母 45→49 */
  chat.directorAudit=async function(text,context){
    const CTX=CTX_REF();
    if(!CTX||!CTX.dsReady()) return {pass:true,issues:[],revised:text};
    context=context||{};
    const st=CTX.getSt();
    const worldBrief=(typeof context.worldBrief==="string"&&context.worldBrief.trim())
      ?context.worldBrief
      :(this.worldBrief?this.worldBrief():"");
    const npcCards=[];
    if(context.npcId){
      const id=context.npcId;
      const npc=CTX.NPC&&CTX.NPC[id];
      const arc=(window.WDRegistry&&WDRegistry.arcSeedOf)?WDRegistry.arcSeedOf(id):null;
      const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;
      const persona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(id):"";
      /* v55：审核卡补注入 WDTerms 专属约束（口吻/禁令），与群聊导演同通道 */
      const pc=personaTermOf(id);
      npcCards.push({id,name:npc?(window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,npc.name):npc.name:id,
        role:npc?npc.role:"",arcSeed:arc||null,voice:v?{cadence:v.cadence,avoid:v.avoid}:null,
        persona:persona||"",
        专属约束:pc?{口吻:pc.voice,禁令:pc.forbidden}:undefined});
    }
    const kind=context.kind||"dialogue";
    const inputType=typeof text;
    const textForAi=inputType==="object"&&text!==null
      ?JSON.stringify(text).slice(0,1500)
      :String(text).slice(0,1500);
    const sys="你是日式RPG《问道之旅·二十五日》的剧本导演。你要审核下面这段 AI 生成的文本，判断它是否合理。\n"
      +"审核四维度：\n"
      +"1. 世界观设定：术语/力量体系/人物关系/势力阵营是否正确、是否与世界观冲突；\n"
      +"2. 事理逻辑：角色行为反应是否合理、因果是否通顺、有没有常识性违和；\n"
      +"3. 当下情境：是否符合当前任务/场景/对话氛围、有没有答非所问或跑题；\n"
      +"4. 人物弧光：说话方式/态度是否符合该角色的性格+当前故事进度（第"+(st.day||1)+"日·幕"+(Math.min(5,Math.floor(((st.day||1)-1)/9)+1))+"）下应有的态度变化。\n"
      +"铁律：\n"
      +"- 能 pass 就 pass，不要吹毛求疵；只改真正有问题的；\n"
      +"- revised 字段直接给出修改后的完整文本（如果 pass=true，revised 与 input 相同）；\n"
      +"- 禁止词/禁止角色（提灯/引魂灯/封妖塔等）属于硬禁，命中必 pass=false；\n"
      +"- 轻小说风格要求不要改成说明书或 AI 腔；\n"
      +"- "+this.masterRule()+"\n"
      +"- 只输出 JSON。";
    const _H=(window.V25&&V25.planHorizon)?V25.planHorizon():{N2:25};
    let user="当前进度：第"+(st.day||1)+"日/共"+_H.N2+"日 · 圣女恢复约 "+Math.min(100,Math.floor(((st.day||1)/_H.N2)*100)+5)+"%";
    if(context.quest) user+="\n当前任务："+(context.quest.name||"")+"（"+(context.quest.tlabel||"")+"）";
    if(npcCards.length) user+="\n涉及NPC："+npcCards.map(c=>JSON.stringify(c)).join("\n");
    if(worldBrief) user+="\n世界观参考（供对照，不要复述）："+(typeof worldBrief==="string"?worldBrief.slice(0,400):JSON.stringify(worldBrief).slice(0,400));
    user+="\n\n待审核文本（类型："+kind+"）：\n"+textForAi
      +"\n\n审核标准：pass=true 或 false。若 false，issues 列出问题，revised 给出修正版。"
      +"\n\n输出JSON：{\"pass\":true/false,\"issues\":[\"问题简述，≤30字\"],\"revised\":\"修正后的完整文本（pass=true 时与 input 相同）\"}。";
    try{
      const raw=await CTX.dsChat([{role:"system",content:sys},{role:"user",content:user}],{ch:"directorAudit",kind:"directorplan"});
      let o;
      try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
      catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(!m) return {pass:true,issues:[],revised:text}; o=JSON.parse(m[0]); }
      const pass=o.pass!==false;
      const issues=(o.issues||[]).map(s=>String(s).slice(0,40)).slice(0,5);
      let revised=pass?text:o.revised;
      if(pass) return {pass:true,issues:[],revised:text};
      if(inputType==="object"&&revised){
        if(typeof revised==="string"){
          try{ const parsed=JSON.parse(revised.replace(/^```json|```$/g,"").trim()); revised=parsed; }catch(e){ revised=text; }
        }
        if(revised&&typeof revised==="object"){
          if(text&&text.v) revised.v=text.v;
          if(text&&text.at) revised.at=text.at;
        }
      }else if(typeof revised==="string"){
        revised=revised.slice(0,inputType==="string"?(String(text).length+200):2000);
      }
      return {pass:false,issues,revised:revised||text};
    }catch(e){
      return {pass:true,issues:[],revised:text};
    }
  };

  /* 6) checkProactive —— 主动消息归属新 id（yunheng→yunting / xuanji→tina / 任务NPC remap） */
  chat.checkProactive=function(){
    const CTX=CTX_REF(); if(!CTX) return null;
    const st=CTX.getSt();
    st.proactiveLog=st.proactiveLog||{};
    const today=new Date().toISOString().slice(0,10);
    const todayCount=Object.keys(st.proactiveLog).filter(k=>st.proactiveLog[k]===today).length;
    if(todayCount>=3) return null;
    const flags=(st.agentFlags=st.agentFlags||{director:true,tools:true,proactive:true});
    if(!flags.proactive) return null;
    /* 规则 1：连续 2 天未复习（lastStudy 距今 >48h）→ 云汀晨间问候 */
    const lastStudy=st.lastStudyAt?new Date(st.lastStudyAt).getTime():0;
    if(lastStudy&&Date.now()-lastStudy>48*36e5){
      const key="nostudy_"+today;
      if(!st.proactiveLog[key]){
        st.proactiveLog[key]=today; CTX.save();
        return {npc:"yunting",reason:"nostudy",text:"两日没见你的脚印了——雾可不等人。今日可得空走一遭？"};
      }
    }
    /* 规则 2：错题 >10 → 缇娜 */
    if(window.WDMem&&window.WDMem.stats){
      let wrongs=0;
      try{
        const stats=window.WDMem.stats();
        Object.keys(stats.byNpc||{}).forEach(id=>{
          const w=stats.byNpc[id].wrongs||{};
          Object.keys(w).forEach(t=>{ wrongs+=w[t].n||0; });
        });
      }catch(e){}
      if(wrongs>10){
        const key="wrongs_"+today;
        if(!st.proactiveLog[key]){
          st.proactiveLog[key]=today; CTX.save();
          return {npc:"tina",reason:"wrongs",text:"星盘上错题雾怪已经结成阵了——"+wrongs+"只。趁今夜雾薄，随我清一波？"};
        }
      }
    }
    /* 规则 3：关卡滞留 2 天 → 接洽 NPC 委婉催办 */
    const aq=CTX.quest&&CTX.quest();
    if(aq&&st.questEnterAt){
      const enterAt=new Date(st.questEnterAt).getTime();
      if(enterAt&&Date.now()-enterAt>48*36e5){
        const key="stuck_"+aq.id+"_"+today;
        if(!st.proactiveLog[key]){
          st.proactiveLog[key]=today; CTX.save();
          return {npc:(NPC_REMAP&&NPC_REMAP[aq.npc])||aq.npc,reason:"stuck",text:"「"+this.questDisplayName(aq)+"」在雾里停了两日了。……卡住了就吭声。"};
        }
      }
    }
    return null;
  };

const KEY = "wendao_v2_save";
/* v54 批 2：旧存档自动继承——检测 localStorage 中所有 wendao 前缀的旧存档，
   按最后修改时间取最新一份，经 reconcile 迁移后写入当前 KEY 并清除旧键。
   解决玩家从旧版本（无 key 版本）升级后进度丢失的问题。 */
function migrateLegacySaves(){
  const LEGACY_PREFIXES=["wendao_v2_save","wendao_save","wdzx_save","wendao_v1","wendao_v0"];
  let best=null, bestKey=null, bestTime=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!LEGACY_PREFIXES.some(p=>k.startsWith(p))||k===KEY) continue;
    try{
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const o=JSON.parse(raw);
      if(!o||typeof o!=="object"||!o.player) continue;
      const t=o.lastAt||o.created||o._ts||0;
      const ts=typeof t==="string"?new Date(t).getTime():t;
      if(ts>bestTime){ bestTime=ts; best=o; bestKey=k; }
    }catch(e){}
  }
  if(!best) return false;
  /* 写入当前 KEY 并清除旧键（保留 wd-zx 前缀的独立键如 dskey/mem 等） */
  st=best;
  reconcile();
  save();
  try{ localStorage.removeItem(bestKey); }catch(e){}
  console.log("[v54] 旧存档继承完成："+bestKey+" → "+KEY+"（最后活动 "+new Date(bestTime).toLocaleDateString()+"）");
  return true;

function migrateNpcIds(){

    ["柳首座","程绣"],["柳如烟","程绣"],
    ["墨小骨","晚棠"],["司马青衫","晚棠"]];
  const fixText=t=>{ if(typeof t!=="string") return t; let s=t; for(const [a,b] of NAME_FIX) s=s.split(a).join(b); return s; };
  const fixMsg=m=>{ if(!m) return m;
    if(m.npc&&M[m.npc]) m.npc=M[m.npc];
    if(typeof m.text==="string") m.text=fixText(m.text);

  [["seenHearts",(a,b)=>a.concat(b)],["npcGrowth",(a,b)=>Object.assign({},a,b)]]
    .forEach(([name,merger])=>{
      const bag=st[name]; if(!bag||typeof bag!=="object") return;
      Object.keys(M).forEach(old=>{
        if(!(old in bag)) return;
        const to=M[old]; if(to===old) return;
        bag[to]=(bag[to]!=null)?merger(bag[to],bag[old]):bag[old];
        delete bag[old];
      });
    });
  /* 1b) privateChat：整键桶，值为消息数组 → 拼接 */
  if(st.privateChat&&typeof st.privateChat==="object"){
    Object.keys(M).forEach(old=>{
      if(!(old in st.privateChat)) return;
      const to=M[old]; if(to===old) return;
      st.privateChat[to]=Array.isArray(st.privateChat[to])
        ?st.privateChat[to].concat(st.privateChat[old]):st.privateChat[old];
      delete st.privateChat[old];
    });
  }
  /* 1c) dailyCtx：键格式 npcId@Dday，仅替换 @ 前的旧 id 前缀 */
  if(st.dailyCtx&&typeof st.dailyCtx==="object"){

        delete st.dailyCtx[k]; }

  /* 2) 消息归属与文本：dialogue + 全部私聊；顺手清掉旧「灵脉暂时中断」系统提示（重载后只留新故障） */

  }
  if(st.privateChat&&typeof st.privateChat==="object")
    Object.keys(st.privateChat).forEach(id=>{ const arr=st.privateChat[id]; if(Array.isArray(arr)) arr.forEach(fixMsg); });
}

   TAN §5 拆成两段后 5..7→6..8（0..4 不动，旧 §5 进度挂在拆分后的圜丘坛段上）。
   同步迁移 ORB key（srs/recTimes/rtPlan cards）与 edits uid（full:{id}:{sec}），从高往低防碰撞 */
function migrateOralIdx(){
  if(!st||st._orbMigV71) return;
  st._orbMigV71=1;
  const IDX=[[10,9],[9,8],[8,7],[7,6],[6,5],[5,4],[4,3],[3,2],[2,1],[1,0]];
  const MV={WAL:IDX,TOM:IDX,TAN:[[7,8],[6,7],[5,6]]};
  const rekey=k=>{
    const m=/^ORB-([A-Z]+)-(\d+)$/.exec(k||""); if(!m) return k;
    const mv=MV[m[1]]; if(!mv) return k;
    const hit=mv.find(p=>p[0]===+m[2]);
    return hit?("ORB-"+m[1]+"-"+hit[1]):k;
  };
  ["srs","recTimes"].forEach(f=>{
    const obj=st[f]; if(!obj||typeof obj!=="object") return;
    const out={};
    Object.keys(obj).forEach(k=>{ const nk=rekey(k); if(nk!==k&&out[nk]) return; out[nk]=obj[k]; });
    st[f]=out;
  });
  if(st.rtPlan&&typeof st.rtPlan==="object")
    Object.keys(st.rtPlan).forEach(id=>{
      const p=st.rtPlan[id];
      if(p&&Array.isArray(p.cards)) p.cards=p.cards.map(rekey);
    });
  if(st.edits&&typeof st.edits==="object"){
    const EIDX=[[10,9],[9,8],[8,7],[7,6],[6,5],[5,4],[4,3],[3,2],[2,1],[1,0],[0,-1]]; /* 0→-1=旧卷首段已删，丢弃 */
    const EM=[["full:great-wall:",EIDX],["full:ming-tombs:",EIDX],["full:temple-of-heaven:",[[7,8],[6,7],[5,6]]]];
    const out={};
    Object.keys(st.edits).forEach(k=>{
      let nk=k;
      for(const [pre,map] of EM){
        if(!k.startsWith(pre)) continue;
        const sfx=k.slice(pre.length);
        if(/^\d+$/.test(sfx)){
          const i=+sfx, hit=map.find(p=>p[0]===i);
          if(hit&&hit[1]>=0) nk=pre+hit[1];
          else if(hit&&hit[1]<0) return; /* 旧「卷首」段已删，丢弃其校订 */
        }

      }
      if(nk!==k&&out[nk]) return;
      out[nk]=st.edits[k];
    });
    st.edits=out;
  }

  for(const g of (d.gameDays||[])){

      :"休息日 · 可约会 / 回访 / 自愿学";

/* v52 R3：构建任务开场 cue 五段：状态/安排/余量/预告/激励 */
/* v53：任务内容摘要——从 lecture items 提炼科目/模块维度，避免 cue 只读标题 */
function questDigest(q){
  const items=[];
  (D.lectures[q.id]||[]).forEach(p=>(p.items||[]).forEach(it=>{ if(it&&it.id) items.push(it.id); }));
  const mods=[...new Set(items.map(id=>{
    const pt=D.pointsLib.find(p=>p.id===id);
    return pt?(pt.module||pt.subject||""):"";
  }).filter(Boolean))].slice(0,3);
  return {n:items.length, mods, meta:q.tlabel||q.type};
}
/* v53：当日任务量概况——总量/分类别量/总耗时，供 cue 与 AI 对白使用 */
function dayCatCount(d){
  const m={};
  (d.quests||[]).forEach(q=>{ const k=q.tlabel||q.type||"其他"; m[k]=(m[k]||0)+1; });
  return m;
}
/* v58b：AI cue 缓存版本——v5：v4 虽拦住命令句，却全部坍缩成
   「能陪我…吗？你在，我就安心/踏实/稳」同一模板，v5 起加入跨稿去重并重生成。
   历史：v3 放行命令/自呼姓名；v4 拦命令但模板坍缩；v5 加跨稿去重与类别画面。 */
const CUE_V=5;
/* cue/串场词确定性红线扫描：只列模型最常犯、误杀率最低的模式；
   命中即带反馈重拟一次，二次仍中则弃用 AI 稿、回退本地兜底池（绝不带病上线）。
   recent：该 NPC 近期已采用的 cue（跨稿去重）；无则只查单稿红线。
   注：不做裸字误杀（且/尚/莫=莫非 等），命令判定只认真对玩家的祈使分句与把字句。 */
function cueRedFlags(t,npcDispName,recent){
  const s=String(t==null?"":t).trim();
  if(!s) return ["空台词"];
  const f=[];
  if(s.length>90) f.push("超长("+s.length+"字)");
  const clauses=s.split(/[，。；！？、…—~～\s]+/).filter(Boolean);
  const cmdClause=clauses.some(c=>/^(别|不要|不准|不许|可别|莫(?!非|如|不)|赶紧|立刻|马上给)/.test(c)||/^快(点|些|去)/.test(c));
  if(cmdClause) f.push("命令/催促分句");
  if(/你把/.test(s)) f.push("把字命令句");
  if(/你得|你给我|你去(?!年)/.test(s)) f.push("指令式你字句");
  /* 讲条件交换只在与命令共现时判负——「你在，我就安心」这类倾诉不拦 */
  if((cmdClause||/你把|你得|你给我|你去(?!年)/.test(s))&&/我就/.test(s)) f.push("命令式讲条件(你做X我就Y)");
  if(/得你自己|你自己来|靠你自己|自己的路|脚.{0,3}你自己|路[^。！？]{0,8}指了/.test(s)) f.push("说教/责任转嫁");
  if(npcDispName&&npcDispName.length>=2&&s.indexOf(npcDispName)>=0) f.push("第三人称自呼姓名");
  if(/考试|考生|老师|教材|知识点|没过|考核|复习|章节|课程|真题|题库/.test(s)) f.push("现实考试词入L1");
  if(/\d+\s*(件|分钟|题|页|个|条|次|%)|共[\s\d一二三四五六七八九十两]+件/.test(s)) f.push("数量/时间播报");
  /* 生猛撕咬动词：「咬进骨缝」这类漏网复合词（叮咬/咬牙/咬唇/咬紧是合法用法） */
  if(/咬(?![叮牙紧唇])/.test(s)) f.push("生猛动词「咬」");
  /* 跨稿去重：同一 NPC 同日多条 cue 不许共享开头/请求框架/收尾词 */
  const arr=(Array.isArray(recent)?recent:[]).map(x=>String(x||""));
  if(arr.length){
    if(arr.some(x=>x.slice(0,4)&&x.slice(0,4)===s.slice(0,4))) f.push("开头与近期开场雷同");
    if(/能陪我/.test(s)&&arr.some(x=>/能陪我/.test(x))) f.push("「能陪我…」请求框架重复");
    /* 收尾情绪词去重（安心/踏实/稳，兼容「踏实些/稳得住」等变体） */
    const tailMark=x=>{ const m=String(x).replace(/[。！？!?…，、~～」』"\s]+$/,"").match(/(安心[些一点]?|踏实[些一点]?|稳[得住些一]?)$/); return m?m[1][0]:null; };
    const mark=tailMark(s);
    if(mark&&arr.some(x=>tailMark(x)===mark)) f.push("收尾情绪词与近期重复(「"+mark+"」)");
  }
  const bl=(window.scanStyleBlacklist&&window.scanStyleBlacklist(s))||[];
  if(bl.length) f.push("风格禁词:"+bl.slice(0,3).join("/"));
  return f;
}
function buildQuestCue(q,d){
  d=d||byDay[q.day];
  const curDay=q.day||st.day||1;
  const stage=stageOfDay(curDay);
  const prog=d?dayProg(d):{n:0,all:0};
  const remain=Math.max(0,(prog.all||0)-(prog.n||0));
  const qs=(d&&d.quests)||[];
  const totalMin=qs.reduce((s,x)=>s+(x.dur||0),0);
  const cats=dayCatCount(d);
  const catBrief=Object.entries(cats).map(([k,n])=>k+" "+n+"件").join("、");
  /* 下一任务：优先当日已解锁未完成者，再预告当日未完成者 */
  let nextQ=null;
  if(d){
    nextQ=(d.quests||[]).find(qq=>qq.id!==q.id&&!qDone(qq.id)&&questUnlocked(qq))
      ||(d.quests||[]).find(qq=>!qDone(qq.id)&&qq.id!==q.id);
  }
  const nextDigest=nextQ?questDigest(nextQ):null;
  /* 当前任务内容摘要（维度：条目数 + 模块） */
  const curDigest=questDigest(q);
  const curMods=curDigest.mods.length
    ?("内容涵盖"+curDigest.mods.map(s=>s.replace(/[：:].*$/,"").trim()).join("、")+(curDigest.n?"，共"+curDigest.n+"项":""))
    :"";
  /* NPC 心境：任务 id+日 哈希轮换 */
  const moodPool=CUE_NPC_MOOD[q.npc]||["在原地等你过来"];
  const mood=moodPool[(hash(q.id)+curDay)%moodPool.length];
  /* 激励：AI 缓存优先（必须是当前红线版本 CUE_V，旧版违规缓存一律不读），无缓存兜底池 */
  const _qlRec=st.questLines&&st.questLines[q.id];
  const cachedMot=(_qlRec&&_qlRec.cueV===CUE_V&&_qlRec.cue)||"";
  const introPool=QUIZ_INTROS[q.npc]||QUIZ_INTROS_FALLBACK;
  const motivate=cachedMot||introPool[(hash(q.id)+curDay)%introPool.length];
  /* FIX-P4 v2：请求式口吻＋蚀度概念，但一律现代口语（禁约莫/几桩/未了/光景等半文半白词）。
     玩家做的事情是拯救世界，角色在请求玩家帮忙——说清原因/事项/如何进行/完成好处，避免机械重复（hash 轮换开场词）。 */
  const isOral = q.type==="oral";
  const erodeOpeners = isOral
    ? ["一脉魔潮正盛，","这边景物又被侵蚀了一截，","精灵的气力又被夺去几分，"]
    : ["藏经阁这一带侵蚀度抬升了，","有几团雾怪在经匣里盘踞，","这一层的雾气又厚了些，"];
  const erodeOpener = erodeOpeners[(hash(q.id)+curDay)%erodeOpeners.length];
  const planReq = isOral
    ? `${erodeOpener}「${q.name}」的精灵正负伤苦撑，${curMods?("要协律的脉络涉及"+curMods+"，"):""}想请你去搭把手，帮她把气力夺回来。`
    : `${erodeOpener}「${q.name}」这一程${curMods?("——"+curMods+"，"):""}想请你一起去清理雾怪，净明这一带。`;
  return {
    status:`【${stage.name}阶段 · ${stage.theme}】${mood}`,
    overview:`今天大约要花你 ${totalMin} 分钟，一共 ${qs.length} 件事想拜托你——${catBrief}。`,
    plan:planReq,
    remain:`已经完成 ${prog.n} 件，还剩 ${remain} 件——等你出手。`,
    next:nextQ
      ?`接下来还想请您：「${nextQ.name}」${nextDigest&&nextDigest.mods.length?"——"+nextDigest.mods.map(s=>s.replace(/[：:].*$/,"").trim()).join("、"):""}`
      :"今日之后，雾里自会显出新路。",
    motivate,
    _ai:!!cachedMot,
  };
}
/* cue 多段拼接为气泡文本（buildStream 用），统一过黑名单。
   v53：加入总量/类别/耗时/进度/剩余/下一任务概括六要素，供离线本地兜底。 */
function cueText(q,d){
  const c=buildQuestCue(q,d);
  genQuestCue(q,d); /* 无 AI 缓存时后台生成整段 cue，下轮即命中 */
  return filterNpcText([c.status,c.overview,c.plan,c.remain+" · "+c.next,"「"+c.motivate+"」"].join("\n"));
}
/* v58b：AI 生成角色开场 cue——只讲画面/请求，不报数量与时间（统计由界面显示）。
   注入完整角色铁律（soulField/请求姿态/禁令）＋全量语言铁律＋正反例；
   产出过 cueRedFlags 红线：命中带反馈重拟一次，二次仍中则弃稿用本地池，绝不带病缓存。
   无 API 静默（本地 buildQuestCue 兜底）。 */
/* v78：任务开场 cue 提示词组装（实发/预演共用，单一事实源）。
   返回 messages/opts 与 gate（红线校验器，实发路径重拟时用）。 */
function buildQuestCueMsgs(q,d){
  const stage=stageOfDay(q.day||st.day||1);
  const pc=personaTermOf(q.npc);
  const iron=langIronRules();
  const b=buildQuestCue(q,d);
  const npcName=((window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(q.npc,(NPC[q.npc]&&NPC[q.npc].name)||q.npc):((NPC[q.npc]&&NPC[q.npc].name)||q.npc));
  const smp=(window.WDTerms&&WDTerms.styleSamples)?WDTerms.styleSamples(q.npc):[];
  /* 跨稿去重数据源：同一 NPC 已采用的 cue（仅当前版本），取最近 6 条 */
  const recent=Object.keys(st.questLines||{})
    .filter(id=>id!==q.id&&QMAP[id]&&QMAP[id].npc===q.npc)
    .map(id=>st.questLines[id])
    .filter(r=>r&&r.cueV===CUE_V&&r.cue).slice(-6).map(r=>r.cue);
  /* 任务类别→画面边界（修诵才许写精灵/夺回气力，问契/传译不许串画面） */
  const cat=q.rtCat||({study:"a",review:"rev",oral:"c",trans:"d",boss:"exam"}[q.type]||"a");
  const SCENE_BOUND={
    a:"理经/新学：画面只能围绕经匣、节点卡、卷轴、书页上盘踞的雾团；她在整理卡页",
    b:"问契：画面围绕来客的问签与一问一答；她在誊写或理顺签条，不许出现景点精灵受伤、夺回气力",
    c:"修诵：画面才允许围绕景点守护精灵与咒祷辞（协律/同调），可以写精灵被侵蚀、要帮她夺回气力",
    d:"传译：画面围绕两本语言的通界语料、五句互译；不许出现精灵受伤或咒祷辞吟诵",
    rev:"复习：画面是旧日净化过的节点又起雾（雾回潮），不是新的精灵受伤",
    exam:"守城：画面是雾潮攻城与守关大阵"
  };
  /* 身体意象轮换：避开近期已用过的，按任务 hash 给一个新意象建议（仅供发散，禁止照抄句式） */
  const SENS=["灯影里晃着一层湿雾","肩头落了点凉意","睫毛沾了细雾","杯里的茶凉透了","窗纸被雾气洇出印子","书页角卷着潮意","灯笼穗滴着水","靴尖沾了雾水","发梢凝着细水珠","指节有点发僵","袖口能拧出雾气","墨都研不开了"];
  const usedSens=SENS.filter(x=>recent.join("|").includes(x.slice(0,2)));
  const freshSens=SENS.filter(x=>!usedSens.includes(x));
  const suggestedSens=freshSens[hash(q.id)%Math.max(1,freshSens.length)]||SENS[hash(q.id)%SENS.length];
  let personaBlock="";
  if(pc){
    personaBlock="【角色铁律·不可违背】"
      +(pc.animeShell?("原型仅借说话节奏与气质："+pc.animeShell+"；原型的身份、头衔、名号、世界观一律不得搬入。"):"")
      +(pc.soulField&&pc.soulField.length?("灵魂领域："+pc.soulField.join("；")+"。"):"")
      +(pc.requestPosture?("请求姿态："+pc.requestPosture+"。"):"")
      +(pc.voice?("口吻："+pc.voice+"。"):"")
      +(pc.forbidden&&pc.forbidden.length?("专属禁令："+pc.forbidden.join("、")+"。"):"")
      +(pc.distinguish?("辨识锚点："+pc.distinguish+"。"):"")
      +(pc.growthArc?("成长弧线："+pc.growthArc+"。"):"")+"\n";
  }
  const sys="你是日式RPG《问道之旅·二十五日》里的角色「"+npcName+"」。玩家是与你并肩同行的同伴，不是来听安排的下属。\n"
    +"请用「"+npcName+"」的口吻，对她说一小段开场台词（1-2句，≤70字），像当季新番动画里同伴当面开口。只讲三件事："

    +"【姿态·最优先】是你在请求她帮忙，不是派发任务：商量、邀请、倾诉都可以。"
    +"禁止命令与催促、禁止讲条件交换、禁止说教或把责任推回给她；禁止用第三人称称呼自己——台词里不许出现你的名字「"+npcName+"」，自称只用「我」。\n"
    +"【反例·五处全错】「"+npcName+"那边等着的，别绕远路。你把那段念顺了，我就把剩下的雾再收一收——路我指了，脚得你自己迈。」\n"
    +"【多样性·硬要求·避免千篇一律】不要每条都写「能陪我……吗？你在，我就安心/踏实/稳」——这是偷懒模板。"
    +"请求框架要换着用，例如（仅示范结构差异，禁止照搬字句和收尾）："
    +"①疑问邀请「……我想请你陪我去看一眼」；"
    +"②陈述式「签我理好了，就差你这双眼睛」；"

    +"【本场景补充】不报任何数字（几件/几分钟/还剩几件由界面显示）；不念任务编号与标题；时间单位只能说「分钟」；雾怪对景点的动作只用「侵蚀/蚕食」，禁「咬」及撕咬类动词。";
  const user="下一程的内容（仅供你心里有数，禁止原样念出来，尤其不许报数量、类别、耗时）：\n"+b.plan
    +"\n画面边界（只能写这一类画面，不许串到别的任务类型）："+(SCENE_BOUND[cat]||SCENE_BOUND.a)
    +"\n身体感受请换一个没用过的意象（给你一个方向，可自由发挥但别照抄）：「"+suggestedSens+"」"
    +(recent.length?("\n你最近已经对她说过这些开场——开头、请求框架、身体意象、收尾词都不许再撞：\n"+recent.map((x,i)=>"〔"+(i+1)+"〕"+x).join("\n")):"")
    +"\n\n请只输出这一小段台词（≤70字），不要解释、不要舞台说明、不要引号以外的字。";
  const gate=t=>cueRedFlags(filterNpcText(t),npcName,recent);
  return {messages:[{role:"system",content:sys},{role:"user",content:user}],opts:{kind:"questcue"},gate};
}
async function genQuestCue(q,d){
  if(!dsReady()||!q) return;
  d=d||byDay[q.day];
  const c=st.questLines||(st.questLines={});
  c[q.id]=c[q.id]||{};
  /* v58b：仅当前红线版本 CUE_V 的缓存可用；旧版（命令/催促/说教/自呼姓名稿）作废重生成 */
  if(c[q.id]._cueP) return;
  if(c[q.id].cueV===CUE_V&&c[q.id].cue) return;
  if(c[q.id].cueV!==CUE_V) delete c[q.id].cue;
  c[q.id]._cueP=true;
  const cleanCue=raw=>String(raw||"").trim().replace(/^[「『"“\s]+|[」』"”\s]+$/g,"").replace(/\s*\n+\s*/g," ").slice(0,90);
  try{
    const built=buildQuestCueMsgs(q,d);
    const sys=built.messages[0].content, user=built.messages[1].content, gate=built.gate;
    let t=cleanCue(await dsChat(built.messages,Object.assign({ch:"questCue"},built.opts)));
    let flags=t?gate(t):[];
    if(t&&flags.length){
      console.warn("[cue] 红线未过，带反馈重拟一次：",flags,t);
      const t2=cleanCue(await dsChat([{role:"system",content:sys},{role:"user",
        content:user+"\n\n上一稿触犯了红线：「"+flags.join("、")+"」。请逐条避开（尤其换一个完全不同的开头、请求说法和收尾，不许再用「能陪我…吗/你在我就…」），保持请求姿态，用「我」自称，重写这一小段（≤70字）。"}],
        {ch:"questCue",kind:"questcue"}));
      const f2=t2?gate(t2):[];
      if(t2&&!f2.length) t=t2; else { console.warn("[cue] 两次未过红线，本轮采用本地兜底词：",f2); t=""; }

/* v62：任务三态——已接取（已发放解锁，未进入）／进行中（进入过且暂离，未完成）／已完成。
   发放（排程解锁）=已接取；玩家进入但中途暂离（questProg 有档）=进行中；交割/略过=已完成。 */
function questStatusOf(q){
  if(!q) return "未接取";
  if(qDone(q.id)||(st.skipped&&st.skipped[q.id])) return "已完成";
  if(st.questProg&&st.questProg[q.id]) return "进行中";
  if(questUnlocked(q)) return "已接取";
  return "未接取";
}
/* v62：某 NPC 当前职守的最近任务——优先「已接取未启动」，其次「进行中」。
   私聊窗口顶部提示用；按纪日顺序取第一件。 */
function npcTodayDuty(npcId){
  if(!st) return null;
  /* v62 Task13：私聊职守卡只取当日（st.day）该 NPC 未完成的任务。
     优先级：进行中 > 当日接取时间戳最新者 > 当日首个未完成；无则不渲染卡片。 */
  const d=byDay[st.day]; if(!d) return null;
  const cand=[];
  for(const q of d.quests){
    if(q.npc!==npcId||qDone(q.id)) continue;
    cand.push({q,status:questStatusOf(q),ts:st.accepted[q.id]||""});
  }
  if(!cand.length) return null;
  cand.sort((a,b)=>{
    if(a.status==="进行中"&&b.status!=="进行中") return -1;
    if(b.status==="进行中"&&a.status!=="进行中") return 1;
    if(a.ts&&b.ts) return a.ts<b.ts?1:-1;   /* 时间戳新者优先 */
    if(a.ts) return -1; if(b.ts) return 1;
    return 0;
  });
  return cand[0];
}

/* ==================== 书页打字机效果 ====================
   初始逐字显示（~300字/分，提速1倍）；每次点击展开当前正在打字的一个完整文本段，
   随后继续下一段的打字机效果，直至所有预设文本段均完成展开。
   - 标签（<span><em>等）即时输出，仅文字逐字显示，保证 HTML 结构完整
   - 点击委托绑定在 pageHost 上，typewriter 重建 innerHTML 后术语仍可点 */
let twTimer=null, twState=null;
/* 打字机速度：默认 200ms/字，最大加速至 20ms/字（10倍），持久化到 localStorage */
const TW_SPEED_DEFAULT=200, TW_SPEED_MIN=20, TW_SPEED_MAX=400;
function twSpeed(){
  try{
    const v=parseInt(localStorage.getItem('twSpeed'),10);
    if(!isNaN(v)&&v>=TW_SPEED_MIN&&v<=TW_SPEED_MAX) return v;
  }catch(e){}
  return TW_SPEED_DEFAULT;
}
function twSetSpeed(ms){
  try{ localStorage.setItem('twSpeed',String(ms)); }catch(e){}
}
function stopTypewriter(){
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  if(twState&&twState.items){ twState.items.forEach(it=>{ if(it.el) it.el.classList.remove('tw-active'); }); }
  twState=null;
}
function startTypewriter(host,sel){
  stopTypewriter();
  if(!host||typeof host.querySelectorAll!=='function') return;
  const els=host.querySelectorAll(sel||'.book .pt, .book .npcnote, .book .anchor, .dtw');
  if(!els||!els.length) return;
  /* 预解析：标签即时输出，文字逐字 */
  const items=Array.from(els).map(el=>{
    const html=el.innerHTML;
    const tokens=[];
    let i=0;
    while(i<html.length){
      if(html[i]==='<'){
        const end=html.indexOf('>',i);
        if(end>=0){ tokens.push({t:1,h:html.slice(i,end+1)}); i=end+1; }
        else{ tokens.push({t:0,c:html[i]}); i++; }
      } else { tokens.push({t:0,c:html[i]}); i++; }
    }
    el.innerHTML='';
    el.classList.add('tw-active');
    return {el,html,tokens,pos:0};
  });
  twState={items,idx:0,built:'',done:false,host};
  twStep();
}
function twStep(){
  if(!twState||twState.done) return;
  if(twState.idx>=twState.items.length){
    twState.done=true; twState.autoDone=true;
    /* 全部打完：恢复术语点击绑定 + 通知宿主（如显示"点击继续"） */
    if(twState.host) twBindGlossary(twState.host);
    if(twState.onDone) twState.onDone();
    return;
  }
  const it=twState.items[twState.idx];
  /* 每tick输出一个文字字符（标签即时输出不计等待） */
  while(it.pos<it.tokens.length){
    const tk=it.tokens[it.pos];
    if(tk.t===1){ twState.built+=tk.h; it.pos++; }
    else { twState.built+=tk.c; it.pos++; break; }
  }
  it.el.innerHTML=twState.built;
  if(it.pos>=it.tokens.length){
    /* 当前段落打完，移除光标，进入下一段 */
    it.el.classList.remove('tw-active');
    twState.idx++; twState.built='';
    twTimer=setTimeout(twStep,300); /* 段落间短暂停顿 */
  } else {
    twTimer=setTimeout(twStep,twSpeed());
  }
}
function typewriterExpand(){
  if(!twState||twState.done) return;
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  /* 每次点击：立即展开当前正在打字的这一段（填充完整内容），随后继续下一段的打字机效果。
     若当前段已打完（idx 已指向下一段），则跳过展开直接继续打下一段；直至所有段完成。 */
  const it=twState.items[twState.idx];
  if(it){ it.el.innerHTML=it.html; it.el.classList.remove('tw-active'); it.pos=it.tokens.length; }
  twState.idx++; twState.built='';
  SFX.tap();
  if(twState.idx>=twState.items.length){
    /* 所有预设文本段均完成展开 */
    twState.done=true;
    if(twState.host) twBindGlossary(twState.host);
    if(twState.onDone) twState.onDone();
  } else {
    /* 200ms 后开始下一段的打字机效果 */
    twTimer=setTimeout(twStep,200);
  }
}
/* 术语点击绑定（独立函数，typewriter 完成后可重新调用） */
function twBindGlossary(host){
  if(!host||typeof host.querySelectorAll!=='function') return;
  host.querySelectorAll('.gl').forEach(sp=>{
    if(sp._glBound) return; sp._glBound=true;
    sp.onpointerdown=(e)=>{
      e.stopPropagation();
      const g=D.glossary[sp.dataset.g]; if(!g) return;
      const gc=document.createElement('div'); gc.className='gcard';
      gc.innerHTML='<div class="gw">'+esc(sp.dataset.g)+'</div>'
        +'<div class="gs"><b>是什么</b>'+esc(g.what)+'</div>'
        +'<div class="gs"><b>装到哪</b>'+esc(g.where)+'</div>'
        +'<div class="gs"><b>为什么</b>'+esc(g.why)+'</div>';
      document.body.appendChild(gc);
      setTimeout(()=>{ try{gc.remove();}catch(e){} },6000);
      gc.onpointerdown=()=>gc.remove();
    };
  });
}

  /* ===== v62 Task8：书页预告 / 末页总结补充 / 四选项 ===== */
  function questPoints(){
    const ids=[...new Set([...(q.cards||[]), ...pages.flatMap(p=>(p.items||[]).map(it=>it.id))])];

  /* v80：本地预告=领域主题概述 + 一个建立在原文具体内容上的带读问题（离线确定性；不再罗列关键词、不提带团场景） */
  function localPreviewQuestion(pt){
    const t=cleanMd(pt.text||"");
    let m=t.match(/(\d[\d.,]*\s*(?:年|米|平方米|公里|个|位|处|座|间|次|万|亿|%|％))/);
    if(m){
      const before=t.slice(0,m.index).split(/[。；;！!？?]/).pop()||"";
      const subj=(before.split(/[，、,：:]/).pop()||ptTitle(pt,pt.id)).trim().slice(-14);
      return `读时留意「${subj}」——${m[1].trim()} 说的是哪一项事实？`;
    }
    m=t.match(/[「“"]([^」”"]{2,12})[」”"]/);
    if(m) return `读时弄清：「${m[1]}」在这一条里指的是什么、和前后内容怎么连？`;
    return `读时用一句话回答：「${ptTitle(pt,pt.id)}」的核心特征是什么？`;
  }
  function localPreview(){
    const pts=questPoints();
    if(!pts.length) return "这一页没有节点卡——直接进入下一环即可。";
    const mods=[...new Set(pts.map(p=>cleanMd(p.module||"")).filter(Boolean))];
    const scope=mods.slice(0,3).join("、")||"本卷考点";
    const overview=`本页 ${pts.length} 张节点卡都在「${scope}」这一域，先弄清它们各自讲的是哪桩事实，再读细节。`;
    /* 带读问题取信息量最高的一条（优先含数字/引号的考点） */
    const ranked=pts.slice().sort((a,b)=>(/\d/.test(b.text)?2:0)+(/[「“"]/.test(b.text)?1:0)-((/\d/.test(a.text)?2:0)+(/[「“"]/.test(a.text)?1:0)));
    return overview+"\n带读问题："+localPreviewQuestion(ranked[0]||pts[0]);
  }
  /* v81：书页预告/卷尾总结——本地兜底即时上屏，AI 成功才替换；按任务缓存（回看直接用稿）；12 秒超时保住本地版 */
  function aiBookExtra(mode, slot, fallback){
    if(!slot) return;
    const cacheKey="brief:"+(q&&q.id)+":"+mode;
    st.bookBrief=st.bookBrief||{};
    const showLocal=()=>{ slot.textContent=fallback||""; };
    const hit=st.bookBrief[cacheKey];
    if(hit){ slot.textContent=hit; return; }          /* 已生成过：回看/重进零等待 */
    if(!dsReady()){ showLocal(); return; }
    showLocal();                                       /* ① 先给确定内容，绝不空转"拟稿中" */
    let done=false;
    const badge=document.createElement("div");
    badge.style.cssText="font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.05em";
    badge.textContent="灵脉润色中……";
    try{ slot.parentNode&&slot.parentNode.appendChild(badge); }catch(e){}
    const finish=()=>{ done=true; try{ badge.remove(); }catch(e){} };
    const timer=setTimeout(()=>{ if(!done) finish(); },12000);
    const built=buildBookExtraMsgs(mode,questPoints());
    dsChat(built.messages,Object.assign({ch:"bookExtra"},built.opts)).then(t=>{
      if(done||!slot.isConnected){ finish(); return; }
      clearTimeout(timer);
      if(!t){ finish(); return; }
      const cleaned=filterNpcText(t.trim());
      /* AI 若擅自引入现实场景，或预告没有带读问题/退化成关键词罗列，整段拒收保本地兜底 */
      const badScene=/带团|带过团|导游工作|宣讲|游客/.test(cleaned);
      const badPreview=mode==="preview"&&(!/带读问题|读时|读着|带着问题/.test(cleaned)||!/[?？]/.test(cleaned)||cleaned.split("、").length>8);
      if(!badScene&&!badPreview&&cleaned.length>=8){
        st.bookBrief[cacheKey]=cleaned; save();
        slot.textContent=cleaned;
      }
      finish();
    }).catch(()=>{ clearTimeout(timer); finish(); });
  }
  /* v62 Task12：灵脉批量英化 b 类试炼（JSON；离线/失败静默，保留本地+待补标注） */

  /* —— 试炼幻境 controller（Phase 1 case-illusion 最小版）——

  let _illu=null;
  function openIllusion(){
    const galRight=ov.querySelector('.gal-right');
    if(!galRight) return null;

    _illu={fogs:{}, combo:0, total:quiz.length, hpFill:null, hpLabel:null, fogArea:null, comboEl:null};

    const hpLabel=document.createElement('div'); hpLabel.className='illu-hp-label'; hpLabel.textContent='试炼 · 0/'+_illu.total;

    const fogArea=document.createElement('div'); fogArea.className='illu-fog-area';
    const comboEl=document.createElement('div'); comboEl.className='illu-combo';
    _illu.hpLabel=hpLabel; _illu.hpFill=fill; _illu.fogArea=fogArea; _illu.comboEl=comboEl;
    galRight.appendChild(top); galRight.appendChild(fogArea); galRight.appendChild(comboEl);
    return _illu;
  }
  function closeIllusion(){
    ov.classList.remove('illusion');
    if(_illu){
      if(_illu.fogArea&&_illu.fogArea.parentNode) _illu.fogArea.parentNode.removeChild(_illu.fogArea);
      if(_illu.hpLabel){ const top=_illu.hpLabel.parentNode; if(top&&top.parentNode) top.parentNode.removeChild(top); }
      if(_illu.comboEl&&_illu.comboEl.parentNode) _illu.comboEl.parentNode.removeChild(_illu.comboEl);
      _illu=null;
    }
  }
  function spawnFog(idx){
    if(!_illu||!_illu.fogArea) return;
    const key='q'+idx;
    if(_illu.fogs[key]) return;
    const node=document.createElement('div'); node.className='illu-fog'; node.dataset.pid=key;
    const ball=document.createElement('div'); ball.className='illu-fog-ball'; ball.textContent='👻';
    const tag=document.createElement('div'); tag.className='illu-fog-idx'; tag.textContent='考点 '+(idx+1);
    node.appendChild(ball); node.appendChild(tag);
    const ratio=_illu.total>1?idx/(_illu.total-1):0.5;
    node.style.top=(4+ratio*86)+'%';
    _illu.fogArea.appendChild(node);
    _illu.fogs[key]=node;
    requestAnimationFrame(()=>node.classList.add('show'));
  }
  function defeatFog(idx){
    if(!_illu) return;
    const key='q'+idx; const node=_illu.fogs[key];
    _illu.combo++;
    const crit=_illu.combo>=3;
    if(_illu.comboEl){ _illu.comboEl.textContent='连击 ×'+_illu.combo; _illu.comboEl.classList.toggle('crit',crit); }
    /* v58：classList.add 不接受空格分隔字符串（连击≥3 时必抛 InvalidCharacterError，导致雾节点残留） */
    if(node){ node.classList.add('defeat'); if(crit) node.classList.add('crit'); delete _illu.fogs[key];
      setTimeout(()=>{ if(node.parentNode) node.parentNode.removeChild(node); },500); }
  }
  function failFog(idx){
    if(!_illu) return;

  let qi=0, okCount=0, answered=false;

  const qdraft=[];

  function restoreQuizIfSaved(){
    const p=curProg();

    if(restoreQuizIfSaved()) return;

        const pages=D.lectures[q.id]||[];
        const needPids=[...new Set([...basePidsOf(q), ...pages.flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean))])];
        const tgtN=quizTargetN(needPids.length);
        if(quiz.length<tgtN){
          const haveQ=new Set(quiz.map(quizNormKey));
          quiz=quiz.slice();
          for(const fz of fallbackQuiz(q)){
            const fk=quizNormKey(fz);
            if(!haveQ.has(fk)){ quiz.push(fz); haveQ.add(fk); }
            if(quiz.length>=tgtN) break;
          }
        }
        qi=0; okCount=0; answered=false; drawQuiz();
      }
    } else {
      /* v53：无静态题的关卡离线也必须能试炼（119+ 动态修习关），本地兜底造题 */
      quiz=fallbackQuiz(q);

      else{
        qInner.innerHTML=`<div class="note" style="border-left-color:var(--ok)">此关无需试炼。</div>`;
        showClearGate({title:"无试之关——此环已了",line:"本关只须读到、走到，没有雾团拦路。确认交割即可完成此环。"});
