    gate.innerHTML=`<div style="font-size:16px;color:var(--ok);font-weight:bold;margin-bottom:6px;letter-spacing:.05em">${esc((o&&o.title)||"雾散阵开——此关已破")}</div>
      <div style="font-size:12.5px;color:var(--fg2);line-height:1.9;margin-bottom:12px">${esc((o&&o.line)||"最后一问答罢，雾团化作光点归入你的印记。")}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn sm primary" id="cgOk" type="button">${esc((o&&o.cta)||"确认通关 · 交割")}</button>
        <button class="btn sm ghost" id="cgStay" type="button">再看一眼</button>

    $("#cgStay",gate).onpointerdown=()=>{ SFX.tap(); gate.remove(); if(finBtn){ finBtn.disabled=false; finBtn.style.display="inline-block"; finBtn.textContent="交割 · 完成此环"; } };

  /* ===== 初始化 ===== */
  function openQuestInit(){

  function loadAiBriefData(){

  /* —— 整页点击推进：术语卡/交互组件/文本框除外（v44 绑定，v58 扩充守护）——
     铁律：点在任何可编辑文本框（input/textarea/select/contenteditable/label）内绝不翻页；
     只在点框外区域、或按翻页键时才推进。 */
  const STAGE_NO_ADVANCE='button,a,input,textarea,select,label,.oralrow,.oralkit,.pager,.bp,.qreplwrap,.qchoice-panel,.cleargate,.gcard,[contenteditable="true"],[data-noadvance]';
  stageHost.onpointerdown=e=>{
    const gl=e.target.closest('.gl');
    if(gl){ e.stopPropagation();
      const g=D.glossary[gl.dataset.g]; if(!g) return;
      const gc=document.createElement('div'); gc.className='gcard';
      gc.innerHTML='<div class="gw">'+esc(gl.dataset.g)+'</div><div class="gs"><b>是什么</b>'+esc(g.what)+'</div><div class="gs"><b>装到哪</b>'+esc(g.where)+'</div><div class="gs"><b>为什么</b>'+esc(g.why)+'</div>';
      document.body.appendChild(gc);

      gc.onpointerdown=()=>gc.remove();

  /* quiz 相关辅助函数（供第 4 阶段使用，复用原有逻辑） */
  function normalize(s){ return String(s).replace(/[\s，。、；：""''！？（）()（）·—…《》<>]/g,"").toLowerCase(); }
  function startAiQuiz(){
    const stage=quizStage(q.id);
    const label=stage==="first"?"正在拟题":stage==="second"?"温故出新题":"变化试炼中";
    const host=stageHost._quizHost; if(!host) return;
    host.innerHTML=`<div class="note" style="border-left-color:var(--cyber)">✦ ${label}…</div>`;
    /* v55 批3-②：AI 出题入库——首学时一次性出题持久化，以后复用复抽 */
    const pids=quizBankPids(q);
    const targetN=Math.max(Math.ceil(pids.length*1.2), pids.length, 4);
    const bank=st.quizBank&&st.quizBank[q.id];
    if(bank&&bank.length>=pids.length){
      const drawn=quizBankDraw(q.id,pids,targetN);
      if(drawn.length){ quiz=drawn; qi=0; okCount=0; answered=false; drawQuiz(); return; }
    }
    genQuizBank(q).then(arr=>{
      if(!ov.isConnected) return;
      let quizArr=(arr&&arr.length)?arr.map(sanitizeQuiz):[];
      /* 不足考点覆盖时 fallback 补足 */
      const needPids=[...new Set([...(basePidsOf(q)), ...(D.lectures[q.id]||[]).flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean))])];
      if(quizArr.length < needPids.length){
        const fb=fallbackQuiz(q);
        const havePids=new Set(quizArr.map(z=>z.pid).filter(Boolean));
        for(const fz of fb){ if(!havePids.has(fz.pid)){ quizArr.push(fz); havePids.add(fz.pid); } if(quizArr.length>=needPids.length) break; }
      }
      /* 入库持久化 */
      if(!st.quizBank) st.quizBank={};
      st.quizBank[q.id]=quizArr;
      save();
      /* 从库中抽取当次做题集 */
      quiz=quizBankDraw(q.id,pids,targetN);
      if(!quiz.length) quiz=quizArr.slice(0,targetN);
      qi=0; okCount=0; answered=false; drawQuiz();
    }).catch(()=>{ if(!ov.isConnected) return; quiz=fallbackQuiz(q); qi=0; okCount=0; answered=false; drawQuiz(); });
  }
  function basePidsOf(q){ return [...new Set(((D.quizzes[q.id]||[]).map(z=>z.pid).filter(Boolean)))]; }
  function drawQuiz(){
    answered=false;
    const host=stageHost._quizHost; if(!host) return;
    if(!quiz.length){ host.innerHTML=`<div class="note" style="border-left-color:var(--danger)">题池暂未生成——请稍后再试。</div>`; return; }
    if(qi>=quiz.length){
      st.quizAttempts[q.id]=(st.quizAttempts[q.id]||0)+1;
      quizPerfect=(okCount===quiz.length);
      save();
      if(readonly){
        const wid=pushAction("我重刷了「"+qdn(q)+"」的印记（答对 "+okCount+"/"+quiz.length+"）。");
        refineAction(wid,q,"（这是温故重刷，不是首通，语气可以更轻松）");
        renderChat();
        host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">温故有效（答对 ${okCount}/${quiz.length}）——错题已录入星盘。再温一遍可换一组变化题。</div>

      } else {
        host.innerHTML=`<div class="note" style="border-left-color:var(--ok)">试炼通过（答对 ${okCount}/${quiz.length}）——错题已录入星盘。</div>`;
        /* v58：最后一问答完即弹通关提示，玩家确认便交割，不必再找右下角按钮 */
        showClearGate({title:quizPerfect?"雾散阵开——全数通过":"雾散阵开——此关已破",
          line:`本轮答对 ${okCount}/${quiz.length} 题${quizPerfect?"，无一折损——":"，"}错题已录入星盘，待回潮日再见。确认后修行与灵铢即刻入账。`});
        SFX.win();
      }
      return;
    }
    /* 试炼幻境视觉层（safe try-catch，失败不阻塞答题） */
    try{
      if(!_illu&&!readonly) openIllusion();
      if(_illu){ spawnFog(qi); illuSetHp(qi); }
    }catch(_){ /* illusion 异常不影响试炼正常进行 */ }
    const z=quiz[qi];
    /* v48：填空题防御——确保 a 为字符串、accept 为非空数组，杜绝卡住 */
    if(z.kind!=="judge"){
      if(z.a==null||z.a===undefined) z.a="";

      if(!Array.isArray(z.accept)||!z.accept.length) z.accept=[z.a];
      z.accept=z.accept.map(x=>String(x));
      if(!z.accept.includes(z.a)) z.accept.unshift(z.a);
    }
    /* v44：NPC 串场词（AI 生成的 intro 优先，否则按 NPC 口癖池取） */
    const kindLabel=z.kind==="judge"?"是非判断":z.kind==="choice"?"选择作答":z.kind==="recall"?"来客之问":"填空作答";
    const intro=(z.intro&&String(z.intro).trim())?String(z.intro).trim():"";
    const introPool=QUIZ_INTROS[npc.id]||QUIZ_INTROS_FALLBACK;
    const introTxt=intro||introPool[(q.id+"_"+qi).split("").reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0)%introPool.length];
    const introHtml=`<div class="qreplwrap" style="margin:0 0 10px">
      <div class="qav" style="background:var(--cyber)">${esc(npcName[0]||"?")}</div>
      <div class="qbub" style="background:rgba(61,240,255,0.07);border:1px solid var(--cyber)">
        <div class="qname">${esc(npcName)}${npcTitle?` · ${esc(npcTitle)}`:""}</div>
        <div style="color:var(--fg2)">${esc(introTxt)}</div>
      </div></div>`;
    if(z.kind==="judge"){
      host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <div class="jbtns"><button class="btn" id="jTrue">真</button><button class="btn" id="jFalse">伪</button></div>
        <div class="fb" id="fb"></div>`;
      $("#jTrue",host).onpointerdown=()=>answer(z.a===true,"真");
      $("#jFalse",host).onpointerdown=()=>answer(z.a===false,"伪");
    } else if(z.kind==="choice"){
      host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <div class="jbtns choicebtns">${(z.opts||[]).map((o,i)=>`<button class="btn" data-copt="${i}">${esc(o)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div>`;
      host.querySelectorAll("[data-copt]").forEach(b=>{
        b.onpointerdown=()=>{ const opt=z.opts[+b.dataset.copt]; answer(opt===z.a, opt); };
      });
    } else if(z.kind==="recall"){
      /* v54 批 1：问契/回潮卡——先凭记忆作答，揭示要点后三档自评（零挫败，从不说"答错"） */
      host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <div class="jbtns"><button class="btn primary" id="rcReveal" type="button">心里作答完毕 · 揭示要点</button></div>
        <div class="fb" id="fb"></div>`;
      $("#rcReveal",host).onpointerdown=()=>{ SFX.tap();
        const rv=$("#rcReveal",host); if(rv) rv.style.display="none";
        const fb=$("#fb",host);
        fb.innerHTML=`<div style="line-height:1.9;color:var(--fg)">${esc(z.a||"")}</div>
          <div style="margin-top:10px;font-size:12px;color:var(--fg2)">对照要点，如实自评：</div>
          <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sm primary" data-gr="2" type="button">要点齐全</button>
            <button class="btn sm" data-gr="1" type="button">断续想起</button>
            <button class="btn sm ghost" data-gr="0" type="button">未想起</button>
          </div>`;
        fb.querySelectorAll("[data-gr]").forEach(b=>{
          b.onpointerdown=()=>{ SFX.tap(); fb.querySelectorAll("[data-gr]").forEach(x=>x.disabled=true);
            z._grade=+b.dataset.gr; answer(z._grade>=2, z._grade>=2?"自评·要点齐全":(z._grade===1?"自评·断续想起":"自评·未想起")); };
        });
      };
    } else {
      host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <input id="blankIn" placeholder="填入 ▁ 处的词" autocomplete="off">
        <div class="jbtns"><button class="btn sm" id="hintBtn">提示</button><button class="btn sm primary" id="subBtn">作答</button></div>
        <div class="fb" id="fb"></div>`;
      const inp=$("#blankIn",host); inp.focus();
      $("#hintBtn",host).onpointerdown=()=>{ inp.value=z.a[0]; inp.placeholder=`${z.a.length} 字，首字「${z.a[0]}」`; };
      const sub=()=>answer(z.accept.some(a=>normalize(a)===normalize(inp.value))||normalize(inp.value).includes(normalize(z.a)),inp.value);
      $("#subBtn",host).onpointerdown=sub;
      inp.onkeydown=e=>{ if(e.key==="Enter") sub(); };
    }
  }
  /* —— v44：答后 NPC 回复（口癖化鼓励 / 错题讲解式回复，符合全员语言最高准则）—— */
  function quizReplyBubble(text,replaceEl){

        <div class="qname">${esc(npcName)}</div>
        <div class="qrepl" style="color:var(--fg2)">${esc(text)}</div>
      </div>`;
    if(replaceEl&&replaceEl.parentNode){ replaceEl.parentNode.replaceChild(wrap,replaceEl); }
    else{
      const fb=$("#fb",host);
      if(fb&&fb.parentNode) fb.parentNode.insertBefore(wrap,fb.nextSibling);
      else host.appendChild(wrap);
    }
    return wrap;
  }
  function praiseReply(){
    const pool=QUIZ_PRAISE[npc.id]||QUIZ_PRAISE_FALLBACK;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function wrongLocalReply(z,mine,okA){
    const pt=D.pointsLib.find(p=>p.id===z.pid);
    const sameN=st.wrong.filter(w=>w.pid===z.pid).length; /* 含本次 */
    const kindTxt=z.kind==="judge"?"是非判断":z.kind==="choice"?"选择作答":"填空作答";
    const key=(pt?pt.text.slice(0,20):String(z.pid));
    const sameTail=sameN>=2?`这个考点已经 ${sameN} 次绊到你啦——这次把它彻底收进记忆里吧。`:"";
    const pool=[
      `这道${kindTxt}有点刁呀。别急——你答的「${esc(mine||"…")}」，和正解差在${key}这一处。再看一眼解析，下一题稳一些吧。`,
      `差一点点而已哦。${key}这块容易混，把解析里的因果再顺一遍，回头再遇上它，你一定拿得下。`,
      `没事的，雾里谁都会被绊一下嘛。这个考点是${key}——记「${esc(okA)}」这个正解，顺着解析理解一遍，比硬背牢固得多呢。`
    ];
    const base=pool[(q.id+"_"+qi).split("").reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0)%pool.length];
    return sameTail?base+sameTail:base;
  }
  function aiWrongReply(z,mine,okA,wrap){
    if(!dsReady()) return;
    const pt=D.pointsLib.find(p=>p.id===z.pid);

    const kindTxt=z.kind==="judge"?"是非判断":z.kind==="choice"?"选择作答":"填空作答";
    const sys="你是日式RPG《问道之旅·四十五日》中的NPC「"+dName(npc.id)+"·"+dTitle(npc.id)+"」，刚目睹玩家答错一道试炼题。\n"
      +(window.WDChat&&WDChat.masterRule?WDChat.masterRule():"")
      +"\n写一段≤70字的口语回复：先顺着玩家的情绪接住（严禁指责/讽刺/施压/PUA），然后讲清这个考点为什么是正解、给出一个记忆方法或背景补充，最后一句鼓励打气。符合你的人设与口癖。只输出回复文本，不要引号。";
    const user="任务："+qdn(q)+"\n题目（"+kindTxt+"）："+z.q
      +"\n玩家的回答："+(mine||"（空白）")
      +"\n正确答案："+okA
      +"\n解析："+(z.why||"")
      +"\n考点："+(pt?pt.id+"："+pt.text.slice(0,80):String(z.pid||""))
      +"\n该考点累计答错次数："+sameN;
    dsChat([{role:"system",content:sys},{role:"user",content:user}],{kind:"polish"}).then(t=>{
      const txt=(t||"").trim().replace(/^["「」"]|["「」"]$/g,"").slice(0,120);
      const el=wrap&&wrap.isConnected?wrap.querySelector(".qrepl"):null;
      if(el&&txt) el.textContent=txt;
    }).catch(()=>{ /* 本地回复已在，静默 */ });
  }
  function answer(ok,mine){
    if(answered) return; answered=true;
    /* v54 批 1：SRS 雾回潮钩子——答题结果直接驱动记忆档位 */
    const host0=stageHost._quizHost; const z0=host0?quiz[qi]:null;
    if(q.rt&&z0&&z0.key){
      if(z0.kind==="recall") srsReview(z0.key, z0._grade||0);
      else if(ok) srsReview(z0.key,2);
      else srsLapse(z0.key);
    }
    const host=stageHost._quizHost; if(!host) return;
    const z=quiz[qi];
    const correct = z.kind==="judge" ? (z.a?"真":"伪") : z.a;
    ["#jTrue","#jFalse","#subBtn","#hintBtn"].forEach(s=>{ const b=$(s,host); if(b) b.disabled=true; });
    host.querySelectorAll("[data-copt]").forEach(b=>b.disabled=true);
    const inp=$("#blankIn",host); if(inp) inp.disabled=true;
    const fb=$("#fb",host);
    const isLast = qi>=quiz.length-1;
    if(ok){ okCount++; st.quizOk++; SFX.ok(); fb.className="fb ok"; defeatFog(qi); }
    else { SFX.no(); fb.className="fb no"; failFog(qi);
      if(z.kind!=="recall"){ pushWrongEntry(q.id, z);
        if(window.WDMem){ const pt=D.pointsLib.find(p=>p.id===z.pid); WDMem.wrong(q.npc,wTopic({pid:z.pid}),pt?+pt.star:null); } }
    }
    /* v54：自评题（来客之问）反馈——零挫败，从不说"答错" */
    if(z.kind==="recall"){
      fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✓ 要点齐备——收进袖中。":"✓ 已对照——未全想起也没关系，要点在上方，印记已记入回潮名册，回潮期再见分晓。");
    }
    else fb.innerHTML=(ok?"✓ 答对了！":"✗ 答错了——")+`正确答案：<b style="color:var(--gold)">${esc(correct)}</b>。${esc(z.why)}`;
    /* v44：答案对照段下方追加 NPC 智能回复 */
    const repText=ok?praiseReply():wrongLocalReply(z,mine,correct);

    fb.appendChild(document.createTextNode(" ")); fb.appendChild(next);
    save();

  openQuestInit();
  const closeQuest=()=>{ stopTypewriter(); closeIllusion(); if(dialogTimer){clearTimeout(dialogTimer);dialogTimer=null;} if(questTimer){clearInterval(questTimer);questTimer=0;} if(window.WDMem)WDMem.setActive(null); ov.remove(); };
  $("#qx",ov).onpointerdown=closeQuest;
  const qx2=$("#qx2",ov); if(qx2) qx2.onpointerdown=closeQuest;
  /* FIX-P3：返回键=上一步（stageIdx>0 回上一阶段，第一步才告辞）；新增跳过按钮=略过任务进待消印集合（视作已做完，给奖励解锁进度，标记待复习） */
  const qxBack=$("#qxBack",ov); if(qxBack) qxBack.onpointerdown=()=>{ SFX.tap(); if(stageIdx>0) goStage(stageIdx-1); else closeQuest(); };
  const qxSkip=$("#qxSkip",ov); if(qxSkip) qxSkip.onpointerdown=()=>{ SFX.tap(); st.skipped[q.id]=true; record("略过任务","「"+q.name+"」已略过，记入待消印集合，日后可回顾"); settleQuest(q,false,ov); };
  if(finBtn) finBtn.onpointerdown=()=>{ settleQuest(q,quizPerfect,ov); };

/* ---------- 任务结算（finBtn 抽取为全局函数，便于测试与复用） ---------- */
/* v57：结算外层保护——进度（done/xp/coin）在最前已落，后续任一步抛错都不再吞掉整个交割，
   也不给 finBtn/qxSkip 的 onpointerdown 留下 unhandled rejection */
async function settleQuest(q,quizPerfect,ov){
  /* 主体在 _settleQuestInner：含 questreact 导演流（WDChat.directorFlow）、云汀润色与过场触发 */
  try{ await _settleQuestInner(q,quizPerfect,ov); }
  catch(e){
    console.error('[settleQuest]',e);
    try{ if(ov&&ov.remove) ov.remove(); }catch(_){}
    try{ save(); render(); }catch(_){}
    toast("力量交割时遇上一阵乱雾，进度已留存，再看一眼便好");
  }
}
async function _settleQuestInner(q,quizPerfect,ov){
  st.xp+=q.xp; st.coin+=q.coin; st.done[q.id]=new Date().toISOString();
  /* v54 批 1：SRS 收尾——正常完成=首学卡入档（tier1·明日回潮）；跳过=视作已做完，逐卡进待消印集合
     v57：逐卡独立保护，单卡入档失败只记日志，不阻断其余卡与整个结算（防一张坏 key 卡死任务交割） */
  if(q.rt&&st.rtPlan&&st.rtPlan[q.id]){
    const _skipped=!!st.skipped[q.id];
    (st.rtPlan[q.id].cards||[]).forEach(k=>{ try{ if(_skipped) srsSkipKey(k); else if(srsGet(k).tier===0) srsMark(k); }catch(ce){ console.error('[srs mark fail]',k,ce); } });
  }
  /* v29（FIX-B/D-6）：主动触发器埋点——任务结算即学习行为，刷新学习时间戳（供未复习关怀规则） */
  st.lastStudyAt=new Date().toISOString();
  /* NPC 记忆：任务完成——通关时长由进入时间戳自动算出，首通且全对记一次性通关 */
  if(window.WDMem){ WDMem.finish(q.npc,q.id,{onePass:quizPerfect}); if(questTimer){clearInterval(questTimer);questTimer=0;} }
  st.fav[q.npc]=(st.fav[q.npc]||0)+1;
  record("任务完成", q.name+"（+"+q.xp+" 修行 +"+q.coin+" 灵铢）");
  /* v54：周推进只走两条正路——真实日期滚动（advanceNaturalDay）或当周全清（maybeUnlockDay）。
     静态任务时代的"首个主线完成即 unlock+1"会跳周晾下当周其余任务，已删除。 */
  maybeUnlockDay();
  // 玩家行动自动入流：先落模板战报，AI 在线时异步润色（群聊里玩家先报，NPC 再接）
  const aid=pushAction("我交割了「"+qdn(q)+"」（+"+q.xp+"修行 +"+q.coin+"灵铢）。");
  refineAction(aid,q);
  const refs=[{qid:q.id}];
  /* v54：运行时任务无 prev 链——下一环=同日内下一个已解锁未完成任务 */
  const fresh=[]; ((byDay[q.day]&&byDay[q.day].quests)||[]).forEach(qq=>{ if(qq.id!==q.id&&!qDone(qq.id)&&questUnlocked(qq)) fresh.push(qq); });
  const nq=fresh[0]||null;
  if(nq) refs.push({qid:nq.id});
  /* —— 第一阶段（同步，<200ms）：落本地兜底 + 云汀模板 + 关弹窗 + 播特效 + 渲染 ——
     让用户立即看到"完成"反馈，不被 AI 调用阻塞。 */
  const fallbackText=qdn(q)+"已完成。";
  st.dialogue.push({role:"npc",npc:q.npc,text:fallbackText,refs,at:new Date().toISOString(),day:st.day});
  const ymsg={id:"yh_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),role:"npc",npc:"yunheng",
    text:yunhengSettleLocal(q,nq,quizPerfect),refs:[{qid:q.id}].concat(nq?[{qid:nq.id}]:[]),
    at:new Date().toISOString(),day:st.day};
  st.dialogue.push(ymsg);
  if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  WDFx.questDone(q.xp,q.coin);
  SFX.win();
  if(ov) ov.remove();
  installRuntimePlan(); /* v54：任务完成后重排后续日程（游标前进、幂等，已完成槽位快照不动） */
  syncGameDay();       /* v58c：纪日指针随完成度推进（HUD 纪日号） */
  ensureGdMilestone(st.day); /* 新纪日首次成为当前纪日时，云汀落一条持久开场 */
  checkAch(); checkLevelUp(); save(); render();
  toast(doneLine(q,byDay[q.day])||"完成");
  /* —— 第二阶段（异步，不阻塞 UI）：导演编排 NPC 反应 + 云汀润色 + 剧情过场 ——
     用 .then 链式调用，不 await，让第一阶段立即返回。 */
  if(window.WDChat&&WDChat.directorFlow&&dsReady()){
    WDChat.directorFlow("我刚把「"+qdn(q)+"」做完了。",{targets:[q.npc],kind:"questreact",quest:q,tools:(st.agentFlags||{}).tools})
      .then(questLines=>{
        if(questLines&&questLines.length){
          /* 替换 fallback 任务NPC文本为 AI 生成 */
          const ackIdx=st.dialogue.findIndex(m=>m&&m.role==="npc"&&m.npc===q.npc&&(m.text||"").includes("已完成"));
          if(ackIdx>=0){
            const taskLine=questLines.find(l=>l.npc===q.npc);
            if(taskLine){ st.dialogue[ackIdx].text=taskLine.text; }
          }
          /* 其他 NPC 插话追加 */
          questLines.filter(l=>l.npc!==q.npc).forEach(l=>{
            st.dialogue.push({role:"npc",npc:l.npc,text:l.text,refs,at:new Date().toISOString(),day:st.day});
          });
          if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
        }
        refineYunheng(ymsg.id,q,nq,quizPerfect);
        if(WDChat.storyAppend) WDChat.storyAppend(q.npc,"与玩家并肩，见证了「"+qdn(q)+"」的交付");
        save(); renderChat();
      })
      .catch(()=>{ refineYunheng(ymsg.id,q,nq,quizPerfect); });
  } else {
    refineYunheng(ymsg.id,q,nq,quizPerfect);
  }
  /* —— 第三阶段：剧情过场触发 —— */
  if(q.id&&q.id.endsWith("BOSS")){
    const actStr=(byDay[q.day]&&byDay[q.day].act)||("act"+curActN());
    if(actStr==="act5"){ triggerCutscene("final"); }
    else { triggerCutscene(actStr); }
  }
  else if(q.kind==="main"&&Object.keys(st.done).filter(k=>k.startsWith("D")&&k.endsWith("M")).length===1) triggerCutscene("bind");
  else if(q.kind==="main"&&Object.keys(st.done).filter(k=>k.startsWith("D")&&k.endsWith("M")).length===2) triggerCutscene("pact");
  /* —— v52 R2：剧情点结算（双奖励）+ 剧情推演触发 ——
     当日任务全清 → 游戏日剧情点 +1 → 触发当日剧情 */
  const _ppBefore=(st.plotPoints&&st.plotPoints.total)||0;
  const plotTheme=checkPlotTrigger();
  const _ppAfter=(st.plotPoints&&st.plotPoints.total)||0;
  if(_ppAfter>_ppBefore){
    toast("剧情点 +1（累积 "+_ppAfter+"）· 今日指定任务已圆满","gold");
  }
  if(plotTheme){
    /* 消耗心气：激活力量有代价；心气不足则圣女兜底不锁进度 */
    const hpCost=plotTheme.type==="major"?20:plotTheme.type==="ultimate"?40:8;
    if((st.hp||0)>=hpCost){ st.hp-=hpCost; }
    performPlot(plotTheme);
  }
}

/* 剧情过场 AI 润色：把本地兜底化进云汀本人的一段口语（不是剧本串、不是任务发布） */
function refineCutscene(id,node){
  if(!window.WDChat||!WDChat.sysPrompt||!dsReady()) return;
  const cs=CUTSCENE_NODES[node]; if(!cs) return;
  const obsolete=(window.WDRegistry&&WDRegistry.obsoleteTerms)?WDRegistry.obsoleteTerms():["提灯","引灯","引魂灯","问道录","仙侠","仙师","封妖塔","掌灯"];

/* 引导对话AI生成：直接生成全部角色对白，就地替换占位文本 */
function refineGuidanceScene(ids,aq,npc1,npc2,dctx){
  if(!window.WDChat||!dsReady()||!ids.length) return;
  const obsolete=(window.WDRegistry&&WDRegistry.obsoleteTerms)?WDRegistry.obsoleteTerms():["提灯","引灯","引魂灯","问道录","仙侠","仙师","封妖塔","掌灯"];

    +"3）玩家与 "+dName(npc1)+" 互动（玩家主动提问，NPC以角色身份回应）；"
    +(npc2?"4）"+dName(npc2)+" 可适时插话一句，体现多NPC在场感。":"")
    +"所有发言像一群熟人在现场你一句我一句：允许短句、停顿、半句、跑题再拉回，不必每句完整、不必每句都推进什么，更不要每句都解释。整体语感接近日式轻小说的日常群像对白，有温度、有性格。禁网游黑话堆砌、禁江湖气装熟、禁AI腔、禁教书先生口吻、禁念任务编号与数值、禁已淘汰概念（"+obsolete.join("、")+"）。每条≤90字。"
    +"【说话人纪律·硬约束】①每条开头必须严格按我给的角色名标注，内容只能是该角色本人说的话——云汀的台词里永远不许出现「云汀」二字（自称只用「我」），其他角色同理不许自呼姓名；"
    +"②玩家的台词是玩家本人的口语，禁止替玩家做角色介绍（大家早已相识，不许出现「这位是云汀/我的引路人」之类引荐句），也不许让玩家念旁白；"
    +"③每条严格对应我列出的顺序，缺条、串角视为废稿。"
    +(window.WDChat&&WDChat.masterRule?WDChat.masterRule():"");
  const user="当日情境："+(dctx?JSON.stringify(dctx):"无")+"\n当前任务："+(aq?qdn(aq)+"（"+aq.tlabel+"）":"无在途任务")
    +"\n出场角色：云汀、玩家、"+dName(npc1)+(npc2?"、"+dName(npc2):"")
    +"\n请生成 "+ids.length+" 条消息，严格按此顺序："
    +"\n1. 云汀→玩家（开场，含当日情境）"
    +"\n2. 玩家→云汀"
    +"\n3. 云汀→"+dName(npc1)+"（引荐/搭话）"
    +"\n4. "+dName(npc1)+"→云汀"
    +"\n5. 玩家→"+dName(npc1)+"（提问）"
    +"\n6. "+dName(npc1)+"→玩家（回应/引导）"
    +(npc2?"\n7. "+dName(npc2)+" 插话":"")
    +"\n每条以「角色名：内容」格式输出，用 ||| 分隔各条。只输出消息，不要解释。";
  dsChat([{role:"system",content:sys},{role:"user",content:user}],false).then(raw=>{
    const txt=(raw||"").trim(); if(!txt||txt.length<10){ refineGuidanceSceneFail(ids); return; }
    const parts=txt.split(/\|\|\||\n{2,}/).map(s=>s.trim()).filter(s=>s);
    if(parts.length<ids.length){ refineGuidanceSceneFail(ids); return; }
    /* v58b：按说话人标签归位，修「云汀自称这位是云汀」式串角——
       旧逻辑纯按序号入座，模型把玩家视角的引荐句排到云汀槽位也照收。
       ①识别每行「名：」归入说话人队列；②无标签行按序号兜底；
       ③NPC 台词再过 cueRedFlags（自呼姓名等），不过则换安全短句。 */
    const dn2=id=>dName(id);

      }
      return null;
    };
    const buckets={player:[]}; [npc1,npc2,"yunting"].forEach(id=>{if(id)buckets[id]=[];});
    const unlabeled=[];
    parts.forEach(line=>{
      const m=line.match(/^([^：:]{1,8})[：:]\s*([\s\S]*)$/);
      if(m){
        const id=labelToId(m[1]); const body=m[2].replace(/^[「『"“]+|[」』"”]+$/g,"").trim();
        if(id&&body){ (buckets[id]||(buckets[id]=[])).push(body); return; }
      }
      unlabeled.push(line.replace(/^[「『"“]+|[」』"”]+$/g,"").trim());
    });
    const GUIDANCE_SAFE={
      yunting:["……你来了。","今天的雾，看着薄一些。"],
      tina:["叮——我在呢。","有错题我会喊你的。"],
      shenzhao:["……进来吧。","书在这儿，自己翻。"],
      chengxiu:["哟，稀客。","坐，茶刚沏上。"],
      wantang:["嘿，你来啦。","这段，我们一起练。"]
    };
    let ui=0;
    const take=speaker=>{
      const q=(buckets[speaker]||[]).shift();
      return q!=null?q:(unlabeled[ui++]||"");
    };
    for(let i=0;i<ids.length;i++){
      const idx=st.dialogue.findIndex(m=>m&&m.id===ids[i]); if(idx<0) continue;
      /* 期望说话人以落流槽位自身的 role/npc 为准（generateGuidanceScene 已固定） */
      const slotMsg=st.dialogue[idx];

      let p=take(speaker).slice(0,200);
      if(speaker!=="player"){
        const fl=cueRedFlags(p,dn2(speaker));

          const pool=GUIDANCE_SAFE[speaker]||["……"];
          p=pool[hash(ids[i])%pool.length];
        }
      }
      st.dialogue[idx].text=p.length>=2?p:"……";
    }
    save();
    if(view==="chat") renderChat(true);
  }).catch(()=>{ refineGuidanceSceneFail(ids); });
}

function maybeUnlockDay(){
  /* 批5修：当日全清后逐日放行——空排程日（p.all===0 或无排程）直接跳过不再锁死后续。
     守卫 guard 防异常数据死循环；有任务的日仍要求全清才推进，主线门不变。 */
  let guard=0;
  while(st.unlocked<45&&guard++<50){
    const d=byDay[st.unlocked];
    if(!d){ st.unlocked++; continue; }
    const p=dayProg(d);
    if(p.n===p.all){ st.unlocked++; continue; }  /* p.all===0（空日）亦放行 */
    break;
  }
  if(st.day<st.unlocked) st.day=st.unlocked;
  /* v29（FIX-A/D-9）：进入终幕（第 42 日，act5 首日）时触发 act5 过场——激活预留节点，修复其永不触发 */
  if(st.day>=42&&!(st.cutscenes&&st.cutscenes["act5"])){ triggerCutscene("act5"); }
}
function checkAch(){
  D.achievements.forEach(a=>{
    if(st.ach[a.id]) return;
    let ok=false; const t=totals(); const c=streak();
    switch(a.id){
      case "first": ok=t.c>=1; break;
      case "chain": ok=DAYS.some(d=>{const p=dayProg(d); return p.all>0&&p.n===p.all;}); break;
      /* v54：静态任务退役——从运行时排程（DAYS）统计 */
      case "main10": { let n=0; DAYS.forEach(dd=>(dd.quests||[]).forEach(qq=>{ if(qq.kind==="main"&&qDone(qq.id)) n++; })); ok=n>=10; } break;
      case "tower": ok=(st.arenaClears||0)>=1; break;  /* 批5：演界试炼首胜即点亮（原以第20日全清代偿） */
      case "guild": ok=fullDone(30,30); break;
      case "ruins": ok=fullDone(41,41); break;
      case "oral10": { let n=0; DAYS.forEach(dd=>(dd.quests||[]).forEach(qq=>{ if(qq.rtCat==="c"&&qDone(qq.id)) n++; })); ok=n>=10; } break;
      case "quiz50": ok=st.quizOk>=50; break;
      case "streak7": ok=c>=7; break;
      case "streak14": ok=c>=14; break;
      case "clueall": ok=(st.libSearches||0)>=10; break;
      case "end": ok=fullDone(1,45); break;
    }
    if(ok){ st.ach[a.id]=new Date().toISOString(); record("成就解锁", a.name); toast("成就解锁 · "+a.name,"gold"); }
  });
}
function fullDone(a,b){ for(let i=a;i<=b;i++){ const d=byDay[i]; const p=dayProg(d); if(p.n<p.all) return false; } return true; }

/* ---------- panels ---------- */
function panel(html){
  const ov=document.createElement("div"); ov.className="ov";
  ov.innerHTML=`<div class="dlg"><button class="close" type="button">×</button>${html}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  $(".close",ov).onpointerdown=close;

  return ov;
}

  const v=editVer(id);
  return v.length? v[0].text : original;
}
function hasEdit(id){ return editVer(id).length>0; }
function saveEdit(id, text){
  text=String(text);
  if(!st.edits) st.edits={};
  const arr=st.edits[id]||(st.edits[id]=[]);
  if(arr.length && arr[0].text===text) return false;   // 与最新一致，不重复记录
  arr.unshift({at:new Date().toISOString(), text});
  save(); return true;
}
function rollbackEdit(id, index){
  const arr=editVer(id); if(!arr[index]) return;
  const text=arr[index].text;
  arr.unshift({at:new Date().toISOString(), text});   // 回退即把旧版复制为最新
  save();
}
/* ==================== 藏经阁内容卡片池 ==================== */
const CATEGORIES=[
  ["full","吟游卷全文"],["oral","吟游句"],["pts","考点卷"],["clue","线索册"],
  ["qoff","问契·官料"],["qmine","问契·自录"]
];
function buildCardPool(){
  const cards=[];
  /* 顺序按重要性：吟游卷全文 → 吟游句 → 考点卷 → 线索册 */
  D.oralFull.forEach(o=>{
    o.sections.forEach((s,i)=>{
      cards.push({uid:"full:"+o.id+":"+i, cat:"full", catLabel:"吟游卷 · "+o.name, id:o.id+" §"+(i+1),
        key:"ORB-"+(o.aid||o.id)+"-"+i, sub:o.name, star:2,
        title:o.name+" · 第"+(i+1)+"节"+(s.h?" · "+s.h:""),
        body:getEdit("full:"+o.id+":"+i, s.text||s.en||""),
        extra:s.h?("小节："+s.h):"", editable:true, editId:"full:"+o.id+":"+i});
    });
  });
  D.oralLib.forEach(x=>{
    cards.push({uid:"oral:"+x.id, cat:"oral", catLabel:"吟游句 · "+x.topic, id:x.id,
      key:x.id, sub:x.topic, star:1,
      title:x.id+" · "+x.topic,

  });
  D.pointsLib.forEach(x=>{
    const pre=(x.id||"").slice(0,2);
    const isS5=pre==="S5", isSx=/^S[1-4]$/.test(pre);
    if(!isS5&&!isSx) return; /* 只收录笔试四科+问契官料；其余非S条目暂不入卡池 */
    cards.push({uid:"point:"+x.id, cat:isS5?"qoff":"pts", catLabel:isS5?"问契·官料":"考点卷 · "+pre, id:x.id,
      key:x.id, sub:isS5?mdClean(x.module||""):(pre+" · "+(RT_SUBJ_NAME[pre]||"")), star:+x.star||1,
      title:"★".repeat(+x.star)+" "+x.id+(x.status==="⚠️"?" ⚠待核":""),
      body:getEdit("point:"+x.id, mdClean(x.text)),
      extra:x.anchor?("记忆锚："+mdClean(x.anchor)):"", editable:true, editId:"point:"+x.id});
  });
  (st.myOral||[]).forEach(m=>{
    cards.push({uid:"myoral:"+m.id, cat:"qmine", catLabel:"问契·自录", id:m.id,
      key:m.id, sub:m.status==="final"?"已定稿":"草稿", star:2, created:m.created,
      title:"★★ "+m.id+(m.status==="final"?"":" · 草稿"),
      body:"问："+m.q+"\n答："+m.a,
      extra:m.ref?("参考："+String(m.ref).slice(0,80)):"", editable:true, editId:"myoral:"+m.id});
  });
  D.clues.forEach(x=>{
    cards.push({uid:"clue:"+x.id, cat:"clue", catLabel:"线索册", id:x.id,
      title:x.id+" "+x.title, body:mdClean(x.text),
      extra:"关联考点："+(x.covers||[]).join(" · "), editable:false});
  });
  return cards;
}
function renderLib(){

  st._libSub = st._libSub || "all";
  st._libStar = st._libStar || "all";
  st._libMs = st._libMs || "all";
  const stream=$("#stream");
  const all=buildCardPool();
  const q=st._libQ.toLowerCase().trim();
  const catSel=[["all","全部（"+all.length+"）"]].concat(CATEGORIES.map(c=>{
    const n=all.filter(x=>x.cat===c[0]).length; return [c[0], c[1]+"（"+n+"）"];
  }));
  /* b2-4：掌握状态——由 SRS 档案推断 */
  const today=srsToday();
  const msOf=c=>{
    if(!c.key) return "none";
    const r=st.srs&&st.srs[c.key];
    if(!r||!r.tier) return "new";
    if(r.pending||r.due<=today) return "due";
    if(r.tier>=2) return "solid";
    return "learning";
  };
  const MS_LABEL={none:"—",new:"未学",learning:"学习中",solid:"已巩固",due:"待消印"};
  /* 新到角标：自录卡 24h 内 / 昨日新入档 SRS */
  const isNew=c=>{
    if(c.created && (Date.now()-new Date(c.created).getTime())<864e5) return true;
    const r=c.key&&st.srs&&st.srs[c.key];
    return !!(r&&r.tier===1&&r.lastAt===today);
  };
  /* 子类选项：按当前大类聚合 sub 字段 */
  const catCards=st._libCat==="all"?all:all.filter(c=>c.cat===st._libCat);
  const subSet=[...new Set(catCards.map(c=>c.sub).filter(Boolean))];
  const subSel=[["all","全部子类（"+catCards.length+"）"]].concat(subSet.map(s=>{
    const n=catCards.filter(c=>c.sub===s).length; return [s, s.length>18?s.slice(0,18)+"…（"+n+"）":s+"（"+n+"）"];
  }));
  let pool=all.filter(c=>{
    if(st._libCat!=="all" && c.cat!==st._libCat) return false;
    if(st._libSub!=="all" && c.sub!==st._libSub) return false;
    if(st._libStar!=="all" && (+c.star||0)!==+st._libStar) return false;
    if(st._libMs!=="all" && msOf(c)!==st._libMs) return false;
    if(q){ const hay=(c.id+c.title+c.body+c.extra+c.catLabel).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(st._libIdx>=pool.length) st._libIdx=Math.max(0,pool.length-1);
  const idx=st._libIdx, cur=pool[idx];
  const firstNew=pool.findIndex(isNew);

  function cardHtml(c, cls){

    const newTag=isNew(c)?' <span style="color:var(--gold)">✦新到</span>':"";
    return `<div class="qcard3d ${cls}">
      <div class="ccat">${esc(c.catLabel)}${edited?' <span style="color:var(--ok)">· 已校订</span>':""}${msTag}${newTag}</div>
      <div class="cid">${esc(c.title)}</div>
      <div class="cen">${esc(c.body)}</div>
      ${c.extra?`<div class="czh">${esc(c.extra)}</div>`:""}
    </div>`;
  }
  // 卡堆：当前 + 后两张预览
  const stack=[0,1,2].map(k=>cardHtml(pool[idx+k], "c"+k)).join("");

  stream.innerHTML=`
  <div class="sys daysep">藏经阁 · 卡牌修行</div>
  <div class="cardsearch">
    <input id="cardQ" placeholder="搜索编号 / 关键词 / 英文句…" value="${esc(st._libQ)}">
    <select id="cardCat">${catSel.map(o=>`<option value="${o[0]}"${st._libCat===o[0]?" selected":""}>${esc(o[1])}</option>`).join("")}</select>
  </div>
  <div class="cardsearch" style="margin-top:6px">
    <select id="cardSub">${subSel.map(o=>`<option value="${esc(o[0])}"${st._libSub===o[0]?" selected":""}>${esc(o[1])}</option>`).join("")}</select>
    <select id="cardStar">${[["all","全部档位"],["3","★3 枢点"],["2","★2 要所"],["1","★1 寻常"]].map(o=>`<option value="${o[0]}"${st._libStar===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select>
    <select id="cardMs">${[["all","全部状态"],["new","未学"],["learning","学习中"],["solid","已巩固"],["due","待消印"]].map(o=>`<option value="${o[0]}"${st._libMs===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select>
    <button class="btn sm gold" id="cGotoNew" type="button" ${firstNew<0?"disabled":""}>✦ 定位新到</button>
  </div>
  <div class="carddeck">
    <div class="cardstack" id="cardStack">${cur?stack:`<div class="qcard3d c0"><div class="cen" style="text-align:center;color:var(--dim)">没有匹配的卡片——换个词或筛选条件</div></div>`}</div>
    <div class="cardpos">${cur?`第 ${idx+1} / ${pool.length} 张`:"0 / 0"}</div>
    <div class="cardtools">
      <button class="btn sm ghost" id="cPrev" type="button" ${idx<=0?"disabled":""}>← 上一张</button>
      <button class="btn sm primary" id="cFlip" type="button" ${pool.length===0?"disabled":""}>翻下一张 ⤵</button>
      <button class="btn sm gold" id="cRand" type="button" ${pool.length===0?"disabled":""}>🎲 随机抽</button>
      <button class="btn sm" id="cEdit" type="button" ${cur&&cur.editable?"":"disabled"}>✏️ 校订此卡</button>
    </div>
    <div class="fliphint">点「翻下一张」从卡堆顶部依次取出 · 「随机抽」从全部卡片中抽取 · 校订内容会自动存档并可回退版本</div>
  </div>`;

  const goto=(n)=>{ st._libIdx=Math.max(0,Math.min(n,pool.length-1)); save(); renderLib(); };
  $("#cPrev",stream).onpointerdown=()=>{ SFX.tap(); goto(idx-1); };
  $("#cFlip",stream).onpointerdown=()=>{ SFX.flip?SFX.flip():SFX.tap(); goto(idx+1); };
  $("#cRand",stream).onpointerdown=()=>{ SFX.win?SFX.win():SFX.ok(); goto(Math.floor(Math.random()*pool.length)); };
  $("#cEdit",stream).onpointerdown=()=>{ if(!cur) return;
    /* myoral 是结构化问答字段，走专用录入面板而非通用文本编辑器 */
    if(cur.cat==="qmine"){ openOralInput(cur.id); return; }
    openEditor(cur); };
  /* FIX-P7：中文输入法保护——组词期间不重建 DOM，组词结束才搜索；搜索计数自增（修复「藏书」成就只读不自增） */
  const cardQEl=$("#cardQ",stream);
  if(cardQEl){
    let composing=false;
    const doSearch=()=>{
      const v=cardQEl.value;
      st._libQ=v; st._libIdx=0;
      if(v && v!==st._libLastTerm){ st.libSearches=(st.libSearches||0)+1; st._libLastTerm=v; if(window.checkAch) checkAch(); }
      renderLib();

  $("#cardCat",stream).onchange=e=>{ SFX.tap(); st._libCat=e.target.value; st._libIdx=0; st._libSub="all"; save(); renderLib(); };
  const subEl=$("#cardSub",stream); if(subEl) subEl.onchange=e=>{ SFX.tap(); st._libSub=e.target.value; st._libIdx=0; save(); renderLib(); };
  const starEl=$("#cardStar",stream); if(starEl) starEl.onchange=e=>{ SFX.tap(); st._libStar=e.target.value; st._libIdx=0; save(); renderLib(); };
  const msEl=$("#cardMs",stream); if(msEl) msEl.onchange=e=>{ SFX.tap(); st._libMs=e.target.value; st._libIdx=0; save(); renderLib(); };
  const gnEl=$("#cGotoNew",stream); if(gnEl) gnEl.onpointerdown=()=>{ SFX.ok(); goto(firstNew); };
}
/* ==================== 内容编辑器（含版本历史 / 回退） ==================== */
/* 据 editId 取官方原文（用于「恢复官方原文」） */
function originalOf(editId){
  const parts=editId.split(":");
  if(parts[0]==="point"){ const x=D.pointsLib.find(p=>p.id===parts[1]); return x?mdClean(x.text):""; }
  if(parts[0]==="oral"){ const x=D.oralLib.find(p=>p.id===parts[1]); return x?(parts[2]==="zh"?x.zh:x.en):""; }
  if(parts[0]==="full"){ const o=D.oralFull.find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; return s?(s.text||s.en||""):""; }
  if(parts[0]==="myoral"){ const m=(st.myOral||[]).find(x=>x.id===parts[1]); return m?("问："+m.q+"\n答："+m.a+(m.ref?"\n参考："+m.ref:"")):""; }
  return "";
}
function openEditor(card){

        <button class="btn sm ghost editbtn" data-v="${i}" type="button" ${i===0?"disabled":""}>${i===0?"最新":"恢复"}</button>
      </div>`).join("");

  };

  };

    ov.remove(); if(view==="lib") renderLib();

      </div>

/* ============================================================

/* —— 1. SRS 内核（雾回潮期统一记忆调度）—— */
const SRS_TIERS=[1,3,7,14,30];
const srsToday=()=>new Date().toISOString().slice(0,10);
const srsAdd=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
function srsAll(){ if(!st.srs||typeof st.srs!=="object") st.srs={}; return st.srs; }
function srsGet(key){ const a=srsAll(); if(!a[key]) a[key]={tier:0,due:"1970-01-01",lastAt:"",streak:0,lapses:0,pending:false,fsrs:null}; return a[key]; }
/* srsMark：首学入档（档 1 · 明日回潮）——已入档的卡不动 */
function srsMark(key){ const r=srsGet(key); if(r.tier>0) return r; r.tier=1; r.due=srsAdd(SRS_TIERS[0]); r.lastAt=srsToday(); save(); return r; }
/* srsReview：三档自评——2 清晰→进档 / 1 模糊→停档重排 / 0 想不起来→退档+印记 */
function srsReview(key,grade){ const r=srsGet(key);
  if(grade>=2){ r.tier=Math.min(5,(r.tier||1)+1); r.due=srsAdd(SRS_TIERS[r.tier-1]); r.streak=(r.streak||0)+1; }
  else if(grade===1){ r.tier=Math.max(1,r.tier||1); r.due=srsAdd(SRS_TIERS[r.tier-1]); }
  else { r.tier=1; r.due=srsAdd(1); r.lapses=(r.lapses||0)+1; r.streak=0; }
  r.lastAt=srsToday(); r.pending=false; save(); return r; }
/* srsLapse：答错——退一档、明日回潮，绝不锁进度 */
function srsLapse(key){ const r=srsGet(key); r.tier=Math.max(1,(r.tier||1)-1); r.due=srsAdd(1); r.lapses=(r.lapses||0)+1; r.streak=0; r.pending=true; r.lastAt=srsToday(); save(); return r; }
/* srsSkipKey：跳过的任务=视作已做完，进入待消印集合（明日回潮） */
function srsSkipKey(key){ const r=srsGet(key); if(r.tier<1) r.tier=1; r.pending=true; r.due=srsAdd(1); r.lastAt=srsToday(); save(); return r; }
function srsDueKeys(){ const t=srsToday(); return Object.keys(srsAll()).filter(k=>{ const r=st.srs[k]; return r&&r.tier>0&&(r.pending||r.due<=t); }); }
/* 复述用时档案：{last 最近一次 / best 最快 / n 完整次数 / sum 总时长}——未完整复述不入档 */
function recTimesFor(key){ st.recTimes=st.recTimes||{}; if(!st.recTimes[key]) st.recTimes[key]={last:0,best:0,n:0,sum:0}; return st.recTimes[key]; }
function recTimesRecord(key,secs){ const r=recTimesFor(key); r.last=secs; r.best=r.best?Math.min(r.best,secs):secs; r.n++; r.sum+=secs; save(); return r; }

/* —— 2. 统一卡池索引（调度视角；藏经阁展示见 buildCardPool）—— */
const RTINDEX=(function(){
  const bySubj={S1:[],S2:[],S3:[],S4:[]};
  const starOf=new Map();
  D.pointsLib.forEach(p=>{ const s=(p.id||"").slice(0,2); if(bySubj[s]){ bySubj[s].push(p.id); starOf.set(p.id,+(p.star||1)); } });
  Object.keys(bySubj).forEach(s=>{ /* 枢点（★3 历年常考）优先排，同档保序 */
    bySubj[s].sort((a,b)=>(starOf.get(b)||1)-(starOf.get(a)||1));
  });
  const wen=D.pointsLib.filter(p=>/^S5-\d+-\d+$/.test(p.id)||/^S5-\d+-Q$/.test(p.id)).map(p=>p.id);
  const oral=[];
  (D.oralFull||[]).forEach(o=>{ (o.sections||[]).forEach((s,i)=>{
    const tx=s.text||s.en||""; if(tx.split(/\s+/).length<30) return; /* 空卷首段不入排程 */
    oral.push({key:"ORB-"+o.aid+"-"+i,fullId:o.id,aid:o.aid,name:o.name,sec:i,h:s.h||"",words:tx.split(/\s+/).length});

const RT_SUBJ_NAME={S1:"政策法规",S2:"导游业务",S3:"全国知识",S4:"北京知识"};
const RT_NPC={a:"shenzhao",b:"wantang",c:"wantang",d:"wantang",rev:"tina",exam:"yunting"};
const RT_TLABEL={a:"理经",b:"问契",c:"修诵",d:"传译",rev:"消印",exam:"验界"};
/* 英语口语约 120 词/分钟 → 时长预估（校订后按 getEdit 现值重算，整篇/分段同步） */
function rtSpkMin(words){ return Math.max(1,Math.round((words||0)/120)); }
function rtOralOf(key){
  const m=/^ORB-([A-Z]+)-(\d+)$/.exec(key||""); if(!m) return null;
  const o=D.oralFull.find(x=>x.aid===m[1]); if(!o) return null;

function rtOralText(key){ const o=rtOralOf(key); return o?getEdit("full:"+o.fullId+":"+o.sec,o.raw):""; }
/* 统一取卡：任何 key → 展示结构（夜巡/书页/题目共用） */
function rtCardOf(key){

  if(/^S5-/.test(key)){ const p=D.pointsLib.find(x=>x.id===key); return p?{key,id:key,text:mdClean(getEdit("point:"+key,p.text)),star:+p.star||2,cat:"b",subj:"S5",mod:mdClean(p.module||p.title||""),title:mdClean(p.title||"")}:null; }

  if(/^ORB-/.test(key)){ const o=rtOralOf(key); return o?{key,id:key,text:rtOralText(key),star:2,cat:"c",oral:o}:null; }
  const t=D.oralLib.find(x=>x.id===key); return t?{key,id:key,en:getEdit("oral:"+key+":en",t.en),zh:getEdit("oral:"+key+":zh",t.zh),topic:t.topic,text:t.en,star:1,cat:"d"}:null;

/* —— 3. 运行时排程器 ——
   游标从 st.done × st.rtPlan 快照反推：未做完的卡次日自动滚动重排（熬夜兜底，不惩罚）。
   st.rtPlan[qid]={cat,cards} 为内容快照，保证已完成任务内容稳定、排程幂等。 */
/* 游标 = 某日之前所有已排快照的消费位置：初次顺序构建时跨日推进（未来天不再重复排同批卡）；
   重建时此前各天快照永不重写（mk done 分支保护），故游标恒定、幂等可重建。 */
function rtCursor(beforeDay){
  const cur={S1:0,S2:0,S3:0,S4:0,wen:0,oral:0,trans:0};
  const plan=st.rtPlan||{};
  Object.keys(plan).forEach(qid=>{
    const m=/^R(\d+)-/.exec(qid); if(!m) return;
    if(beforeDay!=null&&+m[1]>=beforeDay) return;
    (plan[qid].cards||[]).forEach(k=>{
      if(/^S[1-4]-/.test(k)){ const s=k.slice(0,2); if(cur[s]!==undefined) cur[s]++; }
      else if(/^S5-|^QM-/.test(k)) cur.wen++;
      else if(/^ORB-/.test(k)) cur.oral++;
      else cur.trans++;
    });
  });
  return cur;
}
function rtQuizForCards(cards,targetN){
  const pts=cards.map(k=>D.pointsLib.find(p=>p.id===k)).filter(Boolean);
  const mods=new Set(pts.map(p=>p.module).filter(Boolean));
  const pids=pts.map(p=>p.id);
  const sentencePool=D.pointsLib.filter(p=>!pids.includes(p.id)&&(p.module&&mods.has(p.module))).map(ptKeySentence).filter(Boolean);
  const kws=pts.map(p=>({p,kw:extractKeyWords(p.text,p.exam_tip,p.anchor)}));
  const out=[];
  const forms=["judge","blank","choice"];
  for(const c of cards){
    const ent=kws.find(x=>x.p.id===c);
    if(ent){ const z=sanitizeQuiz(genQuestion(forms[Math.floor(Math.random()*forms.length)],ent.p,ent.kw,c,sentencePool)); z.key=c; z.pid=c; out.push(z); continue; }
    /* 非笔试卡 → 来客之问（自评三档）：问契 / 修诵回潮 / 传译回潮 */
    const cd=rtCardOf(c); if(!cd) continue;
    let qt="",at="",wy="先凭记忆作答，再对照要点自评——断续或未想起都会进入回潮名册。";
    if(cd.cat==="b"){ qt=cd.title||"来客之问"; at=cd.text; }
    else if(cd.cat==="c"){ const o=cd.oral; qt="凭记忆诵出「"+o.name+" · "+(o.h||("第"+(o.sec+1)+"节"))+"」这一段"; at=cd.text; }
    else if(cd.cat==="d"){ qt="传译：「"+cd.zh+"」"; at=cd.en; }
    if(qt){ const z=sanitizeQuiz({kind:"recall",key:c,pid:c,q:qt,a:at,why:wy}); z.key=c; out.push(z); }
  }
  /* 题量 = 显式 targetN（验界/守关 boss 传 8/10/12）否则卡数 × 1.2（至少每卡 1 题，同卡不超 2 题） */
  const target=Math.max(1,Math.round(targetN||cards.length*1.2));
  let guard=0;
  while(out.length<target&&kws.length&&guard<target*3){ guard++;
    const ent=kws[Math.floor(Math.random()*kws.length)];
    const z=sanitizeQuiz(genQuestion(forms[Math.floor(Math.random()*forms.length)],ent.p,ent.kw,ent.p.id,sentencePool));
    z.key=ent.p.id; z.pid=ent.p.id; out.push(z);
  }
  return shuffleArr(out);
}
function rtOralPages(o){

function buildRuntimePlan(day){
  const d=byDay[day]; if(!d) return [];
  st.rtPlan=st.rtPlan||{};
  const cur=rtCursor(day);
  const dueAll=srsDueKeys();
  const quests=[];
  /* v2 第 6.2 节算式：1 自然日=1 周=5 纪日——3 个正修纪日（学新）+2 个轻修纪日（复习不空转）。
     每个纪日一套任务：正修套 8 槽 / 轻修套 3 槽；同日 5 套由套间滚动游标 c2 接续消费，不重复排卡。 */
  const gds=(d.gameDays&&d.gameDays.length)?d.gameDays:[1,2,3,4,5].map(i=>({gd:(day-1)*5+i,kind:i<=3?"study":"rest"}));
  const c2=Object.assign({S1:0,S2:0,S3:0,S4:0,wen:0,oral:0,trans:0},cur);
  /* 批5修：卡池回绕——池子耗尽后从头再排（第一遍学完自然转入第二遍复习，45 日恒有任务）。
     旧行为 slice(c2,c2+n) 线性消费，S2/S4 约 19 日耗尽、其余 20 日内耗尽 → day21+ 空日 →
     maybeUnlockDay 无法推进 → 后 25 天验界/守关永远解锁不了。 */
  function cyc(arr,start,n){ const L=(arr||[]).length; if(!L) return []; const s=((start%L)+L)%L; const out=[]; for(let i=0;i<n;i++) out.push(arr[(s+i)%L]); return out; }

    if(/^S[1-4]-/.test(k)){ const s=k.slice(0,2); if(c2[s]!==undefined) c2[s]++; }

  function mk(gi,slotNo,cat,cards,opts){

         杜绝已交付槽位在计划重建后凭空消失、当日列表缺环。 */
      if(!snap&&QMAP[id]&&Array.isArray(QMAP[id].cards)&&QMAP[id].cards.length){
        snap={cat:QMAP[id].rtCat||cat,cards:QMAP[id].cards.slice()}; st.rtPlan[id]=snap;
      }
      bump(snap?snap.cards:[]);
      if(snap){ let o=QMAP[id];
        if(!o) o=Object.assign({id,rt:true,rtCat:snap.cat,kind:"main",chain:"rt",tlabel:RT_TLABEL[snap.cat]||"消印",npc:RT_NPC[snap.cat]||"tina",day,gd:gds[gi]&&gds[gi].gd,name:"已交付之环",xp:0,coin:0,dur:0,minLv:1,prev:[],cards:snap.cards.slice()},opts||{});
        quests.push(o); return o; }

      type:cat==="c"?"oral":(cat==="d"?"trans":"study"),
      tlabel:RT_TLABEL[cat], npc:RT_NPC[cat], day, act:d.act||("act"+stageOfDay(day).id),
      minLv:1, prev:[]
    },opts||{});
    o.cards=cards.slice();

  }
  const dueORB=dueAll.filter(k=>/^ORB-/.test(k));

  /* 正修套全局序：笔试隔科轮换基准（相邻任务异类、相邻理经异科硬约束） */
  let setNo=(day-1)*3;
  const seq=["S1","S2","S3","S4"];
  gds.forEach((g,gi)=>{

      const o=oralLen?RTINDEX.oral[c2.oral%oralLen]:null;
      if(o) mk(gi,0,"c",[o.key],{name:"修诵 · "+o.name+" §"+(o.sec+1),goal:"读懂本段咒祷辞，凭记忆诵出",dur:rtSpkMin(o.words)*3+2,xp:15,coin:8});
      const subA=seq[s0], subB=seq[(s0+1)%4], subC=seq[(s0+2)%4];
      const tA=cyc(RTINDEX.bySubj[subA],c2[subA],4);
      if(tA.length) mk(gi,1,"a",tA,{name:"理经 · "+RT_SUBJ_NAME[subA]+" "+tA.length+" 匣",goal:"读通"+tA.length+"张节点卡，应问破雾全数通过",dur:Math.round(2+tA.length*2.5),xp:tA.length*5+5,coin:tA.length*2+4});

      const tB=cyc(RTINDEX.bySubj[subB],c2[subB],4);
      if(tB.length) mk(gi,4,"a",tB,{name:"理经 · "+RT_SUBJ_NAME[subB]+" "+tB.length+" 匣",goal:"读通"+tB.length+"张节点卡，应问破雾全数通过",dur:Math.round(2+tB.length*2.5),xp:tB.length*5+5,coin:tB.length*2+4});
      const tR=revSlice();
      if(tR.length) mk(gi,5,"rev",tR,{kind:"side",name:"消印 · 雾回潮 "+tR.length+" 团",goal:"净化"+tR.length+"枚回潮雾团",dur:Math.round(3+tR.length*1.5),xp:tR.length*2+4,coin:tR.length+2});
      const tC=cyc(RTINDEX.bySubj[subC],c2[subC],4);
      if(tC.length) mk(gi,6,"a",tC,{name:"理经 · "+RT_SUBJ_NAME[subC]+" "+tC.length+" 匣",goal:"读通"+tC.length+"张节点卡，应问破雾全数通过",dur:Math.round(2+tC.length*2.5),xp:tC.length*5+5,coin:tC.length*2+4});
      const ro=rtOralOf(dueORB[gi]);

    } else {
      /* 轻修套 3 槽：消印 → c复 → d复（复习为主，不学新） */
      const tR=revSlice();
      if(tR.length) mk(gi,0,"rev",tR,{kind:"side",name:"消印 · 雾回潮 "+tR.length+" 团",goal:"净化"+tR.length+"枚回潮雾团",dur:Math.round(3+tR.length*1.5),xp:tR.length*2+4,coin:tR.length+2});
      const ro=rtOralOf(dueORB[gi]);

      const tD=dueTrans.slice(gi*5,gi*5+5);
      if(tD.length) mk(gi,2,"d",tD,{kind:"side",name:"传译回访 · 旧句五句",goal:"回潮传译5句旧料",dur:6,xp:10,coin:5});

  /* —— 批5：五日验界 + 冲刺期雾魁守关 ——
     验界：阶段末日（day%5==0）主线 boss，覆盖近期所学，题量随阶段递增（4/5/6 卡 → 8/10/12 题）。
     守关：冲刺期（31-45 日）加场，阶段7/8/9 总量 6/8/9 场（含验界）：
           stage7 31:1 32:1 33:2 34:1 (+35验界)；stage8 36:2 37:2 38:2 39:1 (+40验界)；stage9 41:2 42:2 43:2 44:2 (+45验界)。
     boss 卡不 bump 游标（不消费线性排卡）；快照存 bcard（rtCursor 只重放 cards，避让防游标污染）；
     验界 id 以 BOSS 结尾（任务完成自动触发阶段过场），守关 id 用 GB 后缀不触发。 */
  function pickBossCards(n){
    const out=[],seen=new Set();
    dueAll.filter(k=>/^S[1-4]-/.test(k)).forEach(k=>{ if(out.length<Math.ceil(n/2)&&!seen.has(k)){ seen.add(k); out.push(k); } });
    const win=Math.max(6,Math.min(14,Math.ceil(n*2)));
    ["S1","S2","S3","S4"].forEach(s=>{
      const arr=RTINDEX.bySubj[s]||[]; const hi=(typeof c2[s]==="number"&&c2[s]>0)?Math.min(c2[s],arr.length):arr.length;
      for(let j=hi-1;j>=Math.max(0,hi-win)&&out.length<n;j--){ const k=arr[j]; if(!seen.has(k)){ seen.add(k); out.push(k); } }
    });
    if(out.length<n){
      const all=shuffleArr([].concat(RTINDEX.bySubj.S1,RTINDEX.bySubj.S2,RTINDEX.bySubj.S3,RTINDEX.bySubj.S4));
      for(const k of all){ if(out.length>=n) break; if(!seen.has(k)){ seen.add(k); out.push(k); } }
    }
    return out;
  }
  function mkBoss(gi,bid,nCards,kind,name,goal,dur,xp,coin){
    if(st.done[bid]){
      const snap=st.rtPlan[bid]; if(!snap) return;
      quests.push({id:bid,rt:true,rtCat:"exam",kind,chain:"rt",type:"boss",tlabel:kind==="main"?"验界":"守关",npc:"yunting",day,gd:gds[gi]&&gds[gi].gd,act:d.act||("act"+stageOfDay(day).id),name:snap.name||name,goal,dur,xp,coin,minLv:1,prev:[],cards:(snap.bcard||snap.cards||[]).slice()});
      return;
    }
    const cards=pickBossCards(nCards); if(!cards.length) return;
    const o={id:bid,rt:true,rtCat:"exam",kind,chain:"rt",type:"boss",tlabel:kind==="main"?"验界":"守关",npc:"yunting",day,gd:gds[gi]&&gds[gi].gd,act:d.act||("act"+stageOfDay(day).id),name,goal,dur,xp,coin,minLv:1,prev:[],cards};
    D.lectures[o.id]=[]; D.quizzes[o.id]=rtQuizForCards(o.cards,kind==="main"?dur:6); /* 验界 8/10/12 题；守关 6 题 */
    st.rtPlan[o.id]={cat:"exam",bcard:o.cards.slice(),name};
    quests.push(o);
  }
  if(day%5===0&&day<=45){
    const stageN=Math.ceil(day/5), qc=stageN<=4?8:(stageN<=6?10:12);
    mkBoss(4,"R"+day+"-4-BOSS",stageN<=4?4:(stageN<=6?5:6),"main",
      "五日验界 · "+(stageOfDay(day).name||("第"+stageN+"阶段")),
      "净守此界——连破"+qc+"道谜题，莫让雾魁破阵",qc,30,15);
  }
  if(day>=31&&day<=45){
    const extra={31:1,32:1,33:2,34:1,36:2,37:2,38:2,39:1,41:2,42:2,43:2,44:2}[day]||0;
    for(let k=0;k<extra;k++){
      const gi=(k+day)%5;
      mkBoss(gi,"R"+day+"-"+gi+"-GB"+k,3,"side","雾魁守关 · 第"+(k+1)+"阵","雾魁来袭——连破谜题守住结界",6,15,8);
    }
  }
  /* 纪日回填：gameDays[].quests 存本纪日任务 id——任务树四级结构（阶段→周→纪日→任务）复用 */
  gds.forEach((g,gi)=>{ g.quests=quests.filter(q=>q.id.indexOf("R"+day+"-"+gi+"-")===0).map(q=>q.id); });
  return quests;
}

function renderNight(){
  /* v54 批 1：夜巡改走统一 SRS——到期卡=雾回潮名册（srsDueKeys，笔试+问契卡）；
     待来日=已入档未到期；预习=已解锁周未学新卡（tier0）。修诵/传译回潮走任务线，不入夜巡卡匣。
     v54 批 2（2026-09-25）：到期复习改为答题模式——按错题知识点随机换题型出题（judge/blank/choice），
     去掉翻面闪卡与 AI 提示词；预习卡保留翻面但去掉提示词。 */
  const due=[], later=[], pre=[];
  const today=srsToday();
  srsDueKeys().forEach(k=>{ if(!/^S[1-5]-|^QM-/.test(k)) return; const c=rtCardOf(k); if(c) due.push(c); });
  Object.keys(st.srs||{}).forEach(k=>{ const r=st.srs[k];
    if(!r||r.tier<1||r.pending||r.due<=today) return; if(!/^S[1-5]-|^QM-/.test(k)) return;
    const c=rtCardOf(k); if(c) later.push(c); });
  for(let day=1;day<=st.unlocked;day++){ const dd=byDay[day]; if(!dd) continue;
    (dd.quests||[]).forEach(q=>{ if(q.rtCat!=="a"&&q.rtCat!=="b") return; if(qDone(q.id)) return;
      (q.cards||[]).forEach(k=>{ if(!/^S[1-5]-|^QM-/.test(k)) return; const r=st.srs&&st.srs[k];
        if(r&&r.tier>0) return; const c=rtCardOf(k); if(c) pre.push(c); });
    });
  }
  const consolidated=Object.values(st.srs||{}).filter(r=>r&&r.tier>=2).length;
  const ov=panel(`<h2>巡夜 · 记忆卡匣</h2><div class="mt">到期复习 ${due.length} 张 · 待来日 ${later.length} 张 · 预习 ${pre.length} 张 · 已巩固 ${consolidated} 张</div>
    <div id="fcHost"></div>`);
  const host=$("#fcHost",ov);
  /* 到期复习：按知识点随机换题型出题（judge/blank/choice 轮换），答题驱动 SRS 档位 */
  const dueDeck=due.map(it=>({it,mode:"due"}));
  const preDeck=pre.map(it=>({it,mode:"pre"}));
  const deck=[...dueDeck,...preDeck];
  let i=0, showRev=false, answered=false;
  function draw(){
    if(i>=deck.length){
      host.innerHTML=deck.length
        ? `<div class="missing" style="text-align:center;padding:30px">今夜巡完（复习 ${due.length} · 预习 ${pre.length}）。安心睡。</div>`
        : `<div class="missing" style="text-align:center;padding:30px">卡匣尚空——完成修行类任务后，考点卡会在此安家。</div>
           <div style="text-align:center;margin-top:10px"><button class="btn sm primary" id="fcGo" type="button">去今日修习</button></div>`;
      const g=$("#fcGo",host); if(g) g.onpointerdown=()=>{ SFX.tap(); ov.remove(); toast("完成今日任务后，新的考点卡会自动入匣"); };
      return;
    }
    const cur=deck[i], it=cur.it;
    /* 预习卡：翻面模式（无提示词，直接看正文）；QM 卡问答成对展示 */
    if(cur.mode==="pre"){
      host.innerHTML=`<div class="flashcard"><div class="fc-id">预习 · ${esc(it.id)} · ${"★".repeat(+it.star||1)}</div>
        <div class="fc-main">${esc(it.title&&/^QM-/.test(it.id)?("问："+it.title+"\n答："+it.text):it.text)}</div>
        <div style="margin-top:12px"><button class="btn sm primary" id="fNext" type="button">记下了（完成后自动入复习队列）</button></div></div>
        <div class="tstate">${i+1} / ${deck.length}</div>`;
      const nx=$("#fNext",host); if(nx) nx.onpointerdown=()=>{ SFX.tap(); i++; draw(); };
      return;
    }

      host.innerHTML=`<div class="flashcard"><div class="fc-id">${esc(it.id)} · 问契 · ${i+1}/${deck.length}</div>
        <div class="qz"><span class="kk">巡夜 · 凭记忆作答</span>${esc(it.title)}</div>
        <div class="fb" id="fb" style="display:none"></div>
        <div class="jbtns" id="qmBtns"><button class="btn sm primary" id="fRev">揭示参考答</button></div></div>

          <div class="jbtns"><button class="btn" data-gr="2">✓ 清晰记得</button><button class="btn" data-gr="1">◐ 模模糊糊</button><button class="btn" data-gr="0">✗ 没想起来</button></div>`;
        $("#qmBtns",host).style.display="none";

    z.key=it.id; z.pid=it.id;

    let qHtml="";

      qHtml=`<div class="qz"><span class="kk">巡夜 ${i+1}/${deck.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <div class="jbtns"><button class="btn" id="fTrue">真</button><button class="btn" id="fFalse">伪</button></div>
        <div class="fb" id="fb"></div>`;
    } else if(z.kind==="choice"){
      qHtml=`<div class="qz"><span class="kk">巡夜 ${i+1}/${deck.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <div class="jbtns choicebtns">${(z.opts||[]).map((o,oi)=>`<button class="btn" data-fcopt="${oi}">${esc(o)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div>`;
    } else {
      qHtml=`<div class="qz"><span class="kk">巡夜 ${i+1}/${deck.length} · ${kindLabel}</span>${esc(z.q)}</div>
        <input id="fBlank" placeholder="填入 ▁ 处的词" autocomplete="off" style="width:100%;padding:8px;border:1px solid var(--border-lit);background:var(--bg);color:var(--fg);border-radius:4px;font:inherit;font-size:13px;margin-top:8px">
        <div class="jbtns" style="margin-top:8px"><button class="btn sm primary" id="fSub">作答</button></div>
        <div class="fb" id="fb"></div>`;
    }
    host.innerHTML=`<div class="flashcard"><div class="fc-id">${esc(it.id)} · ${"★".repeat(+it.star)} · ${kindLabel}</div>${qHtml}</div>
      <div class="tstate">${i+1} / ${deck.length}</div>`;
    const fb=$("#fb",host);
    function answerNight(ok){
      if(answered) return; answered=true;
      fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=(ok?"✓ 答对了——雾气散了些。":"✗ 答偏了——雾未净尽，明日再来。")+(z.why?`<div style="margin-top:4px;font-size:11px;color:var(--dim)">${esc(z.why)}</div>`:"");
      fb.innerHTML+=`<div style="margin-top:8px"><button class="btn sm primary" id="fNext" type="button">继续巡夜</button></div>`;
      srsReview(it.key, ok?2:0);
      $("#fNext",host).onpointerdown=()=>{ SFX.tap(); i++; draw(); };
      save();
    }
    if(z.kind==="judge"){
      $("#fTrue",host).onpointerdown=()=>answerNight(z.a===true);
      $("#fFalse",host).onpointerdown=()=>answerNight(z.a===false);
    } else if(z.kind==="choice"){
      host.querySelectorAll("[data-fcopt]").forEach(b=>{

    } else {
      const inp=$("#fBlank",host); if(inp) inp.focus();
      $("#fSub",host).onpointerdown=()=>{
        const v=(inp&&inp.value||"").trim();
        const ok=z.accept.some(a=>normalize(a)===normalize(v))||normalize(v).includes(normalize(z.a));
        answerNight(ok);
      };
      if(inp) inp.onkeydown=e=>{ if(e.key==="Enter") $("#fSub",host).click(); };
    }
  }
  draw();

/* v51：出题机制重做——本地算法为主，题量溢出考点数。
   v53：修复 2026 考点数据导致的选项碎段——anchor 含 **速记** 包裹、title 有 75 条等于 id、
   exam_tip 是"考察要点：XX模块核心知识点"模板句。现在：入库清洗 markdown、关键词只取
   高信息密度词（年份/引号专名/anchor 速记）、选择题选项为完整核心句（干扰句取同模块考点）。 */
function shuffleArr(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=r[i]; r[i]=r[j]; r[j]=t; } return r; }
/* 出口清洗：去掉 markdown 记号与多余空白（数据层已洗一遍，此处兜 AI 题/旧存档题） */
function cleanMd(s){

/* 无信息量的模板词/碎段，禁止进入关键词与答案 */
const KW_STOP=new Set(["知识点","核心知识","模块核心","下列","正确","答案","考察要点","考查要点","考察","考查","要点","模块","核心","内容","相关","包括","属于","概念","定义","特点","组成","部分","一个","一种","以及","等等","基本","基础","主要","重要","复习","考试","考生","掌握","记住","理解","了解","熟悉","方面","问题","进行","形成","成为","具有","时候","主要内容","核心知识点"]);

const _EDGE_RE=new RegExp("^["+_EDGE_CHARS+"]+|["+_EDGE_CHARS+"]+$","g");

function ptTitle(pt,pid){

  if(t&&t!==pid) return t;

}
/* 考点核心句：优先含数字/引号、长度适中的完整陈述句，用作判断/选择的正确项 */
function ptKeySentence(pt){
  const t=cleanMd(pt&&pt.text||"");
  if(!t) return "";
  /* FIX-P1：过滤备课批注元话语（"本条考察/常考/记忆锚/重点"等），避免被当知识点塞进选项 */
  const META_RE=/^(本条|此条|这里|注意|提示|记忆锚|常考|考点|重点|说明|备注|备考|考纲|出题)/;
  const parts=t.split(/(?<=[。！？；])/).map(s=>s.trim()).filter(s=>s.length>=6&&!META_RE.test(s));
  if(!parts.length) return t.length>48?t.slice(0,48)+"…":t;
  const ranked=parts.map((s,i)=>({s,i,v:(/\d/.test(s)?3:0)+(/[“"「『]/.test(s)?1:0)-(s.length>50?2:0)})).sort((a,b)=>b.v-a.v||a.i-b.i);
  let s=ranked[0].s;

/* 题目出口清洗：q/a/accept/opts/why 一律去 markdown */
function sanitizeQuiz(z){
  if(!z||typeof z!=="object") return z;
  if(typeof z.q==="string") z.q=cleanMd(z.q);
  if(typeof z.a==="string") z.a=cleanMd(z.a);
  if(Array.isArray(z.accept)) z.accept=z.accept.map(cleanMd);
  if(Array.isArray(z.opts)) z.opts=z.opts.map(cleanMd);
  if(typeof z.why==="string") z.why=cleanMd(z.why);
  return z;
}
function extractKeyWords(txt, tip, anchor){
  const words=[];
  const push=raw=>{
    let w=cleanMd(raw).replace(_EDGE_RE,"");
    if(!w) return;
    if(/^\d{2,4}年?$/.test(w)){ words.push(w); return; }
    if(!/^[一-龥A-Za-z0-9]+$/.test(w)) return;
    if(w.length<2||w.length>10) return;
    if(KW_STOP.has(w)) return;
    words.push(w);
  };
  /* anchor 速记信息密度最高（如 "23 旅行部、27 中旅），宽分隔符切（引号/标点全切开） */
  if(anchor){
    cleanMd(anchor).split(_SPLIT_RE).forEach(push);
  }
  /* exam_tip 是模板句"考察要点：XX模块核心知识点"，不含考点信息，不抽词 */
  if(txt){
    const t=cleanMd(txt);
    /* 数字年份/数量+尾随中文，如 1923年、1927 */
    (t.match(/\d{2,4}\s*年?[一-龥]{0,6}/g)||[]).slice(0,6).forEach(s=>push(s.replace(/\s+/g,"")));
    /* 引号内专名，如 "二三四"连读 */
    (t.match(/[“"「『]([^”"」』]{2,10})[”"」』]/g)||[]).slice(0,5).forEach(s=>push(s.slice(1,-1)));
    /* 仍不足时才从正文取连续中文词，过滤停用词与纯序号 */
    if(words.length<3){
      (t.match(/[一-龥]{2,6}/g)||[]).slice(0,24).forEach(w=>{
        if(KW_STOP.has(w)||/^[一二三四五六七八九十百]+$/.test(w)) return;
        words.push(w);
      });
    }
  }
  return [...new Set(words)].slice(0,6);
}
function distortTxt(txt, keyWords){
  const s=String(txt||"");
  /* 优先篡改年份/数字——错点明确，玩家可判断 */
  const nums=s.match(/\d{2,4}\s*年?/g);
  if(nums&&nums.length){
    const n=nums[Math.floor(Math.random()*nums.length)];
    const num=parseInt(n,10);
    if(!isNaN(num)){
      const d=[2,3,5,10][Math.floor(Math.random()*4)]*(Math.random()<0.5?1:-1);
      const rep=String(Math.max(1,num+d))+(/年/.test(n)?"年":"");
      if(rep!==n) return s.replace(n,rep);
    }
  }
  if(keyWords&&keyWords.length){
    const w=keyWords[Math.floor(Math.random()*keyWords.length)];
    if(w&&s.indexOf(w)>=0) return s.replace(w,(w.length>=4?"并非":"不是")+w);
  }
  return s;
}
/* v53：句子级挖空——数字按边界匹配（防止"23"挖掉"1923"后两位），
   挖出后题干不得再残留答案词（防止"文化"出现两次只掩其一而泄题） */
function maskWord(host,w){
  if(!w||!host) return null;
  const escW=String(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=/^\d+$/.test(w)?new RegExp("(?<!\\d)"+escW+"(?!\\d)","g"):new RegExp(escW,"g");
  if(!re.test(host)) return null;
  const masked=host.replace(re,"____");
  return masked.indexOf(w)>=0?null:masked;
}

/* 战斗渲染器：雾躯血条 + 结界血条 + 连击 + 暴击。

function runBattleQuiz(host,qs,opts){
  opts=opts||{};

  const n=Math.max(1,qs.length), hpMax=n*20, barMax=n*10;

      <div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden"><div style="height:100%;width:${Math.max(0,hp/hpMax*100)}%;background:linear-gradient(90deg,#7a3dbf,#b04ae0);transition:width .3s"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px"><span>你的结界</span><span>${Math.max(0,bar)}/${barMax}</span></div>
      <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.max(0,bar/barMax*100)}%;background:linear-gradient(90deg,#3df0a0,#2aa8b8);transition:width .3s"></div></div>
      ${combo>=2?`<div style="text-align:right;font-size:12px;color:var(--gold);margin-top:4px">连击 ×${combo}${combo>=3?" · 暴击待发":""}</div>`:""}
    </div>`;
  }
  function endWin(){
    SFX.win();
    if(opts.onWin) opts.onWin({okN,total:qs.length,maxCombo,hpLeft:Math.max(0,hp),barLeft:Math.max(0,bar),barMax,pct:Math.round(okN/qs.length*100)});
  }
  function settle(ok,g,z){
    if(ok){ okN++; combo++; if(combo>maxCombo) maxCombo=combo; hp-=20; if(combo>=3){ hp-=10; toast("暴击！残雾四散——净化完毕","gold"); } SFX.ok(); }
    else if(g===1){ combo=0; SFX.tap(); }

    if(opts.onAnswer) opts.onAnswer(ok,z);

    if(z.kind==="choice"){
      host.innerHTML=head+`<div class="book"><div class="bp">谜题</div><div style="font-size:14px;line-height:1.9">${esc(z.q)}</div></div>
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px" id="bqOpts"></div>`;

      (z.opts||[]).forEach(o=>{

        b.style.textAlign="left"; b.style.whiteSpace="normal"; b.textContent=o;
        b.onpointerdown=()=>{ if(wrap._lk) return; wrap._lk=1; settle(o===z.a,0,z); };
        wrap.appendChild(b);
      });
    } else if(z.kind==="judge"){
      host.innerHTML=head+`<div class="book"><div class="bp">谜题</div><div style="font-size:14px;line-height:1.9">${esc(z.q)}</div></div>
        <div style="margin-top:10px;display:flex;gap:8px"><button class="btn primary" id="bqT" type="button">真</button><button class="btn" id="bqF" type="button">伪</button></div>`;
      $("#bqT",host).onpointerdown=()=>settle(z.a===true,0,z);
      $("#bqF",host).onpointerdown=()=>settle(z.a===false,0,z);
    } else if(z.kind==="blank"){
      host.innerHTML=head+`<div class="book"><div class="bp">谜题</div><div style="font-size:14px;line-height:1.9">${esc(z.q)}</div></div>
        <div style="margin-top:10px;display:flex;gap:8px"><input id="bqIn" style="flex:1" placeholder="填入空缺处…"><button class="btn primary" id="bqGo" type="button">落笔</button></div>`;
      const inp=$("#bqIn",host); if(inp) inp.focus();

        </div>`;
      host.querySelectorAll("[data-bg]").forEach(b=>b.onpointerdown=()=>{ const g=+b.dataset.bg; settle(g===2,g,z); });

function asrSupport(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }
function asrOnce(lang,onText,onErr){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ if(onErr) onErr("此环境不支持语音识别，请直接打字"); return null; }
  let rec;
  try{ rec=new SR(); }catch(e){ if(onErr) onErr("语音识别初始化失败，请直接打字"); return null; }
  rec.lang=lang||"zh-CN"; rec.interimResults=true; rec.continuous=true; rec.maxAlternatives=1;
  rec.onresult=e=>{ let fin="",inter="";
    for(let k=e.resultIndex;k<e.results.length;k++){ const r=e.results[k]; if(r.isFinal) fin+=r[0].transcript; else inter+=r[0].transcript; }
    if(onText) onText(fin,inter); };
  rec.onerror=e=>{ if(onErr) onErr(e&&e.error==="not-allowed"?"麦克风权限被拒——请允许麦克风后重试":"语音识别暂不可用（"+((e&&e.error)||"未知")+"）——请直接打字"); };

function genQuestion(form, pt, keyWords, pid, distractorSentences){
  const txt=cleanMd(pt.text||"");
  const title=ptTitle(pt,pid);
  if(form==="judge"){
    const core=ptKeySentence(pt)||txt.slice(0,50);
    const a=Math.random()<0.5;
    const body=a?core:distortTxt(core,keyWords);
    return {kind:"judge", q:body+"（判断正误）", a, pid, why:"出自考点 "+pid};
  }
  if(form==="blank"){
    /* 候选词：anchor/正文关键词 → 三/四位完整年份 → 句中中文专名；
       在全文句子级逐个试挖，优先含数字的信息句 */
    const cands=[];
    (keyWords||[]).forEach(w=>{ if(w&&txt.indexOf(w)>=0&&!cands.includes(w)) cands.push(w); });
    (txt.match(/\d{3,4}\s*年?/g)||[]).forEach(s=>{ const w=s.replace(/\s+/g,""); if(!cands.includes(w)) cands.push(w); });
    const sents=txt.split(/(?<=[。！？；])/).map(s=>s.trim()).filter(s=>s.length>=8);
    if(!sents.length) sents.push(txt.slice(0,80));
    sents.sort((a,b)=>(/\d/.test(b)?1:0)-(/\d/.test(a)?1:0));
    let masked=null, ans="";
    for(const w0 of cands){
      for(const sent of sents){ const m=maskWord(sent,w0); if(m){ masked=m; ans=w0; break; } }
      if(masked) break;
    }
    if(!masked){
      for(const sent of sents){
        const cw=sent.match(/[一-龥]{2,4}/g)||[];
        for(const w0 of cw){ if(KW_STOP.has(w0)) continue; const m=maskWord(sent,w0); if(m){ masked=m; ans=w0; break; } }
        if(masked) break;
      }
    }
    if(!masked){
      ans=(keyWords&&keyWords[0])||title;
      return {kind:"blank", q:`关于「${title}」，空缺处应填____`, a:ans, accept:[ans], pid, why:"出自考点 "+pid};
    }
    return {kind:"blank", q:masked, a:ans, accept:[ans], pid, why:"出自考点 "+pid};
  }
  if(form==="choice"){
    /* 选项是完整陈述句：正确项=本考点核心句，干扰项=同模块其他考点的真句 */
    const ans=ptKeySentence(pt)||txt.slice(0,48);
    const pool=(distractorSentences||[]).filter(s=>s&&s!==ans);
    const distractors=shuffleArr(pool).slice(0,3);
    const filler=["此项为无关叙述","与本考点内容不符","以上并非正确说法"];
    let gi=0;
    while(distractors.length<3&&gi<8){
      const bad=distortTxt(ans,keyWords);
      if(bad&&bad!==ans&&!distractors.includes(bad)) distractors.push(bad);
      else { const f=filler[gi%3]; if(!distractors.includes(f)) distractors.push(f); }
      gi++;
    }
    return {kind:"choice", q:`关于「${title}」，以下说法正确的是？`, opts:shuffleArr([ans].concat(distractors.slice(0,3))), a:ans, pid, why:"出自考点 "+pid};
  }
  return {kind:"judge", q:(ptKeySentence(pt)||txt.slice(0,50))+"（判断正误）", a:true, pid, why:"出自考点 "+pid};
}
/* 兜底题库：AI 失败且本任务静态题为空时，本地算法造题，保证温故试炼永不 0/0 空转。
   v51：题量溢出（max(考点数*2, 考点数+4, 8)），每考点 1-2 题，形式随机（judge/blank/choice）。
   v53：干扰池改为"同模块其他考点的完整核心句"，选择题四个选项都是完整陈述，可正常作答。 */
function fallbackQuiz(q){
  const own=D.quizzes[q.id]||[];
  const pages=D.lectures[q.id]||[];
  const itemPids=[...new Set(pages.flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean)))];
  const basePids=[...new Set((own||[]).map(z=>z.pid).filter(Boolean))];
  const pids=[...new Set([...basePids,...itemPids])];
  /* 1. 已有静态题作为基底（过清洗） */
  const out=(own&&own.length)?own.slice().map(sanitizeQuiz):[];
  const covered=new Set(out.map(z=>z.pid).filter(Boolean));
  /* 2. 干扰句池：同 module / 同 subject 的其他考点完整核心句（排除本关考点） */
  const ownPts=D.pointsLib.filter(p=>pids.includes(p.id));
  const mods=new Set(ownPts.map(p=>p.module).filter(Boolean));
  const subs=new Set(ownPts.map(p=>p.subject).filter(Boolean));
  const sentencePool=D.pointsLib
    /* FIX-P1：干扰项严格同 module（原 OR 同 subject 导致跨模块乱捞，约 39% 任务选项不相干） */
    .filter(p=>!pids.includes(p.id)&&(p.module&&mods.has(p.module)))
    .map(ptKeySentence).filter(Boolean);
  /* 3. 题量 = max(考点数*2, 考点数+4, 8)——溢出考点数 */
  const targetN=Math.max(pids.length*2, pids.length+4, 8);
  const forms=["judge","blank","choice"];
  /* 4. 每个未覆盖考点造 1-2 题，形式随机 */
  for(const pid of pids){
    if(covered.has(pid)) continue;
    const pt=D.pointsLib.find(x=>x.id===pid); if(!pt) continue;
    const kw=extractKeyWords(pt.text,pt.exam_tip,pt.anchor);
    const n=1+Math.floor(Math.random()*2);
    for(let i=0;i<n&&out.length<targetN;i++){
      out.push(genQuestion(forms[Math.floor(Math.random()*forms.length)],pt,kw,pid,sentencePool));
    }
    covered.add(pid);
  }
  /* 5. 补足 targetN：从已有考点再造题（形式随机，关键词轮换） */
  let guard=0;
  while(out.length<targetN && pids.length && guard<targetN*3){
    guard++;
    const pid=pids[Math.floor(Math.random()*pids.length)];
    const pt=D.pointsLib.find(x=>x.id===pid); if(!pt) continue;
    const kw=extractKeyWords(pt.text,pt.exam_tip,pt.anchor);
    out.push(genQuestion(forms[Math.floor(Math.random()*forms.length)],pt,kw,pid,sentencePool));
  }
  /* 6. 若仍不足 4 道，从同幕题池随机补 */
  if(out.length<4){
    const pool=[];
    DAYS.forEach(d=>d.quests.forEach(x=>{ if(x.act===q.act){ const zz=D.quizzes[x.id]; if(zz&&zz.length) pool.push(...zz); } }));
    const src=pool.length?pool:Object.values(D.quizzes).flat().filter(v=>v&&v.length);
    const used=new Set();
    while(out.length<4&&used.size<src.length){ const k=Math.floor(Math.random()*src.length); if(used.has(k))continue; used.add(k); out.push(sanitizeQuiz(src[k])); }
  }
  /* 7. 打乱顺序，出口统一清洗 */
  return shuffleArr(out).map(sanitizeQuiz);
}
/* v51：错题簿知识点化——按 pid 聚合，forms 上限 5，第1次重复原题/第2次刷新/此后轮转 */
function getWrongQuestion(we){
  if(!we||!we.forms||!we.forms.length) return null;
  const idx=we.seen % we.forms.length;
  return we.forms[idx];
}
function pushWrongEntry(qid, z){
  const pid=z.pid||"";
  const topic=wTopic({pid});

  if(!we){
    we={pid,topic,forms:[],seen:0,at:new Date().toISOString(),src:qid||"star",qid:qid||""};
    st.wrong.push(we);
  }
  if(we.forms.length<5){
    const fk=z.kind+":"+z.q;
    if(!we.forms.some(f=>(f.kind+":"+f.q)===fk)){
      we.forms.push({kind:z.kind,q:z.q,a:z.a,accept:z.accept,opts:z.opts,why:z.why,okA:(z.kind==="judge"?(z.a?"真":"伪"):z.a)});

/* v51：错题刷新——第2次起每次进入，forms 不足 5 时从考点本数据造新形式补足 */
function refreshWrongForms(we){
  if(!we||we.forms.length>=5) return;
  const pt=D.pointsLib.find(p=>p.id===we.pid); if(!pt) return;
  const kw=extractKeyWords(pt.text,pt.exam_tip,pt.anchor);
  const forms=["judge","blank","choice"];
  /* v53：干扰池用同模块其他考点的完整核心句 */
  const sentencePool=D.pointsLib
    /* FIX-P1：错题刷新干扰池严格同 module */
    .filter(p=>p.id!==we.pid&&(pt.module&&p.module===pt.module))
    .map(ptKeySentence).filter(Boolean);
  let guard=0;
  while(we.forms.length<5 && guard<12){
    guard++;
    const form=forms[Math.floor(Math.random()*forms.length)];
    const nq=sanitizeQuiz(genQuestion(form,pt,kw,we.pid,sentencePool));
    const fk=nq.kind+":"+nq.q;
    if(we.forms.some(f=>(f.kind+":"+f.q)===fk)) continue;
    we.forms.push({kind:nq.kind,q:nq.q,a:nq.a,accept:nq.accept,opts:nq.opts,why:nq.why,okA:(nq.kind==="judge"?(nq.a?"真":"伪"):nq.a)});
  }
}

        +`正确答案：<b style="color:var(--gold)">${esc(String(f.okA!=null?f.okA:f.a))}</b>。`;
      const got=document.createElement("button");
      got.className="btn sm primary"; got.type="button"; got.textContent="知道了";
      got.style.marginTop="6px";
      got.onpointerdown=()=>{
        SFX.tap();
        if(ok){ st.wrong.splice(idx,1); if(window.WDMem)WDMem.right("xuanji",we.topic||wTopic(we)); }      // 答对：移除该知识点，记忆同步销账
        save(); listView();
      };
      rfb.appendChild(document.createTextNode(" ")); rfb.appendChild(got);
    };
    const rt=$("#rt",host);
    if(rt){
      rt.onpointerdown=()=>finish(f.okA==="真");
      $("#rf",host).onpointerdown=()=>finish(f.okA==="伪");
    } else if(isChoice){
      host.querySelectorAll("[data-copt]").forEach(b=>{ b.onpointerdown=()=>{ const opt=f.opts[+b.dataset.copt]; finish(opt===f.a); }; });
    } else {
      const rin=$("#rin",host); rin.focus();
      const acc=(f.accept&&f.accept.length)?f.accept:[String(f.a)];
      const sub=()=>finish(acc.some(a=>normalize(a)===normalize(rin.value))||normalize(rin.value).includes(normalize(f.a)));
      $("#rok",host).onpointerdown=sub;
      rin.onkeydown=e=>{ if(e.key==="Enter") sub(); };
    }
  }
  listView();
}

function downloadFile(name,text,mime){
  try{
    const b=new Blob([text],{type:mime||"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast("导出失败："+e.message); }
}
function pickFile(accept,cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.style.cssText="position:fixed;left:-9999px;top:-9999px";
  /* v58：input 必须持续挂载到文件处理结束——WebKit/Safari 中 file input 分离后，
     由其 File 创建的 blob: URL 加载会永久挂起（img 既不 onload 也不 onerror），
     表现为上传按钮一直停在“处理中…”。cb 可返回 Promise，settle 后才移除；
     不返回时（裁剪 UI 场景）由调用方通过返回值自行释放，10 分钟兜底回收。 */
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{ console.log("[立绘上传] 已选文件:",f.name,f.type,Math.round(f.size/1024)+"KB"); }catch(e){}
    let ret;
    try{ ret=cb(f); }
    catch(e){ setTimeout(()=>{ throw e; },0); ret=Promise.reject(e);
    }
    if(ret&&typeof ret.then==="function"){
      Promise.resolve(ret).then(()=>inp.remove(),()=>inp.remove());
    }
  };
  document.body.appendChild(inp); inp.click();
  setTimeout(()=>{ try{inp.remove();}catch(e){} }, 600000);
  return inp;
}

/* ==================== NPC 记忆档案 / 数据质量监控（WDMem 面板） ==================== */
function memFmt(s){
  if(s<60) return s+"秒";
  if(s<3600) return Math.floor(s/60)+"分"+(s%60?Math.round(s%60)+"秒":"");
  return Math.round(s/360)/10+"小时";
}
function renderMem(){
  if(!window.WDMem){ toast("记忆模块未装载"); return; }
  SFX.tap();
  const q=WDMem.quality(), db=WDMem.stats();
  const rows=Object.keys(db.byNpc).sort().map(id=>{
    const r=db.byNpc[id], n=NPC[id]||NPC.yunheng;

/* v2：callLog（R1.3d）——耗时/缓存命中/重试/错误码，内存环队列 + 截断落盘 */
let _callLog=[];
function callLog(entry){
  entry.t=new Date().toISOString();
  _callLog.push(entry); if(_callLog.length>80) _callLog=_callLog.slice(-80);
  try{ localStorage.setItem("wdzx.calllog",JSON.stringify(_callLog.slice(-40))); }catch(e){}
}

/* v2：重试判定（R1.2c）——仅 429/5xx/网络错误退避重试 1 次；401/402/403 直接异常态 */
function _retryable(status){ return status===429||status>=500; }
function _backoffMs(attempt){ return Math.min(8000,600*Math.pow(2,attempt))+Math.random()*400; }

/* dsChat v2（R1.2）：
   messages 标准多轮；opts 可为 true（旧 json 兼容，映射为 evolve 档）或 {kind,tools,stream}。
   - kind ∈ chat/director/summary/evolve/quiz/persona/questbrief/polish → 参数分档
   - opts.tools 传入时启用 function calling（agent loop 由 WDChat.respondWithTools 驱动）
   - 流式：kind=chat/polish 且未传 tools 且提供 onDelta 回调时 stream:true（含 include_usage）
   返回：普通文本 / 流式完整文本；带 tools 时返回 {content,toolCalls} */
async function dsChat(messages, opts, onDelta){
  if(!dsReady()) throw new Error("未配置密钥");
  const o=(opts===true)?{kind:"evolve"}:((opts&&typeof opts==="object")?opts:{});
  const kind=o.kind||"chat";
  const profile=Object.assign({},DS_PROFILES[kind]||DS_PROFILES.chat);
  const key=dsKeyGet().trim();
  const wantTools=!!o.tools;
  const wantStream=(kind==="chat"||kind==="polish")&&!wantTools&&typeof onDelta==="function";
  let attempt=0, lastErr=null;
  while(attempt<=1){ /* 重试 ≤1 次（R1.2c） */
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), wantStream?12000:22000); /* v2：流式首包 12s（R1.2b） */
    const t0=Date.now();
    try{
      const model=o.model||profile.model||DS_MODEL;
      const body={model,messages,
        ...(profile.temperature!=null?{temperature:profile.temperature}:{}),
        max_tokens:profile.max_tokens,
        ...(profile.frequency_penalty!=null?{frequency_penalty:profile.frequency_penalty}:{}),
        ...(profile.presence_penalty!=null?{presence_penalty:profile.presence_penalty}:{}),
        ...(profile.response_format?{response_format:profile.response_format}:{}),
        ...(wantTools?{tools:o.tools,tool_choice:"auto"}:{}),
        ...(wantStream?{stream:true,stream_options:{include_usage:true}}:{})};
      const r=await fetch("https://api.deepseek.com/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify(body),
        signal:ctrl.signal});
      clearTimeout(t);
      if(r.status===401){ aiHealth="error"; callLog({kind,err:401,ms:Date.now()-t0}); throw new Error("密钥无效(401)"); }
      if(r.status===402||r.status===403){ aiHealth="error"; callLog({kind,err:r.status,ms:Date.now()-t0}); throw new Error("额度不足或禁止("+r.status+")"); }
      if(_retryable(r.status)){ throw Object.assign(new Error("可重试("+r.status+")"),{status:r.status}); }
      if(!r.ok){ callLog({kind,err:r.status,ms:Date.now()-t0}); throw new Error("接口异常("+r.status+")"); }
      aiHealth="ok";
      /* ===== 流式读取（R1.2b：SSE 逐 delta） ===== */
      if(wantStream){
        let full="", usage=null;
        const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
        while(true){
          const {done,value}=await reader.read();
          if(done) break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split("\n"); buf=lines.pop();
          for(const line of lines){
            const s=line.trim();
            if(!s.startsWith("data:")) continue;
            const payload=s.slice(5).trim();
            if(payload==="[DONE]") continue;
            try{
              const j=JSON.parse(payload);
              const d=j.choices&&j.choices[0]&&j.choices[0].delta;
              if(d&&d.content){ full+=d.content; try{ onDelta(d.content,full); }catch(e){ console.warn('[ds stream] onDelta 渲染异常',e); } }
              if(j.usage) usage=j.usage;
            }catch(e){ /* SSE 心跳/半截块非合法 JSON 属正常，仅调试期留痕 */ if(payload&&payload!=="[DONE]") console.warn('[ds stream] 坏块已跳过',String(payload).slice(0,80)); }
          }
        }
        callLog({kind,ms:Date.now()-t0,stream:true,cached:usage&&usage.prompt_cache_hit_tokens||0});
        const c=full.trim();
        if(!c) throw new Error("返回为空");
        return c;
      }
      /* ===== 非流式 ===== */
      const j=await r.json();
      callLog({kind,ms:Date.now()-t0,cached:j.usage&&j.usage.prompt_cache_hit_tokens||0,retry:attempt>0});
      const msg=j.choices&&j.choices[0]&&j.choices[0].message;
      if(!msg) throw new Error("返回为空");
      if(msg.tool_calls&&msg.tool_calls.length){
        return {content:msg.content||"",toolCalls:msg.tool_calls};
      }
      const c=msg.content;
      if(!c) throw new Error("返回为空");
      return c.trim();
    }catch(e){
      clearTimeout(t);
      lastErr=e;
      const isAbort=/abort/i.test(String(e&&e.name||e));
      if(isAbort||e&&e.status&&_retryable(e.status)){
        if(attempt<1){ attempt++; await new Promise(rs=>setTimeout(rs,_backoffMs(attempt))); continue; }
        aiHealth="down"; callLog({kind,err:isAbort?"timeout":"net",ms:Date.now()-t0,retried:1});
        throw new Error("网络超时或限流，重试后仍失败");
      }
      throw e;
    }
  }
  throw lastErr||new Error("未知错误");
}

    +"严禁出现以下已淘汰的旧概念："+OBSOLETE_TERMS.join("、")+"。"
    +((window.WDRegistry&&WDRegistry.arcSeedOf)?("\n\n【NPC目标/弧线基线·须贴合】\n"+JSON.stringify(WDRegistry.arcSeedOf(npcId))):"")

    +"\n1. miniBio: 人物小传，200字内，交代角色来历、内在矛盾、与玩家的关系张力"

/* v55 批3-②：AI 一次性出题入库——首学时按任务一次性出题并持久化到 st.quizBank，
   以后进入同一任务时直接复用复抽；题目数量 = 知识点数 × 1.2，同知识点最多 2 题。 */
function quizBankPids(q){
  const baseQuiz=D.quizzes[q.id]||[];
  const pages=D.lectures[q.id]||[];
  const basePids=[...new Set((baseQuiz||[]).map(z=>z.pid).filter(Boolean))];
  const itemPids=[...new Set(pages.flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean)))];
  return [...new Set([...basePids,...itemPids])];
}
/* 从题库按知识点均匀抽取 targetN 题（每知识点至少 1 题，最多 2 题） */
function quizBankDraw(qid,pids,targetN){
  const bank=(st.quizBank&&st.quizBank[qid])||[];
  if(!bank.length) return [];
  const used=new Set(); const out=[]; const byPid={};
  pids.forEach(p=>{ byPid[p]=bank.filter(z=>z.pid===p); });
  /* 先给每知识点 1 题 */
  pids.forEach(p=>{
    if(out.length>=targetN) return;
    const cand=byPid[p].filter(z=>!used.has(z.q));
    if(cand.length){ const z=cand[Math.floor(Math.random()*cand.length)]; used.add(z.q); out.push(z); }
  });
  /* 再补足 targetN（同知识点 ≤2） */
  const all=bank.filter(z=>!used.has(z.q));
  let guard=0;
  while(out.length<targetN&&all.length&&guard<targetN*4){
    guard++;
    const pidCounts={}; out.forEach(z=>{ pidCounts[z.pid]=(pidCounts[z.pid]||0)+1; });
    const cand=all.filter(z=>(pidCounts[z.pid]||0)<2);
    if(!cand.length) break;
    const z=cand[Math.floor(Math.random()*cand.length)];
    used.add(z.q); out.push(z);
  }
  return shuffleArr(out).map(sanitizeQuiz);
}

  const arr=Array.isArray(o)?o:(o.questions||[]);

    let a=z.a, accept=z.accept, pid=z.pid, why=z.why;
    if(kind==="judge"){
      a=(a===true||a==="true")?true:(a===false||a==="false")?false:Boolean(a);
      if(typeof a!=="boolean") a=Boolean(a);
    } else {
      a=String(a);
      accept=Array.isArray(accept)&&accept.length?accept.map(String):[a];
      if(!accept.includes(a)) accept.unshift(a);
    }
    if(!pid||!pidSet.has(pid)) pid=pids[0]||pid;
    if(!why||typeof why!=="string") why="出处：考点 "+pid;
    else why=String(why).slice(0,120);
    const out={kind,q:String(z.q),a,why,pid};
    if(kind==="blank") out.accept=accept;
    return out;
  });
  return cleaned.map(sanitizeQuiz);
}

          if(colon<0) return {name:p.trim(),rel:""};

    host.querySelectorAll("[data-grow]").forEach(b=>b.onpointerdown=async ()=>{

    const box=$("#fb_"+id,host);

    }catch(e){ if(box){ box.textContent="生成失败："+e.message+"（已保留原人设，可重试）"; } SFX.no(); }
  }
  draw();
