<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>问道之旅 · 四十五日 · 于不浪</title>
<style>
:root{
  --bg:#f6efe4; --bg2:#efe5d2; --bg3:#e5d8bf;
  --fg:#3b3226; --fg2:#6b5c48; --dim:#78684e;
  --neon:#c96f7f; --cyber:#5f8f8f; --gold:#b98a3f; --ok:#6f9a62; --danger:#b85c5c;
  --border:#d8cbb2; --border-lit:#c1ab85;
  --pixel:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --shadow:0 1px 3px rgba(60,45,25,.14);
  --ink2:var(--dim); --serif:var(--pixel); --accent:var(--cyber); --hair:var(--border);
}
/* @font-face 已废弃：改用 iOS 系统字体族，保证清晰易读与跨设备一致性 */
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);font-size:clamp(14px,4.4vw,20px);line-height:1.65;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#game{max-width:1280px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
@media(min-width:1500px){#game{max-width:min(1500px,94vw)}}
.hidden{display:none!important}
.serif{font-family:var(--pixel)}
.intlink{color:var(--cyber);text-decoration:underline dotted;text-underline-offset:3px}
.intlink:hover{color:var(--neon)}

/* header */
.hd{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--border-lit);padding-bottom:8px;text-shadow:0 1px 0 rgba(60,45,25,.35)}
.hd .t{font-weight:600;font-size:clamp(16px,4.8vw,22px);letter-spacing:.14em;color:var(--cyber)}
.hd .t small{font-size:11px;color:var(--dim);letter-spacing:.18em;margin-left:8px}
.hd .stats{font-size:12.5px;color:var(--fg2);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:14px;row-gap:4px;font-variant-numeric:tabular-nums}
.hd .stats b{color:var(--gold)}
.hd .stats .gametime{font-size:15.5px;font-weight:600;color:var(--cyber);letter-spacing:.06em}
.hd .stats .gametime b{color:var(--neon);font-size:17px}
.tplot{font-size:11.5px;color:var(--dim);padding:2px 0 4px 22px;line-height:1.5;font-style:italic}
.hd .stats button{background:none;border:none;font:inherit;color:var(--fg2);cursor:pointer;text-decoration:underline;padding:0}
.hd .stats button:hover{color:var(--neon)}
.hdacts{white-space:nowrap;display:inline-flex;gap:10px;align-items:center}
.navline{display:flex;gap:2px;margin:8px 0 0;overflow-x:auto}
.navline button{background:none;border:none;font:inherit;font-size:13px;color:var(--fg2);padding:9px 12px;min-height:40px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.navline button.on{color:var(--cyber);border-bottom-color:var(--neon);font-weight:600}
.navline button .dot{display:inline-block;width:6px;height:6px;background:var(--neon);border-radius:50%;margin-left:4px;vertical-align:2px}

/* chat stream */
.stream{flex:1;min-height:0;overflow-y:auto;padding:14px 4px 8px;scroll-behavior:smooth;overscroll-behavior:contain}
.sys{font-size:12px;color:var(--dim);text-align:center;margin:12px 0;letter-spacing:.08em}
.sys.daysep{border-bottom:1px dashed var(--border);padding-bottom:8px;margin-top:22px;letter-spacing:.15em}
.msg{display:flex;gap:10px;margin:10px 0;align-items:flex-start}
.msg .avatar{flex:none;width:40px;height:40px;border:2px solid var(--border-lit);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--cyber);box-shadow:0 2px 0 rgba(60,45,25,.16)}
.msg .body{max-width:78%}
.msg .name{font-size:12px;color:var(--dim);margin-bottom:2px}
.msg .name b{color:var(--cyber);font-weight:600}
.bubble{background:var(--bg2);border:2px solid var(--border);padding:9px 13px;font-size:14.5px;box-shadow:0 2px 0 rgba(60,45,25,.16)}
.bubble.narration{background:none;border:none;color:var(--dim);font-size:13.5px;padding:2px 0;font-style:italic}
.msg.me{flex-direction:row-reverse}
.msg.me .body{text-align:right}
.msg.me .bubble{background:var(--neon);border-color:var(--neon);color:#3b3226;text-align:left}
.msg.sysline{justify-content:center}
.msg.sysline .bubble{background:var(--bg2);border:none;font-size:12px;color:var(--dim);padding:4px 10px}

/* quest card in stream */
.qcard{border:2px solid var(--border-lit);background:var(--bg);margin-top:8px;padding:10px 12px;max-width:100%;box-shadow:0 3px 0 rgba(60,45,25,.15);position:relative}
.qrefs{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px}
.qref{border:1px solid var(--cyber);background:rgba(95,143,143,.10);color:var(--cyber);font-size:11.5px;padding:3px 10px;border-radius:12px;cursor:pointer}
.qref:active{transform:scale(.96)}
@keyframes qflashK{0%,100%{box-shadow:0 3px 0 rgba(60,45,25,.15)}30%{box-shadow:0 0 0 4px var(--gold);border-color:var(--gold)}}
.qflash{animation:qflashK 1.6s ease}
.qcard::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.1) 2px,rgba(0,0,0,.1) 3px);z-index:0}
.qcard>*{position:relative;z-index:1}
.qcard.locked{border-color:var(--border);opacity:.6}
.qcard .qn{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;color:var(--fg)}
.qcard .qn .rk{font-size:11px;color:var(--neon)}
.qcard .qg{font-size:12.5px;color:var(--fg2);margin:4px 0 8px}
.qcard .qr{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--gold)}
.qcard .qr .dur{color:var(--dim)}
.qcard.done{opacity:.75;border-color:var(--border)}
.qcard.done .qn::after{content:" ✓";color:var(--ok)}
.qcard.now{border-color:var(--neon)}
/* 置底当前任务卡（需求2a） */
.pinwrap{margin-top:16px;border:2px solid var(--neon);background:rgba(185,138,63,.10);box-shadow:0 0 12px rgba(185,138,63,.25);padding:8px 10px}
.pinwrap .pinhead{font-size:11px;letter-spacing:.2em;color:var(--neon);margin-bottom:2px}
.pinwrap .qcard{margin-top:6px;box-shadow:0 2px 0 rgba(60,45,25,.16)}
.pinwrap.idle{border-color:var(--border-lit);background:var(--bg2);box-shadow:none}
.pinwrap.idle .pinhead{color:var(--gold)}
.pinwrap .pintip{font-size:12.5px;color:var(--fg2);padding:4px 2px}
/* v52 R4：剧情回廊（独立于行为流的剧情折叠区） */
.plotcorridor{border-color:var(--gold);background:rgba(255,215,0,.05);box-shadow:0 0 12px rgba(255,215,0,.18)}
.plotcorridor .pinhead{color:var(--gold);cursor:pointer;user-select:none}
.plotcorridor .msg{margin:6px 0 2px}
/* v52 R3：任务开场 cue 气泡（状态/安排/余量/预告/激励五行） */
.cue-banner{white-space:pre-line;line-height:1.7;border-left:3px solid var(--neon);background:rgba(185,138,63,.10);font-size:13px}
/* v58c：纪日索引卡（云汀手札，一纪日一张，逐任务点选） */
.qindex{border:2px solid var(--neon);background:var(--bg);margin-top:6px;padding:10px 12px;max-width:100%;box-shadow:0 3px 0 rgba(60,45,25,.18)}
.qindex .qihd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.qindex .qititle{font-weight:600;font-size:14px;color:var(--neon);letter-spacing:.06em}
.qindex .qiprog{font-size:12px;color:var(--gold);white-space:nowrap}
.qindex .qicue{font-size:12.5px;line-height:1.7;color:var(--fg2);border-left:3px solid var(--gold);background:rgba(185,138,63,.08);padding:4px 8px;margin-bottom:8px}
.qindex .qirow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-top:1px dashed var(--border)}
.qindex .qirow.done{opacity:.6}
.qindex .qirow.done .qin::after{content:" ✓";color:var(--ok)}
.qindex .qidot{width:18px;text-align:center;color:var(--gold);flex:none}
.qindex .qiinfo{flex:1;min-width:0}
.qindex .qin{font-size:13.5px;color:var(--fg)}
.qindex .qim{font-size:11.5px;color:var(--dim);margin-top:1px}
.qindex .qibtn{flex:none}
/* v52 R6：吟游修习室 站/段/句 三层 */
.osec{border:1px solid var(--border);border-radius:4px;margin:6px 0;background:var(--bg2)}
.osec.passed{border-color:var(--ok)}
.osec-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none;font-size:13.5px}
.osec-head .fcar{color:var(--neon);width:12px}
.osec-badge{margin-left:auto;font-size:11px;color:var(--gold)}
.osec.passed .osec-badge{color:var(--ok)}
.osec-body{padding:4px 10px 10px;border-top:1px dashed var(--border)}
.osent{padding:6px 4px;border-bottom:1px dotted var(--border)}
.osent-en{font-size:14px;line-height:1.7;color:var(--fg)}
.osent-zh{font-size:12px;color:var(--dim);line-height:1.6;margin-top:2px}
.osent-act{margin-top:3px;display:flex;gap:6px}
/* 已完成任务折叠（需求2c） */
.qfold{margin-top:10px}
.qfoldhead{display:flex;align-items:center;gap:7px;border:1px dashed var(--border-lit);background:var(--bg2);padding:7px 10px;font-size:12px;color:var(--fg2);cursor:pointer;max-width:100%}
.qfoldhead:hover{background:var(--bg)}
.qfoldhead .fcar{color:var(--gold);font-size:10px;flex:none}
.qfoldhead .ftext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qfoldhead .fhint{margin-left:auto;font-size:10.5px;color:var(--dim);flex:none}
.qfoldbody{margin-top:6px}
/* 最新回复自动关联当前任务 chip（需求2b） */
.qref.cur{border-color:var(--neon);color:var(--neon);background:rgba(201,111,127,.14)}
.nowtag{font-size:10.5px;color:#3b3226;background:var(--neon);padding:2px 8px;margin-left:8px;letter-spacing:.12em;box-shadow:0 1px 0 rgba(60,45,25,.16);font-weight:600}
.donetag{color:var(--ok);font-size:12px;margin-right:8px;white-space:nowrap}
.btn{display:inline-block;border:2px solid var(--border-lit);background:linear-gradient(180deg,#efe5d2 0%,#e5d8bf 100%);color:var(--fg);font:inherit;font-size:13.5px;
  padding:6px 16px;cursor:pointer;letter-spacing:.06em;transition:none;
  box-shadow:0 1px 3px rgba(60,45,25,.18);border-radius:8px}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(60,45,25,.22)}
.btn.primary{background:linear-gradient(180deg,#d9899a,#c96f7f);border-color:#c96f7f;color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary:active{box-shadow:0 1px 2px rgba(60,45,25,.22)}
.btn.gold{background:linear-gradient(180deg,#c9a15f,#b98a3f);border-color:#b98a3f;color:#3b3226}
.btn.ghost{border-color:var(--dim);color:var(--dim)}
.btn.ghost:hover{border-color:var(--fg2);color:var(--fg2);filter:none}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn:disabled:hover{filter:none}
.btn:disabled:active{transform:none;box-shadow:0 1px 3px rgba(60,45,25,.18)}

/* input bar */
.inputbar{display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--border);margin-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.inputbar input{flex:1;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:9px 12px}
.inputbar input:focus{outline:none;border-color:var(--neon)}
.inputbar .hint{font-size:11.5px;color:var(--dim);padding-top:12px;white-space:nowrap}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,5,20,.8);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}

/* ===== v56：序章视觉小说播放器已整段移除，相关样式一并删除 ===== */

.dlg{background:var(--bg2);border:2px solid var(--border-lit);width:100%;max-width:680px;max-height:88vh;overflow:auto;padding:20px 22px 20px 22px;box-shadow:0 4px 0 rgba(60,45,25,.14);position:relative}
.dlg::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px);z-index:0}
.dlg>*{position:relative;z-index:1}
.dlg h2{font-size:clamp(18px,5.5vw,24px);margin:0 0 2px;padding-right:48px;font-weight:600;color:var(--cyber);text-shadow:0 1px 0 rgba(60,45,25,.35)}
.dlg .mt{font-size:12px;color:var(--dim);letter-spacing:.12em;margin-bottom:10px;padding-right:48px}
.dlg .close{position:absolute;top:10px;right:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:1px solid var(--border-lit);font-size:22px;line-height:1;cursor:pointer;color:var(--dim);z-index:12;box-shadow:0 1px 3px rgba(60,45,25,.18);-webkit-tap-highlight-color:transparent;border-radius:8px}
.dlg .close:hover{color:var(--danger);border-color:var(--danger)}
.dlg .close:active{transform:scale(.94)}

/* ===== GAL 版式：quest modal 宽屏变左右两栏（Phase 0 T1）=====
   左 1/3 = 配合区（NPC + 关卡元信息 + 奖励）
   右 2/3 = stageHost（书页/对话/试炼） */
.dlg.gal{max-width:min(1100px,95vw);padding:0;overflow:hidden}
@media(min-width:900px){
  .dlg.gal{display:flex;flex-direction:row}
  .dlg.gal .gal-left{
    width:32%;min-width:220px;max-width:280px;
    border-right:2px solid var(--border);
    padding:22px 16px;
    display:flex;flex-direction:column;gap:14px;
    background:linear-gradient(180deg,rgba(61,240,255,.05),transparent);
  }
  .dlg.gal .gal-right{
    position:relative;flex:1;min-width:0;
    padding:20px 22px;
    display:flex;flex-direction:column;overflow:hidden;
    max-height:88vh;
  }
  .dlg.gal .gal-right .close{top:12px;right:14px}
  .dlg.gal .gal-right #stageHost{flex:1;min-height:0;overflow-y:auto}
}

/* ===== 试炼幻境视觉层（Phase 1 case-illusion 最小版）===== */
.dlg.gal.illusion .gal-right{
  background:radial-gradient(120% 80% at 50% 0%,rgba(120,40,200,.18),transparent 55%),#0a0618;
}
.dlg.gal.illusion .gal-right::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 4px,rgba(120,40,200,.05) 4px,rgba(120,40,200,.05) 5px);
  animation:illuFogFlow 14s linear infinite;
}
@keyframes illuFogFlow{ 0%{background-position:0 0} 100%{background-position:0 40px} }
.dlg.gal.illusion .gal-right .gal-right-inner{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.illu-top{position:absolute;top:6px;left:14px;right:14px;z-index:5;pointer-events:none}
.illu-hp-label{font-size:10px;color:var(--gold);letter-spacing:.12em;margin-bottom:2px;text-align:right}
.illu-hp-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.illu-hp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyber),var(--neon));transition:width .4s ease}
.illu-fog-area{position:absolute;inset:0 0 140px 0;pointer-events:none;overflow:hidden}
.illu-fog{position:absolute;bottom:0;transform:translateY(40px);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.illu-fog.show{transform:translateY(0);opacity:1}
.illu-fog.defeat{transform:translateY(-80px);opacity:0;transition:transform .5s ease,opacity .4s}
.illu-fog.defeat.crit{transform:translateY(-120px) scale(1.4);filter:hue-rotate(40deg);opacity:0}
.illu-fog.fail{animation:illuShake .5s ease}
@keyframes illuShake{10%,90%{transform:translateX(-4px)} 20%,80%{transform:translateX(4px)} 30%,50%,70%{transform:translateX(-3px)} 40%,60%{transform:translateX(3px)}}
.illu-fog-ball{font-size:28px;filter:drop-shadow(0 0 8px rgba(180,80,220,.6))}
.illu-fog-idx{font-size:9px;color:var(--dim);text-align:center;margin-top:2px;letter-spacing:.08em}
.illu-combo{position:absolute;bottom:10px;right:16px;font-size:11px;color:var(--gold);letter-spacing:.1em;z-index:5}
.illu-combo.crit{font-size:14px;color:var(--neon);text-shadow:0 0 8px var(--neon);animation:illuCritPulse .8s ease}
@keyframes illuCritPulse{0%{transform:scale(1.4)} 100%{transform:scale(1)}}

/* scroll book pages */
.book{background:var(--bg3);border:2px solid var(--border);padding:14px 16px;margin:10px 0;box-shadow:inset 1px 1px 0 var(--border-lit)}
.book .bp{font-weight:600;font-size:14px;letter-spacing:.1em;color:var(--neon);margin-bottom:8px;text-shadow:0 1px 0 rgba(60,45,25,.35);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.book .bp .pid{font-weight:600}
.book .bp em{font-style:normal;color:var(--gold);font-weight:600}
.book .pt{border-bottom:1px dashed var(--border);padding:7px 0;font-size:14px;line-height:1.6}
.book .pt .pid{font-weight:600;margin-right:8px}
.book .pt .pid .s3{color:var(--neon)}
.book .pt em{font-style:normal;color:var(--gold);font-weight:600}
.book .npcnote{font-size:12.5px;color:var(--dim);border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;font-style:italic}
.book .anchor{background:var(--bg2);border:1px solid var(--border-lit);padding:8px 10px;margin-top:8px;font-size:13px}
.book .anchor b{color:var(--neon)}
/* 打字机效果：当前打字元素高亮 + 末尾闪烁光标 */
.book .pt.tw-active,.book .npcnote.tw-active,.book .anchor.tw-active{background:rgba(95,143,143,.08);border-radius:2px}
.tw-active::after{content:'▋';color:var(--neon);animation:twblink .8s steps(2) infinite;margin-left:1px;font-weight:400}
@keyframes twblink{50%{opacity:0}}
.tw-done{opacity:1!important;transition:none}
.book .oralrow{padding:8px 0;border-bottom:1px dashed var(--border);font-size:13.5px}
.book .oralrow .en{display:block;color:var(--fg);font-size:14px;line-height:1.6}
.book .oralrow .zh{display:block;color:var(--dim);font-size:12.5px;margin-top:4px}

/* 朗读/复述工作台 */
.oralkit{border:2px solid var(--border);background:var(--bg);padding:12px;margin-top:10px}
.oraltxt{position:relative;border:1px dashed var(--border-lit);padding:10px 12px;margin-bottom:8px;line-height:1.7;transition:filter .2s}
.oraltxt.masked .en{filter:blur(7px);user-select:none;pointer-events:none}
.oraltxt.masked .zh{opacity:.35}
.oraltxt .maskhint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--neon);font-size:14px;letter-spacing:.1em;pointer-events:none;text-shadow:0 1px 0 rgba(60,45,25,.35)}
.oraltxt.masked .maskhint{display:flex}
.kitbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.kitbar .btn{padding:5px 10px;font-size:12.5px}
.rectimer{font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;min-width:52px}
.wave{width:100%;height:48px;background:var(--bg2);border:1px solid var(--border);display:block;margin:6px 0}
.kwgrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kwchip{border:1px solid var(--border-lit);background:var(--bg2);color:var(--fg2);padding:4px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.kwchip.hit{background:var(--ok);color:#3b3226;border-color:var(--ok);text-decoration:line-through}
.kwchip.miss{opacity:.45}
.recscore{font-size:14px;margin-top:6px;padding:8px 10px;border-left:3px solid var(--gold);background:var(--bg3)}
.recscore.good{border-left-color:var(--ok)}
.recscore.bad{border-left-color:var(--danger)}
.speedbtns button.cur{background:var(--neon);color:#fff;border-color:var(--neon)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0}
.pager button{min-width:34px}
.pager .pg{font-size:12.5px;color:var(--dim)}

/* quiz inside modal */
.quiz{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.quiz .qz{font-size:14px;margin:8px 0}
.quiz .qz .kk{font-size:11px;color:var(--dim);letter-spacing:.1em;display:block;margin-bottom:3px}
.quiz input{width:100%;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;padding:7px 10px;margin-top:4px}
.quiz input:focus{outline:none;border-color:var(--neon)}
.quiz .fb{font-size:13px;margin-top:6px;display:block;line-height:1.7}
.quiz .fb.ok{color:var(--ok)} .quiz .fb.no{color:var(--danger)}
.quiz .fb .btn{margin-top:6px}
.jbtns{display:flex;gap:10px;margin-top:6px}
/* v53：选择题选项为完整陈述句（最长 50 字），改为纵向排列、左对齐自动换行 */
.jbtns.choicebtns{flex-direction:column;gap:8px}
.jbtns.choicebtns .btn{width:100%;text-align:left;white-space:normal;word-break:break-all;overflow-wrap:break-word;line-height:1.6;padding:10px 14px;min-height:0;font-size:13px;max-width:100%;display:block}

/* v53：gal-left 头像下方立绘占位——雾袍剪影（素材就绪后替换为真实立绘） */
.gal-portrait{flex:1;min-height:180px;margin:6px 0;border-radius:10px;
  background:
    linear-gradient(180deg,transparent 60%,rgba(60,45,25,.10)),
    radial-gradient(60% 46% at 50% 34%, var(--border-lit) 0 42%, transparent 43%),   /* 头 */
    radial-gradient(72% 62% at 50% 78%, var(--border-lit) 0 52%, transparent 53%); /* 袍身 */
  background-color:rgba(185,138,63,.08);
  border:1px solid var(--border);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);
  position:relative;overflow:hidden;
}
.gal-portrait::after{content:"立绘";position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-size:10px;letter-spacing:.2em;color:var(--dim)}
.gal-portrait.hasimg::after{content:none}
.gal-portrait.hasimg{background:none;border:none;box-shadow:none}
/* v58：窄屏不再完全藏起立绘——已上传时以紧凑横幅展示，无图仍隐藏占位剪影 */
@media(max-width:899px){
  .gal-portrait{display:none}
  .gal-portrait.hasimg{display:block;min-height:0;height:150px;margin:8px 12px}
  .gal-portrait.hasimg img{width:100%;height:100%;object-fit:cover;border-radius:10px}
}

/* timer */
.timer{font-size:clamp(28px,8vw,40px);text-align:center;font-variant-numeric:tabular-nums;padding:4px 0;color:var(--cyber);text-shadow:0 1px 0 rgba(60,45,25,.35)}
.tstate{text-align:center;font-size:12px;color:var(--dim)}

/* lists */
.li{border-bottom:1px solid var(--border);padding:7px 2px;font-size:13.5px}
.li b{color:var(--neon);margin-right:8px}
.ach{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:8px 2px}
.ach .ic{width:28px;height:28px;flex:none;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ach.got .ic{background:var(--neon);color:#3b3226;border-color:var(--neon)}
.ach.got b{color:var(--gold)}
.ach .ts{margin-left:auto;font-size:11px;color:var(--dim)}
.heart{border-bottom:1px solid var(--border);padding:9px 2px}
.heart .hn{font-weight:600;color:var(--cyber)}
.heart .ht{font-size:11.5px;color:var(--dim)}
.heart .hl{font-size:14px;margin-top:3px;font-style:italic}
.heart.locked .hl{color:var(--border);font-style:normal}
.shoprow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border);padding:7px 2px}
.shoprow input{flex:1;border:none;background:none;font:inherit;border-bottom:1px dashed var(--border);font-size:14px;color:var(--fg)}
.shoprow .cost{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--gold)}
.flashcard{border:2px solid var(--border-lit);padding:22px 18px;text-align:center;margin:12px 0;min-height:150px;background:var(--bg3);box-shadow:0 3px 0 rgba(60,45,25,.15)}
.flashcard .fc-id{font-size:12px;color:var(--dim);letter-spacing:.1em}
.flashcard .fc-main{font-size:16px;margin-top:10px;color:var(--fg);white-space:pre-wrap}
.flashcard .fc-rev{margin-top:12px;font-size:13px;color:var(--cyber);border-top:1px dashed var(--border);padding-top:10px}
.wrongrow{border-bottom:1px solid var(--border);padding:7px 2px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.wrongrow .retry{margin-left:auto}
.savegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.note{font-size:12px;color:var(--dim);background:var(--bg3);padding:6px 10px;margin:10px 0;border-left:3px solid var(--neon)}
.toasts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));right:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:var(--bg3);color:var(--fg);padding:10px 15px;font-size:13.5px;max-width:300px;animation:tin .25s;border:2px solid var(--border-lit);box-shadow:0 3px 0 rgba(60,45,25,.15)}
.toast.gold{background:var(--gold);color:#3b3226;border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
footer{color:var(--border);text-align:center;font-size:10.5px;letter-spacing:.2em;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.recctl{display:flex;gap:8px;align-items:center;margin-top:8px}
@media(max-width:560px){
  .dlg{padding:14px}.msg .body{max-width:88%}.timer{font-size:28px}
  /* v57：小屏头部防溢出——状态栏收窄换行，时钟字号降级，配置/存档按钮始终可见 */
  #game{padding-left:12px;padding-right:12px}
  .hd{align-items:flex-start;gap:8px}
  .hd .t small{display:block;margin-left:0;margin-top:2px}
  .hd .stats{gap:8px;font-size:11.5px;flex:1}
  .hd .stats .gametime{font-size:13px;flex-basis:100%}
  .hd .stats .gametime b{font-size:14px}
}

.journey{display:flex;flex-direction:column;gap:14px;margin:12px 0}
.jrow{display:flex;align-items:center;gap:10px}
.jact{width:46px;flex:none;text-align:center}
.jact svg{display:block;margin:0 auto;stroke:var(--cyber)!important}
.jact .an{font-size:11px;color:var(--dim)}
.jnodes{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.jnode{width:34px;height:34px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:var(--bg);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(60,45,25,.16);transition:none}
.jnode:hover{background:var(--bg3)}
.jnode.cur{border-color:var(--neon);color:var(--neon);font-weight:600;box-shadow:0 0 8px var(--neon),2px 2px 0 #000}
.jnode.done{background:var(--ok);color:#3b3226;border-color:var(--ok)}
.jnode.part{background:var(--bg3);border-color:var(--neon)}
.jnode.future{opacity:.4}
.jnode.boss{border-width:2px;border-color:var(--gold)}
.badgewall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:2px solid var(--border);padding:14px 10px;text-align:center;background:var(--bg2)}
.badge .bic{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--border)}
.badge.got{border-color:var(--neon)}
.badge.got .bic{border-color:var(--neon);color:var(--neon);background:var(--bg3)}
.badge.got b{color:var(--fg)}
.badge b{font-weight:600;font-size:14px;display:block;color:var(--fg)}
.badge .bd{font-size:12px;color:var(--dim)}
.descbox{background:var(--bg3);border:1px solid var(--border);padding:10px 12px;margin:10px 0;font-size:13.5px}
.descbox .dbg{font-style:italic;color:var(--dim);margin-bottom:6px}
.descbox .dgl{margin:4px 0}
.descbox .dgl b,.descbox .dst b{color:var(--neon);margin-right:6px}
.descbox .dac{border-top:1px dashed var(--border);margin-top:8px;padding-top:6px;color:var(--ok)}

.wow{font-size:14.5px}
.wow .wbg{background:var(--bg3);border-left:3px solid var(--neon);padding:8px 12px;margin:8px 0;font-style:italic;color:var(--cyber)}
.wow .wsec{margin:10px 0}
.wow .wl{font-weight:600;color:var(--neon);letter-spacing:.08em;margin-right:8px}
.wow .witem{color:var(--gold);font-weight:600}
.wow ul{margin:4px 0 4px 18px;padding:0}
.wow li{margin:3px 0}
.wow a{color:var(--cyber);text-decoration:underline}
.gl{border-bottom:1px dashed var(--neon);cursor:help;color:var(--neon)}
.gcard{position:fixed;z-index:80;background:var(--bg3);color:var(--fg);padding:12px 14px;max-width:320px;font-size:13px;border:2px solid var(--gold);box-shadow:0 4px 0 rgba(60,45,25,.14)}
.gcard .gw{font-weight:600;color:var(--gold);margin-bottom:6px}
.gcard .gs{margin:4px 0}
.gcard .gs b{color:var(--gold);margin-right:6px}

/* 藏经阁增强 */
.libtabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.progbar{height:10px;background:var(--bg3);border:1px solid var(--border);margin:6px 0}
.progfill{height:100%;background:linear-gradient(90deg,var(--neon),var(--cyber));transition:width .3s}
.libanchor{display:block;color:var(--cyber);font-size:12.5px;margin-top:4px;line-height:1.5}
.libanchor.auto{color:var(--dim);font-style:italic}
.libanchor.auto::before{content:"〔自动〕"}
.libwarn{color:var(--gold);font-size:11px;margin-left:4px}
.dayinfo{text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px}
.missing{text-align:center;padding:30px;color:var(--dim)}
.aidot{font-size:11px;letter-spacing:.04em;cursor:help;padding:0 4px}
.aidot.ok{color:var(--ok)}
.aidot.down{color:var(--gold)}
.aidot.err{color:var(--danger)}
.aidot.off{color:var(--dim)}
.energyhint{margin:4px 0;padding:6px 10px;border:1px dashed var(--border-lit);color:var(--gold);font-size:12px;line-height:1.5}
.statbar{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;margin:0 0 10px;padding:6px 10px;font-size:13px;
  background:var(--bg2);border:2px solid var(--border-lit);box-shadow:0 2px 0 rgba(60,45,25,.16);flex-wrap:wrap}
.statbar b{color:var(--gold)}
.statbar .slv{color:var(--gold);font-weight:700;letter-spacing:.08em;flex:none;text-shadow:0 1px 0 rgba(60,45,25,.35)}
.statbar .sgroup{display:inline-flex;align-items:center;gap:5px}
.statbar .sgroup i{font-style:normal;color:var(--dim);font-size:11.5px}
.statbar .sbar{width:clamp(46px,16vw,72px);height:9px;background:var(--bg3);border:1px solid var(--border);position:relative;overflow:hidden}
.statbar .sbar b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--danger),var(--gold));transition:width .3s}
.statbar .sbar.en b{background:linear-gradient(90deg,var(--neon),var(--cyber))}
.statbar .sgroup em{font-style:normal;font-size:11px;color:var(--ink2);min-width:54px}
/* ===== 配置中心 ===== */
.cfgtabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.cfgtabs button{font:inherit;font-size:12.5px;padding:5px 12px;background:var(--bg3);border:2px solid var(--border);color:var(--fg2);cursor:pointer}
.cfgtabs button.on{background:var(--bg2);border-color:var(--neon);color:var(--neon);box-shadow:0 2px 0 rgba(60,45,25,.16)}
.cfgpane{display:none}.cfgpane.on{display:block}
.npcfgcard{border:1px solid var(--border);padding:8px 10px;margin:6px 0;border-radius:4px;background:var(--bg2)}
.cfgrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.cfgrow label{font-size:12.5px;color:var(--dim);min-width:64px}
.cfgrow input[type=text],.cfgrow input[type=password],.cfgrow input[type=number],.cfgrow textarea,.cfgrow select{
  font:inherit;font-size:13.5px;background:var(--bg);border:1px solid var(--border-lit);color:var(--fg);padding:7px 9px;min-width:0;flex:1}
.cfgrow textarea{width:100%;min-height:64px;resize:vertical}
.cfgchips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.cfgchips button{font:inherit;font-size:11.5px;padding:3px 9px;background:var(--bg3);border:1px solid var(--border);color:var(--fg2);cursor:pointer}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0}
.avcell{border:2px solid var(--border);background:var(--bg2);padding:7px;text-align:center;font-size:11.5px}
.avcell .avbox{width:56px;height:56px;margin:0 auto 5px;border:1px solid var(--border-lit);background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center}
.avcell .avbox img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.avcell .avnm{color:var(--cyber);margin-bottom:3px}
/* v58：立绘上传后在配置格内即时可见（等比 contain，保全身构图） */
.avcell .ptbox{height:118px;margin:0 auto 4px;border:1px solid var(--border-lit);border-radius:6px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center}
.avcell .ptbox img{max-width:100%;max-height:100%;object-fit:contain}
.avcell button{font:inherit;font-size:10.5px;padding:3px 6px;margin:2px 1px 0;background:var(--bg3);border:1px solid var(--border);color:var(--fg2);cursor:pointer}
.avpreview{width:120px;height:120px;border:2px solid var(--border-lit);overflow:hidden;background:var(--bg3);position:relative}
.avpreview img{width:100%;height:100%;object-fit:cover}
.attrctl{display:flex;align-items:center;gap:8px;font-size:13.5px}
.attrctl button{font:inherit;width:30px;height:28px;background:var(--bg3);border:2px solid var(--border-lit);color:var(--neon);cursor:pointer;font-size:15px;line-height:1}
.attrctl b{display:inline-block;min-width:26px;text-align:center;color:var(--gold);font-size:15px}
.cfghist{font-size:11.5px;color:var(--dim);max-height:180px;overflow-y:auto;border:1px solid var(--border);background:var(--bg);padding:6px 9px;line-height:1.7}
.memcard{border:2px solid var(--border);background:var(--bg2);padding:9px 11px;margin:8px 0;font-size:12.5px;line-height:1.7}
.memcard b{color:var(--cyber)}
.memcard .mdig{color:var(--gold);font-size:12px;margin-top:4px;border-top:1px dashed var(--border);padding-top:4px}
.ad{font-size:12px;color:var(--dim)}

/* 任务面板（行者手札·任务卷） */
.loadmeter{margin:8px 0}
.loadmeter .lmrow{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg2);margin-bottom:3px}
.loadmeter .lmtrack{height:12px;background:var(--bg3);border:1px solid var(--border);position:relative}
.loadmeter .lmfill{height:100%;background:linear-gradient(90deg,var(--ok),var(--gold));transition:width .3s}
.loadmeter.heavy .lmfill{background:linear-gradient(90deg,var(--gold),var(--danger))}
.boardgroup{margin:14px 0}
.boardgroup>h3{font-size:14px;color:var(--cyber);margin:0 0 6px;letter-spacing:.1em;text-shadow:0 1px 0 rgba(60,45,25,.35);border-left:3px solid var(--neon);padding-left:8px}
/* v58c：本周任务·纪日分组 */
.gdgroup{border:1px solid var(--border);border-radius:6px;margin:8px 0;background:var(--bg2)}
.gdgroup.cur{border-color:var(--neon);box-shadow:0 0 10px rgba(185,138,63,.18)}
.gdgroup.done{opacity:.7}
.gdgroup.empty{opacity:.55;border-style:dashed}
.gdhead{display:flex;align-items:baseline;justify-content:space-between;padding:7px 10px;font-size:13px}
.gdgroup.cur .gdname{color:var(--neon);font-weight:600;letter-spacing:.08em}
.gdgroup .gdprog{font-size:11.5px;color:var(--gold)}
.gdgroup.empty .gdkind{font-size:11.5px;color:var(--dim)}
.gdgroup .qrow{margin:0;border-width:0;border-top:1px solid var(--border);background:transparent}
.qrow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg);padding:8px 10px;margin:6px 0;flex-wrap:wrap}
.qrow.done{opacity:.6;border-color:var(--border)}
.qrow.active{border-color:var(--neon);box-shadow:0 2px 0 rgba(60,45,25,.16)}
.qrow.locked{opacity:.5}
.qrow .qstage{font-size:11px;padding:2px 8px;border:1px solid var(--border-lit);white-space:nowrap}
.qrow.done .qstage{color:var(--ok);border-color:var(--ok)}
.qrow.active .qstage{color:var(--neon);border-color:var(--neon)}
.qrow.locked .qstage{color:var(--dim)}
.qrow .qinfo{flex:1;min-width:160px}
.qrow .qinfo .qn{font-size:13.5px;font-weight:600}
.qrow .qinfo .qmeta{font-size:11.5px;color:var(--dim);margin-top:2px}
.qrow .qrew{font-size:11.5px;color:var(--gold);white-space:nowrap}
.entrygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.entrybtn{border:2px solid var(--border-lit);background:var(--bg3);color:var(--fg);font:inherit;font-size:12.5px;padding:10px 8px;cursor:pointer;text-align:center;line-height:1.4}
.entrybtn:active{transform:translate(1px,1px)}
.entrybtn .ei{font-size:18px;display:block;margin-bottom:3px}

/* 打字复述区 */
.typezone{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.typezone textarea{width:100%;min-height:64px;border:2px solid var(--border);background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px;padding:8px 10px;resize:vertical}
.typezone textarea:focus{outline:none;border-color:var(--neon)}
.typecmp{font-size:13px;margin-top:6px;line-height:1.8}
.typecmp .hit{color:var(--ok);font-weight:600}
.typecmp .miss{color:var(--danger)}
.recbig{width:100%;margin-top:8px;padding:12px;font-size:15px;letter-spacing:.1em}

/* ===== 可折叠任务树 ===== */
.treetools{display:flex;gap:8px;justify-content:flex-end;margin:6px 0}
.tree{border:1px solid var(--border);background:var(--bg);max-height:320px;overflow-y:auto;padding:4px}
.tnode{user-select:none}
.trow{display:flex;align-items:center;gap:6px;padding:6px 6px;cursor:pointer;border-bottom:1px dashed var(--border);transition:background .15s}
.trow:hover{background:var(--bg2)}
.ttog{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--cyber);font-size:12px;border:1px solid var(--border);background:var(--bg3);transition:transform .2s}
.tnode[data-expanded="false"]>.trow .ttog{transform:rotate(0deg)}
.tnode[data-expanded="true"]>.trow .ttog .tcar{display:inline-block;transform:rotate(90deg)}
.tnode:not([data-has-children="true"]) .ttog{visibility:hidden}
.tchildren{margin-left:18px;border-left:2px dotted var(--border-lit);padding-left:6px}
.tnode[data-expanded="false"]>.tchildren{display:none}
.tnode[data-level="0"]>.trow{font-weight:600;color:var(--cyber);font-size:13.5px}
.tnode[data-level="1"]>.trow{color:var(--fg2);font-size:13px}
.tnode[data-level="2"]>.trow{color:var(--fg);font-size:12.5px}
.tdot{width:9px;height:9px;flex:none;border:2px solid var(--border)}
.trow.done .tdot{background:var(--ok);border-color:var(--ok)}
.trow.cur .tdot{background:var(--neon);border-color:var(--neon);box-shadow:0 0 5px var(--neon)}
.trow.locked .tdot{background:transparent}
.tlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.locked .tlabel{color:var(--dim)}
.tmeta{font-size:10.5px;color:var(--dim);flex:none}
.trow.leaf{cursor:pointer}
/* v53：休息日节点（游戏日·休息） */
.trow.rest .tdot{background:transparent;border-style:dotted}
.trow.rest .tlabel{color:var(--dim);font-style:italic}
.tnode[data-level="3"]>.trow{font-size:12px;color:var(--fg2)}

/* ===== 藏经阁卡片堆 ===== */
.carddeck{display:flex;flex-direction:column;align-items:center;margin:12px 0}
.cardstack{position:relative;width:100%;max-width:520px;height:320px;margin-bottom:10px}

(function(){

/* v49：注入 2026 考点数据库（586 条），替换 game-data.js 中的旧考点。
   来源：考点数据库-2026-修正版.json，经 build-review-file.py 修正（A/B/C/D 四组）。
   字段补全：star 默认 '3'，anchor_type 由 anchor 推断。 */
if(window.EXAM_2026_DATA && Array.isArray(EXAM_2026_DATA) && EXAM_2026_DATA.length){
  const _oldCnt=(D.pointsLib&&D.pointsLib.length)||0;
  /* v53：入库即清洗 markdown——62 条 anchor 形如 **"23 旅行部、27 中旅"**，
     游戏内无 markdown 渲染器，星号会直接污染书页展示与出题关键词提取 */
  const _stripMd=s=>String(s==null?"":s).replace(/\*{1,3}/g,"").replace(/`+/g,"").replace(/^#{1,6}\s*/gm,"").replace(/[ \t]+/g," ").trim();
  /* v56：批注剥离——text 中嵌的备课批注（本条常考/本条考察/常考…/记忆锚：…）属 L2 备课层，
     禁止进入书页展示与出题（此前仅出题侧 ptKeySentence 过滤）；text 内嵌「记忆锚：X」迁回 anchor 字段 */
  const _META_SENT=/^(?:本条|此条|记忆锚|常考|考点|备考|考纲|出题|考察|考查|高频|易错|答题)/;
  function _stripMeta(s){
    const anchors=[];
    let t=_stripMd(s);
    t=t.replace(/记忆锚[:：][^。；]*/g,m=>{anchors.push(m.replace(/^记忆锚[:：]/,""));return "";});
    /* 句中批注引导词（如「……教材，本条常考篇目归属：」）只删引导字，保留其后考点内容 */
    t=t.replace(/本条(?:常考|考察|考查)/g,"");
    t=t.split(/(?<=[。！？；])/).map(x=>x.trim()).filter(x=>x&&!_META_SENT.test(x)).join("").trim();
    t=t.replace(/[，、；]\s*$/,"").replace(/。{2,}/g,"。");
    return {t,anchors};
  }
  D.pointsLib=EXAM_2026_DATA.map(d=>{
    const _tx=_stripMeta(d.text||"");
    let _anchor=_stripMd(d.anchor||"");
    if(!_anchor&&_tx.anchors.length) _anchor=_tx.anchors.join("；");
    return {
    id:d.id, title:_stripMd(d.title||""), subject:d.subject||"", module:_stripMd(d.module||""),
    text:_tx.t, anchor:_anchor, context:_stripMeta(d.context||"").t,
    source:d.source||"", status:d.status||"✅",
    exam_tip:_stripMd(d.exam_tip||""), origin:d.origin||"",
    version:d.version||"2026-r3", collected:d.collected||"",
    star:d.star||"3", anchor_type:d.anchor_type||(d.anchor?"manual":""),
  };
  });
  console.log("[v49] 考点数据库已替换为 2026 修正版:", D.pointsLib.length, "条 (旧:", _oldCnt, "条)");
}

/* —— 2. 三套时钟：游戏日(1-225) / 雾涌日(45→1 倒计时) / 自然日 —— */
/* v50：1 现实自然日 = 1 自然日推进（DAYS 按自然日组织）；次元内游戏日 = 自然日×5 */
function ensureClocks(){
  /* v49：st.day 为 undefined/0/NaN 时强制初始化为 1，防止 stageOfDay 返回错误 */
  if(!st.day||isNaN(st.day)||st.day<1) st.day=1;
  if(st.day>45) st.day=45;
  if(!st.lastNaturalDay) st.lastNaturalDay=new Date().toISOString().slice(0,10);
  if(st.fogDay==null||isNaN(st.fogDay)) st.fogDay=45;
  /* v50：游戏日（次元内日）= (自然日-1)×5 + 1，上限 225；叙事层 1自然日=5游戏日 */
  st.gameDay=((st.day-1)*5)+1;
  try{ console.log("[v50] clocks:",{naturalDay:st.day,gameDay:st.gameDay,fog:st.fogDay,stage:stageOfDay(st.day).name}); }catch(e){}
}
function advanceNaturalDay(){
  /* v50：每过 1 个现实自然日，游戏自然日 +1（DAYS 按自然日组织任务），雾涌日 -1（最低 1），恢复心气/灵力 */
  const today=new Date().toISOString().slice(0,10);
  ensureClocks();
  if(today===st.lastNaturalDay) return 0;
  const elapsed=Math.max(1, Math.round((new Date(today)-new Date(st.lastNaturalDay))/86400000));
  /* v50 修正：1 现实日 = 1 自然日推进（旧版错误地 +5 导致跳过任务） */
  const natAdv=elapsed;
  const oldDay=st.day||1;
  st.day=Math.min(45, oldDay+natAdv);
  st.fogDay=Math.max(1, (st.fogDay||45)-natAdv);
  /* v58c：跨自然日后按完成度对齐当前纪日，不再恒置周一 */
  syncGameDay();
  /* v53 修复：离线推进自然日时，同步推进任务解锁自然日——现实时间已流逝，
     玩家不能再被"未做前置任务"锁死在昨天，任务链应解锁到当前自然日 */
  if((st.unlocked||1) < st.day) st.unlocked=st.day;
  /* 离线恢复：心气+30%、灵力全额恢复 */
  const hpCap=maxHP(); st.hp=Math.min(hpCap,(st.hp||0)+Math.round(hpCap*0.3*elapsed));
  const enCap=maxEnergy(); st.energy=enCap;
  st.lastNaturalDay=today;
  /* v52 R2：自然日奖励剧情点——每推进 1 个现实自然日额外 +1（按日期幂等发放 elapsed 个） */
  try{
    for(let i=0;i<elapsed;i++){
      const d=new Date(new Date(st.lastNaturalDay).getTime()-((elapsed-1-i)*86400000));
      addPlotPoints("naturalDay", d.toISOString().slice(0,10));
    }
  }catch(e){}
  /* v58c：推进到新的一周后，补发当前纪日手札开场（更早纪日静默回填） */
  try{ ensureGdMilestone(st.day); }catch(e){}
  /* v55 批3-⑦⑧：跨阶段时触发 R1 群聊指导与传译出题（异步，不阻塞） */
  try{ r1StageTrigger(oldDay, st.day); }catch(e){}
  save();
  return elapsed;
}

function plotTriggered(day){ return !!(st.plotDone&&st.plotDone[day]); }
/* v52 R2：剧情点累积机制（双奖励）
   - 游戏日点（byDay）：完成当日指定任务（当日任务全清）→ +1，主线剧情以此触发
   - 自然日奖励点（byNaturalDay）：每推进 1 个现实自然日 → 额外 +1，用于 REWARD_ITEMS 联动解锁
   - st.plotPoints.total = 两类点数之和（累积值，只增不减）
   幂等：同一天/同一自然日重复调用不重复发放。 */
function addPlotPoints(src, day){
  st.plotPoints=st.plotPoints||{total:0,byDay:{},byNaturalDay:{},triggered:{}};
  const pp=st.plotPoints;
  if(src==="gameDay"){
    const d=+day||(st.day||1);
    if(pp.byDay[d]) return 0;
    pp.byDay[d]=new Date().toISOString();
    pp.total=(pp.total||0)+1;
    return 1;
  }
  if(src==="naturalDay"){
    const key=day||new Date().toISOString().slice(0,10);
    if(pp.byNaturalDay[key]) return 0;
    pp.byNaturalDay[key]=new Date().toISOString();
    pp.total=(pp.total||0)+1;
    return 1;
  }
  return 0;
}
/* 当日指定任务是否已全清（游戏日点发放条件） */
function dayQuestsAllDone(day){
  const d=byDay[day]; if(!d) return false;
  const qs=d.quests||[]; if(!qs.length) return false;
  return qs.every(q=>qDone(q.id));
}
function checkPlotTrigger(){
  /* v52 R2：触发条件改为剧情点驱动——
     当日任务全清 → addPlotPoints("gameDay") → 当日游戏日点到账 → 触发当日主线剧情；
     自然日奖励点不提前触发主线（防止纯登录跳过剧情），仅联动 REWARD_ITEMS。 */
  const day=st.day||1;
  if(plotTriggered(day)) return null;
  if(!PLOT_THEMES[day]) return null;
  /* 结算时补发当日游戏日点（幂等） */
  if(dayQuestsAllDone(day)) addPlotPoints("gameDay", day);
  const pp=st.plotPoints||(st.plotPoints={total:0,byDay:{},byNaturalDay:{},triggered:{}});
  if(pp.byDay[day]){
    st.plotDone=st.plotDone||{};
    st.plotDone[day]=new Date().toISOString();
    pp.triggered[day]=new Date().toISOString();
    save();
    return PLOT_THEMES[day]||null;
  }
  return null;
}

  if(!s||typeof s!=="string") return s;

  for(const [from,to] of NPC_TEXT_REMAP){
    if(to) r=r.split(from).join(to);
  }
  for(const [from,to] of STYLE_BLACKLIST){

  if(!s||typeof s!=="string") return [];

  for(const [from] of STYLE_BLACKLIST){
    if(s.indexOf(from)>=0) hits.push(from);
  }
  for(const [re] of STYLE_REGEX){
    re.lastIndex=0;
    if(re.test(s)) hits.push(String(re));
    re.lastIndex=0;
  }
  return hits;
}

  chat.deRepeat = function(npcId,text){

    if(!mine.length) return text;
    const last=mine[mine.length-1]||"";
    if(last&&text.slice(0,4)===last.slice(0,4)){
      const lead={
        yunting:["……","嗯？","哦——"],
        shenzhao:["……","等。","续上。"],
        chengxiu:["嚯，","哟，","嗯——"],
        tina:["叮——","……","唔。"],
        wantang:["哈哈，","嘿，","哎——"]
      };
      const pool=lead[npcId]||lead.yunting;
      return pool[hash(text)%pool.length]+text;
    }
    if(mine.length>=2){
      const tail1=mine[mine.length-1].slice(-12), tail2=text.slice(-12);
      const inv=/愿不愿|能不能|想不想|陪我|与我同行/;

        return text.replace(/[，,。]?(愿不愿|能不能|想不想)[^。！？]*[？?]$/,"。")+ "这一程，我等你。";

  /* 3) directorPlan —— 群聊导演提示词 → 四十五日；任务类型元标签 → 咒纹拓印 */
  chat.directorPlan=async function(userText,opts){
    const CTX=CTX_REF();
    opts=opts||{};
    if(!CTX||!CTX.dsReady()) return null;
    const {NPC}=CTX;
    const targets=opts.targets||[];
    const kind=opts.kind||"chat";
    const ck=this._cacheKey(userText,opts);
    const cached=this._dPlanCache.get(ck);
    if(cached&&(Date.now()-cached.at)<60000) return cached.plan;
    const cards=Object.keys(NPC).map(id=>{
      const npc=NPC[id]; if(!npc) return null;
      const name=(window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,npc.name):npc.name;
      const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;
      const arc=(window.WDRegistry&&WDRegistry.arcSeedOf)?WDRegistry.arcSeedOf(id):null;
      return {id,name,role:npc.role||"",
        cadence:v?v.cadence:"",
        goal:arc?arc.goal:""};
    }).filter(Boolean);
    const scene=this.recentScene?this.recentScene(10):[];
    const userDoc=(window.WDCfg&&WDCfg.directorDoc)?WDCfg.directorDoc():"";
    let sys=userDoc&&userDoc.trim()
      ?userDoc.trim()
      :("你是日式RPG《问道之旅·四十五日》的群聊导演。看完下面的信息，决定接下来哪些NPC该开口、按什么顺序、用什么反应类型。\n"
        +"【反应类型】respond(正常接话) / interject(插话，多为半句或语气词) / react(对他人的反应) / guide(把话题轻拽回正事，但不许生硬)。\n"
        +"【活人感·铁律】"
        +"1）NPC首先是有自己生活的居民，不是任务派发器或报告器——她们可以聊自己正在做的事、想起的事、对眼前场景的感想，不必每次都和任务相关；"
        +"2）反应必须多样：有人接话、有人吐槽、有人只给一个语气词、有人冷淡、有人听错重点、有人接别人的话茬、有人突然想起别的事；"
        +"3）禁止让NPC轮流报告进度、轮流说鼓励话、轮流报数值——几个人不能说几个意思相近的句子；"
        +"4）hint是给NPC这一句的方向（≤20字），不是替她写台词，不要写「请说……」「你要表达……」这种指令；"
        +"5）通常1-2人开口，极少超过3人。被@的人通常必回应；未被@的人只在她的性格确实会被勾起时插话。\n"
        +"【任务完成场景特别注意】不要让NPC说「XX已交付」「任务完成」这种报告式台词——那是系统该干的事。NPC的第一反应应该像队友看到同伴刚干完活：也许随口夸一句、也许吐槽选这关太折腾、也许接别人的话茬、也许什么都不说只应一声、也许突然想起自己有别的事要忙。");
    if(kind==="questreact"&&!(userDoc&&userDoc.trim())){
      sys+="任务NPC的反应尤其要活人：刚见证了队友通关，她第一反应不是「已交付」——可能是「嚯，这一关居然真被你闯过来了。」「行吧，算是过了。」「……你手怎么脏的？」这种。";
    }
    sys+="\n"+this.masterRule();
    sys+="\n只输出JSON。";
    let user="在场角色与各自说话方式：\n"+cards.map(c=>JSON.stringify(c)).join("\n")
      +"\n\n近期群聊（供互文，不要重复其中说法）：\n"+(scene.map(s=>s.who+"："+s.text).join("\n")||"（无）")
      +"\n\n玩家刚发："+userText
      +"\n\n输出JSON：{\"plan\":[{\"npc\":\"id\",\"type\":\"respond\",\"hint\":\"这一句的方向≤20字\"}]}";
    if(kind==="questreact"&&opts.quest){
      const q=opts.quest;
      const meta=(q.type==="gear"?"法器整备 · 晨雾初整":
        q.type==="study"?"秘境探幽 · 雾径开荒":
        q.type==="review"?"雾回潮 · 旧秘回望":
        q.type==="drill"?"谜题净化 · 试炼雾巢":
        q.type==="oral"?"咒祷辞吟诵 · 镇城大咒":
        q.type==="boss"?"攻城之战 · 守关大阵":
        q.type==="clue"?"咒纹拓印 · 结界拓片":
        q.type==="flash"?"夜巡驱雾":
        q.type==="reward"?"雾散赏至":"初程");
      user+="\n\n【任务完成场景补充】刚完成的关卡是「"+(this.questDisplayName(q)||"")+"」——这是原始关卡名（教育/考试术语），绝对不要让NPC说这个名字。它在世界里的游戏化类型是："+meta+"。";
    }
    if(targets.length){
      user+="\n被@的角色："+targets.map(id=>NPC[id]?((window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,NPC[id].name):NPC[id].name):id).join("、")+"——这些人通常必回应。";
    }
    try{
      const raw=await CTX.dsChat([{role:"system",content:sys},{role:"user",content:user}],{kind:"directorplan"});
      let o;
      try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
      catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(!m) return null; o=JSON.parse(m[0]); }
      const seen=new Set();
      const plan=(o.plan||[]).filter(p=>p&&p.npc&&NPC[p.npc]&&!seen.has(p.npc)&&seen.add(p.npc))
        .slice(0,4)
        .map(p=>({npc:p.npc,type:p.type||"respond",hint:String(p.hint||"").slice(0,40)}));
      if(!plan.length) return null;
      const result={plan};
      this._dPlanCache.set(ck,{plan:result,at:Date.now()});
      return result;
    }catch(e){ return null; }
  };

  /* 4) directorRespond —— 全员群聊单次生成提示词 → 四十五日 */
  chat.directorRespond=async function(targetIds,userText){
    const CTX=CTX_REF();
    if(!CTX||!CTX.dsReady()||!targetIds||targetIds.length<2) return null;
    const {NPC}=CTX;
    try{
      const scene=this.recentScene(10);
      const cards=targetIds.map(id=>{
        const npc=NPC[id]; if(!npc) return null;
        const name=(window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,npc.name):npc.name;
        const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;
        const persona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(id):"";
        /* v55：群聊导演卡补注入 WDTerms 专属约束——群聊回复此前不做人设约束，是「人设部分生效」根因 */
        const pc=personaTermOf(id);
        return {id,姓名:name,
          说话方式:v?{节奏:v.cadence,手法:(v.moves||[]).slice(0,2),示例:(v.samples||[]).slice(0,2),禁忌:(v.avoid||[]).slice(0,2)}
                   :(persona||npc.intro||""),
          专属约束:pc?{灵魂领域:pc.soulField,口吻:pc.voice,禁令:pc.forbidden,锚点:pc.distinguish}:undefined};
      }).filter(Boolean);
      if(!cards.length) return null;
      const sys="你是日式RPG《问道之旅·四十五日》的群聊导演。一群早就认识彼此的角色，在同一个群聊里看到玩家的同一条消息，各自留下反应。"
        +"铁律："
        +"1）每个人只说她这个人才会说的话——反应类型必须错开：有人接话、有人吐槽、有人只给一个语气词、有人冷淡、有人听错重点或答非所问、有人顺着别人的话补刀、有人把话题拽回正事；"
        +"2）严禁所有人表达同一个意思（尤其禁止轮流鼓励/安慰/说'不要气馁'/'相信自己'），也严禁每个人都把话说完整；"
        +"3）长度2～50字，越短越好，允许只有一两个字、半句、犹豫改口；玩家说的是现实见闻时，先当八卦接，不许翻译成剧情或任务；"
        +"4）允许角色之间互相接茬、拆台、偷笑、无奈，体现她们彼此的关系；玩家是群里一员，不是宇宙中心；"
        +"5）遵守各自语言人格卡的节奏与禁忌；禁老师腔/客服腔/心理医生腔/AI腔/命令句/表面卖萌口癖；不要为了显得有性格而集体表演性格，平淡应一声也允许；"
        +"6）"+this.masterRule()
        +"7）只输出JSON。";
      const user="在场角色与各自说话方式：\n"+cards.map(c=>JSON.stringify(c)).join("\n")
        +"\n\n近期群聊（供互文，不要重复其中说法）：\n"+(scene.map(s=>s.who+"："+s.text).join("\n")||"（无）")
        +"\n\n玩家刚发："+userText
        +"\n\n输出JSON：{\"lines\":["+cards.map(c=>"{npc:\""+c.id+"\",text:\"她的反应，2～50字，允许极短或不完整\"}").join(",")+"]}。每人一条，像同一个真实群里前后脚冒出来的消息，而不是几份问卷答案。";
      const raw=await CTX.dsChat([{role:"system",content:sys},{role:"user",content:user}],{kind:"director"});
      let o;
      try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
      catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(!m) throw e; o=JSON.parse(m[0]); }
      const seen=new Set();
      const lines=(o.lines||[]).filter(l=>l&&l.npc&&l.text&&NPC[l.npc]&&!seen.has(l.npc)&&seen.add(l.npc))
        .slice(0,cards.length)
        .map(l=>({npc:l.npc,text:String(l.text).slice(0,80)}));
      if(lines.length<2) return null;
      try{
        const audit=await this.directorAudit(lines,{kind:"directorRespond"});
        if(!audit.pass&&audit.revised&&Array.isArray(audit.revised)){
          const rev=audit.revised.filter(x=>x&&x.npc&&x.text).slice(0,lines.length);
          if(rev.length>=Math.ceil(lines.length/2)){
            lines.length=0;
            rev.forEach(r=>lines.push({npc:r.npc,text:r.text.slice(0,80)}));
          }else{
            rev.forEach(r=>{ const idx=lines.findIndex(x=>x.npc===r.npc); if(idx>=0) lines[idx].text=r.text.slice(0,80); });
          }
        }
      }catch(e){ /* 审核失败不阻断 */ }
      lines.forEach(l=>{ this.bumpTalk(l.npc); this.maybeSummarize(l.npc); });
      return lines;
    }catch(e){ return null; }
  };

  /* 5) directorAudit —— 审核提示词 → 四十五日；圣女恢复分母 45→49 */
  chat.directorAudit=async function(text,context){
    const CTX=CTX_REF();
    if(!CTX||!CTX.dsReady()) return {pass:true,issues:[],revised:text};
    context=context||{};
    const st=CTX.getSt();
    const worldBrief=(typeof context.worldBrief==="string"&&context.worldBrief.trim())
      ?context.worldBrief
      :(this.worldBrief?this.worldBrief():"");
    const npcCards=[];
    if(context.npcId){
      const id=context.npcId;
      const npc=CTX.NPC&&CTX.NPC[id];
      const arc=(window.WDRegistry&&WDRegistry.arcSeedOf)?WDRegistry.arcSeedOf(id):null;
      const v=(window.WDRegistry&&WDRegistry.voiceOf)?WDRegistry.voiceOf(id):null;
      const persona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(id):"";
      /* v55：审核卡补注入 WDTerms 专属约束（口吻/禁令），与群聊导演同通道 */
      const pc=personaTermOf(id);
      npcCards.push({id,name:npc?(window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,npc.name):npc.name:id,
        role:npc?npc.role:"",arcSeed:arc||null,voice:v?{cadence:v.cadence,avoid:v.avoid}:null,
        persona:persona||"",
        专属约束:pc?{口吻:pc.voice,禁令:pc.forbidden}:undefined});
    }
    const kind=context.kind||"dialogue";
    const inputType=typeof text;
    const textForAi=inputType==="object"&&text!==null
      ?JSON.stringify(text).slice(0,1500)
      :String(text).slice(0,1500);
    const sys="你是日式RPG《问道之旅·四十五日》的剧本导演。你要审核下面这段 AI 生成的文本，判断它是否合理。\n"
      +"审核四维度：\n"
      +"1. 世界观设定：术语/力量体系/人物关系/势力阵营是否正确、是否与世界观冲突；\n"
      +"2. 事理逻辑：角色行为反应是否合理、因果是否通顺、有没有常识性违和；\n"
      +"3. 当下情境：是否符合当前任务/场景/对话氛围、有没有答非所问或跑题；\n"
      +"4. 人物弧光：说话方式/态度是否符合该角色的性格+当前故事进度（第"+(st.day||1)+"日·幕"+(Math.min(5,Math.floor(((st.day||1)-1)/9)+1))+"）下应有的态度变化。\n"
      +"铁律：\n"
      +"- 能 pass 就 pass，不要吹毛求疵；只改真正有问题的；\n"
      +"- revised 字段直接给出修改后的完整文本（如果 pass=true，revised 与 input 相同）；\n"
      +"- 禁止词/禁止角色（提灯/引魂灯/封妖塔等）属于硬禁，命中必 pass=false；\n"
      +"- 轻小说风格要求不要改成说明书或 AI 腔；\n"
      +"- "+this.masterRule()+"\n"
      +"- 只输出 JSON。";
    let user="当前进度：第"+(st.day||1)+"周 · 第"+(stageOfDay(st.day||1).name)+"阶段 · 圣女恢复约 "+Math.min(100,Math.floor(((st.day||1)/45)*100)+5)+"%";
    if(context.quest) user+="\n当前任务："+(context.quest.name||"")+"（"+(context.quest.tlabel||"")+"）";
    if(npcCards.length) user+="\n涉及NPC："+npcCards.map(c=>JSON.stringify(c)).join("\n");
    if(worldBrief) user+="\n世界观参考（供对照，不要复述）："+(typeof worldBrief==="string"?worldBrief.slice(0,400):JSON.stringify(worldBrief).slice(0,400));
    user+="\n\n待审核文本（类型："+kind+"）：\n"+textForAi
      +"\n\n审核标准：pass=true 或 false。若 false，issues 列出问题，revised 给出修正版。"
      +"\n\n输出JSON：{\"pass\":true/false,\"issues\":[\"问题简述，≤30字\"],\"revised\":\"修正后的完整文本（pass=true 时与 input 相同）\"}。";
    try{
      const raw=await CTX.dsChat([{role:"system",content:sys},{role:"user",content:user}],{kind:"directorplan"});
      let o;
      try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
      catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(!m) return {pass:true,issues:[],revised:text}; o=JSON.parse(m[0]); }
      const pass=o.pass!==false;
      const issues=(o.issues||[]).map(s=>String(s).slice(0,40)).slice(0,5);
      let revised=pass?text:o.revised;
      if(pass) return {pass:true,issues:[],revised:text};
      if(inputType==="object"&&revised){
        if(typeof revised==="string"){
          try{ const parsed=JSON.parse(revised.replace(/^```json|```$/g,"").trim()); revised=parsed; }catch(e){ revised=text; }
        }
        if(revised&&typeof revised==="object"){
          if(text&&text.v) revised.v=text.v;
          if(text&&text.at) revised.at=text.at;
        }
      }else if(typeof revised==="string"){
        revised=revised.slice(0,inputType==="string"?(String(text).length+200):2000);
      }
      return {pass:false,issues,revised:revised||text};
    }catch(e){
      return {pass:true,issues:[],revised:text};
    }
  };

  /* 6) checkProactive —— 主动消息归属新 id（yunheng→yunting / xuanji→tina / 任务NPC remap） */
  chat.checkProactive=function(){
    const CTX=CTX_REF(); if(!CTX) return null;
    const st=CTX.getSt();
    st.proactiveLog=st.proactiveLog||{};
    const today=new Date().toISOString().slice(0,10);
    const todayCount=Object.keys(st.proactiveLog).filter(k=>st.proactiveLog[k]===today).length;
    if(todayCount>=3) return null;
    const flags=(st.agentFlags=st.agentFlags||{director:true,tools:true,proactive:true});
    if(!flags.proactive) return null;
    /* 规则 1：连续 2 天未复习（lastStudy 距今 >48h）→ 云汀晨间问候 */
    const lastStudy=st.lastStudyAt?new Date(st.lastStudyAt).getTime():0;
    if(lastStudy&&Date.now()-lastStudy>48*36e5){
      const key="nostudy_"+today;
      if(!st.proactiveLog[key]){
        st.proactiveLog[key]=today; CTX.save();
        return {npc:"yunting",reason:"nostudy",text:"两日没见你的脚印了——雾可不等人。今日可得空走一遭？"};
      }
    }
    /* 规则 2：错题 >10 → 缇娜 */
    if(window.WDMem&&window.WDMem.stats){
      let wrongs=0;
      try{
        const stats=window.WDMem.stats();
        Object.keys(stats.byNpc||{}).forEach(id=>{
          const w=stats.byNpc[id].wrongs||{};

        }

    }
    /* 规则 3：关卡滞留 2 天 → 接洽 NPC 委婉催办 */
    const aq=CTX.quest&&CTX.quest();

const KEY = "wendao_v2_save";
/* v54 批 2：旧存档自动继承——检测 localStorage 中所有 wendao 前缀的旧存档，
   按最后修改时间取最新一份，经 reconcile 迁移后写入当前 KEY 并清除旧键。
   解决玩家从旧版本（无 key 版本）升级后进度丢失的问题。 */
function migrateLegacySaves(){
  const LEGACY_PREFIXES=["wendao_v2_save","wendao_save","wdzx_save","wendao_v1","wendao_v0"];
  let best=null, bestKey=null, bestTime=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!LEGACY_PREFIXES.some(p=>k.startsWith(p))||k===KEY) continue;
    try{
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const o=JSON.parse(raw);
      if(!o||typeof o!=="object"||!o.player) continue;
      const t=o.lastAt||o.created||o._ts||0;
      const ts=typeof t==="string"?new Date(t).getTime():t;
      if(ts>bestTime){ bestTime=ts; best=o; bestKey=k; }
    }catch(e){}
  }
  if(!best) return false;
  /* 写入当前 KEY 并清除旧键（保留 wd-zx 前缀的独立键如 dskey/mem 等） */
  st=best;
  reconcile();
  save();
  try{ localStorage.removeItem(bestKey); }catch(e){}
  console.log("[v54] 旧存档继承完成："+bestKey+" → "+KEY+"（最后活动 "+new Date(bestTime).toLocaleDateString()+"）");
  return true;
}

  /* v2：密钥已迁出存档（WZ-017）；旧存档导入时已在导入处剔除 */

const qDone=id=>!!st.done[id];
function dayProg(d){ let n=0; d.quests.forEach(q=>{if(qDone(q.id))n++;}); return {n,all:d.quests.length}; }
/* ==================== v58c：纪日（游戏日）工具层 ====================
   时间模型：1 自然日（界面的「第X周」）= 5 纪日 = 周一~周五；
   周一/二/三正修、周四轻修（多为空）、周五验界。任务以纪日为单位分配。 */
const GD_LABELS=["周一","周二","周三","周四","周五"];
function gdAbs(day,gi){ return (day-1)*5+gi+1; }          /* 纪日绝对编号 1~225 */
function gdKind(day,gi){
  const d=byDay[day]; const g=d&&d.gameDays&&d.gameDays[gi];
  return g?g.kind:(gi<=2?"study":"rest");
}
/* 某纪日任务：优先 d.gameDays 回填的 id 表（含 BOSS/GB），缺数据时按 q.gd/id 前缀兜底 */
function gdQuests(day,gi){
  const d=byDay[day]; if(!d) return [];
  const g=d.gameDays&&d.gameDays[gi];
  let ids=(g&&Array.isArray(g.quests))?g.quests.slice():null;
  if(!ids){
    const gd=gdAbs(day,gi), pre="R"+day+"-"+gi+"-";
    ids=(d.quests||[]).filter(q=>(q.gd===gd)||(typeof q.id==="string"&&q.id.indexOf(pre)===0)).map(q=>q.id);
  }
  return ids.map(id=>QMAP[id]).filter(Boolean);
}
function gdProg(day,gi){ const qs=gdQuests(day,gi); let n=0; qs.forEach(q=>{if(qDone(q.id))n++;}); return {n,all:qs.length,quests:qs}; }
function gdAllDone(day,gi){ const p=gdProg(day,gi); return p.all>0&&p.n===p.all; }
/* 本周当前纪日：第一个「有任务且未全清」的 gi；全周完成返回 null（空周四自动跳过） */
function curGiOfDay(day){
  const d=byDay[day]; if(!d) return null;
  for(let gi=0;gi<5;gi++){ const p=gdProg(day,gi); if(p.all>0&&p.n<p.all) return gi; }
  return null;
}
/* 当前应处于的纪日绝对编号（HUD 用）；本周全清则停在周五 gd */
function curGameDay(day){
  day=day||st.day||1;
  const gi=curGiOfDay(day);
  return gi==null?day*5:gdAbs(day,gi);
}
function syncGameDay(saveNow){
  const g=curGameDay(st.day||1);
  if(st.gameDay!==g){ st.gameDay=g; if(saveNow) save(); }
  return g;
}

/* v53：本地配比算法——把 784 卡按学习性质分配到当日各游戏日。

   口径：笔试类(考点+线索)轻量、背诵类(吟游)重量；30 自然日学完第一遍。 */
function buildDailyPlan(day){

  for(const g of (d.gameDays||[])){

      :"休息日 · 可约会 / 回访 / 自愿学";

}

function buildStream(){
  const out=[];

    const d=byDay[day]; if(!d) continue;
    const prog=dayProg(d);
    const hasUndone=d.quests.some(q=>!qDone(q.id));
    out.push({t:"sysday",x:`次元内 第 ${d.day} 周（纪日 ${(d.day-1)*5+1}~${(d.day-1)*5+5}）· ${(function(){try{return stageOfDay(d.day).name}catch(e){return ""}})()}阶段`});
    /* v52 R6e：当日吟游学习安排（仅当前自然日显示，整合入每日任务流） */
    if(day===(st.day||1)){
      try{ out.push({t:"sys",x:"🎙️ 本周吟游："+oralPlanOf(day).label}); }catch(e){}
      try{ const gi=curGiOfDay(day); const est=gi==null?0:rtGdEstimate(day,gi);
        if(est>0) out.push({t:"sys",x:"⏳ "+(gi!=null?GD_LABELS[gi]+"预估约 ":"本周剩余约 ")+est+" 分钟——量力而行，随时可歇。"});
      }catch(e){}
    }
    if(hasUndone) out.push({t:"npc",npc:d.npc,x:d.line});
    /* v58c：任务以纪日为单位发放——每周只在对话流放「当前纪日」一张索引卡，
       卡内逐任务点选进入、进度实时更新；不再一次性铺开当周 18 张卡。 */
    if(day===(st.day||1)){
      const gi=curGiOfDay(day);
      if(gi!=null){
        const gd=gdAbs(day,gi);
        if(st.gdIssued&&st.gdIssued[gd]){
          genGdCue(day,gi); /* 仅当前纪日单点预热（幂等） */
          out.push({t:"qindex",day,gi});
        }
      }
    }
    /* 已完成任务保留可折叠回执行（回看入口）；未完成任务不再逐条上信息流 */
    d.quests.forEach(q=>{
      if(qDone(q.id)) out.push({t:"sys",x:`✓ ${q.name} 已完成 · +${q.xp}修行 +${q.coin}灵铢`,qid:q.id});
    });
    if(prog.n===prog.all&&prog.all>0){
      out.push({t:"sys",x:`次元内第 ${d.day} 周修行圆满（${prog.all}/${prog.all}）`});
      if(day===45) out.push({t:"npc",npc:"yunting",x:"四十五日，功德圆满。金榜台上，我为你备了一盏灯。"});
    } else if(prog.n<prog.all&&day<st.unlocked){
      out.push({t:"sys",x:`此日尚有 ${prog.all-prog.n} 项未竟——随时可补`});
    }
  }
  const t=totals();
  if(t.c===t.a&&t.a>0) out.push({t:"sys",x:`全程圆满（${t.a}/${t.a}）· 导游试炼功德圆满`});
  /* v52 R1：路径覆盖——所有 buildStream 输出文本统一过风格黑名单 */
  for(const r of out){ if(r.x&&typeof r.x==="string") r.x=filterNpcText(r.x); }
  return out;
}

const CUE_V=5;

function cueRedFlags(t,npcDispName,recent){
  const s=String(t==null?"":t).trim();
  if(!s) return ["空台词"];
  const f=[];
  if(s.length>90) f.push("超长("+s.length+"字)");
  const clauses=s.split(/[，。；！？、…—~～\s]+/).filter(Boolean);
  const cmdClause=clauses.some(c=>/^(别|不要|不准|不许|可别|莫(?!非|如|不)|赶紧|立刻|马上给)/.test(c)||/^快(点|些|去)/.test(c));
  if(cmdClause) f.push("命令/催促分句");
  if(/你把/.test(s)) f.push("把字命令句");
  if(/你得|你给我|你去(?!年)/.test(s)) f.push("指令式你字句");
  /* 讲条件交换只在与命令共现时判负——「你在，我就安心」这类倾诉不拦 */
  if((cmdClause||/你把|你得|你给我|你去(?!年)/.test(s))&&/我就/.test(s)) f.push("命令式讲条件(你做X我就Y)");
  if(/得你自己|你自己来|靠你自己|自己的路|脚.{0,3}你自己|路[^。！？]{0,8}指了/.test(s)) f.push("说教/责任转嫁");
  if(npcDispName&&npcDispName.length>=2&&s.indexOf(npcDispName)>=0) f.push("第三人称自呼姓名");
  if(/考试|考生|老师|教材|知识点|没过|考核|复习|章节|课程|真题|题库/.test(s)) f.push("现实考试词入L1");
  if(/\d+\s*(件|分钟|题|页|个|条|次|%)|共[\s\d一二三四五六七八九十两]+件/.test(s)) f.push("数量/时间播报");
  /* 生猛撕咬动词：「咬进骨缝」这类漏网复合词（叮咬/咬牙/咬唇/咬紧是合法用法） */
  if(/咬(?![叮牙紧唇])/.test(s)) f.push("生猛动词「咬」");
  /* 跨稿去重：同一 NPC 同日多条 cue 不许共享开头/请求框架/收尾词 */
  const arr=(Array.isArray(recent)?recent:[]).map(x=>String(x||""));
  if(arr.length){
    if(arr.some(x=>x.slice(0,4)&&x.slice(0,4)===s.slice(0,4))) f.push("开头与近期开场雷同");
    if(/能陪我/.test(s)&&arr.some(x=>/能陪我/.test(x))) f.push("「能陪我…」请求框架重复");
    /* 收尾情绪词去重（安心/踏实/稳，兼容「踏实些/稳得住」等变体） */
    const tailMark=x=>{ const m=String(x).replace(/[。！？!?…，、~～」』"\s]+$/,"").match(/(安心[些一点]?|踏实[些一点]?|稳[得住些一]?)$/); return m?m[1][0]:null; };
    const mark=tailMark(s);
    if(mark&&arr.some(x=>tailMark(x)===mark)) f.push("收尾情绪词与近期重复(「"+mark+"」)");
  }
  const bl=(window.scanStyleBlacklist&&window.scanStyleBlacklist(s))||[];
  if(bl.length) f.push("风格禁词:"+bl.slice(0,3).join("/"));
  return f;
}
function buildQuestCue(q,d){

  const stage=stageOfDay(curDay);

  const remain=Math.max(0,(prog.all||0)-(prog.n||0));
  const qs=(d&&d.quests)||[];
  const totalMin=qs.reduce((s,x)=>s+(x.dur||0),0);
  const cats=dayCatCount(d);
  const catBrief=Object.entries(cats).map(([k,n])=>k+" "+n+"件").join("、");
  /* 下一任务：优先当日已解锁未完成者，再预告当日未完成者 */
  let nextQ=null;
  if(d){
    nextQ=(d.quests||[]).find(qq=>qq.id!==q.id&&!qDone(qq.id)&&questUnlocked(qq))
      ||(d.quests||[]).find(qq=>!qDone(qq.id)&&qq.id!==q.id);
  }
  const nextDigest=nextQ?questDigest(nextQ):null;
  /* 当前任务内容摘要（维度：条目数 + 模块） */
  const curDigest=questDigest(q);
  const curMods=curDigest.mods.length
    ?("内容涵盖"+curDigest.mods.map(s=>s.replace(/[：:].*$/,"").trim()).join("、")+(curDigest.n?"，共"+curDigest.n+"项":""))
    :"";
  /* NPC 心境：任务 id+日 哈希轮换 */
  const moodPool=CUE_NPC_MOOD[q.npc]||["在原地等你过来"];
  const mood=moodPool[(hash(q.id)+curDay)%moodPool.length];
  /* 激励：AI 缓存优先（必须是当前红线版本 CUE_V，旧版违规缓存一律不读），无缓存兜底池 */
  const _qlRec=st.questLines&&st.questLines[q.id];
  const cachedMot=(_qlRec&&_qlRec.cueV===CUE_V&&_qlRec.cue)||"";
  const introPool=QUIZ_INTROS[q.npc]||QUIZ_INTROS_FALLBACK;
  const motivate=cachedMot||introPool[(hash(q.id)+curDay)%introPool.length];
  /* FIX-P4 v2：请求式口吻＋蚀度概念，但一律现代口语（禁约莫/几桩/未了/光景等半文半白词）。
     玩家做的事情是拯救世界，角色在请求玩家帮忙——说清原因/事项/如何进行/完成好处，避免机械重复（hash 轮换开场词）。 */
  const isOral = q.type==="oral";
  const erodeOpeners = isOral
    ? ["一脉魔潮正盛，","这边景物又被侵蚀了一截，","精灵的气力又被夺去几分，"]
    : ["藏经阁这一带侵蚀度抬升了，","有几团雾怪在经匣里盘踞，","这一层的雾气又厚了些，"];
  const erodeOpener = erodeOpeners[(hash(q.id)+curDay)%erodeOpeners.length];
  const planReq = isOral
    ? `${erodeOpener}「${q.name}」的精灵正负伤苦撑，${curMods?("要协律的脉络涉及"+curMods+"，"):""}想请你去搭把手，帮她把气力夺回来。`
    : `${erodeOpener}「${q.name}」这一程${curMods?("——"+curMods+"，"):""}想请你一起去清理雾怪，净明这一带。`;
  return {
    status:`【${stage.name}阶段 · ${stage.theme}】${mood}`,
    overview:`今天大约要花你 ${totalMin} 分钟，一共 ${qs.length} 件事想拜托你——${catBrief}。`,
    plan:planReq,
    remain:`已经完成 ${prog.n} 件，还剩 ${remain} 件——等你出手。`,

  const gi=curGiOfDay(day); if(gi==null) return;
  const gd=gdAbs(day,gi);
  st.gdIssued=st.gdIssued||{};

    for(let dd=1;dd<=day;dd++) for(let k=0;k<5;k++){
      if(dd===day&&k>=gi) break;
      const g2=gdAbs(dd,k); if(gdQuests(dd,k).length) st.gdIssued[g2]=1;
    }
    st._gdBf=1;
  }
  if(!st.gdIssued[gd]){
    st.gdIssued[gd]=new Date().toISOString();
    st.dialogue.push({id:"gd_"+gd,role:"npc",npc:"yunting",kind:"gdmilestone",
      text:gdMilestoneText(day,gi),at:new Date().toISOString(),day});

  }

    t=filterNpcText(t.replace(/\n.*/s,"").slice(0,40));

/* 全链路中第一个「已解锁未完成」的关卡（群聊 NPC 接话/任务发布的事实源） */
function firstActiveQuest(){
  if(!st) return null;
  for(let day=1;day<=st.unlocked;day++){
    const d=byDay[day]; if(!d) continue;
    for(const q of d.quests){ if(!qDone(q.id)&&questUnlocked(q)) return q; }
  }
  return null;
}
function inputHint(){
  return "自由发言，总会有人接话……（@云汀 可指定同道，@所有人 全员回应）";
}
/* typing 指示：AI 接话期间在流尾显示省略气泡（不落存档） */
let TYPING=null;
function typing(on,multi){

/* 自由发言智能路由：直呼其名/别名 → WDChat 评分式领域判断 → 云汀兜底，
   保证玩家每一句自由发言都至少有一位合适的 NPC 出面回应 */
/* v2（R2.1）：路由关键词从角色注册表派生；v3：评分逻辑收敛到 WDChat.judgeDomain */
const NPC_ROLE_KW=(window.WDRegistry&&WDRegistry.keywordMap())||{};
function routeNpc(text){
  const raw=String(text||"");
  /* 主路径：WDChat 评分式领域判断（职能词+2，直呼名字+3，低于阈值→云汀） */
  if(window.WDChat&&WDChat.judgeDomain) return WDChat.judgeDomain(raw);
  /* 降级路径（WDChat未挂载时）：直接呼叫NPC名 → 关键词 → 云汀兜底 */
  if(window.WDCfg){
    for(const id of Object.keys(NPC)){
      const n=NPC[id];
      const names=[n.name,n.title, WDCfg.npcName(id,""), WDCfg.npcTitle(id,"")].filter(x=>x&&x.length>=2);
      if(names.some(nm=>raw.includes(nm))) return id;
    }
  }
  for(const id in NPC_ROLE_KW){
    if(NPC_ROLE_KW[id].some(k=>raw.includes(k))) return id;
  }
  return "yunheng";
}
/* NPC 显示名/称号：玩家自定义优先，原始数据仅以 ID 索引 */
function dName(id){ const n=resolveNpc(id); return (window.WDCfg&&WDCfg.npcName)?WDCfg.npcName(id,n?n.name:id):(n?n.name:id); }
function dTitle(id){ const n=resolveNpc(id); return (window.WDCfg&&WDCfg.npcTitle)?WDCfg.npcTitle(id,n?(n.title||""):""):(n?(n.title||""):""); }
/* 关卡口播名：NPC 台词与玩家可见对话一律用清洗后的名字（剥掉 S3-02 类编号与统计括号） */
function qdn(q){ return (window.WDChat&&WDChat.questDisplayName)?WDChat.questDisplayName(q):String((q&&q.name)||"这一关"); }
/* 玩家口吻开场白：点击 NPC 名字时自动生成一句符合当下情境的玩家发言 */
function playerOpener(npcId){
  const nm=dName(npcId);
  const aq=firstActiveQuest();
  const pool=aq?[
    nm+"，「"+qdn(aq)+"」这一关我想先听你说说该怎么下手",
    nm+"，现下这桩「"+qdn(aq)+"」，我该备些什么",
    "正卡在「"+qdn(aq)+"」——"+nm+"，给我指条路",
    nm+"，这关的底细你给我透一透呗"
  ]:[
    nm+"，接下来我该往哪走",
    nm+"，今日的事都交割了，再给我派一桩？",
    nm+"，闲着也是闲着，说说前头的局势吧"
  ];
  const seed=Date.now()+hashStr(pool.join());
  return pool[seed%pool.length];
}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
/* 统一应答：把玩家发言落档 → 指定 NPC 群聊接话（永不冷场）；落档注入当前任务 refs（需求2b） */
function npcAnswer(targets,text){
  const all=targets.length>1;
  typing(true,all);
  toast(all?"各位已收到喊话……":"正在与"+dName(targets[0])+"对话……");
  const flags=(st.agentFlags=st.agentFlags||{director:true,tools:true,proactive:true});
  const aq=firstActiveQuest();
  /* v36：统一导演流——导演决定谁开口（含插话/反应），逐个 NPC 生成台词 */
  if(flags.director&&window.WDChat&&WDChat.directorFlow){
    WDChat.directorFlow(text,{targets,brief:all,quest:aq,tools:flags.tools}).then(lines=>{
      if(lines&&lines.length){
        lines.forEach(l=>{
          const m={role:"npc",npc:l.npc,text:l.text,at:new Date().toISOString(),day:st.day};
          if(aq) m.refs=[{qid:aq.id}];
          st.dialogue.push(m);
          if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
        });
        save(); typing(false); renderChat(); return;
      }
      npcAnswerParallel(targets,text,all);
    }).catch(()=>{ npcAnswerParallel(targets,text,all); });
    return;
  }
  npcAnswerParallel(targets,text,all);
}
/* v2：并行模式（原 npcAnswer 逻辑，作为 director 的回退路径） */
function npcAnswerParallel(targets,text,all){
  typing(true,all);
  let done=0;
  targets.forEach(id=>{
    aiRespond(id,text,all).then(r=>{
      const aqR=firstActiveQuest();
      if(!r.text){
        /* v35：AI 失败——推系统消息提示中断，不再本地兜底 */
        aiHealth=(r.error&&/密钥|未配置/.test(r.error))?"error":"down";
        st.dialogue.push({role:"sys",text:"灵脉暂时中断："+(r.error||"AI 未响应")+"。点击状态栏 ●AI 可重连。",at:new Date().toISOString(),day:st.day});
      } else {
        const m={role:"npc",npc:id,text:r.text,at:new Date().toISOString(),day:st.day};
        if(!r.refs&&aqR) m.refs=[{qid:aqR.id}];
        st.dialogue.push(m);
      }
      if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
      save();
      if(++done===targets.length){ typing(false); renderChat(); } else renderChat(true);
    }).catch(()=>{ if(++done===targets.length){ typing(false); renderChat(); } });
  });
}
function sendChat(){
  closeMention();
  const inp=$("#chatInput"); const v=inp.value.trim(); if(!v) return;
  st.notes[st.day+"_"+Date.now()]=v;
  inp.value="";
  const mentioned=parseMention(v);
  // 任意自由发言均永久入档——群聊式发言环境，不再只有 @提及 才有回应
  st.dialogue.push({role:"player",text:v,at:new Date().toISOString(),day:st.day});
  if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  save(); renderChat(true);
  // @全员 → 各 NPC 并行接话；@单人 → 指定回应；无 @ → 云汀代为引荐职能NPC
  if(mentioned==="__ALL__") npcAnswer(Object.keys(MENTION_ALIASES),v);
  else if(mentioned) npcAnswer([mentioned],v);
  else yunhengProxy(v);
}
/* 云汀代@机制：未指定 NPC 时按领域评分直接路由（云汀是默认引路人，不再每条都代为引荐） */
function yunhengProxy(text){
  const target=(window.WDChat&&WDChat.judgeDomain)?WDChat.judgeDomain(text):routeNpc(text);

  npcAnswer([target],text);

/* ==================== 书页打字机效果 ====================
   初始逐字显示（~300字/分，提速1倍）；每次点击展开当前正在打字的一个完整文本段，
   随后继续下一段的打字机效果，直至所有预设文本段均完成展开。
   - 标签（<span><em>等）即时输出，仅文字逐字显示，保证 HTML 结构完整
   - 点击委托绑定在 pageHost 上，typewriter 重建 innerHTML 后术语仍可点 */
let twTimer=null, twState=null;
/* 打字机速度：默认 200ms/字，最大加速至 20ms/字（10倍），持久化到 localStorage */
const TW_SPEED_DEFAULT=200, TW_SPEED_MIN=20, TW_SPEED_MAX=400;
function twSpeed(){
  try{
    const v=parseInt(localStorage.getItem('twSpeed'),10);
    if(!isNaN(v)&&v>=TW_SPEED_MIN&&v<=TW_SPEED_MAX) return v;
  }catch(e){}
  return TW_SPEED_DEFAULT;
}
function twSetSpeed(ms){
  try{ localStorage.setItem('twSpeed',String(ms)); }catch(e){}
}
function stopTypewriter(){
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  if(twState&&twState.items){ twState.items.forEach(it=>{ if(it.el) it.el.classList.remove('tw-active'); }); }
  twState=null;
}
function startTypewriter(host,sel){
  stopTypewriter();
  if(!host||typeof host.querySelectorAll!=='function') return;
  const els=host.querySelectorAll(sel||'.book .pt, .book .npcnote, .book .anchor, .dtw');
  if(!els||!els.length) return;
  /* 预解析：标签即时输出，文字逐字 */
  const items=Array.from(els).map(el=>{
    const html=el.innerHTML;
    const tokens=[];
    let i=0;
    while(i<html.length){
      if(html[i]==='<'){
        const end=html.indexOf('>',i);
        if(end>=0){ tokens.push({t:1,h:html.slice(i,end+1)}); i=end+1; }
        else{ tokens.push({t:0,c:html[i]}); i++; }
      } else { tokens.push({t:0,c:html[i]}); i++; }
    }
    el.innerHTML='';
    el.classList.add('tw-active');
    return {el,html,tokens,pos:0};
  });
  twState={items,idx:0,built:'',done:false,host};
  twStep();
}
function twStep(){
  if(!twState||twState.done) return;
  if(twState.idx>=twState.items.length){
    twState.done=true; twState.autoDone=true;
    /* 全部打完：恢复术语点击绑定 + 通知宿主（如显示"点击继续"） */
    if(twState.host) twBindGlossary(twState.host);
    if(twState.onDone) twState.onDone();
    return;
  }
  const it=twState.items[twState.idx];
  /* 每tick输出一个文字字符（标签即时输出不计等待） */
  while(it.pos<it.tokens.length){
    const tk=it.tokens[it.pos];
    if(tk.t===1){ twState.built+=tk.h; it.pos++; }
    else { twState.built+=tk.c; it.pos++; break; }
  }
  it.el.innerHTML=twState.built;
  if(it.pos>=it.tokens.length){
    /* 当前段落打完，移除光标，进入下一段 */
    it.el.classList.remove('tw-active');
    twState.idx++; twState.built='';
    twTimer=setTimeout(twStep,300); /* 段落间短暂停顿 */
  } else {
    twTimer=setTimeout(twStep,twSpeed());
  }
}
function typewriterExpand(){
  if(!twState||twState.done) return;
  if(twTimer){ clearTimeout(twTimer); twTimer=null; }
  /* 每次点击：立即展开当前正在打字的这一段（填充完整内容），随后继续下一段的打字机效果。
     若当前段已打完（idx 已指向下一段），则跳过展开直接继续打下一段；直至所有段完成。 */
  const it=twState.items[twState.idx];
  if(it){ it.el.innerHTML=it.html; it.el.classList.remove('tw-active'); it.pos=it.tokens.length; }
  twState.idx++; twState.built='';
  SFX.tap();
  if(twState.idx>=twState.items.length){
    /* 所有预设文本段均完成展开 */
    twState.done=true;
    if(twState.host) twBindGlossary(twState.host);
    if(twState.onDone) twState.onDone();
  } else {
    /* 200ms 后开始下一段的打字机效果 */
    twTimer=setTimeout(twStep,200);
  }
}
/* 术语点击绑定（独立函数，typewriter 完成后可重新调用） */
function twBindGlossary(host){
  if(!host||typeof host.querySelectorAll!=='function') return;
  host.querySelectorAll('.gl').forEach(sp=>{
    if(sp._glBound) return; sp._glBound=true;
    sp.onpointerdown=(e)=>{
      e.stopPropagation();
      const g=D.glossary[sp.dataset.g]; if(!g) return;
      const gc=document.createElement('div'); gc.className='gcard';
      gc.innerHTML='<div class="gw">'+esc(sp.dataset.g)+'</div>'
        +'<div class="gs"><b>是什么</b>'+esc(g.what)+'</div>'
        +'<div class="gs"><b>装到哪</b>'+esc(g.where)+'</div>'
        +'<div class="gs"><b>为什么</b>'+esc(g.why)+'</div>';
      document.body.appendChild(gc);
      setTimeout(()=>{ try{gc.remove();}catch(e){} },6000);
      gc.onpointerdown=()=>gc.remove();
    };
  });
}

function openQuest(qid){
  const q=QMAP[qid]; if(!q) return;

  if(!readonly){
    if(!questUnlocked(q)){ toast("前序任务未完成——环环相扣，先破前关"); return; }
    // 等级仅作进度参考：前置链完成即代表已沿路修得足够道行（xp 由 reconcile 对账保证）。
    // 若因异常导致等级落后，先对账再判定，杜绝误拦正常流程。
    reconcile();
    /* v52 R6：吟游任务跳过 minLv 硬拦（questUnlocked 已保证主线推进到日，xp 对账保证道行） */
    if(q.type!=="oral" && level()<(q.minLv||1)){
      toast(`修行等级不足：需 Lv.${q.minLv}，当前 Lv.${level()}——先完成前序任务积累道行`);
      return;
    }
  }
  const pages=D.lectures[qid]||[];
  let quiz=D.quizzes[qid]||[];
  const npc=resolveNpc(q.npc);
  /* NPC 记忆：任务进入（在途态）+ 修习时长心跳（每 30 秒入账 0.5 分钟，归属当前任务 NPC）。回看模式不记在途 */
  if(window.WDMem&&!readonly){ WDMem.enter(q.npc,q.id); if(questTimer)clearInterval(questTimer);
    questTimer=setInterval(()=>WDMem.tick(0.5),30000); }
  /* v29（FIX-B/D-6）：主动触发器埋点——进入未完成任务时记录关卡进入时间（供滞留催办规则） */
  if(!readonly){ st.questEnterAt=new Date().toISOString(); acceptQuestLine(q); /* v58c：首次接取幂等落流 */ save(); }
  let quizPerfect=(quiz.length===0);   // 本次试炼是否全对（无题任务视为一次通关）
  const ov=document.createElement("div"); ov.className="ov";
  let pageIdx=0;
  /* FIX-P5：删除死代码 renderPage（全项目 0 处调用，含 oral 分支死代码副本）。
     渲染已由 renderStageBookPage + renderOralBlock 接管。bindOralKit 调用点已同步移除（原 L3283）。 */

  /* —— 点击推进（v44）：整页点击流转阶段 —— */
  const STAGES=(RT_FLOWS[q.rtCat]||RT_FLOWS.a).map(id=>({
    id, render:(id==="dialog"?renderStageDialog:id==="brief"?renderStageBrief:id==="book"?renderStageBook:id==="quiz"?renderStageQuiz:id==="recite"?renderStageRecite:id==="battle"?renderStageBattle:renderStageTrans)
  }));
  function goStage(idx){
    stageIdx=Math.max(0,Math.min(STAGES.length-1,idx));
    stopTypewriter();
    if(dialogTimer){ clearTimeout(dialogTimer); dialogTimer=null; }
    SFX.tap();
    STAGES[stageIdx].render();

  /* —— 对话末尾/阶段完成 选项面板（对齐新版 dialogue-flow 7 类核心子集）—— */
  let _choiceActive=false;
  function showChoicePanel(choices, onPick){
    if(_choiceActive) return;
    _choiceActive=true;
    const old=stageHost.querySelector('.qchoice-panel');
    if(old) old.remove();
    const panel=document.createElement('div');
    panel.className='qchoice-panel';
    panel.style.cssText='padding:10px 6px;border-top:1px dashed var(--border);margin-top:10px;display:flex;flex-direction:column;gap:8px';
    choices.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='btn sm'+(c.primary?' primary':'')+(c.ghost?' ghost':'');
      btn.textContent=c.label;
      btn.onclick=()=>{ _choiceActive=false; panel.remove(); SFX.tap(); onPick(c.value); };
      panel.appendChild(btn);
    });
    stageHost.appendChild(panel);
    stageHost.scrollTop=stageHost.scrollHeight;
  }

  function advanceStage(){
    /* 选项面板正在显示时，整页点击不推进 */
    if(_choiceActive) return;
    /* v58：按阶段 id 分流（不再假定 quiz 恒为第 4 段——rev 流只有 3 段、exam 流末段是 battle，
       旧逻辑按索引 2 当书页处理，会在消印/验界阶段误翻书）。试炼/复述/传译/战阵任何点击都不推进。 */
    const sid=STAGES[stageIdx]?STAGES[stageIdx].id:"";
    if(sid==="dialog"){
      /* dialog：打字中→加速；未全弹完→skip；全弹完→选项面板 */
      if(twState&&!twState.done){ typewriterExpand(); return; }
      if(dialogShown<dialogTotal){ dialogSkipOrNext(); return; }
      if(dialogDone){
        showChoicePanel([
          {label:'翻开手记，开始读这一卷', value:'continue', primary:true},
          {label:'告辞，先退下了', value:'leave', ghost:true}
        ], v=>{ if(v==='continue') goStage(1); else ov.remove(); });
      }
      return;
    }
    if(sid==="brief"){ /* brief：点击直接翻页进入书页（自动推进） */
      goStage(2); return;
    }
    if(sid==="book"){
      /* book：打字中→加速；自动刚打完（autoDone）→吞一次点击让用户看到提示；
         未翻完→翻页；末页读完→自动进入试炼 */
      if(twState&&!twState.done){ typewriterExpand(); return; }
      if(twState&&twState.autoDone){ twState.autoDone=false; return; }
      if(bookPageIdx<pages.length-1){ SFX.tap(); bookPageIdx++; renderStageBookPage(); return; }
      if(bookDone) goStage(3);
      return;
    }
    /* quiz / recite / trans / battle（试炼类阶段）：点击不推进，由答题按钮与通关面板驱动 */
  }
  function bookPageBack(){
    if((STAGES[stageIdx]||{}).id!=="book"||bookPageIdx<=0) return false;
    SFX.tap(); bookPageIdx=Math.max(0,bookPageIdx-1); renderStageBookPage(); return true;
  }
  /* v58：翻页键——焦点不在任何文本框内时，→/↓/PgDn/空格/回车=向前推进，←/↑/PgUp=书页回翻。
     绑 document（弹窗刚打开时焦点常在 body），ov 关闭即卸载；其他弹层压在任务上时不抢键。 */
  function isEditableTarget(t){
    return !!(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable));
  }
  document.addEventListener("keydown",function _questKeydown(e){
    if(!ov.isConnected){ document.removeEventListener("keydown",_questKeydown); return; }
    if(isEditableTarget(e.target)) return;           /* 文本框内：打字优先，绝不翻页 */
    if(e.target&&e.target.closest&&e.target.closest(".ov")&&e.target.closest(".ov")!==ov) return;
    if(e.target&&e.target.tagName==="BUTTON"&&!e.target.disabled&&(e.key==="Enter"||e.key===" ")) return; /* 可用按钮让原生激活 */
    /* 通关面板在场：回车/空格=确认通关 */
    const cg=ov.querySelector(".cleargate #cgOk");
    if(cg&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); cg.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true})); return; }
    const fwd=(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="PageDown"||e.key===" "||e.key==="Enter");
    const back=(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp");
    if(!fwd&&!back) return;
    e.preventDefault();
    if(fwd) advanceStage(); else bookPageBack();
  });

  /* ===== v58：通关提示——末题（末诵/末译/战阵）完成即弹，玩家确认即刻交割通关 ===== */
  function showClearGate(o){
    if(readonly) return;
