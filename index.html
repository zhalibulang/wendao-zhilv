/* 已淘汰的旧世界观概念（人设/任务生成中严禁出现） */
const OBSOLETE_TERMS=["提灯","引灯","问道录","仙侠","仙师","封妖塔","幻纱行","机关童子","观星者","掌灯","镇塔尊者"];
/* 生成 NPC 人设卡片（可带修改意见重生成）。用户在配置中心输入的人设描述作为硬约束，
   AI 须完全匹配该描述，禁止生成矛盾特质（如用户写"活泼可爱"则不得出现"沉默寡言"）。 */
async function genPersona(npcId, feedback){
  const npc=D.npcs.find(n=>n.id===npcId)||NPC[npcId];
  const persona=st.personas[npcId];
  /* 用户在配置中心输入的人设描述基准（WDCfg.npcPersonas）——作为第一参考硬约束 */
  const customPersona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(npcId):"";
  const sys="你是游戏角色设定师。基于给定的游戏世界背景与NPC基础信息，产出严谨的角色人设卡片。只输出JSON。";
  const user="游戏背景信息：\n"+JSON.stringify(buildWorldBrief(),null,1)
    +"\n\n要设定的NPC："+JSON.stringify({id:npcId,姓名:dName(npcId),称号:dTitle(npcId),职能:NPC_ROLE[npcId]||"",背景:npc.intro})
    +(customPersona?("\n\n【用户设定的角色基准·硬约束】"+customPersona
      +"——你必须完全匹配此描述生成人设：personality/style/identity 字段须与此基准一致，"
      +"严禁出现与用户设定相矛盾的特质（如用户写「活泼可爱」则不得出现「沉默寡言/冷淡/内敛」等反义描述）。"
      +"若用户设定了具体性格词，personality 数组必须包含该词或其近义表达。"):"")
    +(persona?("\n\n当前已有人设（供参考，若含旧概念须改写）："+JSON.stringify(persona.card)):"")
    +(feedback?("\n\n用户的修改意见（必须采纳）："+feedback):"")
    +"\n\n【世界观硬约束】本游戏世界观是「自在世界跌入导游异次元，遗忘之雾入侵，玩家通关导游试炼以拯救世界并重返家园」。"
    +"严禁出现以下已淘汰的旧概念："+OBSOLETE_TERMS.join("、")+"。"
    +"人设须贴合导游异次元的传奇导游设定，性格鲜明、可信。"
    +"\n\n请输出JSON，字段：name(姓名)、identity(身份背景，30-50字，须体现其导游职能)、personality(性格特征，3-4个短语，必须与用户设定基准一致)、style(对话风格描述，必须与用户设定基准一致)、relations(与其他角色关系数组，每项{name,rel})。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], true);
  let card;
  try{ card=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) card=JSON.parse(m[0]); else throw e; }
  card.id=npcId; card.name=card.name||dName(npcId);
  /* 保证 personality 为数组，便于后续统一处理与直接编辑 */
  if(typeof card.personality==="string") card.personality=card.personality.split(/[、,，;；\s]+/).filter(Boolean);
  if(!Array.isArray(card.personality)) card.personality=[];
  return card;
}
/* 生成任务说明：游戏隐喻叙事 + 背景故事 + 知识拓展（替代旧版独立任务描述模块） */
async function genQuestBrief(q){
  const npc=NPC[q.npc]||NPC.qingxuan;
  const persona=st.personas[q.npc]&&st.personas[q.npc].card;

  // 关联英文导游词
  const oralMap={"TAM":"tiananmen-square","GUG":"forbidden-city","TAN":"temple-of-heaven","SUM":"summer-palace","WAL":"great-wall","TOM":"ming-tombs"};
  const oralInfo=(q.covers||[]).map(c=>{

  if(o.metaphor) o.metaphor=String(o.metaphor).slice(0,50);
  o.at=new Date().toISOString();
  return o;
}
/* AI 出题：模仿真实考题，按复习阶段产生细微变化；失败时由调用方降级为静态题 */
async function genQuiz(q, stage){
  const baseQuiz=D.quizzes[q.id]||[];
  if(!baseQuiz.length) throw new Error("本题组无静态题参照");
  const pids=[...new Set(baseQuiz.map(z=>z.pid).filter(Boolean))];
  // 知识点全文（截 120 字，比 genQuestBrief 略长以保证出题精度）
  const knowledge=pids.map(pid=>{
    const p=D.pointsLib.find(x=>x.id===pid);
    return p?(pid+"："+p.text.slice(0,120)):"";
  }).filter(Boolean).join("\n");
  // 学习材料要点补充
  const lec=(D.lectures[q.id]||[]).flatMap(p=>(p.items||[]).map(it=>({id:it.id,text:it.text.slice(0,80)})));
  const lecSeen=new Set(), lecItems=[];
  for(const it of lec){ if(!pids.includes(it.id)&&!lecSeen.has(it.id)){ lecSeen.add(it.id); lecItems.push(it.id+"："+it.text); } if(lecItems.length>=12) break; }
  const lecText=lecItems.join("\n");
  // 静态题目作为样题（精简，只取关键字段）
  const sample=baseQuiz.map(z=>({kind:z.kind,q:String(z.q).slice(0,80),a:z.a,pid:z.pid}));
  // 阶段变化指令
  const stageInfo={
    first:{label:"初次学习",instr:"标准真题风格，与样题考点一致但重新措辞，不改变答案知识点"},
    second:{label:"二次复习",instr:"更换切入角度或提问方式（如是非题改为反向表述、填空换位），不改变考点和答案"},
    multi:{label:"多次复习",instr:"增加迷惑性干扰项；是非题可近义替换关键数字/名称；填空可设近义陷阱，但 accept 必须收录所有合理写法，不改变核心考点"}
  };
  const si=stageInfo[stage]||stageInfo.first;
  const sys="你是北京导游资格考试的出题专家。根据给定的知识点和样题，按照真实考试风格出题。\n1. 题目严格基于给定知识点，不超纲\n2. 题型为是非题（judge）和填空题（blank），模仿真实考试\n3. "+si.instr+"\n4. 每题提供解析（why字段，≤60字），注明出处考点\n5. 只输出JSON";
  const user="任务："+JSON.stringify({名称:q.name,目标:q.goal,日次:q.day})
    +"\n\n知识点：\n"+knowledge
    +(lecText?"\n\n学习材料要点：\n"+lecText:"")
    +"\n\n样题（仅供参考考点和风格，请出不同的题目）：\n"+JSON.stringify(sample)
    +"\n\n出题阶段："+si.label+"（"+si.instr+"）"
    +"\n\n请输出JSON：{\"questions\":["+baseQuiz.length+"道题]}。每题字段：kind(\"judge\"或\"blank\")、q(题干，填空用▁占位)、a(judge为true/false布尔值、blank为字符串答案)、accept(仅blank，字符串数组，须含a本身及别名/简写)、why(解析≤60字)、pid(必须是给定知识点id之一:"+pids.join("/")+")。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], true);
  let o;
  try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) o=JSON.parse(m[0]); else throw e; }
  const arr=Array.isArray(o)?o:(o.questions||[]);
  if(!Array.isArray(arr)||!arr.length) throw new Error("AI出题格式异常");
  const pidSet=new Set(pids);
  return arr.filter(z=>z&&z.kind&&z.q).slice(0, baseQuiz.length).map(z=>{
    const kind=z.kind==="blank"?"blank":"judge";
    let a=z.a, accept=z.accept, pid=z.pid, why=z.why;
    if(kind==="judge"){
      a=(a===true||a==="true")?true:(a===false||a==="false")?false:Boolean(a);
      if(typeof a!=="boolean") a=Boolean(a);
    } else {
      a=String(a);
      accept=Array.isArray(accept)&&accept.length?accept.map(String):[a];
      if(!accept.includes(a)) accept.unshift(a);
    }
    if(!pid||!pidSet.has(pid)) pid=pids[0]||pid;
    if(!why||typeof why!=="string") why="出处：考点 "+pid;
    else why=String(why).slice(0,120);
    const out={kind,q:String(z.q),a,why,pid};
    if(kind==="blank") out.accept=accept;
    return out;
  });
}

  function saveEdit(id){

          if(colon<0) return {name:p.trim(),rel:""};
          return {name:p.slice(0,colon).trim(),rel:p.slice(colon+1).trim()};
        }).filter(r=>r.name):[];

    host.querySelectorAll("[data-grow]").forEach(b=>b.onpointerdown=async ()=>{

      if(o){ SFX.win(); if(box) box.textContent="推演完成——性格/语言/行为已更新，对话中将自然体现"; draw(); }
      else { SFX.no(); if(box) box.textContent=WDChat.historyOf(id,1).length?"推演失败（AI 未响应，稍后再试）":"尚无互动记录——先在对话里与这位 NPC 多聊几句"; }

  async function genFlow(id, feedback){
    const box=$("#fb_"+id,host);

    }catch(e){ if(box){ box.textContent="生成失败："+e.message+"（已保留原人设，可重试）"; } SFX.no(); }

  draw();
}

/* 角色别名 → npcId（含全名与常用称呼，均取自 D.npcs 真实名，避免错字） */
const MENTION_ALIASES={
  yunheng:["云蘅","引路人","yunheng"],
  qingxuan:["青玄先生","青玄","qingxuan"],
  smq:["司马青衫","司马","smq"],
  tiemian:["铁面先生","铁面","tiemian"],
  liuruyan:["柳如烟","liuruyan"],
  moxiaogu:["墨小骨","小骨","moxiaogu"],
  xuanji:["玄机夫人","玄机","xuanji"]
};
function parseMention(text){
  const m=/@([A-Za-z0-9_\u4e00-\u9fa5]{2,8})/.exec(text);
  if(!m) return null;
  const tok=m[1];
  // @所有人/各位/全员/大家 → 全员应答
  if(/^(所有人|各位|全员|大家|全部|所有人呢|都有)$/.test(tok)) return "__ALL__";
  for(const id in MENTION_ALIASES){ if(MENTION_ALIASES[id].some(a=>tok===a||tok.startsWith(a)||a.startsWith(tok)&&tok.length>=2)) return id; }
  // 玩家自定义名/称号同样可被 @ 触发（ID 仍为系统固定值）
  if(window.WDCfg){
    for(const id of Object.keys(NPC)){
      const cn=WDCfg.npcName(id,""), ct=WDCfg.npcTitle(id,"");
      if((cn&&(tok===cn||tok.startsWith(cn)))||(ct&&(tok===ct||tok.startsWith(ct)))) return id;
    }
  }
  return null;
}
/* 网络检索 / 资料库匹配 / 对话生成已整体移入独立模块 wd-chat.js（window.WDChat），
   此处仅保留薄委托：本文件专注 UI 粘合，模块可在任意宿主复用。 */
async function aiRespond(npcId,userText,brief){
  /* NPC 记忆：对话即相识（meet/talk 归档），灵力作为「御 AI」资源消耗 */
  if(window.WDMem) WDMem.talk(npcId);
  if(dsReady()){
    if((st.energy|0)<1){ toast("灵力将尽——以本地话术接引，稍息自复"); return {text:WDChat.fallback(npcId,userText),degraded:true}; }
    st.energy=Math.max(0,st.energy-1); refreshStat(true);
  }
  const r=await WDChat.respond(npcId,userText,brief);
  if(window.WDMem) WDMem.meet(npcId);
  refreshStat();
  return r;
}

/* ---------- 任务面板（行者手札 · 任务卷）：对话流之外的独立任务总览 ---------- */
function dayMemoryPoints(day){
  const set=new Set();
  (byDay[day].quests||[]).forEach(q=>{
    (D.quizzes[q.id]||[]).forEach(z=>{ if(z.pid) set.add(z.pid); });
  });
  return set.size;
}
function qStage(q){
  if(qDone(q.id)) return {key:"done", label:"✓ 已完成"};
  if(questUnlocked(q)) return {key:"active", label:"▶ 进行中"};
  return {key:"locked", label:"🔒 未解锁"};
}
/* ==================== 可折叠层级任务树 ==================== */
/* 节点：{id,label,meta,state('done'|'cur'|'locked'|''),leaf,children:[]} */
function treeDefaultExpanded(node){
  if(!st._treeExp) st._treeExp={};
  if(st._treeExp[node.id]===undefined){
    // 默认：幕级展开；日级仅当日展开
    st._treeExp[node.id] = node.level===0 ? true : (node._defaultOpen===true);
  }
  return st._treeExp[node.id];
}
function setTreeExp(id,val){ if(!st._treeExp) st._treeExp={}; st._treeExp[id]=val; save(); }
function renderTreeNode(node){
  const hasKids = node.children && node.children.length>0;
  const expanded = hasKids && treeDefaultExpanded(node);
  const stateCls = node.state ? " "+node.state : "";
  const leafCls = node.leaf ? " leaf" : "";
  /* 叶子行只挂 data-leaf——若同时挂 data-toggle，bindTree 的 toggle 分支会拦截点击导致任务打不开 */
  return `<div class="tnode" data-level="${node.level}" data-has-children="${hasKids}" data-expanded="${expanded}" data-tid="${esc(node.id)}">
    <div class="trow${stateCls}${leafCls}" ${node.leaf?`data-leaf="${esc(node.id)}"`:`data-toggle="${esc(node.id)}"`}>
      <span class="ttog"${node.leaf?"":` data-toggle="${esc(node.id)}"`}>${hasKids?'<span class="tcar">▶</span>':''}</span>
      <span class="tdot"></span>
      <span class="tlabel">${esc(node.label)}</span>
      ${node.meta?`<span class="tmeta">${esc(node.meta)}</span>`:""}
    </div>
    ${hasKids?`<div class="tchildren">${node.children.map(renderTreeNode).join("")}</div>`:""}
  </div>`;
}
function bindTree(container, onLeaf){
  container.onpointerdown=e=>{
    /* 先查叶子：叶子行已不挂 data-toggle，此处顺序双保险 */
    const leaf=e.target.closest("[data-leaf]");
    if(leaf){ e.stopPropagation(); SFX.tap(); onLeaf&&onLeaf(leaf.dataset.leaf); return; }
    const tog=e.target.closest("[data-toggle]");
    if(tog){
      const n=tog.closest(".tnode"); if(!n) return;
      e.stopPropagation();
      const id=n.dataset.tid; const cur=n.dataset.expanded==="true";
      n.dataset.expanded=String(!cur); setTreeExp(id,!cur); SFX.tap();
    }
  };
}
function setAllTreeExpanded(nodes, val){
  const walk=ns=>ns.forEach(n=>{ if(!st._treeExp) st._treeExp={}; st._treeExp[n.id]=val; if(n.children) walk(n.children); });
  walk(nodes); save();
}
/* 构建 幕→日→任务 三级树 */
function buildQuestTree(){
  const acts=[...new Set(DAYS.map(d=>d.act))];
  return acts.map(act=>{
    const days=DAYS.filter(d=>d.act===act);
    let actDone=0, actAll=0;
    const dayNodes=days.map(d=>{
      const prog=dayProg(d); actDone+=prog.n; actAll+=prog.all;
      const isCur = d.day===st.day;
      const qNodes=d.quests.map(q=>{
        const s=qStage(q);
        return {id:q.id, level:2, leaf:true, state:s.key, label:q.name, meta:q.tlabel+"·"+q.dur+"分"};
      });
      return {id:"day:"+d.day, level:1, label:`第 ${d.day} 日 · 星期${d.week}`, meta:prog.n+"/"+prog.all,
        state: prog.n===prog.all?"done":(isCur?"cur":""), _defaultOpen:isCur, children:qNodes};
    });
    return {id:"act:"+act, level:0, label:D.acts[act], meta:actDone+"/"+actAll,
      state: actDone===actAll?"done":"", _defaultOpen:true, children:dayNodes};
  });
}
function renderBoard(){

    <div class="lmrow"><span>今日负荷（时长 ${totalMin} 分钟 · 记忆点 ${memPts} 个）</span><span>${heavy?"偏重，可拆两段":"适中"} ${load}%</span></div>
    <div class="lmtrack"><div class="lmfill" style="width:${Math.min(100,load)}%"></div></div>

  // 绑定入口
  stream.querySelectorAll("[data-entry]").forEach(b=>{

  stream.querySelectorAll("[data-enter]").forEach(b=>{

  });
  // 任务树：事件委托 + 展开状态记忆
  const treeEl=$("#questTree",stream);

    else toast("该环节尚未解锁——先破当前关");
  });
  $("#treeExpand",stream).onpointerdown=()=>{ SFX.tap(); setAllTreeExpanded(tree,true); renderBoard(); };
  $("#treeCollapse",stream).onpointerdown=()=>{ SFX.tap(); setAllTreeExpanded(tree,false); renderBoard(); };
}
/* ==================== 吟游 · 英文导游词独立任务线 ==================== */
function renderOralLine(){
  const stream=$("#stream");
  // 严格按日顺序（即原有先后与依赖），分离所有 oral 任务
  const orals=D.quests.filter(q=>q.type==="oral").sort((a,b)=>a.day-b.day||a.id.localeCompare(b.id));
  const doneN=orals.filter(q=>qDone(q.id)).length;
  const pct=Math.round(doneN/orals.length*100);
  // 按幕分组展示顺序链
  const groups=[];
  orals.forEach(q=>{
    let g=groups.find(x=>x.act===q.act);
    if(!g){ g={act:q.act, items:[]}; groups.push(g); }
    g.items.push(q);
  });
  const listHtml=groups.map(g=>{
    const actDay=DAYS.find(d=>d.act===g.act);
    const rows=g.items.map((q,i)=>{
      const s=qStage(q);
      const btn = s.key==="done" ? `<button class="btn sm ghost" data-oral="${q.id}" type="button">回看</button>`
        : s.key==="active" ? `<button class="btn sm primary" data-oral="${q.id}" type="button">进入背诵</button>`
        : `<span style="font-size:11px;color:var(--dim)">🔒 随主线解锁</span>`;
      return `<div class="qrow oral ${s.key}" style="border-left:3px solid var(--cyber)">
        <span class="qstage">${s.label}</span>
        <div class="qinfo"><div class="qn">第${q.day}日 · ${esc(q.name)}</div>
        <div class="qmeta">${fmtDur(q.dur)} · 出声朗读 + 复述自评</div></div>
        <span class="qrew">+${q.xp}修行</span>
        ${btn}
      </div>`;
    }).join("");
    return `<div class="boardgroup"><h3>${D.acts[g.act]}</h3>${rows}</div>`;
  }).join("");

  // 六篇吟游卷全文入口（卡片直达藏经阁导游词）
  const fullHtml=`<div class="boardgroup"><h3>吟游卷 · 六篇全文</h3>
    <div class="entrygrid">${D.oralFull.map((o,i)=>`<button class="entrybtn" data-full="${i}" type="button"><span class="ei">📖</span>${esc(o.name)}<br><span style="font-size:10px;opacity:.7">${o.words}词 · ${o.sections.length}节</span></button>`).join("")}</div>
    <div class="ad">点景点名可直接进入该篇全文（在藏经阁卡牌中逐节浏览、可校订）。</div>
  </div>`;

  stream.innerHTML=`
  <div class="sys daysep">吟游 · 英文导游词任务线</div>
  <div class="boardgroup">
    <div class="lmrow"><span>背诵进度（独立计算，与主修行同步存档）</span><span>${doneN}/${orals.length} · ${pct}%</span></div>
    <div class="oralprog"><div style="width:${pct}%"></div></div>
    <div class="ad">此线从主任务树独立呈现，但顺序与解锁依赖不变——完成主线前环，对应吟游才会开放。随时点右下角 🎙️ 可回到这里。</div>
  </div>
  ${listHtml}
  ${fullHtml}`;

  stream.querySelectorAll("[data-oral]").forEach(b=>b.onpointerdown=()=>{ SFX.tap(); openQuest(b.dataset.oral); });
  stream.querySelectorAll("[data-full]").forEach(b=>b.onpointerdown=()=>{
    SFX.tap();
    const idx=+b.dataset.full;
    // 跳藏经阁并定位到该篇第一张卡
    const cards=buildCardPool();
    const target=cards.findIndex(c=>c.cat==="full" && c.id.startsWith(D.oralFull[idx].id+" §1"));
    st._libCat="full"; st._libQ=""; st._libIdx= target>=0?target:0; save();
    switchView("lib");
  });
}
function renderCal(){
  const acts=[["act1","山河游学",1,8],["act2","律法塔",9,20],["act3","行会风云",21,30],["act4","遗迹探秘",31,41],["act5","金榜台前",42,45]];
  const scene={act1:"M12 3 L20 17 H4 Z",act2:"M9 20 V8 L12 4 L15 8 V20 M6 20 H18",act3:"M4 20 V10 Q12 2 20 10 V20",act4:"M5 20 Q5 8 12 8 Q19 8 19 20 M12 8 V20",act5:"M6 20 V12 L12 6 L18 12 V20 H6 Z"};
  let h='<div class="dayinfo">旅程地图 · 五幕四十五站 · 点击节点前往</div><div class="journey">';
  acts.forEach(function(a2){
    const aid=a2[0], aname=a2[1], a2a=a2[2], b2=a2[3];
    h+='<div class="jrow"><div class="jact"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="'+scene[aid]+'"/></svg><div class="an">'+esc(aname)+'</div></div><div class="jnodes">';
    for(let i=a2a;i<=b2;i++){
      const dd=byDay[i], pp=dayProg(dd);
      let cls = i===st.day?"cur":(i>st.unlocked?"future":(pp.n===pp.all&&pp.all>0?"done":(pp.n>0?"part":"")));
      const isBoss=dd.quests.some(q2=>q2.type==="boss"&&q2.kind==="main");
      h+='<div class="jnode '+cls+(isBoss?" boss":"")+'" data-day="'+i+'">'+i+'</div>';
    }
    h+='</div></div>';
  });
  h+='</div><div class="note">图例：墨块=圆满 · 朱框=今日 · 浅朱=进行中 · 双框=章节大试炼 · 半透明=未解锁</div>';
  const ov=panel('<h2>旅程</h2><div class="mt">五幕四十五站 · 当前第 '+st.day+' 日（已解锁至第 '+st.unlocked+' 日）</div>'+h);
  ov.querySelectorAll("[data-day]").forEach(n=>{
    n.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const day=+n.dataset.day;
      if(day>st.unlocked){ return; }
      st.day=day; save();
      ov.remove();
      document.querySelectorAll(".navline button").forEach(x=>x.classList.toggle("on",x.dataset.v==="chat"));
      view="chat";
      renderChat();
    });
  });
}
boot();
// 注册 Service Worker 实现 PWA 离线 + 自动更新
// 关键：新 SW 激活时上报缓存版本，页面对比版本差异后精准重载一次——
// 否则大陆网络访问 github.io 不稳定时，旧 SW 会永远回落陈旧缓存（iPad 不刷新的根因）
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if(d.type === "swv" && d.v){
      const prev = localStorage.getItem("wdzx_swv");
      if(prev && prev !== d.v){ location.reload(); return; }
      localStorage.setItem("wdzx_swv", d.v);
    }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // 启动即检查 sw.js 更新；之后每 10 分钟再查一次（iOS 独立 PWA 无导航期更新保障）
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
      window.__wdzxReg = reg;
    }).catch(() => {});
  });
}
