function aiApplyChannel(messages,opts,allowOff){
  const o=opts||{}; const id=o.ch||o.kind||"chat";
  if(aiChOff(id)&&!allowOff){
    /* v76：停用也留痕——捕获"本来要发什么"，玩家在面板仍可查看/修订（notsent 标注未真正发出） */
    try{ _aiSnapPut(id,Object.assign({kind:o.kind||"",off:true,notsent:true,ov:false},_snapMsgs(messages))); }catch(e){}
    const e=new Error("AI_CH_OFF:"+id); e.aiChOff=true; throw e;
  }
  const ov=aiPromptOv(id);
  if(!ov) return messages;
  return messages.map(m=>{
    if(m.role==="system"&&ov.sys!=null) return Object.assign({},m,{content:ov.sys});
    if(m.role==="user"&&ov.user!=null) return Object.assign({},m,{content:ov.user});
    return m;
  });
}

/* v2：callLog（R1.3d）——耗时/缓存命中/重试/错误码，内存环队列 + 截断落盘 */
let _callLog=[];
function callLog(entry){
  entry.t=new Date().toISOString();
  _callLog.push(entry); if(_callLog.length>80) _callLog=_callLog.slice(-80);
  try{ localStorage.setItem("wdzx.calllog",JSON.stringify(_callLog.slice(-40))); }catch(e){}
}

/* v2：重试判定（R1.2c）——仅 429/5xx/网络错误退避重试 1 次；401/402/403 直接异常态 */
function _retryable(status){ return status===429||status>=500; }
function _backoffMs(attempt){ return Math.min(8000,600*Math.pow(2,attempt))+Math.random()*400; }

/* dsChat v2（R1.2）：
   messages 标准多轮；opts 可为 true（旧 json 兼容，映射为 evolve 档）或 {kind,tools,stream}。
   - kind ∈ chat/director/summary/evolve/quiz/persona/questbrief/polish → 参数分档
   - opts.tools 传入时启用 function calling（agent loop 由 WDChat.respondWithTools 驱动）
   - 流式：kind=chat/polish 且未传 tools 且提供 onDelta 回调时 stream:true（含 include_usage）
   返回：普通文本 / 流式完整文本；带 tools 时返回 {content,toolCalls} */
async function dsChat(messages, opts, onDelta){
  const o=(opts===true)?{kind:"evolve"}:((opts&&typeof opts==="object")?opts:{});
  const kind=o.kind||"chat";
  const ch=o.ch||kind;
  /* v78：实弹预演（dryRun）——配置中心「👁 预览当前指令」专用：
     · 无需密钥也可组装（离线玩家同样看得到规则）；
     · 走完整 aiApplyChannel（修订覆盖照常生效；停用通道仅标注 off，不拦截）；
     · 落 preview 快照后在 fetch 之前抛 aiDryRun，绝不发请求、不计费、不写 callLog。 */
  if(o.dryRun){
    const pmsgs=aiApplyChannel(messages,o,true);
    const dprof=Object.assign({},DS_PROFILES[kind]||DS_PROFILES.chat);
    _aiSnapPut(ch,Object.assign({model:o.model||dprof.model||DS_MODEL,kind,preview:true,
      ov:!!aiPromptOv(ch),off:aiChOff(ch),
      temp:dprof.temperature,maxTokens:o.max_tokens||dprof.max_tokens,
      json:!!dprof.response_format,tools:!!o.tools,stream:false},_snapMsgs(pmsgs)));
    const dre=new Error("AI_DRY_RUN"); dre.aiDryRun=true; throw dre;
  }
  if(!dsReady()) throw new Error("未配置密钥");
  messages=aiApplyChannel(messages,o);   /* v73：通路停用拦截 + 提示词修订覆盖 */
  const profile=Object.assign({},DS_PROFILES[kind]||DS_PROFILES.chat);
  const key=dsKeyGet().trim();
  const wantTools=!!o.tools;
  const wantStream=(kind==="chat"||kind==="polish")&&!wantTools&&typeof onDelta==="function";
  let attempt=0, lastErr=null;
  while(attempt<=1){ /* 重试 ≤1 次（R1.2c） */
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), wantStream?12000:22000); /* v2：流式首包 12s（R1.2b） */
    const t0=Date.now();
    try{
      const model=o.model||profile.model||DS_MODEL;
      /* v73 实发快照；v76 起持久化本机并记录参数约束（温度/上限/JSON/工具/流式），面板审计真源 */
      _aiSnapPut(ch,Object.assign({model,kind,ov:!!aiPromptOv(ch),
        temp:profile.temperature,maxTokens:o.max_tokens||profile.max_tokens,
        json:!!profile.response_format,tools:wantTools,stream:wantStream},_snapMsgs(messages)));
      const body={model,messages,
        ...(profile.temperature!=null?{temperature:profile.temperature}:{}),
        max_tokens:o.max_tokens||profile.max_tokens,
        ...(profile.frequency_penalty!=null?{frequency_penalty:profile.frequency_penalty}:{}),
        ...(profile.presence_penalty!=null?{presence_penalty:profile.presence_penalty}:{}),
        ...(profile.response_format?{response_format:profile.response_format}:{}),
        ...(wantTools?{tools:o.tools,tool_choice:"auto"}:{}),
        ...(wantStream?{stream:true,stream_options:{include_usage:true}}:{})};
      const r=await fetch("https://api.deepseek.com/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify(body),
        signal:ctrl.signal});
      clearTimeout(t);
      if(r.status===401){ aiHealth="error"; callLog({ch,kind,err:401,ms:Date.now()-t0}); throw new Error("密钥无效(401)"); }
      if(r.status===402||r.status===403){ aiHealth="error"; callLog({ch,kind,err:r.status,ms:Date.now()-t0}); throw new Error("额度不足或禁止("+r.status+")"); }
      if(_retryable(r.status)){ throw Object.assign(new Error("可重试("+r.status+")"),{status:r.status}); }
      if(!r.ok){ callLog({ch,kind,err:r.status,ms:Date.now()-t0}); throw new Error("接口异常("+r.status+")"); }
      aiHealth="ok";
      /* ===== 流式读取（R1.2b：SSE 逐 delta） ===== */
      if(wantStream){
        let full="", usage=null;
        const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
        while(true){
          const {done,value}=await reader.read();
          if(done) break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split("\n"); buf=lines.pop();
          for(const line of lines){
            const s=line.trim();
            if(!s.startsWith("data:")) continue;
            const payload=s.slice(5).trim();
            if(payload==="[DONE]") continue;
            try{
              const j=JSON.parse(payload);
              const d=j.choices&&j.choices[0]&&j.choices[0].delta;
              if(d&&d.content){ full+=d.content; try{ onDelta(d.content,full); }catch(e){ console.warn('[ds stream] onDelta 渲染异常',e); } }
              if(j.usage) usage=j.usage;
            }catch(e){ /* SSE 心跳/半截块非合法 JSON 属正常，仅调试期留痕 */ if(payload&&payload!=="[DONE]") console.warn('[ds stream] 坏块已跳过',String(payload).slice(0,80)); }
          }
        }
        callLog({ch,kind,ms:Date.now()-t0,stream:true,cached:usage&&usage.prompt_cache_hit_tokens||0});
        const c=full.trim();
        if(!c) throw new Error("返回为空（流式）");
        const sysContent=(messages.find(m=>m.role==="system")||{}).content||"";
        const userContent=([...messages].reverse().find(m=>m.role==="user")||{}).content||"";
        _aiAuditPut({ at:new Date().toISOString(), ch, kind, model, status:"ok", ms:Date.now()-t0, stream:true,
          promptTokens:usage?usage.prompt_tokens:null, completionTokens:usage?usage.completion_tokens:null,
          totalTokens:usage?usage.total_tokens:null, cacheHit:usage?usage.prompt_cache_hit_tokens||0:0,
          sys:_aiAuditClip(sysContent), user:_aiAuditClip(userContent),
          resp:_aiAuditClip(c) });
        return c;
      }
      /* ===== 非流式 ===== */
      const j=await r.json();
      callLog({ch,kind,ms:Date.now()-t0,cached:j.usage&&j.usage.prompt_cache_hit_tokens||0,retry:attempt>0});
      const msg=j.choices&&j.choices[0]&&j.choices[0].message;
      if(!msg) throw new Error("返回为空");
      if(msg.tool_calls&&msg.tool_calls.length){
        _aiAuditPut({ at:new Date().toISOString(), ch, kind, model, status:"ok", ms:Date.now()-t0, stream:false,
          promptTokens:j.usage?j.usage.prompt_tokens:null, completionTokens:j.usage?j.usage.completion_tokens:null,
          totalTokens:j.usage?j.usage.total_tokens:null, cacheHit:j.usage?j.usage.prompt_cache_hit_tokens||0:0,
          sys:_aiAuditClip((messages.find(m=>m.role==="system")||{}).content||""),
          user:_aiAuditClip(([...messages].reverse().find(m=>m.role==="user")||{}).content||""),
          resp:_aiAuditClip(JSON.stringify(msg.tool_calls)), tools:true });
        return {content:msg.content||"",toolCalls:msg.tool_calls};
      }
      const c=msg.content;
      if(!c) throw new Error(/reasoner/i.test(model)?"R1 推理模型未返回正文（思考过程可能耗尽 token 上限，请重试或调大 max_tokens）":"返回为空");
      _aiAuditPut({ at:new Date().toISOString(), ch, kind, model, status:"ok", ms:Date.now()-t0, stream:false,
        promptTokens:j.usage?j.usage.prompt_tokens:null, completionTokens:j.usage?j.usage.completion_tokens:null,
        totalTokens:j.usage?j.usage.total_tokens:null, cacheHit:j.usage?j.usage.prompt_cache_hit_tokens||0:0,
        sys:_aiAuditClip((messages.find(m=>m.role==="system")||{}).content||""),
        user:_aiAuditClip(([...messages].reverse().find(m=>m.role==="user")||{}).content||""),
        resp:_aiAuditClip(c) });
      return c.trim();
    }catch(e){
      clearTimeout(t);
      lastErr=e;
      const isAbort=/abort/i.test(String(e&&e.name||e));
      /* 失败也记一条审计，方便用户看到"发了什么却没回来" */
      try{
        const model=o.model||(profile&&profile.model)||DS_MODEL;
        const sysContent=(messages.find(m=>m.role==="system")||{}).content||"";
        const userContent=([...messages].reverse().find(m=>m.role==="user")||{}).content||"";
        _aiAuditPut({ at:new Date().toISOString(), ch, kind, model, status:"err", ms:Date.now()-t0,
          sys:_aiAuditClip(sysContent), user:_aiAuditClip(userContent),
          err:String(e&&e.message||e).slice(0,300) });
      }catch(_){}
      if(isAbort||e&&e.status&&_retryable(e.status)){
        if(attempt<1){ attempt++; await new Promise(rs=>setTimeout(rs,_backoffMs(attempt))); continue; }
        aiHealth="down"; callLog({ch,kind,err:isAbort?"timeout":"net",ms:Date.now()-t0,retried:1});
        throw new Error("网络超时或限流，重试后仍失败");
      }
      throw e;
    }
  }
  throw lastErr||new Error("未知错误");
}

async function genQuestBrief(q){

  let dlg=Array.isArray(o.dialog)?o.dialog.filter(l=>l&&String(l.t||"").trim()).map(l=>({s:l.s==="p"?"p":"n",t:String(l.t).trim().slice(0,120)})):[];
  if(!dlg.length&&o.line) dlg=[{s:"n",t:String(o.line).slice(0,120)}];

  o.v=3;   /* v44 多段对话 schema：旧 prompt 生成的缓存一律失效重生成 */
  o.at=new Date().toISOString();
  /* v43：导演合理性筛查——审核世界观/事理逻辑/情境/人物弧光/对话体量，fail-open */
  try{
    if(window.WDChat&&WDChat.directorAudit){
      const audit=await WDChat.directorAudit(o,{npcId:q.npc,quest:q,kind:"questbrief"});
      if(!audit.pass&&audit.revised){
        o=audit.revised;
        if(o&&typeof o==="object"){
          /* 审核改写后重新规范化 dialog */
          let dlg2=Array.isArray(o.dialog)?o.dialog.filter(l=>l&&String(l.t||"").trim()).map(l=>({s:l.s==="p"?"p":"n",t:String(l.t).trim().slice(0,120)})):[];
          if(!dlg2.length&&o.line) dlg2=[{s:"n",t:String(o.line).slice(0,120)}];
          if(dlg2.length>9) dlg2=dlg2.slice(0,9);
          o.dialog=dlg2;

/* v55 批3-②：AI 一次性出题入库——首学时按任务一次性出题并持久化到 st.quizBank，
   以后进入同一任务时直接复用复抽；题目数量 = 知识点数 × 1.2，同知识点最多 2 题。 */
function quizBankPids(q){
  const baseQuiz=D.quizzes[q.id]||[];
  const pages=D.lectures[q.id]||[];
  const basePids=[...new Set((baseQuiz||[]).map(z=>z.pid).filter(Boolean))];
  const itemPids=[...new Set(pages.flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean)))];
  /* v70：口语句/导游段落只走传译与复述形态，不进笔试题库（否则 AI 会把英文句改成判断/填空题） */
  return [...new Set([...basePids,...itemPids])].filter(p=>!isOralLibId(p)&&!/^ORB-/.test(p));
}
/* v62 Task6：从题库按权重抽取 targetN 题（每知识点至少 1 题，最多 3 题）
   v69：同轮归一化去重 + 同知识点题型唯一（judge 只出一次，再抽就换题型），杜绝同型同面题 */
function quizBankDraw(qid,pids,targetN){
  const bank=(st.quizBank&&st.quizBank[qid])||[];
  if(!bank.length) return [];
  const out=[]; const byPid={};
  pids.forEach(p=>{ byPid[p]=bank.filter(z=>z.pid===p); });
  const seen=new Set(); const kindByPid={};
  const take=z=>{
    if(!z) return false;
    const k=quizNormKey(z);
    if(seen.has(k)) return false;
    if(z.pid&&kindByPid[z.pid]===z.kind) return false;   /* 同考点本题已出过该题型 */
    seen.add(k); if(z.pid) kindByPid[z.pid]=z.kind; out.push(z); return true;
  };
  /* 先给每知识点 1 题 */
  pids.forEach(p=>{
    if(out.length>=targetN) return;
    const cand=byPid[p];
    if(cand.length){ take(cand[Math.floor(Math.random()*cand.length)]); }
  });
  /* 再补足 targetN（同知识点 ≤3，重点/错题加权；优先换题型） */
  let guard=0;
  while(out.length<targetN&&guard<targetN*6){
    guard++;
    const cnt={}; out.forEach(z=>{ cnt[z.pid]=(cnt[z.pid]||0)+1; });
    const pidPick=weightedPid(pids,cnt);
    if(!pidPick) break;
    const cand=byPid[pidPick];
    /* 该知识点本轮已有某题型，就先抽没出过的题型；全出过再允许重复题型（题面仍需不同） */
    const alt=cand.filter(z=>z.kind!==kindByPid[pidPick]);
    const pool=alt.length?alt:cand;
    if(!pool.length) continue;
    take(pool[Math.floor(Math.random()*pool.length)]);
  }
  /* v70：旧题库里可能存着口语句的判断/填空异化题（v70 前生成），出库时一律剔除——
     口语卡的复习形态只允许是 trans/oralrec（由 rtQuizForCards 现造） */
  return shuffleArr(out).map(sanitizeQuiz).filter(z=>!isOralLibId(z.pid)&&!/^ORB-/.test(z.pid));
}
async function genQuizBank(q){
  const pids=quizBankPids(q);
  if(!pids.length) throw new Error("本关无考点可出");
  const knowledge=pids.map(pid=>{
    const p=D.pointsLib.find(x=>x.id===pid);
    return p?(pid+"："+p.text.slice(0,120)):"";
  }).filter(Boolean).join("\n");
  const baseQuiz=D.quizzes[q.id]||[];
  const sample=baseQuiz.length?baseQuiz.map(z=>({kind:z.kind,q:String(z.q).slice(0,80),a:z.a,pid:z.pid})):[
    {kind:"judge", q:"故宫太和殿是故宫内规模最大、等级最高的建筑。", a:true, pid:pids[0]},
    {kind:"blank",  q:"北京故宫位于北京的____区。", a:"东城", pid:pids[0], accept:["东城","东城区"]}
  ];
  const targetN=quizTargetN(pids.length);
  const sys="你是北京导游资格考试的出题专家。根据给定的知识点和样题，按照真实考试风格出题。\n"
    +"1. 题目严格基于给定知识点，不超纲\n"
    +"2. 题型五类：是非题（judge）、填空题（blank）、单选题（choice）、多选题（multi）、选错误项题（wrongone）；选项必须互斥明确、每题正确集合唯一，禁止多个可认定正确\n"
    +"3. 同一知识点若出多题，题型必须轮换（judge/blank/choice/multi/wrongone 换开），且题干表述不得重复或近似重复：判断题换措辞、换判断角度；填空题换挖空位置或换挖空词；选择/多选/选错题换选项组合与考察角度。全部题目两两互不相同\n"
    +"4. 每题提供解析（why字段，≤60字），注明出处考点\n"
    +"5. 只输出JSON";
  const user="任务："+JSON.stringify({名称:qdn(q),目标:qdn({name:q.goal||""})})
    +"\n\n知识点：\n"+knowledge
    +"\n\n样题（仅供参考考点和风格，请出不同的题目）：\n"+JSON.stringify(sample)
    +"\n\n请输出JSON：{\"questions\":["+targetN+"道题]}。每题字段：\n"
    +"kind：judge/blank/choice/multi/wrongone 之一；\n"
    +"q：题干（填空用____占位）；\n"
    +"opts：choice/multi/wrongone 必须给4个完整陈述选项；\n"
    +"a：judge为true/false布尔；blank为字符串答案；choice为正确选项文本；wrongone为【错误】选项文本；multi为正确选项文本数组（≥2个）；\n"
    +"accept：仅blank，字符串数组，须含a本身及别名/简写；\n"
    +"why：解析≤60字；pid：必须是给定知识点id之一（"+pids.join("/")+"）。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], {kind:"quizbank"});
  let o;
  try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) o=JSON.parse(m[0]); else throw e; }
  const arr=Array.isArray(o)?o:(o.questions||[]);
  if(!Array.isArray(arr)||!arr.length) throw new Error("AI出题格式异常");
  const pidSet=new Set(pids);
  const cleaned=arr.filter(z=>z&&z.kind&&z.q).map(z=>{
    const ALLOW=["judge","blank","choice","multi","wrongone"];
    const kind=ALLOW.includes(z.kind)?z.kind:"judge";
    let pid=z.pid, why=z.why;
    if(!pid||!pidSet.has(pid)) pid=pids[0]||pid;
    if(!why||typeof why!=="string") why="出处：考点 "+pid;
    else why=String(why).slice(0,120);
    const out={kind,q:String(z.q),why,pid};
    if(kind==="judge"){
      out.a=(z.a===true||z.a==="true")?true:(z.a===false||z.a==="false")?false:Boolean(z.a);
    } else if(kind==="blank"){
      out.a=String(z.a);
      let accept=Array.isArray(z.accept)&&z.accept.length?z.accept.map(String):[out.a];
      if(!accept.includes(out.a)) accept.unshift(out.a);
      out.accept=accept;
    } else {
      /* choice/multi/wrongone：opts 必须为 ≥2 完整选项；a 与 opts 对齐 */
      if(!Array.isArray(z.opts)||z.opts.length<2) return null;
      const opts=z.opts.map(o=>String(o));
      out.opts=opts;
      if(kind==="multi"){
        let aIdx=[];
        if(Array.isArray(z.a)) aIdx=z.a.map(x=>typeof x==="number"?x:opts.indexOf(String(x)));
        else if(Array.isArray(z.aIdx)) aIdx=z.aIdx.map(Number);
        aIdx=[...new Set(aIdx.filter(i=>Number.isInteger(i)&&i>=0&&i<opts.length))].sort((a,b)=>a-b);
        if(aIdx.length<2||aIdx.length>=opts.length) return null; /* 无效多选（全选/仅1项）丢弃 */
        out.aIdx=aIdx; out.a=aIdx.map(i=>opts[i]);
      } else {
        let idx=typeof z.a==="number"?z.a:(z.a!=null?opts.indexOf(String(z.a)):-1);
        if(!Number.isInteger(idx)||idx<0) idx=0;
        out.a=opts[idx]; /* choice=正确项；wrongone=错误项（题干语义决定） */
      }
    }
    return out;
  }).filter(Boolean);
  /* v69：出库清洗——归一化去重 + 同知识点题型唯一，同轮绝不重复（AI 违约时兜底） */
  const seenN=new Set(); const kindByPid={}; const out2=[];
  for(const z of cleaned){
    const k=quizNormKey(z);
    if(seenN.has(k)) continue;
    if(z.pid&&kindByPid[z.pid]===z.kind) continue;
    seenN.add(k); if(z.pid) kindByPid[z.pid]=z.kind; out2.push(z);
  }
  return out2.map(sanitizeQuiz);
}

/* ⑧ 传译 R1 出题：每大阶段 1 次，分析玩家翻译记录生成新题 */
async function r1TransQuizGen(stage){
  /* 第一阶段使用已有积累数据 + 125 双语句合适部分；后续阶段用玩家翻译记录 */
  const wrongTrans=(st.wrong||[]).filter(w=>w.pid&&/^S5-/.test(w.pid));
  const doneTrans=(st.dialogue||[]).filter(m=>m.role==="user"&&/传译|翻译/.test(m.text||"")).slice(-20);
  const sample125=D.oralLib.filter(x=>x.id&&/^OR-/.test(x.id)).slice(0,20).map(x=>({en:x.en,zh:x.zh}));
  const sys="你是北京导游资格考试中英互译出题专家。根据考生历史记录与双语句库，生成 5 道新的传译题。\n"
    +"要求：\n1. 题目围绕导游服务场景（欢迎词、景点介绍、应急处理、餐饮住宿等）；\n"
    +"2. 难度适配当前阶段（"+stage.name+"）；\n3. 覆盖考生薄弱点（如有历史错题则针对性出题）；\n"
    +"4. 每题提供：原文（中或英）、参考译文、考点说明（≤30字）；\n"
    +"5. 只输出 JSON：{\"questions\":[{\"src\":\"原文\",\"ref\":\"参考译文\",\"note\":\"考点说明\"}]}";
  const user="考生历史错题知识点：\n"+(wrongTrans.map(w=>w.pid).join("、")||"无")
    +"\n近期翻译记录：\n"+(doneTrans.map(m=>m.text.slice(0,80)).join("\n")||"无")
    +"\n双语句库参考：\n"+JSON.stringify(sample125.slice(0,8))
    +"\n请生成 5 道传译题。";
  try{
    const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}],{ch:"biasText",kind:"persona_r1"});
    let o;
    try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
    catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) o=JSON.parse(m[0]); else return; }
    const arr=o.questions||[];
    if(!arr.length) return;
    /* 存入传译题库（扩展 D.oralLib 动态部分） */
    st.transLibExt=st.transLibExt||[];
    arr.forEach((it,i)=>{
      st.transLibExt.push({id:"TR-R1-"+stage.id+"-"+i, src:String(it.src||""), ref:String(it.ref||""), note:String(it.note||""), stage:stage.id, at:new Date().toISOString()});
    });
    save();
    toast("「"+stage.name+"」阶段传译新题已生成（"+arr.length+" 道）");
  }catch(e){ /* 静默失败 */ }
}

/* 分句（与 wd-v25.js 的 _oralSplitSent、tools/build-oral.mjs 完全一致）：
   ① 句末标点后可能先跟右引号/右括号（如 “Purple Forbidden City.”），只看 .!? 后是否跟空格会切不开；
   ② 过短句（英文 <5 词 / 中文 <6 字）并入下一句，避免「Good morning, everyone!」单独成条。 */
function oralSplitSentences(text){
  const t=String(text||"").replace(/\s+/g," ").trim();
  if(!t) return [];
  const out=[]; let cur="";
  const isEnd=ch=>ch==="."||ch==="!"||ch==="?"||ch==="。"||ch==="！"||ch==="？";
  const isCloser=ch=>ch==='"'||ch==="'"||ch==="”"||ch==="’"||ch===")"||ch==="]"||ch==="」"||ch==="』"||ch==="）"||ch==="】";
  for(let i=0;i<t.length;i++){
    const ch=t[i]; cur+=ch;
    if(!isEnd(ch)) continue;
    if(ch==="."&&/\d/.test(t[i-1]||"")&&/\d/.test(t[i+1]||"")) continue; /* 3.5 不切 */
    let j=i+1;
    while(j<t.length&&isCloser(t[j])){ cur+=t[j]; j++; }
    const nx=t[j]||"";
    if(j>=t.length||nx===" "||/[\u4e00-\u9fffA-Z0-9“"‘'(]/.test(nx)){ out.push(cur.trim()); cur=""; i=j-1; }
  }
  if(cur.trim()) out.push(cur.trim());
  const wc=s=>(s.match(/[A-Za-z0-9]+(?:['’][A-Za-z]+)?/g)||[]).length;
  const cc=s=>(s.match(/[\u4e00-\u9fff]/g)||[]).length;
  const merged=[];
  for(let k=0;k<out.length;k++){
    const s=out[k];
    const short=/[\u4e00-\u9fff]/.test(s)?cc(s)<6:wc(s)<5;
    if(short&&k+1<out.length){ out[k+1]=s+" "+out[k+1]; continue; }
    merged.push(s);
  }
  return merged;
}

function oralKeywords(text,n){

    const wd=w.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,"");
    if(!wd) return;
    if(/^\d/.test(wd)) { set.add(wd); return; }           /* 数字事实：35 meters、1420 */
    if(/^[A-Z]/.test(wd)&&wd.length>2) { set.add(wd); return; } /* 专有名词 */
    const lw=wd.toLowerCase();
    if(wd.length>=6&&!ORAL_STOP.has(lw)) set.add(wd);       /* 长实词 */

/* 打字/背诵对照评分：归一化后按参考句词命中率（0-100）
   v109：tolerant=true 时（语音输入）把词形相近的识别误差也算命中——评分判内容对错，不判识别引擎准度 */
function oralScore(typed, refText, tolerant){
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9\s'-]/g," ").split(/\s+/).filter(w=>w.length>1);
  const ref=norm(refText), got=norm(typed);
  if(!ref.length||!got.length) return 0;
  const pool=got.slice();
  let hit=0;
  ref.forEach(w=>{
    let k=pool.indexOf(w);
    if(k<0&&tolerant) k=pool.findIndex(g=>g[0]===w[0]&&Math.abs(g.length-w.length)<=2);
    if(k>=0){ hit++; pool.splice(k,1); }

}
/* ==================== v70：复述/传译逐词对照（替代纯百分比） ====================
   词级/字级 LCS 对齐 → 标出笔误（ctral≈central）、漏词、多词；
   英文按词、中文按字并额外核查数字/专名/引号词覆盖。 */
const DIFF_STOP=new Set(["the","a","an","and","or","but","of","to","in","on","at","for","with","from","by","as","is","are","was","were","be","been","this","that","these","those","it","its","we","you","your","our","their","his","her","they","them","he","she","will","would","can","could","please","here","there","have","has","had","do","does","did","not","no","if","than","so","i","me","my","am","about","into","also"]);
function _lev(a,b){
  const n=a.length,m=b.length; if(n>24||m>24)return 99;
  const d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=0;i<=n;i++)d[i][0]=i;
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[n][m];
}
function _lcsOps(a,b,keyFn){
  const n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--){
    dp[i][j]=keyFn(a[i])===keyFn(b[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  }
  const ops=[];let i=0,j=0;
  while(i<n&&j<m){
    if(keyFn(a[i])===keyFn(b[j])){ops.push({t:"eq",w:a[i],r:b[j]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){ops.push({t:"miss",r:b[j]});j++;}
    else{ops.push({t:"extra",w:a[i]});i++;}
  }
  while(j<m)ops.push({t:"miss",r:b[j++]});
  while(i<n)ops.push({t:"extra",w:a[i++]});
  /* 全等残留先消缺：LCS 多解时同形词可能各剩一个（your 不该被近似配给 tour）。
     合成单个 eq（取 extra 位显示），对应 miss 位标记 drop（两侧不再重复渲染）。 */
  const leftM=[];
  ops.forEach((o,k)=>{if(o.t==="miss")leftM.push(k);});
  const usedM0=new Set();
  ops.forEach((o,ei)=>{ if(o.t!=="extra")return;
    const lw=String(o.w).toLowerCase();
    const mi=leftM.find(k=>!usedM0.has(k)&&String(ops[k].r).toLowerCase()===lw);
    if(mi!=null){ usedM0.add(mi); ops[ei]={t:"eq",w:o.w,r:ops[mi].r}; ops[mi]={t:"drop"}; }
  });
  /* 拼写近似全局配对——不要求相邻：同义改写时 LCS 常把错词与正词分到不相邻的两段，
     故在全部 extra/miss 间按编辑距离贪心最近匹配（ctral≈central、coroperation≈cooperation）。
     阈值收紧：只认 1 字母之差、或长词（≥7）2 字母之差、或长词（≥8）≤25% 差异——
     going/coming（4 字母之差）这种「不同的词」不算笔误。 */
  const cand=[];
  ops.forEach((o,ei)=>{ if(o.t!=="extra")return;
    ops.forEach((p,mi)=>{ if(p.t!=="miss")return;
      const w=String(o.w),r=String(p.r),lw=w.toLowerCase(),lr=r.toLowerCase();
      if(w.length>=4&&r.length>=4&&lw!==lr){
        const d=_lev(lw,lr);
        const allow=d===1||(d===2&&Math.max(w.length,r.length)>=7)||(Math.max(w.length,r.length)>=8&&d/Math.min(w.length,r.length)<=0.25);
        if(allow) cand.push({d,ei,mi,w,r});
      }
    });
  });
  cand.sort((x,y)=>x.d-y.d);
  const usedE=new Set(),usedM=new Set();
  cand.forEach(c=>{ if(usedE.has(c.ei)||usedM.has(c.mi))return;
    usedE.add(c.ei); usedM.add(c.mi);
    ops[c.ei]={t:"typo",w:c.w,r:c.r};
    ops[c.mi]={t:"typoRef",r:c.r};
  });
  return ops;
}
function oralDiffHtml(mine,ref,en){
  mine=String(mine==null?"":mine),ref=String(ref==null?"":ref);
  const note=(s,color)=>`<div style="font-size:12px;color:${color||"var(--fg2)"};margin:8px 0 3px;line-height:1.8">${s}</div>`;
  if(!mine.trim()) return note("你这题空着——先把参考读一遍：","var(--dim)")+`<div style="background:rgba(255,255,255,0.04);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.9">${esc(ref)}</div>`;
  const chips=[];
  let mineHtml,refHtml,covPct;
  if(en){
    const tok=s=>String(s).replace(/[^A-Za-z0-9'’\-]/g," ").split(/\s+/).filter(Boolean);
    const ops=_lcsOps(tok(mine),tok(ref),w=>String(w).toLowerCase());
    mineHtml=ops.map(o=>{
      if(o.t==="eq")return esc(o.w)+" ";
      if(o.t==="typo")return `<span style="background:rgba(255,193,7,0.25);border-radius:3px;padding:0 2px" title="应为 ${esc(o.r)}">${esc(o.w)}</span> `;
      if(o.t==="extra")return `<s style="color:var(--danger);opacity:.85">${esc(o.w)}</s> `;
      return "";
    }).join("");
    refHtml=ops.map(o=>{
      if(o.t==="drop")return "";
      if(o.t==="eq")return esc(o.r)+" ";
      if(o.t==="typo"||o.t==="typoRef")return `<b style="color:var(--gold)">${esc(o.r)}</b> `;
      if(o.t==="miss")return `<b style="color:var(--gold);border-bottom:1px solid var(--gold)">${esc(o.r)}</b> `;
      return "";
    }).join("");
    const typos=ops.filter(o=>o.t==="typo");
    const missAll=ops.filter(o=>o.t==="miss").map(o=>o.r);
    const missContent=missAll.filter(w=>!DIFF_STOP.has(w.toLowerCase()));
    const missStop=missAll.length-missContent.length;
    const extras=ops.filter(o=>o.t==="extra").map(o=>o.w).filter(w=>!DIFF_STOP.has(w.toLowerCase()));
    if(typos.length) chips.push("疑似笔误："+typos.map(o=>`<span style="color:var(--gold)">${esc(o.w)} → ${esc(o.r)}</span>`).join("；"));
    if(missContent.length) chips.push("漏掉的关键词："+missContent.slice(0,8).map(w=>`<b style="color:var(--gold)">${esc(w)}</b>`).join("、")+(missContent.length>8?" 等":""));
    if(missStop) chips.push("另有 "+missStop+" 个冠词/介词/连词等小词未出现，不影响大意");
    if(extras.length) chips.push("多写的词："+extras.slice(0,6).map(w=>`<s style="color:var(--danger)">${esc(w)}</s>`).join("、"));

    covPct=oralScore(mine,ref);
  }else{
    /* 中文：字级对齐（去标点）+ 数字/英文专名/引号词覆盖核查 */
    const norm=s=>String(s).replace(/[\s，。、；：？！,.:;?!“”‘’（）()【】「」『』""''\-—…·]/g,"");

    refHtml=ops.filter(o=>o.t==="eq"||o.t==="miss"||o.t==="typoRef"||o.t==="typo").map(o=>(o.t==="miss"||o.t==="typoRef"||o.t==="typo")?`<b style="color:var(--gold);border-bottom:1px solid var(--gold)">${esc(o.r)}</b>`:esc(o.r)).join("");
    const missN=ops.filter(o=>o.t==="miss").length, extraN=ops.filter(o=>o.t==="extra").length;
    /* 参考中的数字/英文/专名与引号词——必须传到的硬信息 */

    const uniqFacts=[...new Set(facts.map(s=>s.trim()))];
    const missingFacts=uniqFacts.filter(f=>!mine.includes(f)&&!(f.length<=4&&String(mine).includes(f))).slice(0,8);
    if(missingFacts.length) chips.push("这些硬信息没传到："+missingFacts.map(f=>`<b style="color:var(--gold)">${esc(f)}</b>`).join("、"));
    if(missN) chips.push("另有约 "+missN+" 个汉字与参考不同（同义表达可以，确认上面的专名与数字齐全即可）");
    if(extraN>6) chips.push("你的表述比参考多出不少内容，注意别偏离原意");

      <div style="font-size:11px;color:var(--dim);margin-bottom:3px">参考重合 ${covPct}% · <span style="color:var(--gold)">金色</span>=漏失 · <span style="color:var(--gold)">黄底</span>=笔误 · <s style="color:var(--danger)">红删</s>=多写</div>

      <div style="color:var(--dim);font-size:12px;margin-top:5px">你的：</div><div>${mineHtml||'<span style="color:var(--dim)">（未作答）</span>'}</div>

/* 吟游学习计划（天数动态）：第 2~N1 天分站背诵，N1+1~N2 天通篇轮考，之后抽题模拟。
   N1 = 距 11/16（第一截止日）、N2 = 距 11/20（最终截止日）的真实天数，见 V25.planHorizon()。 */
function oralPlanOf(day){
  const d=+day||1;
  if(d===1) return {aid:null,mode:"intro",label:"开场白与 Welcome 段通读 1 遍，出声跟读"};
  const plan=orderedOral();
  /* 天数随真实日期动态：第 2~N1 天分站背诵（N1=11/16 第一截止日），N1+1~N2 天通篇考核轮转（N2=11/20 最终截止日） */
  const _H=(window.V25&&V25.planHorizon)?V25.planHorizon():{N1:20,N2:25};
  if(d<=_H.N1){
    /* 天 2~N1 共 (N1-1) 天均摊六篇节：按各篇节数加权切片 */
    const total=plan.reduce((s,o)=>s+o.sections.length,0);
    const span=Math.max(1,_H.N1-1);
    let acc=0, target=(d-1)/span*total;
    for(const o of plan){
      const start=acc; acc+=o.sections.length;
      if(target<acc){
        const idx=Math.min(o.sections.length-1, Math.floor(target-start));
        return {aid:o.aid,mode:"section",sec:idx,
          label:`《${o.name}》第 ${idx+1}/${o.sections.length} 节「${o.sections[idx].h}」——通读 + 逐句跟读 + 分站背诵`};
      }
    }
    const last=plan[plan.length-1];
    return {aid:last.aid,mode:"section",sec:last.sections.length-1,label:`《${last.name}》末节通读 + 分站背诵`};
  }
  if(d<=_H.N2){
    const k=d-_H.N1-1;                      /* N1 之后第几个考核日 */
    const idx=k%plan.length;
    const round=Math.floor(k/plan.length)+1;
    const o=plan[idx];
    return {aid:o.aid,mode:"full",round,label:`《${o.name}》通篇背诵考核（第 ${round} 轮）——遮文复述，关键词覆盖 ≥70% 达标`};
  }
  return {aid:null,mode:"mock",label:"官方口试模拟：随机抽 1 景点 7 分钟完整讲解录音自评"};
}

    navigator.serviceWorker.register("sw.js").then(reg => {
      // 启动即检查 sw.js 更新；之后每 10 分钟再查一次（iOS 独立 PWA 无导航期更新保障）
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
      window.__wdzxReg = reg;
    }).catch(() => {});
  });
}

/* v25-67 图区点击放大：全局函数，inline onpointerdown 调用；三种关闭：遮罩背景 / 右上 × / ESC */
window._v25Zoom=function(src){
  if(typeof panel!=="function") return;
  const ov=panel('<img src="'+String(src||"").replace(/["'<>]/g,"")+'" alt="大图">');
  ov.classList.add("v25img-zoom");
  const close=()=>{ ov.remove(); document.removeEventListener("keydown",onKey); };
  const onKey=ev=>{ if(ev.key==="Escape") close(); };
  document.addEventListener("keydown",onKey);
  ov.onpointerdown=ev=>{ if(ev.target===ov) close(); };
};

</script>
