/* ==================== 内容编辑 / 版本系统 ==================== */
/* st.edits[id] = [{at:ISO, text}, ...] 最新在前；默认永远显示最新版本 */
function editVer(id){ return (st.edits&&st.edits[id])||[]; }
function getEdit(id, original){
  const v=editVer(id);
  return v.length? v[0].text : original;
}
function hasEdit(id){ return editVer(id).length>0; }
function saveEdit(id, text){
  text=String(text);
  if(!st.edits) st.edits={};
  const arr=st.edits[id]||(st.edits[id]=[]);
  if(arr.length && arr[0].text===text) return false;   // 与最新一致，不重复记录
  arr.unshift({at:new Date().toISOString(), text});
  save(); return true;
}
function rollbackEdit(id, index){
  const arr=editVer(id); if(!arr[index]) return;
  const text=arr[index].text;
  arr.unshift({at:new Date().toISOString(), text});   // 回退即把旧版复制为最新
  save();
}
/* ==================== 藏经阁内容卡片池 ==================== */
const CATEGORIES=[
  ["pts","考点卷"],["oral","吟游句"],["full","吟游卷全文"],["clue","线索册"]
];
function buildCardPool(){
  const cards=[];
  D.pointsLib.forEach(x=>{
    cards.push({uid:"point:"+x.id, cat:"pts", catLabel:"考点卷 · "+x.id.slice(0,2), id:x.id,
      title:"★".repeat(+x.star)+" "+x.id+(x.status==="⚠️"?" ⚠待核":""),
      body:getEdit("point:"+x.id, mdClean(x.text)),
      extra:x.anchor?("记忆锚："+mdClean(x.anchor)):"", editable:true, editId:"point:"+x.id});
  });
  D.oralLib.forEach(x=>{
    cards.push({uid:"oral:"+x.id, cat:"oral", catLabel:"吟游句 · "+x.topic, id:x.id,
      title:x.id+" · "+x.topic,
      body:getEdit("oral:"+x.id+":en", x.en),
      extra:getEdit("oral:"+x.id+":zh", x.zh), editable:true, editId:"oral:"+x.id+":en"});
  });
  D.oralFull.forEach(o=>{
    o.sections.forEach((s,i)=>{
      cards.push({uid:"full:"+o.id+":"+i, cat:"full", catLabel:"吟游卷 · "+o.name, id:o.id+" §"+(i+1),
        title:o.name+" · 第"+(i+1)+"节"+(s.h?" · "+s.h:""),
        body:getEdit("full:"+o.id+":"+i, s.text||s.en||""),
        extra:s.h?("小节："+s.h):"", editable:true, editId:"full:"+o.id+":"+i});
    });
  });
  D.clues.forEach(x=>{
    cards.push({uid:"clue:"+x.id, cat:"clue", catLabel:"线索册", id:x.id,
      title:x.id+" "+x.title, body:mdClean(x.text),
      extra:"关联考点："+(x.covers||[]).join(" · "), editable:false});
  });
  return cards;
}
function renderLib(){
  st._libCat = st._libCat || "all";
  st._libQ = st._libQ || "";
  st._libIdx = st._libIdx || 0;
  const stream=$("#stream");
  const all=buildCardPool();
  const q=st._libQ.toLowerCase().trim();
  const catSel=[["all","全部（"+all.length+"）"]].concat(CATEGORIES.map(c=>{
    const n=all.filter(x=>x.cat===c[0]).length; return [c[0], c[1]+"（"+n+"）"];
  }));
  let pool=all.filter(c=>{
    if(st._libCat!=="all" && c.cat!==st._libCat) return false;
    if(q){ const hay=(c.id+c.title+c.body+c.extra+c.catLabel).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  if(st._libIdx>=pool.length) st._libIdx=Math.max(0,pool.length-1);
  const idx=st._libIdx, cur=pool[idx];

  function cardHtml(c, cls){
    if(!c) return "";
    const edited=hasEdit(c.editId);
    return `<div class="qcard3d ${cls}">
      <div class="ccat">${esc(c.catLabel)}${edited?' <span style="color:var(--ok)">· 已校订</span>':""}</div>
      <div class="cid">${esc(c.title)}</div>
      <div class="cen">${esc(c.body)}</div>
      ${c.extra?`<div class="czh">${esc(c.extra)}</div>`:""}
    </div>`;
  }
  // 卡堆：当前 + 后两张预览
  const stack=[0,1,2].map(k=>cardHtml(pool[idx+k], "c"+k)).join("");

  stream.innerHTML=`
  <div class="sys daysep">藏经阁 · 卡牌修行</div>
  <div class="cardsearch">
    <input id="cardQ" placeholder="搜索编号 / 关键词 / 英文句…" value="${esc(st._libQ)}">
    <select id="cardCat">${catSel.map(o=>`<option value="${o[0]}"${st._libCat===o[0]?" selected":""}>${esc(o[1])}</option>`).join("")}</select>
  </div>
  <div class="carddeck">
    <div class="cardstack" id="cardStack">${cur?stack:`<div class="qcard3d c0"><div class="cen" style="text-align:center;color:var(--dim)">没有匹配的卡片——换个词或类别</div></div>`}</div>
    <div class="cardpos">${cur?`第 ${idx+1} / ${pool.length} 张`:"0 / 0"}</div>
    <div class="cardtools">
      <button class="btn sm ghost" id="cPrev" type="button" ${idx<=0?"disabled":""}>← 上一张</button>
      <button class="btn sm primary" id="cFlip" type="button" ${pool.length===0?"disabled":""}>翻下一张 ⤵</button>
      <button class="btn sm gold" id="cRand" type="button" ${pool.length===0?"disabled":""}>🎲 随机抽</button>
      <button class="btn sm" id="cEdit" type="button" ${cur&&cur.editable?"":"disabled"}>✏️ 校订此卡</button>
    </div>
    <div class="fliphint">点「翻下一张」从卡堆顶部依次取出 · 「随机抽」从全部卡片中抽取 · 校订内容会自动存档并可回退版本</div>
  </div>`;

  const goto=(n)=>{ st._libIdx=Math.max(0,Math.min(n,pool.length-1)); save(); renderLib(); };
  $("#cPrev",stream).onpointerdown=()=>{ SFX.tap(); goto(idx-1); };
  $("#cFlip",stream).onpointerdown=()=>{ SFX.flip?SFX.flip():SFX.tap(); goto(idx+1); };
  $("#cRand",stream).onpointerdown=()=>{ SFX.win?SFX.win():SFX.ok(); goto(Math.floor(Math.random()*pool.length)); };
  $("#cEdit",stream).onpointerdown=()=>{ if(cur) openEditor(cur); };
  $("#cardQ",stream).oninput=e=>{ st._libQ=e.target.value; st._libIdx=0; renderLib(); const inp=$("#cardQ",stream); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); };
  $("#cardCat",stream).onchange=e=>{ SFX.tap(); st._libCat=e.target.value; st._libIdx=0; save(); renderLib(); };
}
/* ==================== 内容编辑器（含版本历史 / 回退） ==================== */
/* 据 editId 取官方原文（用于「恢复官方原文」） */
function originalOf(editId){
  const parts=editId.split(":");
  if(parts[0]==="point"){ const x=D.pointsLib.find(p=>p.id===parts[1]); return x?mdClean(x.text):""; }
  if(parts[0]==="oral"){ const x=D.oralLib.find(p=>p.id===parts[1]); return x?(parts[2]==="zh"?x.zh:x.en):""; }
  if(parts[0]==="full"){ const o=D.oralFull.find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; return s?(s.text||s.en||""):""; }
  return "";
}
function openEditor(card){
  const origText = originalOf(card.editId) || card.body;
  const current = getEdit(card.editId, origText);
  const ov=panel(`<h2>校订 · ${esc(card.id)}</h2><div class="mt">${esc(card.catLabel)} · 修改实时存档，默认永远显示最新版本，可随时回退</div>
    <div class="editor">
      <textarea id="edArea" placeholder="在此校订内容（导游词/考点原文）…">${esc(current)}</textarea>
      <div class="estatus saved" id="edStatus">● 已加载当前版本</div>
      <div class="kitbar">
        <button class="btn sm primary" id="edSave" type="button">保存新版本</button>
        <button class="btn sm ghost" id="edReset" type="button">恢复官方原文</button>
        <button class="btn sm ghost" id="edClose" type="button">关闭</button>
      </div>
      <div class="vhist" id="vHist"></div>
    </div>`);
  const area=$("#edArea",ov), status=$("#edStatus",ov), hist=$("#vHist",ov);
  let dirty=false;
  const markDirty=()=>{ dirty=true; status.className="estatus dirty"; status.textContent="● 有未保存修改…"; };
  area.oninput=markDirty;
  function drawHist(){
    const vers=editVer(card.editId);
    if(!vers.length){ hist.innerHTML=`<div class="vitem"><span class="vat">官方原文</span><span class="vprev">（尚无校订版本）</span></div>`; return; }
    hist.innerHTML=`<div style="font-size:12px;color:var(--cyber);margin-bottom:4px">版本历史（最新在前，点「恢复」回退）</div>`+
      vers.map((v,i)=>`<div class="vitem ${i===0?"cur":""}">
        <span class="vat">${i===0?"当前 · ":"v"+(vers.length-i)+" · "}${v.at.slice(0,16).replace("T"," ")}</span>
        <span class="vprev">${esc(v.text.slice(0,40))}…</span>
        <button class="btn sm ghost editbtn" data-v="${i}" type="button" ${i===0?"disabled":""}>${i===0?"最新":"恢复"}</button>
      </div>`).join("");
    hist.querySelectorAll("[data-v]").forEach(b=>b.onpointerdown=()=>{
      SFX.tap(); rollbackEdit(card.editId, +b.dataset.v);
      area.value=getEdit(card.editId,origText); dirty=false;
      status.className="estatus saved"; status.textContent="● 已回退并保存为最新版本";
      drawHist(); toast("已回退到所选版本");
    });
  }
  $("#edSave",ov).onpointerdown=()=>{
    const txt=area.value.trim();
    if(!txt){ toast("内容不能为空"); return; }
    if(saveEdit(card.editId, txt)){ SFX.ok(); dirty=false; status.className="estatus saved"; status.textContent="● 已保存 "+new Date().toLocaleTimeString(); drawHist(); toast("新版本已存档"); }
    else { status.className="estatus saved"; status.textContent="● 内容未变化"; }
  };
  $("#edReset",ov).onpointerdown=()=>{
    if(!confirm("恢复为官方原文？此操作会把原文存为最新版本。")) return;
    SFX.tap(); saveEdit(card.editId, origText); area.value=origText; dirty=false;
    status.className="estatus saved"; status.textContent="● 已恢复官方原文"; drawHist(); toast("已恢复官方原文");
  };
  $("#edClose",ov).onpointerdown=()=>{
    if(dirty && !confirm("有未保存的修改，确定关闭？")) return;
    ov.remove(); if(view==="lib") renderLib();
  };
  drawHist();
}
/* 巡夜卡匣 · NPC 引导话术：含知识点提示但不直接给答案，请求式口吻激励回忆 */
function fcHint(it,mode){
  if(!it) return "翻面看看吧。";
  const id=(it.id||"").toUpperCase();
  const m=id.match(/^([A-Z]+\d*)/);
  const prefix=m?m[1]:"";
  let npcId="xuanji";
  if(prefix==="S1"||prefix==="S2") npcId="smq";
  else if(prefix==="S3") npcId="tiemian";
  else if(prefix==="S4") npcId="liuruyan";
  else if(prefix==="S5") npcId="moxiaogu";
  else if(prefix==="S6") npcId="xuanji";
  const npc=dName(npcId);
  const t=it.text||"";
  let clue="这条考点的核心";
  if(/\d{4}\s*年/.test(t)) clue="这段有个年份要记牢";
  else if(/[北京上海嘉兴南湖故宫天坛十三陵长城颐和园中南海人民大会堂]/.test(t)) clue="这和某个地点有关";
  else if(/代表大会|会议|全会|大会|一大|二大/.test(t)) clue="这讲的是一场会议";
  else if(/条例|法规|法条|规定|办法|处罚/.test(t)) clue="这是某条法规";
  else if(/旅行社|接待|客人|服务|导游|礼仪/.test(t)) clue="这讲的是接待实务";
  else if(/[建筑|遗迹|文物|年表|历史|朝代]/.test(t)) clue="这讲的是古迹史实";
  let h=0; for(let i=0;i<id.length;i++){h=(h*31+id.charCodeAt(i))>>>0;}
  const pre=mode==="pre"?[
    `「${npc}」轻声道：${clue}——心里先有个数，翻面核对一下？`,
    `「${npc}」递来残卷：${clue}，先回忆回忆，翻面对对看。`,
    `「${npc}」眨眨眼：${clue}，还记得不？翻面瞧瞧答案。`,
    `「${npc}」低声问：${clue}——翻面之前，你先想想。`
  ]:[
    `「${npc}」抚卷道：${clue}——还记得吗？翻面验验。`,
    `「${npc}」递来旧符：${clue}，回忆一下，翻面对对。`,
    `「${npc}」望着你：${clue}，心里有数了吗？翻面看看。`,
    `「${npc}」轻叩案：${clue}——翻面之前，先想想。`
  ];
  return pre[h%pre.length];
}
function renderNight(){
  // 到期复习卡（已完成 study 任务）+ 预习卡（已解锁未完成 study 任务）——保证任意进度打开均有内容
  const due=[], later=[], pre=[];
  const today=new Date().toISOString().slice(0,10);
  DAYS.forEach(d=>{ if(d.day>st.unlocked) return;
    d.quests.forEach(q=>{ if(q.type!=="study") return;
      (D.lectures[q.id]||[]).forEach(p=>{ (p.items||[]).forEach(it=>{
        if(qDone(q.id)){ const rec=st.cards[it.id]||{due:"2026-01-01",iv:1};
          if(rec.due<=today) due.push(it); else later.push(it);
        } else pre.push(it);
      });});
    });
  });
  const consolidated=Object.values(st.cards||{}).filter(r=>r&&r.iv>=2).length;
  const prog=(window.WDQuiz&&WDQuiz._db())?WDQuiz.progress():null;
  const progHtml=prog?` · 智能提问：答${prog.total}题，正确率${prog.rate}%，连对${prog.streak}题`:"";
  const ov=panel(`<h2>巡夜 · 记忆卡匣</h2><div class="mt">到期复习 ${due.length} 张 · 待来日 ${later.length} 张 · 预习 ${pre.length} 张 · 已巩固 ${consolidated} 张${progHtml}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
      ${window.WDQuiz?`<button class="btn sm primary" id="iqBtn" type="button">✦ 智能提问</button><span style="color:var(--ink2);font-size:12.5px">NPC 依你的记忆内容主动出题，认知递进</span>`:""}
    </div>
    <div id="fcHost"></div>`);
  const host=$("#fcHost",ov);
  /* 智能提问入口：基于记忆卡匣+错题生成认知递进式提问，NPC 依职能匹配出题 */
  const iqBtn=$("#iqBtn",ov);
  if(iqBtn) iqBtn.onpointerdown=()=>{ SFX.tap(); startIntelligentQuiz(due,pre,later,host); };
  const deck=[...due.map(it=>({it,mode:"due"})), ...pre.map(it=>({it,mode:"pre"}))];
  let i=0, showRev=false;
  function draw(){
    if(i>=deck.length){
      host.innerHTML=deck.length
        ? `<div class="missing" style="text-align:center;padding:30px">今夜巡完（复习 ${due.length} · 预习 ${pre.length}）。安心睡。</div>`
        : `<div class="missing" style="text-align:center;padding:30px">卡匣尚空——完成修行类任务后，考点卡会在此安家。</div>
           <div style="text-align:center;margin-top:10px"><button class="btn sm primary" id="fcGo" type="button">去今日修习</button></div>`;
      const g=$("#fcGo",host); if(g) g.onpointerdown=()=>{ SFX.tap(); ov.remove(); toast("完成今日任务后，新的考点卡会自动入匣"); };
      return;
    }
    const cur=deck[i], it=cur.it, rev=showRev;
    if(cur.mode==="pre"){
      host.innerHTML=`<div class="flashcard"><div class="fc-id">预习 · ${esc(it.id)} · ${"★".repeat(+it.star||1)}</div>
        <div class="fc-main">${esc(rev?it.text:fcHint(it,"pre"))}</div>
        ${rev?`<div class="fc-rev">${esc(it.text)}</div>`:""}
        <div style="margin-top:12px">${rev?`<button class="btn sm primary" id="fNext" type="button">记下了（完成后自动入复习队列）</button>`:`<button class="btn sm primary" id="fFlip" type="button">翻面</button>`}</div></div>
        <div class="tstate">${i+1} / ${deck.length}</div>`;
      const fl=$("#fFlip",host); if(fl) fl.onpointerdown=()=>{ SFX.tap(); showRev=true; draw(); };
      const nx=$("#fNext",host); if(nx) nx.onpointerdown=()=>{ SFX.tap(); i++; showRev=false; draw(); };
      return;
    }
    host.innerHTML=`<div class="flashcard"><div class="fc-id">${esc(it.id)} · ${"★".repeat(+it.star)}</div>
      <div class="fc-main">${esc(rev?it.text:fcHint(it,"due"))}</div>
      ${rev?`<div class="fc-rev">${esc(it.text)}</div>`:""}
      <div style="margin-top:12px">${rev?`
        <button class="btn sm" id="fAgain" type="button">生疏（明日再来）</button>
        <button class="btn sm primary" id="fGood" type="button">记住了（延后间隔）</button>`
        :`<button class="btn sm primary" id="fFlip" type="button">翻面</button>`}</div></div>
      <div class="tstate">${i+1} / ${deck.length}</div>`;
    const flip=$("#fFlip",host); if(flip) flip.onpointerdown=()=>{ SFX.tap(); showRev=true; draw(); };
    const ag=$("#fAgain",host); if(ag) ag.onpointerdown=()=>{ SFX.tap(); st.cards[it.id]={due:new Date(Date.now()+864e5).toISOString().slice(0,10),iv:1}; i++; showRev=false; save(); draw(); };
    const gd=$("#fGood",host); if(gd) gd.onpointerdown=()=>{ SFX.tap(); const r=st.cards[it.id]||{iv:1}; const nv=Math.min(15,r.iv*2); st.cards[it.id]={due:new Date(Date.now()+nv*864e5).toISOString().slice(0,10),iv:nv}; i++; showRev=false; save(); draw(); };
  }
  draw();
}
/* ==================== 智能提问交互（NPC 依记忆内容主动出题，认知递进）==================== */
function startIntelligentQuiz(due,pre,later,host){
  if(!window.WDQuiz||!WDQuiz._db()){ toast("智能提问模块未就绪"); return; }
  /* 合并所有可用考点卡作为题源 */
  const allCards=[...(due||[]),...(pre||[]),...(later||[])];
  if(!allCards.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">卡匣尚空——完成修行类任务后，考点卡会在此安家。</div>`; return; }
  /* 生成5道认知递进式提问（混合记忆卡匣+错题） */
  const questions=WDQuiz.ask(allCards,st.wrong,D.pointsLib,5);
  if(!questions.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">暂无可提问的考点。</div>`; return; }
  let qi=0, okN=0;
  function drawQ(){
    if(qi>=questions.length){
      const prog=WDQuiz.progress();
      host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">
        <div style="font-size:14px;margin-bottom:6px">智能提问终了：答对 ${okN}/${questions.length}</div>
        <div style="font-size:12px;color:var(--ink2)">累计答题 ${prog.total} · 正确率 ${prog.rate}% · 连对 ${prog.streak}（最高 ${prog.bestStreak}）</div>
        <div style="font-size:12px;color:var(--ink2);margin-top:4px">已掌握 ${prog.mastered} 个考点 · 学习中 ${prog.learning} 个</div>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn sm" id="iqBack" type="button">← 返回卡匣</button>
        <button class="btn sm primary" id="iqAgain" type="button">再来一轮</button>
      </div>`;
      $("#iqBack",host).onpointerdown=()=>{ SFX.tap(); host.innerHTML=""; renderNight(); };
      $("#iqAgain",host).onpointerdown=()=>{ SFX.tap(); startIntelligentQuiz(due,pre,later,host); };
      return;
    }
    const q=questions[qi];
    const npcName=dName(q.npcId), npcTitle=dTitle(q.npcId);
    const avatarURL=(window.WDAvatar&&WDAvatar.avatarURL)?WDAvatar.avatarURL(q.npcId):"";
    const lvLabel=["基础","进阶","挑战"][q.lv-1]||q.lv;
    const lvColor=q.lv===1?"var(--ok)":(q.lv===2?"var(--gold)":"var(--danger)");
    host.innerHTML=`<div class="iqcard">
      <div class="iqhead">
        ${avatarURL?`<img src="${avatarURL}" alt="" style="width:32px;height:32px;image-rendering:pixelated;border-radius:4px">`:""}
        <div class="iqnpc">${esc(npcName)}${npcTitle?" · "+esc(npcTitle):""}</div>
        <span class="iqlv" style="color:${lvColor}">${esc(q.typeLabel)} · ${lvLabel}</span>
      </div>
      <div class="iqq">${esc(q.q)}</div>
      <div class="iqhint" style="color:var(--dim);font-size:11px;margin-top:4px">考点 ${esc(q.pid)} · 关键词：${esc(q.keyword)}</div>
      <textarea id="iqAns" rows="3" placeholder="用你的话作答……（可不答，直接跳过查看参考）" style="width:100%;font:inherit;font-size:12px;background:var(--bg);border:1px solid var(--border-lit);color:var(--fg);padding:8px;border-radius:4px;margin-top:8px"></textarea>
      <div class="kitbar" style="margin-top:8px">
        <button class="btn sm primary" id="iqSubmit" type="button">作答</button>
        <button class="btn sm" id="iqKnow" type="button">✓ 会了</button>
        <button class="btn sm ghost" id="iqSkip" type="button">不会，看参考</button>
      </div>
      <div id="iqFb" class="small" style="margin-top:8px;font-size:12px;line-height:1.7"></div>
    </div>`;
    const fb=$("#iqFb",host);
    let answered=false;
    $("#iqSubmit",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      const ans=$("#iqAns",host).value.trim();
      if(!ans){ fb.innerHTML=`<div style="color:var(--gold)">没写也没关系——下面是参考答案，看一眼也算温习。</div>`; showRef(false); return; }
      /* 自评反馈：展示参考答案供玩家自评 */
      fb.innerHTML=`<div style="color:var(--cyber)"><b>你的回答：</b>${esc(ans)}</div>
        <div style="color:var(--ink2);margin-top:4px">对照参考自评——你觉得答得对吗？</div>
        <div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn sm primary" id="iqRight" type="button">答对了</button>
          <button class="btn sm ghost" id="iqWrong" type="button">答偏了</button>
        </div>`;
      $("#iqRight",host).onpointerdown=()=>{ SFX.tap(); SFX.ok(); okN++; WDQuiz.record(q.pid,true); if(window.WDMem)WDMem.right(q.npcId,q.topic); showRef(true,true); };
      $("#iqWrong",host).onpointerdown=()=>{ SFX.tap(); SFX.no(); WDQuiz.record(q.pid,false); if(window.WDMem)WDMem.wrong(q.npcId,q.topic,q.lv); showRef(true,false); };
    };
    $("#iqKnow",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      okN++; WDQuiz.record(q.pid,true);
      if(window.WDMem)WDMem.right(q.npcId,q.topic);
      showRef(true,true);
    };
    $("#iqSkip",host).onpointerdown=()=>{ SFX.tap();
      if(answered) return; answered=true;
      WDQuiz.record(q.pid,false);
      if(window.WDMem)WDMem.wrong(q.npcId,q.topic,q.lv);
      showRef(false,false);
    };
    function showRef(selfAssessed,correct){
      const interval=WDQuiz.interval(q.pid);
      const nextReview=interval===1?"明日":(interval===3?"3日后":"7日后");
      const msg=correct?'<span style="color:var(--ok)">很好——这个考点将在'+nextReview+'复习。</span>':'<span style="color:var(--gold)">没关系，多见几次就熟了——明日再来。</span>';
      fb.innerHTML=`${selfAssessed?'':''}<div style="border-left:3px solid var(--neon);padding:6px 8px;margin-top:6px;background:rgba(0,229,255,.04);border-radius:0 4px 4px 0">
        <b style="color:var(--neon);font-size:11px">参考答案</b><br><span style="font-size:12.5px;color:var(--fg2)">${esc(q.refText)}</span>
      </div>
      <div style="margin-top:6px;font-size:12px">${msg}</div>
      <div style="margin-top:8px"><button class="btn sm primary" id="iqNext" type="button">下一题 →</button></div>`;
      $("#iqNext",host).onpointerdown=()=>{ SFX.tap(); qi++; drawQ(); };
    }
  }
  drawQ();
}
function wTopic(x){ return (x.pid&&x.pid.includes("-")?x.pid.split("-").slice(0,2).join("-"):(x.pid||x.qid))||"杂"; }
/* 兜底题库：AI 失败且本任务静态题为空时，同幕复用题池，保证温故试炼永不 0/0 空转 */
function fallbackQuiz(q){
  const own=D.quizzes[q.id]||[];
  if(own.length) return own;
  const pool=[];
  DAYS.forEach(d=>d.quests.forEach(x=>{ if(x.act===q.act){ const zz=D.quizzes[x.id]; if(zz&&zz.length) pool.push(...zz); } }));
  const src=pool.length?pool:Object.values(D.quizzes).flat().filter(v=>v&&v.length);
  const out=[], used=new Set();
  while(out.length<4&&used.size<src.length){ const k=Math.floor(Math.random()*src.length); if(used.has(k))continue; used.add(k); out.push(src[k]); }
  return out;
}
function renderStar(){
  const byTopic={};
  st.wrong.forEach(x=>{ const t=wTopic(x); byTopic[t]=(byTopic[t]||0)+1; });
  const top=Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,n])=>t+"×"+n).join(" · ");
  const ov=panel(`<h2>星盘 · 错题</h2><div class="mt">玄机夫人记下的每一道错题，答对后方可移出星盘${st.wrong.length?`<br>共 ${st.wrong.length} 题${top?` · 高发：${esc(top)}`:""}`:""}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><button class="btn sm primary" id="starQuizBtn" type="button">✦ 随机小考</button><span style="color:var(--ink2);font-size:12.5px">无错题也可主动演练，答错自动入盘</span></div><div id="wHost"></div>`);
  const host=$("#wHost",ov);
  $("#starQuizBtn",ov).onpointerdown=()=>{ SFX.tap(); miniQuiz(); };
  // 小考题池：已解锁日全部静态可试题（跨任务复用）
  function quizPool(){
    const pool=[];
    DAYS.forEach(d=>{ if(d.day>st.unlocked) return;
      d.quests.forEach(q=>{ const zz=D.quizzes[q.id]; if(zz&&zz.length) pool.push(...zz); }); });
    return pool;
  }
  function miniQuiz(){
    const pool=quizPool();
    if(!pool.length){ host.innerHTML=`<div class="missing" style="text-align:center;padding:30px">题池待充盈——先解锁更多日程。</div>`; return; }
    const picked=[], used=new Set();
    while(picked.length<3&&used.size<pool.length){ const k=Math.floor(Math.random()*pool.length); if(used.has(k))continue; used.add(k); picked.push(pool[k]); }
    let qi=0, okN=0;
    function drawOne(){
      if(qi>=picked.length){
        host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">小考终了：答对 ${okN}/${picked.length}。${okN===picked.length?"星盘为你增辉。":"错者已记入星盘，玄机夫人会安排它们再见你。"}</div>
          <div style="margin-top:8px"><button class="btn sm" id="mqBack" type="button">← 返回星盘</button></div>`;
        $("#mqBack",host).onpointerdown=()=>{ SFX.tap(); listView(); };
        save(); return;
      }
      const z=picked[qi], isJudge=z.kind==="judge";
      host.innerHTML=`<div class="qz"><span class="kk">小考 ${qi+1}/${picked.length}${z.pid?` · ${esc(z.pid)}`:""}</span>${esc(z.q)}</div>
        ${isJudge?`<div class="jbtns"><button class="btn" id="qt" type="button">真</button><button class="btn" id="qf" type="button">伪</button></div>`
          :`<input id="qin" style="width:100%;border:1px solid var(--hair);font:inherit;padding:8px" placeholder="作答" autocomplete="off"><div style="margin-top:8px"><button class="btn primary" id="qok" type="button">作答</button></div>`}
        <div class="fb" id="qfb" style="display:block;margin-top:10px;line-height:1.7"></div>`;
      const fb=$("#qfb",host); let done=false;
      const judge=v=>{ if(done)return; done=true; (v?SFX.ok():SFX.no());
        if(v){ okN++; fb.className="fb ok"; }
        else{ st.wrong.push({qid:"star",pid:z.pid||"",text:z.q,okA:(isJudge?(z.a?"真":"伪"):z.a),at:new Date().toISOString(),src:"小考"}); fb.className="fb no";
          if(window.WDMem){ const pt=D.pointsLib.find(p=>p.id===z.pid);
            WDMem.wrong("xuanji",wTopic({pid:z.pid||""}),pt?+pt.star:null); } }
        fb.style.color=v?"var(--ok)":"var(--danger)";
        fb.innerHTML=(v?"✓ 对了。":"✗ 不对。")+`正确答案：<b style="color:var(--gold)">${esc(String(isJudge?(z.a?"真":"伪"):z.a))}</b>。${esc(z.why||"")}`;
        const nx=document.createElement("button"); nx.className="btn sm primary"; nx.type="button"; nx.textContent="知道了"; nx.style.marginTop="6px";
        nx.onpointerdown=()=>{ SFX.tap(); qi++; drawOne(); };
        fb.appendChild(document.createTextNode(" ")); fb.appendChild(nx); save();
      };
      if(isJudge){ $("#qt",host).onpointerdown=()=>judge(true); $("#qf",host).onpointerdown=()=>judge(false); }
      else{ const inp=$("#qin",host); inp.focus();
        const sub=()=>judge(z.accept.some(a=>normalize(a)===normalize(inp.value))||normalize(inp.value).includes(normalize(z.a)));
        $("#qok",host).onpointerdown=sub; inp.onkeydown=e=>{ if(e.key==="Enter") sub(); }; }
    }
    drawOne();
  }
  // 列表视图
  function listView(){
    const w=st.wrong.slice(-40).reverse();
    host.innerHTML=w.length? w.map((x,i)=>`<div class="wrongrow"><div><b>${esc(x.pid||"")}</b> ${esc(x.text.slice(0,70))}<br><span style="color:var(--ink2);font-size:12px">正确：${esc(String(x.okA).slice(0,40))} · ${esc(wTopic(x))} · ${esc(x.at.slice(0,10))}</span></div><button class="btn sm retry" data-i="${st.wrong.length-1-i}">再答</button></div>`).join("")
      :`<div class="missing" style="text-align:center;padding:30px">星盘干净——继续保持。<br>也可点上方「随机小考」，让玄机夫人先考你几题。</div>`;
    host.querySelectorAll(".retry").forEach(b=>{ b.onpointerdown=()=>{ SFX.tap(); retryView(+b.dataset.i); }; });
  }
  // 再答视图（同一弹窗内切换，避免叠加）
  function retryView(idx){
    const x=st.wrong[idx]; if(!x){ listView(); return; }
    const isJudge=(x.okA==="真"||x.okA==="伪");
    host.innerHTML=`<button class="btn sm ghost" id="rBack" type="button">← 返回错题列表</button>
      <div class="qz" style="margin-top:10px"><span class="kk">出自 ${esc(x.qid||"")} ${esc(x.pid||"")}</span>${esc(x.text)}</div>
      ${isJudge
        ? `<div class="jbtns"><button class="btn" id="rt" type="button">真</button><button class="btn" id="rf" type="button">伪</button></div>`
        : `<input id="rin" style="width:100%;border:1px solid var(--hair);font:inherit;padding:8px" placeholder="作答" autocomplete="off"><div style="margin-top:8px"><button class="btn primary" id="rok" type="button">作答</button></div>`}
      <div class="fb" id="rfb" style="display:block;margin-top:10px;line-height:1.7"></div>`;
    $("#rBack",host).onpointerdown=()=>{ SFX.tap(); listView(); };
    let rAns=false;
    const rfb=$("#rfb",host);
    const finish=(ok)=>{
      if(rAns) return; rAns=true;   // 反馈态锁定
      const rt=$("#rt",host), rf=$("#rf",host), rok=$("#rok",host), rin=$("#rin",host);
      [rt,rf,rok].forEach(b=>{ if(b) b.disabled=true; }); if(rin) rin.disabled=true;
      if(ok) SFX.ok(); else SFX.no();
      rfb.className = ok ? "fb ok" : "fb no";
      rfb.style.color = ok ? "var(--ok)" : "var(--danger)";
      rfb.innerHTML=(ok?"✓ 这次对了——错题移出星盘。":"✗ 仍不对——再记一次。")
        +`正确答案：<b style="color:var(--gold)">${esc(String(x.okA))}</b>。`;
      const got=document.createElement("button");
      got.className="btn sm primary"; got.type="button"; got.textContent="知道了";
      got.style.marginTop="6px";
      got.onpointerdown=()=>{
        SFX.tap();
        if(ok){ st.wrong.splice(idx,1); if(window.WDMem)WDMem.right("xuanji",wTopic(x)); }      // 答对：移除该错题，记忆同步销账
        else { x.at=new Date().toISOString(); } // 答错：更新时间置顶，不重复新增
        save(); listView();
      };
      rfb.appendChild(document.createTextNode(" ")); rfb.appendChild(got);
    };
    const rt=$("#rt",host);
    if(rt){
      rt.onpointerdown=()=>finish(x.okA==="真");
      $("#rf",host).onpointerdown=()=>finish(x.okA==="伪");
    } else {
      const rin=$("#rin",host); rin.focus();
      const sub=()=>finish(normalize(rin.value)===normalize(x.okA));
      $("#rok",host).onpointerdown=sub;
      rin.onkeydown=e=>{ if(e.key==="Enter") sub(); };
    }
  }
  listView();
}

function downloadFile(name,text,mime){
  try{
    const b=new Blob([text],{type:mime||"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast("导出失败："+e.message); }
}
function pickFile(accept,cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) cb(f); };
  document.body.appendChild(inp); inp.click(); inp.remove();
}

const DS_MODEL="deepseek-chat";
/* v2：密钥独立键（WZ-017）——不再入存档，导出存档不再泄漏密钥 */
const DS_KEY_STORE="wdzx.dskey";
function dsKeyGet(){

}
function dsKeySet(v){

/* AI 健康状态（R1.3b）：ok / off（未配密钥）/ down（网络/限流临时异常）/ error（密钥/额度） */
let aiHealth="off";
function dsReady(){ return !!(dsKeyGet() && dsKeyGet().trim()); }
function quizStage(qid){ const n=st.quizAttempts[qid]||0; return n===0?"first":n===1?"second":"multi"; }

/* v2：参数分档（R1.2a，DeepSeek 官方温度建议校准：对话角色扮演 1.1 起步） */
const DS_PROFILES={
  chat:      {temperature:1.1,frequency_penalty:0.4,presence_penalty:0.25,max_tokens:400},
  director:  {temperature:1.0,frequency_penalty:0.3,presence_penalty:0.2,max_tokens:900},
  directorplan:{temperature:0.6,max_tokens:300,response_format:{type:"json_object"}},
  summary:   {temperature:0.5,max_tokens:500},
  evolve:    {temperature:0.6,max_tokens:1000,response_format:{type:"json_object"}},
  quiz:      {temperature:0.7,max_tokens:1200,response_format:{type:"json_object"}},
  persona:   {temperature:0.6,max_tokens:1000,response_format:{type:"json_object"}},
  questbrief:{temperature:0.7,max_tokens:900,response_format:{type:"json_object"}},

};

/* v2：callLog（R1.3d）——耗时/缓存命中/重试/错误码，内存环队列 + 截断落盘 */
let _callLog=[];
function callLog(entry){
  entry.t=new Date().toISOString();
  _callLog.push(entry); if(_callLog.length>80) _callLog=_callLog.slice(-80);
  try{ localStorage.setItem("wdzx.calllog",JSON.stringify(_callLog.slice(-40))); }catch(e){}
}

/* v2：重试判定（R1.2c）——仅 429/5xx/网络错误退避重试 1 次；401/402/403 直接异常态 */
function _retryable(status){ return status===429||status>=500; }
function _backoffMs(attempt){ return Math.min(8000,600*Math.pow(2,attempt))+Math.random()*400; }

/* dsChat v2（R1.2）：
   messages 标准多轮；opts 可为 true（旧 json 兼容，映射为 evolve 档）或 {kind,tools,stream}。
   - kind ∈ chat/director/summary/evolve/quiz/persona/questbrief/polish → 参数分档
   - opts.tools 传入时启用 function calling（agent loop 由 WDChat.respondWithTools 驱动）
   - 流式：kind=chat/polish 且未传 tools 且提供 onDelta 回调时 stream:true（含 include_usage）
   返回：普通文本 / 流式完整文本；带 tools 时返回 {content,toolCalls} */
async function dsChat(messages, opts, onDelta){
  if(!dsReady()) throw new Error("未配置密钥");
  const o=(opts===true)?{kind:"evolve"}:((opts&&typeof opts==="object")?opts:{});
  const kind=o.kind||"chat";
  const profile=Object.assign({},DS_PROFILES[kind]||DS_PROFILES.chat);
  const key=dsKeyGet().trim();
  const wantTools=!!o.tools;
  const wantStream=(kind==="chat"||kind==="polish")&&!wantTools&&typeof onDelta==="function";
  let attempt=0, lastErr=null;
  while(attempt<=1){ /* 重试 ≤1 次（R1.2c） */
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), wantStream?12000:22000); /* v2：流式首包 12s（R1.2b） */
    const t0=Date.now();
    try{
      const body={model:DS_MODEL,messages,temperature:profile.temperature,
        max_tokens:profile.max_tokens,
        ...(profile.frequency_penalty!=null?{frequency_penalty:profile.frequency_penalty}:{}),
        ...(profile.presence_penalty!=null?{presence_penalty:profile.presence_penalty}:{}),
        ...(profile.response_format?{response_format:profile.response_format}:{}),
        ...(wantTools?{tools:o.tools,tool_choice:"auto"}:{}),
        ...(wantStream?{stream:true,stream_options:{include_usage:true}}:{})};
      const r=await fetch("https://api.deepseek.com/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify(body),
        signal:ctrl.signal});
      clearTimeout(t);
      if(r.status===401){ aiHealth="error"; callLog({kind,err:401,ms:Date.now()-t0}); throw new Error("密钥无效(401)"); }
      if(r.status===402||r.status===403){ aiHealth="error"; callLog({kind,err:r.status,ms:Date.now()-t0}); throw new Error("额度不足或禁止("+r.status+")"); }
      if(_retryable(r.status)){ throw Object.assign(new Error("可重试("+r.status+")"),{status:r.status}); }
      if(!r.ok){ callLog({kind,err:r.status,ms:Date.now()-t0}); throw new Error("接口异常("+r.status+")"); }
      aiHealth="ok";
      /* ===== 流式读取（R1.2b：SSE 逐 delta） ===== */
      if(wantStream){
        let full="", usage=null;
        const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
        while(true){
          const {done,value}=await reader.read();
          if(done) break;
          buf+=dec.decode(value,{stream:true});
          const lines=buf.split("\n"); buf=lines.pop();
          for(const line of lines){
            const s=line.trim();
            if(!s.startsWith("data:")) continue;
            const payload=s.slice(5).trim();
            if(payload==="[DONE]") continue;
            try{
              const j=JSON.parse(payload);
              const d=j.choices&&j.choices[0]&&j.choices[0].delta;
              if(d&&d.content){ full+=d.content; try{ onDelta(d.content,full); }catch(e){} }
              if(j.usage) usage=j.usage;
            }catch(e){}
          }
        }
        callLog({kind,ms:Date.now()-t0,stream:true,cached:usage&&usage.prompt_cache_hit_tokens||0});
        const c=full.trim();
        if(!c) throw new Error("返回为空");
        return c;
      }
      /* ===== 非流式 ===== */
      const j=await r.json();
      callLog({kind,ms:Date.now()-t0,cached:j.usage&&j.usage.prompt_cache_hit_tokens||0,retry:attempt>0});
      const msg=j.choices&&j.choices[0]&&j.choices[0].message;
      if(!msg) throw new Error("返回为空");
      if(msg.tool_calls&&msg.tool_calls.length){
        return {content:msg.content||"",toolCalls:msg.tool_calls};
      }
      const c=msg.content;
      if(!c) throw new Error("返回为空");
      return c.trim();
    }catch(e){
      clearTimeout(t);
      lastErr=e;
      const isAbort=/abort/i.test(String(e&&e.name||e));
      if(isAbort||e&&e.status&&_retryable(e.status)){
        if(attempt<1){ attempt++; await new Promise(rs=>setTimeout(rs,_backoffMs(attempt))); continue; }
        aiHealth="down"; callLog({kind,err:isAbort?"timeout":"net",ms:Date.now()-t0,retried:1});
        throw new Error("网络超时或限流，重试后仍失败");
      }
      throw e;
    }
  }
  throw lastErr||new Error("未知错误");
}

const OBSOLETE_TERMS=(window.WDRegistry&&WDRegistry.obsoleteTerms())||[];
/* 生成 NPC 人设卡片（可带修改意见重生成）。用户在配置中心输入的人设描述作为硬约束，
   AI 须完全匹配该描述，禁止生成矛盾特质（如用户写"活泼可爱"则不得出现"沉默寡言"）。 */
async function genPersona(npcId, feedback){
  const npc=D.npcs.find(n=>n.id===npcId)||NPC[npcId];
  const persona=st.personas[npcId];
  /* 用户在配置中心输入的人设描述基准（WDCfg.npcPersonas）——作为第一参考硬约束 */
  const customPersona=(window.WDCfg&&WDCfg.npcPersona)?WDCfg.npcPersona(npcId):"";
  const sys="你是游戏角色设定师。基于给定的游戏世界背景与NPC基础信息，产出严谨的角色人设卡片。每个角色须有明确的个人目标与角色弧线，体现她在故事中的目的与成长，而非只是功能性NPC。只输出JSON。";
  const user="游戏背景信息：\n"+JSON.stringify(buildWorldBrief(),null,1)
    +"\n\n要设定的NPC："+JSON.stringify({id:npcId,姓名:dName(npcId),称号:dTitle(npcId),职能:NPC_ROLE[npcId]||"",背景:npc.intro})
    +(customPersona?("\n\n【用户设定的角色基准·硬约束】"+customPersona
      +"——你必须完全匹配此描述生成人设：personality/style/identity 字段须与此基准一致，"
      +"严禁出现与用户设定相矛盾的特质（如用户写「活泼可爱」则不得出现「沉默寡言/冷淡/内敛」等反义描述）。"
      +"若用户设定了具体性格词，personality 数组必须包含该词或其近义表达。"):"")
    +(persona?("\n\n当前已有人设（供参考，若含旧概念须改写）："+JSON.stringify(persona.card)):"")
    +(feedback?("\n\n用户的修改意见（必须采纳）："+feedback):"")
    +"\n\n【世界观硬约束】本游戏世界观是「玩家意外跌入导游异次元，遗忘之雾入侵，玩家通关导游试炼以拯救世界并重返家园」。"
    +"严禁出现以下已淘汰的旧概念："+OBSOLETE_TERMS.join("、")+"。"
    +"人设须贴合导游异次元的传奇导游设定，性格鲜明、可信。"
    +((window.WDRegistry&&WDRegistry.arcSeedOf)?("\n\n该NPC的目标/弧线基线（生成时须贴合，可润色不可偏离）："+JSON.stringify(WDRegistry.arcSeedOf(npcId))):"")
    +"\n\n请输出JSON，字段：name(姓名)、identity(身份背景，30-50字，须体现其导游职能)、personality(性格特征，3-4个短语，必须与用户设定基准一致)、style(对话风格描述，必须与用户设定基准一致)、relations(与其他角色关系数组，每项{name,rel})、goal(此角色个人目标：她想要什么，30字内，贴合导游异次元世界观)、arc(角色弧线：她在这四十五日里会如何变化，40字内，渐进不突兀)。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], {kind:"persona"});
  let card;
  try{ card=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) card=JSON.parse(m[0]); else throw e; }
  card.id=npcId; card.name=card.name||dName(npcId);
  /* 保证 personality 为数组，便于后续统一处理与直接编辑 */
  if(typeof card.personality==="string") card.personality=card.personality.split(/[、,，;；\s]+/).filter(Boolean);
  if(!Array.isArray(card.personality)) card.personality=[];
  if(typeof card.goal==="string") card.goal=card.goal.slice(0,60);
  if(typeof card.arc==="string") card.arc=card.arc.slice(0,80);
  return card;
}
/* 生成任务说明：游戏隐喻叙事 + 背景故事 + 知识拓展（替代旧版独立任务描述模块） */
async function genQuestBrief(q){
  const npc=NPC[q.npc]||NPC.qingxuan;
  const persona=st.personas[q.npc]&&st.personas[q.npc].card;
  const sys="你是日式轻小说RPG《问道之旅·四十五日》的叙事引擎，文风对标日式轻小说与GALGAME：克制、有光影与画面、有温度，句子长短错落，留白比说尽更高级。\n"
    +"故事背景（序章已向玩家讲过，scene里不必复述设定）：玩家是意外坠入「导游次元」的普通现代人——『域外之人』，已与圣女候选云蘅绑定、与记忆精灵璇玑结下灵魂契约。他只有走完四十五日、五幕导游试炼，在金榜台完成神圣导游就职仪式，云蘅才能恢复圣女之力、以圣器驱散遗忘之雾，界门才会重新为他打开。NPC是他的同行者，不是老师、不是客服。\n"
    +"要求：\n"
    +"1. scene 先给一个具体画面：时辰、雾况、NPC正在做的一件小事或周遭一个动静，让玩家像翻开轻小说的一页，≤80字。不要概述世界观、不要喊口号。\n"
    +"2. line 是NPC本人当面对玩家说的话，自然承接scene，符合该角色性格，像轻小说/动画对白（有半句、停顿、潜台词），≤80字。\n"
    +"3. 「关卡定位」只作氛围参考：若定位不含战斗字样（如整备/夜巡/拓片/赏赐等），严禁出现妖兽、妖王、低吼、厮杀等战斗描写；即使是战斗定位，也重在气氛，不必喊打喊杀。\n"
    +"4. necessity/impact/reward 各≤70字：像同行者低声讲给他听的话，有温度、有信息，不写产品说明书、不做排比口号、不空洞夸奖；reward 不许出现具体数字（界面会另行显示）。\n"
    +"5. 严禁AI腔（首先/其次/总之/综上/值得一提的是）、禁教书先生口吻（掌握了/要记住/同学们/好好复习）、禁客服腔、禁网游黑话堆砌（新手村/刷本/开荒/掉落/团战/扛怪/上路）；可用轻小说式冒险语（试炼、封印、秘境、通关、修行、道力）。\n"
    +"6. 不剧透未解锁环节，不跑题，不给考试答案。\n"
    +"7. 只输出JSON。\n"
    +"8. 严禁使用已淘汰的旧概念：提灯、引灯、引魂灯、问道录、仙侠、仙师、封妖塔、幻纱行、机关童子、观星者、掌灯、镇塔尊者；统一用导游异次元世界观术语。\n"
    +"【剧情先行·任务发布顺序】必须按以下顺序输出：\n"
    +"  ① scene：环境/事件/NPC当下的小动作，把玩家带进此刻，≤80字\n"
    +"  ② line：NPC承接画面，才对玩家说起这一程试炼，≤80字\n"
    +"  ③ 任务三要素（necessity/impact/reward）依次写：\n"
    +"     - necessity 此行为何：这一程为何只有他这个域外之人能走（就职仪式只认他），但要像角色说的话，不要复读标签，≤70字\n"
    +"     - impact 雾散之后：此程完成后云蘅圣女之力的复苏与驱雾救世的进展，≤70字\n"
    +"     - reward 此行所得：修行、铜钱与新的路——它们如何通向归乡、通向他返回原世界的那扇门，≤70字，不写数字\n"
    +"  ④ metaphor：一句有余韵的轻小说式旁注，概括此程在修行路上的意义，≤30字";
  // 汇总本任务试炼涉及的考点，供 AI 拓展
  const quiz=D.quizzes[q.id]||[];
  const pids=[...new Set(quiz.map(z=>z.pid).filter(Boolean))];
  const knowledge=pids.map(pid=>{
    const p=D.pointsLib.find(x=>x.id===pid);
    return p?(p.id+"："+p.text.slice(0,100)):"";
  }).filter(Boolean).join("\n");
  // 关联英文导游词
  const oralMap={"TAM":"tiananmen-square","GUG":"forbidden-city","TAN":"temple-of-heaven","SUM":"summer-palace","WAL":"great-wall","TOM":"ming-tombs"};
  const oralInfo=(q.covers||[]).map(c=>{
    const key=c.split("-")[0];
    const o=D.oralFull.find(x=>x.id===oralMap[key]);
    return o?(o.name+" "+o.words+"词"):"";
  }).filter(Boolean).join("、");
  const user="游戏背景信息：\n"+JSON.stringify(buildWorldBrief())
    +"\n\n当前任务："+JSON.stringify({日次:q.day,环节:qdn(q),类型:q.tlabel,目标:qdn({name:q.goal||""}),NPC:dName(q.npc)+"·"+dTitle(q.npc),关卡定位:questMetaphor(q),奖励:"+"+q.xp+"修行 +"+q.coin+"铜钱（仅供设定，台词不要念数字）"})
    +(persona?("\n\n该NPC已确认人设，台词必须符合："+JSON.stringify(persona)):"")
    +(knowledge?("\n\n任务涉及知识点（可在说明中自然拓展）：\n"+knowledge):"")
    +(oralInfo?("\n\n涉及英文导游词："+oralInfo):"")
    +"\n\n注意：「关卡定位」由隐喻引擎给出，只作氛围参考（战斗关才有妖物层级；非战斗关如整备/夜巡/拓片不得写战斗）。围绕当前任务本身叙事，自然借用定位中的意象即可，不要复读定位文字。"
    +"\n\n请输出JSON：{scene:string(一页轻小说式的场景画面，≤80字),line:string(NPC承接画面当面对玩家说的话，有性格有留白,≤80字),necessity:string(此行为何:像同行者低声说的话,点出就职仪式只认他这个域外之人,≤70字),impact:string(雾散之后:云蘅圣女之力复苏与驱雾救世的进展,≤70字),reward:string(此行所得:修行/铜钱/新的路如何通向归乡,≤70字,不写数字),metaphor:string(有余韵的轻小说式旁注,≤30字)}。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], {kind:"questbrief"});
  let o;
  try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) o=JSON.parse(m[0]); else throw e; }
  o.scene=(o.scene||"").slice(0,120);
  o.line=(o.line||"").slice(0,120);
  o.necessity=(o.necessity||"").slice(0,100);
  o.impact=(o.impact||"").slice(0,100);
  o.reward=(o.reward||"").slice(0,100);
  if(o.metaphor) o.metaphor=String(o.metaphor).slice(0,50);
  /* 兼容旧缓存：若无三要素字段，将旧 brief 拆分为 necessity 兜底 */
  if(!o.necessity&&o.brief) o.necessity=String(o.brief).slice(0,100);
  o.v=2;   /* v33 轻小说 schema：旧 prompt 生成的缓存一律失效重生成 */
  o.at=new Date().toISOString();
  return o;
}
/* AI 出题：模仿真实考题，按复习阶段产生细微变化；失败时由调用方降级为静态题 */
async function genQuiz(q, stage){
  const baseQuiz=D.quizzes[q.id]||[];
  if(!baseQuiz.length) throw new Error("本题组无静态题参照");
  const pids=[...new Set(baseQuiz.map(z=>z.pid).filter(Boolean))];
  // 知识点全文（截 120 字，比 genQuestBrief 略长以保证出题精度）
  const knowledge=pids.map(pid=>{
    const p=D.pointsLib.find(x=>x.id===pid);
    return p?(pid+"："+p.text.slice(0,120)):"";
  }).filter(Boolean).join("\n");
  // 学习材料要点补充
  const lec=(D.lectures[q.id]||[]).flatMap(p=>(p.items||[]).map(it=>({id:it.id,text:it.text.slice(0,80)})));
  const lecSeen=new Set(), lecItems=[];
  for(const it of lec){ if(!pids.includes(it.id)&&!lecSeen.has(it.id)){ lecSeen.add(it.id); lecItems.push(it.id+"："+it.text); } if(lecItems.length>=12) break; }
  const lecText=lecItems.join("\n");
  // 静态题目作为样题（精简，只取关键字段）
  const sample=baseQuiz.map(z=>({kind:z.kind,q:String(z.q).slice(0,80),a:z.a,pid:z.pid}));
  // 阶段变化指令
  const stageInfo={
    first:{label:"初次学习",instr:"标准真题风格，与样题考点一致但重新措辞，不改变答案知识点"},
    second:{label:"二次复习",instr:"更换切入角度或提问方式（如是非题改为反向表述、填空换位），不改变考点和答案"},
    multi:{label:"多次复习",instr:"增加迷惑性干扰项；是非题可近义替换关键数字/名称；填空可设近义陷阱，但 accept 必须收录所有合理写法，不改变核心考点"}
  };
  const si=stageInfo[stage]||stageInfo.first;
  const sys="你是北京导游资格考试的出题专家。根据给定的知识点和样题，按照真实考试风格出题。\n1. 题目严格基于给定知识点，不超纲\n2. 题型为是非题（judge）和填空题（blank），模仿真实考试\n3. "+si.instr+"\n4. 每题提供解析（why字段，≤60字），注明出处考点\n5. 只输出JSON";
  const user="任务："+JSON.stringify({名称:qdn(q),目标:qdn({name:q.goal||""}),日次:q.day})
    +"\n\n知识点：\n"+knowledge
    +(lecText?"\n\n学习材料要点：\n"+lecText:"")
    +"\n\n样题（仅供参考考点和风格，请出不同的题目）：\n"+JSON.stringify(sample)
    +"\n\n出题阶段："+si.label+"（"+si.instr+"）"
    +"\n\n请输出JSON：{\"questions\":["+baseQuiz.length+"道题]}。每题字段：kind(\"judge\"或\"blank\")、q(题干，填空用▁占位)、a(judge为true/false布尔值、blank为字符串答案)、accept(仅blank，字符串数组，须含a本身及别名/简写)、why(解析≤60字)、pid(必须是给定知识点id之一:"+pids.join("/")+")。";
  const raw=await dsChat([{role:"system",content:sys},{role:"user",content:user}], {kind:"quiz"});
  let o;
  try{ o=JSON.parse(raw.replace(/^```json|```$/g,"").trim()); }
  catch(e){ const m=raw.match(/\{[\s\S]*\}/); if(m) o=JSON.parse(m[0]); else throw e; }
  const arr=Array.isArray(o)?o:(o.questions||[]);
  if(!Array.isArray(arr)||!arr.length) throw new Error("AI出题格式异常");
  const pidSet=new Set(pids);
  return arr.filter(z=>z&&z.kind&&z.q).slice(0, baseQuiz.length).map(z=>{
    const kind=z.kind==="blank"?"blank":"judge";
    let a=z.a, accept=z.accept, pid=z.pid, why=z.why;
    if(kind==="judge"){
      a=(a===true||a==="true")?true:(a===false||a==="false")?false:Boolean(a);
      if(typeof a!=="boolean") a=Boolean(a);
    } else {
      a=String(a);
      accept=Array.isArray(accept)&&accept.length?accept.map(String):[a];
      if(!accept.includes(a)) accept.unshift(a);
    }
    if(!pid||!pidSet.has(pid)) pid=pids[0]||pid;
    if(!why||typeof why!=="string") why="出处：考点 "+pid;
    else why=String(why).slice(0,120);
    const out={kind,q:String(z.q),a,why,pid};
    if(kind==="blank") out.accept=accept;
    return out;
  });
}

/* 角色别名 → npcId（含全名与常用称呼，均取自 D.npcs 真实名，避免错字） */
/* v2（R2.1）：@提及别名从角色注册表派生 */
const MENTION_ALIASES=(window.WDRegistry&&WDRegistry.aliasMap())||{};
function parseMention(text){
  const m=/@([A-Za-z0-9_\u4e00-\u9fa5]{2,8})/.exec(text);
  if(!m) return null;
  const tok=m[1];
  // @所有人/各位/全员/大家 → 全员应答
  if(/^(所有人|各位|全员|大家|全部|所有人呢|都有)$/.test(tok)) return "__ALL__";
  for(const id in MENTION_ALIASES){ if(MENTION_ALIASES[id].some(a=>tok===a||tok.startsWith(a)||a.startsWith(tok)&&tok.length>=2)) return id; }
  // 玩家自定义名/称号同样可被 @ 触发（ID 仍为系统固定值）
  if(window.WDCfg){
    for(const id of Object.keys(NPC)){
      const cn=WDCfg.npcName(id,""), ct=WDCfg.npcTitle(id,"");
      if((cn&&(tok===cn||tok.startsWith(cn)))||(ct&&(tok===ct||tok.startsWith(ct)))) return id;
    }
  }
  return null;
}

/* ==================== @ 提及弹窗选单 ==================== */
let _mentionPop=null;
const _mentionState={open:false,atPos:-1,token:"",list:[],sel:0};

function filterMentionList(token){
  const t=(token||"").trim();
  const out=[];
  const allKw=["所有人","各位","全员","大家","全部"];
  if(!t||allKw.some(k=>k.startsWith(t)||(t.length>=2&&k.includes(t)))){
    out.push({id:"__ALL__",name:"所有人",title:"全员应答",kind:"all"});
  }
  const seen=new Set(["__ALL__"]);
  for(const id in MENTION_ALIASES){
    const aliases=MENTION_ALIASES[id]||[];
    const hit=!t||aliases.some(a=>a===t||a.startsWith(t)||(t.length>=2&&a.includes(t)));
    if(!hit||seen.has(id)) continue;
    seen.add(id);
    out.push({id,name:dName(id),title:dTitle(id),kind:"npc"});
  }
  return out;
}

function insertMention(value,atPos,endPos,name){
  const before=value.slice(0,atPos+1);
  const after=value.slice(endPos);
  const next=before+name+after;
  return{value:next,caret:(before+name).length};
}

function onChatInput(inp){
  const pos=inp.selectionStart??inp.value.length;
  const upTo=inp.value.slice(0,pos);
  const m=upTo.match(/@([^\s@，。、,；;:！？!?]{0,8})$/);
  if(!m){closeMention();return;}
  _mentionState.atPos=m.index;
  _mentionState.token=m[1];
  openMention(inp,m[1]);
}

function openMention(inp,token){
  const list=filterMentionList(token);
  if(!list.length){closeMention();return;}
  _mentionState.list=list;_mentionState.sel=0;_mentionState.open=true;
  if(!_mentionPop){
    _mentionPop=document.createElement("div");
    _mentionPop.className="mention-pop";
    Object.assign(_mentionPop.style,{
      position:"absolute",zIndex:"9999",maxHeight:"42vh",overflowY:"auto",
      background:"var(--bg)",border:"1px solid var(--border-lit)",
      borderRadius:"6px",boxShadow:"0 2px 12px rgba(0,0,0,.35)",
      fontSize:"13px",fontFamily:"zpix,monospace",minWidth:"160px",
      padding:"4px"
    });
    document.body.appendChild(_mentionPop);
  }
  renderMentionList(inp);
  positionMention(inp);
}

function renderMentionList(inp){
  const items=_mentionState.list.map((it,i)=>{
    const sel=i===_mentionState.sel;
    return '<div class="ment-item" data-i="'+i+'" style="padding:7px 10px;cursor:pointer;'+(sel?"background:var(--gold);color:var(--bg);border-radius:4px;":"")+'">'
      +'<b>'+esc(it.name)+'</b> <span style="opacity:.7;font-size:11px">'+esc(it.title)+'</span></div>';
  }).join("");
  _mentionPop.innerHTML=items;
  _mentionPop.querySelectorAll("[data-i]").forEach(el=>{
    el.onpointerdown=e=>{e.preventDefault();selectMention(inp,+el.dataset.i);};
  });
}

function positionMention(inp){
  const r=inp.getBoundingClientRect();
  const popH=Math.min(_mentionPop.offsetHeight||160,220);
  _mentionPop.style.left=r.left+"px";
  _mentionPop.style.top=(r.top-popH-4)+"px";
  _mentionPop.style.width=Math.max(r.width,160)+"px";
}

function handleMentionKey(e,inp){
  if(!_mentionState.open) return false;
  const n=_mentionState.list.length;
  if(e.key==="ArrowDown"){e.preventDefault();_mentionState.sel=(_mentionState.sel+1)%n;renderMentionList(inp);return true;}
  if(e.key==="ArrowUp"){e.preventDefault();_mentionState.sel=(_mentionState.sel-1+n)%n;renderMentionList(inp);return true;}
  if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();selectMention(inp,_mentionState.sel);return true;}
  if(e.key==="Escape"){e.preventDefault();closeMention();return true;}
  return false;
}

function selectMention(inp,idx){
  const it=_mentionState.list[idx];if(!it) return;
  const end=inp.selectionStart??inp.value.length;
  const r=insertMention(inp.value,_mentionState.atPos,end,it.name);
  inp.value=r.value;
  try{inp.setSelectionRange(r.caret,r.caret);}catch(e){}
  closeMention();

/* v2（R2.3）：序章叙事从 worldBrief 派生——用户覆写世界观后序章同步（默认世界观输出与 v1 等价文案） */
const DEFAULT_INTRO_NARRATIVE="你意外降临「导游次元」——一个正被遗忘之雾吞噬的娘化世界。所有居民皆为女性，唯独你是男性外来者。这座次元最后的净土是北京。圣女候选云蘅正在此举行神圣导游就职仪式，却在仪式中途遭遗忘之雾侵袭——你的降临打断了仪式，却也让你与云蘅形成了绑定。记忆精灵璇玑也在混乱中与你意外建立灵魂契约。四十五日之内，完成五幕试炼、踏上金榜台就职神圣导游，云蘅就能恢复圣女之力，用导游圣器驱逐遗忘之雾。";
/* 从自定义世界观文本里取序章用的叙事开头：取前 2 个完整句、≤180 字；不足 10 个汉字视为无效 */
function narrativeLead(raw,prefix){
  const body=String(raw||"").replace(/[「」『』【】]/g,"").replace(/\s+/g," ").trim();
  const cjk=(body.match(/[\u4e00-\u9fff]/g)||[]).length;
  if(cjk<10) return "";
  const sentences=body.split(/(?<=[。！？!?…])/).map(s=>s.trim()).filter(Boolean);
  let out="";
  for(const s of sentences){
    if((out+s).length>180) break;
    out+=s;
    if(out.length>=60) break;   /* 已够一段，不必凑满 */
  }
  if(!out) out=body.slice(0,180);
  return (prefix||"")+out;
}
/* 递归收集 JSON brief 中的字符串值，优先取叙事性键名 */
function narrativeFromJson(obj){
  const KEYS=/世界观|世界设定|背景|故事|序章|简介|概述|设定|world|story|intro|setting/i;
  const found=[];
  const walk=o=>{
    if(o==null) return;
    if(typeof o==="string"){ return; }
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(typeof o==="object"){
      for(const k of Object.keys(o)){
        const v=o[k];
        if(typeof v==="string"){
          const cjk=(v.match(/[\u4e00-\u9fff]/g)||[]).length;
          if(cjk>=10) found.push({key:k,text:v,prio:KEYS.test(k)?0:1});
        }else if(typeof v==="object") walk(v);
      }
    }
  };
  walk(obj);
  if(!found.length) return "";
  found.sort((a,b)=>a.prio-b.prio||b.text.length-a.text.length);
  return narrativeLead(found[0].text);
}
function introNarrative(){
  /* v31：自定义 brief 可能是多行散文，也可能是配置面板里保存的 JSON（以「{」开头）；
     两种都要能取出一段人话；取不出有效叙事就回退默认长段，绝不能把「{」显示到序章 */
  try{
    const custom=(window.WDCfg&&WDCfg.customWorldBrief)?WDCfg.customWorldBrief():null;
    if(custom&&custom.trim()){
      const wb=WDChat.worldBrief();
      let lead="";
      if(typeof wb==="string"&&wb.trim()){
        const s=wb.trim();
        if(s[0]==="{"||s[0]==="["){ try{ lead=narrativeFromJson(JSON.parse(s)); }catch(e){} }
        if(!lead) lead=narrativeLead(s);
      }else if(wb&&typeof wb==="object"){
        lead=narrativeFromJson(wb);
      }
      if(lead) return lead;
    }
  }catch(e){}
  return DEFAULT_INTRO_NARRATIVE;
}

/* 序章结束：标记 arrive/bind/pact 三节点已演（防任务完成时重复触发），

function finishPrologue(){
  const ts=new Date().toISOString();
  st.cutscenes=st.cutscenes||{};
  ["arrive","bind","pact"].forEach(node=>{ if(!st.cutscenes[node]) st.cutscenes[node]=ts; });
  if(!st.dialogue.some(m=>m.cutscene==="arrive")){
    const mk=(node,npc)=>{ const b=PROLOGUE_SCRIPT.find(x=>x.id===node);
      return {id:"pl_"+node,role:"npc",npc,text:plNames(b.x),cutscene:node,at:ts,day:st.day}; };
    st.dialogue.push(mk("arrive","yunheng"),mk("pact","xuanji"),mk("bind","yunheng"));
    if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
  }
  record("序章","序章·降临完成");
  save();
  if(plState){ if(plState.timer) clearInterval(plState.timer); if(plState.el&&plState.el.isConnected) plState.el.remove(); plState=null; }
  render();
}

function dayMemoryPoints(day){

function qStage(q){
  if(qDone(q.id)) return {key:"done", label:"✓ 已完成"};
  if(questUnlocked(q)) return {key:"active", label:"▶ 进行中"};
  return {key:"locked", label:"🔒 未解锁"};
}
/* ==================== 可折叠层级任务树 ==================== */
/* 节点：{id,label,meta,state('done'|'cur'|'locked'|''),leaf,children:[]} */
function treeDefaultExpanded(node){
  if(!st._treeExp) st._treeExp={};
  if(st._treeExp[node.id]===undefined){
    // 默认：幕级展开；日级仅当日展开
    st._treeExp[node.id] = node.level===0 ? true : (node._defaultOpen===true);
  }
  return st._treeExp[node.id];
}
function setTreeExp(id,val){ if(!st._treeExp) st._treeExp={}; st._treeExp[id]=val; save(); }
function renderTreeNode(node){
  const hasKids = node.children && node.children.length>0;
  const expanded = hasKids && treeDefaultExpanded(node);
  const stateCls = node.state ? " "+node.state : "";
  const leafCls = node.leaf ? " leaf" : "";
  /* 叶子行只挂 data-leaf——若同时挂 data-toggle，bindTree 的 toggle 分支会拦截点击导致任务打不开 */
  return `<div class="tnode" data-level="${node.level}" data-has-children="${hasKids}" data-expanded="${expanded}" data-tid="${esc(node.id)}">
    <div class="trow${stateCls}${leafCls}" ${node.leaf?`data-leaf="${esc(node.id)}"`:`data-toggle="${esc(node.id)}"`}>
      <span class="ttog"${node.leaf?"":` data-toggle="${esc(node.id)}"`}>${hasKids?'<span class="tcar">▶</span>':''}</span>
      <span class="tdot"></span>
      <span class="tlabel">${esc(node.label)}</span>
      ${node.meta?`<span class="tmeta">${esc(node.meta)}</span>`:""}
    </div>
    ${hasKids?`<div class="tchildren">${node.children.map(renderTreeNode).join("")}</div>`:""}
  </div>`;
}
function bindTree(container, onLeaf){
  container.onpointerdown=e=>{
    /* 先查叶子：叶子行已不挂 data-toggle，此处顺序双保险 */
    const leaf=e.target.closest("[data-leaf]");
    if(leaf){ e.stopPropagation(); SFX.tap(); onLeaf&&onLeaf(leaf.dataset.leaf); return; }
    const tog=e.target.closest("[data-toggle]");
    if(tog){
      const n=tog.closest(".tnode"); if(!n) return;
      e.stopPropagation();
      const id=n.dataset.tid; const cur=n.dataset.expanded==="true";
      n.dataset.expanded=String(!cur); setTreeExp(id,!cur); SFX.tap();
    }
  };
}
function setAllTreeExpanded(nodes, val){
  const walk=ns=>ns.forEach(n=>{ if(!st._treeExp) st._treeExp={}; st._treeExp[n.id]=val; if(n.children) walk(n.children); });
  walk(nodes); save();
}
/* 构建 幕→日→任务 三级树 */
function buildQuestTree(){
  const acts=[...new Set(DAYS.map(d=>d.act))];
  return acts.map(act=>{
    const days=DAYS.filter(d=>d.act===act);
    let actDone=0, actAll=0;
    const dayNodes=days.map(d=>{
      const prog=dayProg(d); actDone+=prog.n; actAll+=prog.all;
      const isCur = d.day===st.day;
      const qNodes=d.quests.map(q=>{
        const s=qStage(q);
        return {id:q.id, level:2, leaf:true, state:s.key, label:q.name, meta:q.tlabel+"·"+q.dur+"分"};
      });
      return {id:"day:"+d.day, level:1, label:`第 ${d.day} 日 · 星期${d.week}`, meta:prog.n+"/"+prog.all,
        state: prog.n===prog.all?"done":(isCur?"cur":""), _defaultOpen:isCur, children:qNodes};
    });
    return {id:"act:"+act, level:0, label:D.acts[act], meta:actDone+"/"+actAll,
      state: actDone===actAll?"done":"", _defaultOpen:true, children:dayNodes};
  });
}

    const aid=a2[0], aname=a2[1], a2a=a2[2], b2=a2[3];
    h+='<div class="jrow"><div class="jact"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="'+scene[aid]+'"/></svg><div class="an">'+esc(aname)+'</div></div><div class="jnodes">';
    for(let i=a2a;i<=b2;i++){
      const dd=byDay[i], pp=dayProg(dd);
      let cls = i===st.day?"cur":(i>st.unlocked?"future":(pp.n===pp.all&&pp.all>0?"done":(pp.n>0?"part":"")));
      const isBoss=dd.quests.some(q2=>q2.type==="boss"&&q2.kind==="main");
      h+='<div class="jnode '+cls+(isBoss?" boss":"")+'" data-day="'+i+'">'+i+'</div>';
    }
    h+='</div></div>';
  });
  h+='</div><div class="note">图例：墨块=圆满 · 朱框=今日 · 浅朱=进行中 · 双框=章节大试炼 · 半透明=未解锁</div>';
  const ov=panel('<h2>旅程</h2><div class="mt">五幕四十五站 · 当前第 '+st.day+' 日（已解锁至第 '+st.unlocked+' 日）</div>'+h);
  ov.querySelectorAll("[data-day]").forEach(n=>{
    n.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const day=+n.dataset.day;
      if(day>st.unlocked){ return; }
      st.day=day; save();
      ov.remove();
      document.querySelectorAll(".navline button").forEach(x=>x.classList.toggle("on",x.dataset.v==="chat"));
      view="chat";
      renderChat();
    });
  });
}
boot();
/* v2（R3.3）：主动触发器——boot 后 30s 检查一次（本地规则零成本，每日 ≤3 条，可在配置中心关闭） */
setTimeout(()=>{
  try{
    if(window.WDChat&&WDChat.checkProactive){
      const p=WDChat.checkProactive();
      if(p&&p.npc&&NPC[p.npc]){
        const aqP=firstActiveQuest();
        const m={role:"npc",npc:p.npc,text:p.text,at:new Date().toISOString(),day:st.day,proactive:p.reason};
        if(aqP) m.refs=[{qid:aqP.id}];
        st.dialogue.push(m);
        if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
        save(); if(view==="chat") renderChat(true);
        toast(dName(p.npc)+"主动传音……","gold");
      }
    }
  }catch(e){}
},30000);
/* v2（R1.3b）：AI 健康徽标——对话页顶部状态点；aiHealth 由 dsChat 维护 */
window.addEventListener("wd:aicheck",()=>{ if(view==="chat") renderChat(true); });
// 注册 Service Worker 实现 PWA 离线 + 自动更新
// 关键：新 SW 激活时上报缓存版本，页面对比版本差异后精准重载一次——
// 否则大陆网络访问 github.io 不稳定时，旧 SW 会永远回落陈旧缓存（iPad 不刷新的根因）
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if(d.type === "swv" && d.v){
      const prev = localStorage.getItem("wdzx_swv");
      if(prev && prev !== d.v){ location.reload(); return; }
      localStorage.setItem("wdzx_swv", d.v);
    }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // 启动即检查 sw.js 更新；之后每 10 分钟再查一次（iOS 独立 PWA 无导航期更新保障）
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
      window.__wdzxReg = reg;
    }).catch(() => {});
  });
}

</script>
