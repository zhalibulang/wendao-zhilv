  /* ============ v54 批 1：c 类修诵·复述页 ============
     不看原文复述该段；提示按钮给主题词；想不起来可「看全文」回书页再进。
     三档自评：流畅诵出=完整（记实际用时）/ 断续想起 / 雾未散=不完整（不计分）。

  function renderStageRecite(){

    const stt={i:0,phase:"read",scores:[],full:false,fullScore:null};

      }
      const i=stt.i;
      const progLine=`句级进度 ${Math.min(i,total)}/${total}${stt.scores.length?` · 已复述句均 ${Math.round(stt.scores.reduce((a,b)=>a+b,0)/stt.scores.length)} 分`:""}`;
      if(stt.phase==="read"){
        stageHost.innerHTML=`<div style="padding:6px">
          <div style="font-size:13px;color:var(--neon);margin-bottom:6px;font-weight:bold">✦ 逐句精读 · 第 ${i+1}/${total} 句${o?` · ${esc(o.name)} §${o.sec+1}`:""}</div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:10px">${progLine}</div>
          <div class="book"><div class="bp">先读懂这一句</div>
            <div style="font-size:16px;line-height:1.9">${esc(sentences[i])}</div></div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sm primary" id="rcToRec" type="button">我记住了 · 遮文复述</button>
          </div>
        </div>`;
        $("#rcToRec",stageHost).onpointerdown=()=>{ SFX.tap(); stt.phase="recite"; persist(); draw(); };
        return;
      }
      stageHost.innerHTML=`<div style="padding:6px">
        <div style="font-size:13px;color:var(--neon);margin-bottom:6px;font-weight:bold">✦ 遮文复述 · 第 ${i+1}/${total} 句</div>
        <div style="font-size:11px;color:var(--dim);margin-bottom:10px">${progLine}</div>
        <textarea id="rcIn" placeholder="不看原文，凭记忆打出这一句……" style="width:100%;min-height:80px"></textarea>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm primary" id="rcSub" type="button">提交对照</button>
        </div>
        <div id="rcOut" style="margin-top:10px"></div>
      </div>`;
      const ta=$("#rcIn",stageHost); if(ta) ta.focus();
      $("#rcSub",stageHost).onpointerdown=()=>{ SFX.tap();
        const typed=(ta&&ta.value||"").trim();
        const score=oralScore(typed,sentences[i]);
        stt.scores[i]=score;
        const last=i===total-1;
        $("#rcOut",stageHost).innerHTML=`<div class="note" style="border-left-color:${score>=70?"var(--ok)":"var(--gold)"}">
          <div style="margin-bottom:4px">本句词命中 <b>${score}%</b>${score>=70?"——稳":(score>=40?"——磕绊可修":"——差距尚远")} · 重合度只作参考，逐词对照如下：</div>
          ${oralDiffHtml(typed,sentences[i],true)}</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm ${score>=70?"primary":""}" id="rcNext" type="button">${last?"句级皆过 · 通读整段":"下一句"}</button>
          <button class="btn sm ghost" id="rcRetry" type="button">本句再试一次</button>
        </div>`;
        $("#rcSub",stageHost).disabled=true;
        $("#rcRetry",stageHost).onpointerdown=()=>{ SFX.tap(); draw(); };
        $("#rcNext",stageHost).onpointerdown=()=>{ SFX.tap();
          if(last){ stt.full="read"; persist(); draw(); }
          else { stt.i=i+1; stt.phase="read"; persist(); draw(); }
        };
      };
    }
    /* v77：返回键=严格的上一步（不跳书页、不回首页）：
       v70：整段复述→整段通读；整段通读→末句原句；遮文复述→重读本句原句；第 N 句原句→上一句原句；第 1 句原句→交回 backOne 回书页 */
    innerBack=()=>{
      if(stt.full==="recite"){ stt.full="read"; persist(); draw(); return true; }
      if(stt.full==="read"){ stt.full=false; stt.i=sentences.length-1; stt.phase="read"; persist(); draw(); return true; }
      if(stt.phase==="recite"){ stt.phase="read"; persist(); draw(); return true; }
      if(stt.i>0){ stt.i--; stt.phase="read"; persist(); draw(); return true; }
      return false;
    };
    draw();
  }
  /* ============ v80：d 类传译·练习页（首读在书页完成；这里逐句"重读→练习"） ============
     每句先重读双语底稿，再遮住参考动笔；提交后逐词对照＋三档自评＋可选 AI 评讲。 */
  function renderStageTrans(){
    const cards=(q.cards||[]).map(rtCardOf).filter(Boolean);
    /* v80：{i,phase:"reread"|"practice"} 随暂离存档；旧档 ti 数字兼容 */
    const stt={i:0,phase:"reread"};
    if(!readonly){ const rp=(curProg()||{}).trans;
      if(rp){ try{ stt.i=Math.min(+rp.i||0,cards.length-1); stt.phase=rp.phase==="practice"?"practice":"reread"; }catch(e){} }
    }
    function persist(){ if(readonly)return; saveProg({trans:{i:stt.i,phase:stt.phase}}); }
    if(!recT0) recT0=Date.now();
    function finishAll(){
      const secs=Math.max(1,Math.round((Date.now()-recT0)/1000));
      stageHost.innerHTML=`<div style="padding:12px 6px">
        <div class="note" style="border-left-color:var(--ok)">${cards.length} 句传译皆已对照——用时 ${Math.round(secs/cards.length)} 秒/句。自评已入雾回潮名册。</div>
        ${readonly?'<div style="font-size:11px;color:var(--dim);margin-top:8px;text-align:center">回看模式 · 传译记录已留。</div>':""}</div>`;
      quizPerfect=true;
      if(!readonly){
        showClearGate({title:"五句皆通——此环功成",line:`双向往返 ${cards.length} 句，平均 ${Math.round(secs/cards.length)} 秒/句——灵脉之间的路你已走顺。确认交割，修行与灵铢即刻入账。`});
      } else if(finBtn){ finBtn.disabled=false; finBtn.textContent="交割 · 完成此环"; }
      SFX.win();
    }
    function draw(){
      if(stt.i>=cards.length){ finishAll(); return; }
      const c=cards[stt.i]; const dir=stt.i%2===0?"zh2en":"en2zh";
      const src=dir==="zh2en"?c.zh:c.en, ref=dir==="zh2en"?c.en:c.zh;
      if(stt.phase==="reread"){
        /* 重读：与书页同款中英分块，整句再过一遍 */
        stageHost.innerHTML=`<div style="padding:6px">
          <div style="font-size:13px;color:var(--neon);margin-bottom:8px;font-weight:bold">✦ 重读底稿 · 第 ${stt.i+1}/${cards.length} 句 · ${dir==="zh2en"?"此界文 → 彼界文":"彼界文 → 此界文"}</div>
          ${transCardPageHtml(c)}
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
            ${stt.i>0?'<button class="btn sm ghost" id="trRereadPrev" type="button">回上一句</button>':""}
            <button class="btn sm primary" id="trToPractice" type="button">读好了 · 遮住参考动笔</button>
          </div>
        </div>`;
        /* 重读态的校订按钮同样可用 */
        stageHost.querySelectorAll(".trans-edit-btn").forEach(btn=>{
          btn.onpointerdown=e=>{ e.stopPropagation(); SFX.tap();
            const lang=btn.dataset.lang, eid="oral:"+c.id+":"+lang;
            openEditor({id:eid,catLabel:"传译底稿 · "+c.id+" · "+(lang==="zh"?"中文":"英文"),
              title:eid,body:getEdit(eid,lang==="zh"?c.zh:c.en),editable:true,editId:eid,
              onSaved:()=>{ const f=rtCardOf(c.id); if(f){c.zh=f.zh;c.en=f.en;} draw(); }});
          };
        });
        $("#trToPractice",stageHost).onpointerdown=()=>{ SFX.tap(); stt.phase="practice"; persist(); draw(); };
        if(stt.i>0) $("#trRereadPrev",stageHost).onpointerdown=()=>{ SFX.tap(); stt.i--; stt.phase="practice"; persist(); draw(); };
        return;
      }
      /* 练习：只给题目，提交后逐词对照+自评 */
      stageHost.innerHTML=`<div style="padding:6px">
        <div style="font-size:13px;color:var(--neon);margin-bottom:8px;font-weight:bold">✦ 动笔传译 · ${stt.i+1}/${cards.length} · ${dir==="zh2en"?"此界文 → 彼界文":"彼界文 → 此界文"}</div>
        <div class="book"><div class="bp">题目（只看这一边）</div><div style="font-size:15px;line-height:1.9">${dir==="zh2en"?hlTransZh(src):hlOralAnchors(src)}</div></div>
        <div style="margin-top:10px"><textarea id="trIn" style="width:100%;min-height:90px" placeholder="${dir==="zh2en"?"在此写出对应英文…":"在此写出对应中文…"}"></textarea></div>
        <div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm primary" id="trSub" type="button">提交对照</button>
          <button class="btn sm ghost" id="trBackReread" type="button">回看原句</button></div>
        <div id="trOut" style="margin-top:10px"></div>
      </div>`;
      const ta=$("#trIn",stageHost); if(ta) ta.focus();
      $("#trBackReread",stageHost).onpointerdown=()=>{ SFX.tap(); stt.phase="reread"; persist(); draw(); };
      $("#trSub",stageHost).onpointerdown=()=>{ SFX.tap();
        const mine=(ta&&ta.value||"").trim();
        const out=$("#trOut",stageHost);
        out.innerHTML=`<div class="note" style="border-left-color:var(--gold)">
          ${oralDiffHtml(mine,ref,dir==="zh2en")}
          <div style="margin-top:8px;font-size:12px;color:var(--fg2)">传译允许与参考不同的表达——按信息传到的程度如实自评：</div>
          <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn sm primary" data-gr="2" type="button">大体无碍</button>
            <button class="btn sm" data-gr="1" type="button">磕绊可修</button>
            <button class="btn sm ghost" data-gr="0" type="button">没写出来</button>
          </div>
          <div style="margin-top:8px;text-align:center"><button class="btn sm ghost" id="trAiBtn" type="button" ${dsReady()?"":"disabled"}>✨ 请灵脉评讲</button></div>
          <div id="trAiOut" style="margin-top:8px"></div></div>`;
        $("#trSub",stageHost).disabled=true;
        out.querySelectorAll("[data-gr]").forEach(b=>b.onpointerdown=()=>{ SFX.tap();
          const gr=+b.dataset.gr;
          out.querySelectorAll("[data-gr]").forEach(x=>x.disabled=true);
          srsReview(c.key,gr);
          recordTransWrong(c,dir,mine,ref,gr);
          stt.i++; stt.phase="reread"; persist(); draw(); });
        const trAi=$("#trAiBtn",out);
        if(trAi) trAi.onpointerdown=()=>{ SFX.tap();
          if(!dsReady()){ toast("灵脉未通——请在配置中填入密钥后启用 AI 评讲"); return; }
          trAi.disabled=true; trAi.textContent="灵脉评讲中…";
          aiTransReview(src,mine,ref,dir,c.key,$("#trAiOut",out),()=>{ if(trAi.isConnected){ trAi.disabled=false; trAi.textContent="✨ 请灵脉评讲"; } });
        };
      };
    }
    /* v80：返回键=练习回重读、重读回上句练习；第 1 句重读交回 backOne 回书页 */
    innerBack=()=>{
      if(stt.phase==="practice"){ stt.phase="reread"; persist(); draw(); return true; }
      if(stt.i>0){ stt.i--; stt.phase="practice"; persist(); draw(); return true; }
      return false;
    };
    draw();
  }
  /* —— 点击推进（v44）：整页点击流转阶段 —— */
  const STAGES=(RT_FLOWS[q.rtCat]||RT_FLOWS.a).map(id=>({
    id, render:(id==="dialog"?renderStageDialog:id==="brief"?renderStageBrief:id==="book"?renderStageBook:id==="quiz"?renderStageQuiz:id==="recite"?renderStageRecite:id==="battle"?renderStageBattle:renderStageTrans)
  }));
  /* v61：暂离续关——任务内进度（阶段/书页/题序）随存档持久化，完成或跳过后清除 */
  function saveProg(patch){
    if(readonly) return;
    st.questProg=st.questProg||{};
    st.questProg[q.id]=Object.assign(st.questProg[q.id]||{},patch,{at:Date.now()});
    save();
  }
  function curProg(){ return (st.questProg&&st.questProg[q.id])||null; }
  const _saved0=(!readonly&&st.questProg&&st.questProg[q.id])?st.questProg[q.id]:null;
  let resumeQi=(_saved0&&typeof _saved0.qi==="number"&&_saved0.qi>0)?_saved0.qi:null;
  function goStage(idx, opts){
    stageIdx=Math.max(0,Math.min(STAGES.length-1,idx));
    stopTypewriter();
    if(dialogTimer){ clearTimeout(dialogTimer); dialogTimer=null; }
    innerBack=null;   /* v77：旧阶段的内层返回钩子随阶段切换失效，新阶段 render 时自行挂载 */
    SFX.tap();
    STAGES[stageIdx].render(opts||{});
    saveProg({stage:STAGES[stageIdx].id, book:(STAGES[stageIdx].id==="book"?bookPageIdx:0), qi:(STAGES[stageIdx].id==="quiz"?qi:0)});
    if(finBtn){
      const showFin=stageIdx===STAGES.length-1&&!readonly;
      finBtn.style.display=showFin?"inline-block":"none";
    }
  }
  /* —— 对话末尾/阶段完成 选项面板（对齐新版 dialogue-flow 7 类核心子集）—— */
  let _choiceActive=false;
  function showChoicePanel(choices, onPick){
    if(_choiceActive) return;
    _choiceActive=true;
    const old=stageHost.querySelector('.qchoice-panel');
    if(old) old.remove();
    const panel=document.createElement('div');
    panel.className='qchoice-panel';
    panel.style.cssText='padding:10px 6px;border-top:1px dashed var(--border);margin-top:10px;display:flex;flex-direction:column;gap:8px';
    choices.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='btn sm'+(c.primary?' primary':'')+(c.ghost?' ghost':'');
      btn.textContent=c.label;
      btn.onclick=()=>{ _choiceActive=false; panel.remove(); SFX.tap(); onPick(c.value); };
      panel.appendChild(btn);
    });
    stageHost.appendChild(panel);
    stageHost.scrollTop=stageHost.scrollHeight;
  }

  function advanceStage(){
    /* 选项面板正在显示时，整页点击不推进 */
    if(_choiceActive) return;
    /* v58：按阶段 id 分流（不再假定 quiz 恒为第 4 段——rev 流只有 3 段、exam 流末段是 battle，
       旧逻辑按索引 2 当书页处理，会在消印/验界阶段误翻书）。试炼/复述/传译/战阵任何点击都不推进。 */
    const sid=STAGES[stageIdx]?STAGES[stageIdx].id:"";
    if(sid==="dialog"){
      /* dialog：打字中→加速；未全弹完→skip；全弹完→选项面板 */
      if(twState&&!twState.done){ typewriterExpand(); return; }
      if(dialogShown<dialogTotal){ dialogSkipOrNext(); return; }
      if(dialogDone){
        showChoicePanel([
          {label:'翻开手记，开始读这一卷', value:'continue', primary:true},
          {label:'告辞，先退下了', value:'leave', ghost:true}
        ], v=>{
          if(v==='continue') goStage(1);
          else ov.remove();
        });
      }
      return;
    }
    if(sid==="brief"){ /* brief：点击直接翻页进入书页（自动推进） */
      goStage(2); return;
    }
    if(sid==="book"){
      /* book：打字中→加速；自动刚打完（autoDone）→吞一次点击让用户看到提示；
         未翻完→翻页；末页读完→自动进入试炼 */
      if(twState&&!twState.done){ typewriterExpand(); return; }
      if(twState&&twState.autoDone){ twState.autoDone=false; return; }
      if(bookPageIdx<pages.length-1){ SFX.tap(); bookPageIdx++; renderStageBookPage(); saveProg({stage:"book",book:bookPageIdx}); return; }
      /* v62 Task8：末页总结段在场（试炼流）时，必须由四选项决定去向；c/d 类无总结段仍可轻触进入 */
      if(bookDone&&!_summaryShown) goStage(3);
      return;
    }
    /* quiz / recite / trans / battle（试炼类阶段）：点击不推进，由答题按钮与通关面板驱动 */
  }
  /* v58：翻页键——焦点不在任何文本框内时，→/↓/PgDn/空格/回车=向前推进，←/↑/PgUp=单层返回（试炼回上一题/书页回上一页）。
     绑 document（弹窗刚打开时焦点常在 body），ov 关闭即卸载；其他弹层压在任务上时不抢键。 */
  function isEditableTarget(t){
    return !!(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable));
  }
  document.addEventListener("keydown",function _questKeydown(e){
    if(!ov.isConnected){ document.removeEventListener("keydown",_questKeydown); return; }
    if(isEditableTarget(e.target)) return;           /* 文本框内：打字优先，绝不翻页 */
    if(e.target&&e.target.closest&&e.target.closest(".ov")&&e.target.closest(".ov")!==ov) return;
    if(e.target&&e.target.tagName==="BUTTON"&&!e.target.disabled&&(e.key==="Enter"||e.key===" ")) return; /* 可用按钮让原生激活 */
    /* 通关面板在场：回车/空格=确认通关 */
    const cg=ov.querySelector(".cleargate #cgOk");
    if(cg&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); cg.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true})); return; }
    const fwd=(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key==="PageDown"||e.key===" "||e.key==="Enter");
    const back=(e.key==="ArrowLeft"||e.key==="ArrowUp"||e.key==="PageUp");
    if(!fwd&&!back) return;
    e.preventDefault();
    if(fwd) advanceStage(); else backOne();
  });

  /* ===== v58：通关提示——末题（末诵/末译/战阵）完成即弹，玩家确认即刻交割通关 ===== */
  function showClearGate(o){
    if(readonly) return;
    /* quizPerfect 由各终点自行结算（全对=true；有错也可通关但不算完美），此处不覆盖 */
    const host=stageHost._quizHost||stageHost;
    const old=host.querySelector(".cleargate"); if(old) old.remove();
    const gate=document.createElement("div");
    gate.className="cleargate";
    gate.style.cssText="margin-top:12px;border:1px solid var(--ok);background:rgba(74,222,128,0.07);border-radius:8px;padding:14px 12px;text-align:center";
    gate.innerHTML=`<div style="font-size:16px;color:var(--ok);font-weight:bold;margin-bottom:6px;letter-spacing:.05em">${esc((o&&o.title)||"雾散阵开——此关已破")}</div>
      <div style="font-size:12.5px;color:var(--fg2);line-height:1.9;margin-bottom:12px">${esc((o&&o.line)||"最后一问答罢，雾团化作光点归入你的印记。")}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn sm primary" id="cgOk" type="button">${esc((o&&o.cta)||"确认通关 · 交割")}</button>
        <button class="btn sm ghost" id="cgStay" type="button">再看一眼</button>
      </div>`;
    host.appendChild(gate);
    try{ stageHost.scrollTop=stageHost.scrollHeight; }catch(_){}
    $("#cgOk",gate).onpointerdown=()=>{ SFX.tap(); settleQuest(q,quizPerfect,ov); };
    $("#cgStay",gate).onpointerdown=()=>{ SFX.tap(); gate.remove(); if(finBtn){ finBtn.disabled=false; finBtn.style.display="inline-block"; finBtn.textContent="交割 · 完成此环"; } };
  }

  /* ===== 初始化 ===== */
  function openQuestInit(){
    /* v53：开场即 cue 五段（离线确定性内容），AI brief 仅后台增强阶段1的引导句，不再阻塞 */
    aiBriefData={}; aiBriefReady=true;
    /* v61：暂离续关——有存档进度则直接回到当时的阶段（书页/题序随之恢复） */
    const saved=curProg();
    if(!readonly&&saved&&saved.stage){
      const idx=STAGES.findIndex(s=>s.id===saved.stage);
      if(idx>0){
        bookPageIdx=Math.max(0,+(saved.book||0));
        if(saved.stage!=="quiz") resumeQi=null;
        goStage(idx);
        if(saved.stage==="quiz") try{ toast("已回到上次暂离的进度","dim"); }catch(e){}
        loadAiBriefData();
        if(q.rtCat==="b") ensureWenqiAI((quiz||[]).map(zz=>zz.pid).filter(Boolean),up=>{
          if(ov.isConnected&&STAGES[stageIdx].id==="quiz"&&!answered&&up.includes(quiz[qi]&&quiz[qi].pid)) drawQuiz();
        });
        return;
      }
    }
    STAGES[0].render();
    if(q.rtCat==="b") ensureWenqiAI((quiz||[]).map(zz=>zz.pid).filter(Boolean),up=>{
      if(ov.isConnected&&STAGES[stageIdx].id==="quiz"&&!answered&&up.includes(quiz[qi]&&quiz[qi].pid)) drawQuiz();
    });
    loadAiBriefData();
  }
  function loadAiBriefData(){
    if(!dsReady()) return;
    const cached=st.aiBrief[q.id];
    if(cached&&cached.v===3){ aiBriefData=cached; return; }
    genQuestBrief(q).then(o=>{
      if(!ov.isConnected) return;
      st.aiBrief[q.id]=o; save();
      aiBriefData=o;
    }).catch(()=>{ /* 静默：阶段1有静态引导句兜底 */ });
  }
  /* —— 整页点击推进：术语卡/交互组件/文本框除外（v44 绑定，v58 扩充守护）——
     铁律：点在任何可编辑文本框（input/textarea/select/contenteditable/label）内绝不翻页；
     只在点框外区域、或按翻页键时才推进。 */
  const STAGE_NO_ADVANCE='button,a,input,textarea,select,label,.oralrow,.oralkit,.pager,.bp,.qreplwrap,.qchoice-panel,.cleargate,.gcard,[contenteditable="true"],[data-noadvance]';
  stageHost.onpointerdown=e=>{
    const gl=e.target.closest('.gl');
    if(gl){ e.stopPropagation();
      const g=D.glossary[gl.dataset.g]; if(!g) return;
      const gc=document.createElement('div'); gc.className='gcard';
      gc.innerHTML='<div class="gw">'+esc(gl.dataset.g)+'</div><div class="gs"><b>是什么</b>'+esc(g.what)+'</div><div class="gs"><b>装到哪</b>'+esc(g.where)+'</div><div class="gs"><b>为什么</b>'+esc(g.why)+'</div>';
      document.body.appendChild(gc);
      setTimeout(()=>{ try{gc.remove();}catch(err){} },6000);
      gc.onpointerdown=()=>gc.remove();
      return;
    }
    if(isEditableTarget(e.target)||(e.target.closest&&e.target.closest(STAGE_NO_ADVANCE))) return;
    advanceStage();
  };
  /* quiz 相关辅助函数（供第 4 阶段使用，复用原有逻辑） */
  function normalize(s){ return String(s).replace(/[\s，。、；：""''！？（）()（）·—…《》<>]/g,"").toLowerCase(); }
  function startAiQuiz(){
    const stage=quizStage(q.id);
    const label=stage==="first"?"正在拟题":stage==="second"?"温故出新题":"变化试炼中";
    const host=stageHost._quizHost; if(!host) return;
    host.innerHTML=`<div class="note" style="border-left-color:var(--cyber)">✦ ${label}…</div>`;
    /* v55 批3-②：AI 出题入库——首学时一次性出题持久化，以后复用复抽 */
    const pids=quizBankPids(q);
    const targetN=quizTargetN(pids.length);
    const bank=st.quizBank&&st.quizBank[q.id];
    if(bank&&bank.length>=pids.length){
      const drawn=quizBankDraw(q.id,pids,targetN);
      if(drawn.length){ quiz=drawn; qi=0; okCount=0; answered=false; drawQuiz(); return; }
    }
    genQuizBank(q).then(arr=>{
      if(!ov.isConnected) return;
      let quizArr=(arr&&arr.length)?arr.map(sanitizeQuiz):[];
      /* v62 Task6：不足 b 时 fallback 按题面去重补足 */
      const needPids=[...new Set([...(basePidsOf(q)), ...(D.lectures[q.id]||[]).flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean))])];
      const fbTargetN=quizTargetN(needPids.length);
      if(quizArr.length < fbTargetN){
        const fb=fallbackQuiz(q);
        const haveQ=new Set(quizArr.map(quizNormKey));
        for(const fz of fb){ const fk=quizNormKey(fz); if(!haveQ.has(fk)){ quizArr.push(fz); haveQ.add(fk); } if(quizArr.length>=fbTargetN) break; }
      }
      /* 入库持久化 */
      if(!st.quizBank) st.quizBank={};
      st.quizBank[q.id]=quizArr;
      save();
      /* 从库中抽取当次做题集 */
      quiz=quizBankDraw(q.id,pids,targetN);
      if(!quiz.length) quiz=quizArr.slice(0,targetN);
      qi=0; okCount=0; answered=false; drawQuiz();
    }).catch(()=>{ if(!ov.isConnected) return; quiz=fallbackQuiz(q); qi=0; okCount=0; answered=false; drawQuiz(); });
  }
  function basePidsOf(q){ return [...new Set(((D.quizzes[q.id]||[]).map(z=>z.pid).filter(Boolean)))]; }
  function drawQuiz(){
    answered=false;
    /* v61：暂离续关——题序恢复（仅一次；题池重建后夹到合法范围）
       v62 Task4：okCount 不再默认=qi（默认全对），按 qdraft 真实对错统计 */
    if(resumeQi!=null&&quiz.length){ qi=Math.min(resumeQi,quiz.length-1); resumeQi=null; }
    okCount=qdraft.filter(x=>x&&x.answered&&x.ok).length;
    if(!readonly&&STAGES[stageIdx]&&STAGES[stageIdx].id==="quiz")
      saveProg({stage:"quiz",qi, quiz:quiz.slice(), draft:qdraft.map(x=>Object.assign({},x)), ended:_quizEnded});
    const host=stageHost._quizHost; if(!host) return;
    if(!quiz.length){ host.innerHTML=`<div class="note" style="border-left-color:var(--danger)">题池暂未生成——请稍后再试。</div>`; return; }
    /* v62：完成分支只结算一次——回看后再次到达末尾时不重复计数/重复推流 */
    if(qi>=quiz.length){
      if(!_quizEnded){
        st.quizAttempts[q.id]=(st.quizAttempts[q.id]||0)+1;
        quizPerfect=(okCount===quiz.length);
        save();
      }
      _quizEnded=true;
      /* v62 Task4：ended 同步持久化——重入时不重复计数（通关门仍会重新提示未交割） */
      if(!readonly) saveProg({stage:"quiz",qi, quiz:quiz.slice(), draft:qdraft.map(x=>Object.assign({},x)), ended:true});
      if(readonly){
        if(qdraft.length===0){ const wid=pushAction("我重刷了「"+qdn(q)+"」的印记（答对 "+okCount+"/"+quiz.length+"）。");
          refineAction(wid,q,"（这是温故重刷，不是首通，语气可以更轻松）"); }
        host.innerHTML=`<div class="note" style="border-left-color:var(--gold)">温故有效（答对 ${okCount}/${quiz.length}）——错题已录入星盘。再温一遍可换一组变化题。</div>
        <div style="margin-top:8px"><button class="btn sm primary" id="reRetryBtn" type="button">再温一遍</button></div>`;
        SFX.win();
        const rr=$("#reRetryBtn",host); if(rr) rr.onpointerdown=()=>{ SFX.tap(); startAiQuiz(); };
      } else {
        host.innerHTML=`<div class="note" style="border-left-color:var(--ok)">试炼通过（答对 ${okCount}/${quiz.length}）——错题已录入星盘。</div>`;
        /* v58：最后一问答完即弹通关提示，玩家确认便交割，不必再找右下角按钮 */
        showClearGate({title:quizPerfect?"雾散阵开——全数通过":"雾散阵开——此关已破",
          line:`本轮答对 ${okCount}/${quiz.length} 题${quizPerfect?"，无一折损——":"，"}错题已录入星盘，待回潮日再见。确认后修行与灵铢即刻入账。`});
        SFX.win();
      }
      return;
    }
    /* v62：已作答的题只读回看（backOne 回上一题）；可继续下一题或重答本题 */
    if(qdraft[qi]&&qdraft[qi].answered){
      const zd=quiz[qi], dd=qdraft[qi];
      const correctD=zd.kind==="judge"?(zd.a?"真":"伪"):zd.a;
      /* v80：回看还原当时的 AI 讲评/英文讲解（持久化在 st.aiExplain），不再清空 */
      const saved=getAiExplain(zd);
      const savedBubble=saved&&saved.html?`<div class="qreplwrap" style="margin-top:8px">
          <div class="qav" style="background:var(--cyber)">${esc(npcName[0]||"?")}</div>
          <div class="qbub" style="background:rgba(61,240,255,0.07);border:1px solid var(--cyber)">
            <div class="qname">${esc(npcName)} · 当时的讲评</div>
            <div class="qrepl" style="color:var(--fg2)">${saved.html}</div>
          </div></div>`:"";
      host.innerHTML=`<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · 已作答 · 回看</span>${esc(zd.q)}</div>
        <div class="fb ${dd.ok?'ok':'no'}">${dd.ok?"✓ 你答对了——":"✗ 你的作答——「"+esc(dd.mine||"…")+"」"}${quizExplainHtml(zd,correctD,dd.mine)}</div>
        ${savedBubble}`;
      const navD=document.createElement("div");
      navD.style.cssText="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap";
      navD.innerHTML=`<button class="btn sm primary" id="qvNext" type="button">${qdraft[qi+1]&&qdraft[qi+1].answered?"继续看下一题":"继续作答下一题"}</button>
        <button class="btn sm ghost" id="qvRedo" type="button">重答本题</button>`;
      host.appendChild(navD);
      $("#qvNext",navD).onpointerdown=()=>{ SFX.tap(); qi++; answered=false; drawQuiz(); };
      $("#qvRedo",navD).onpointerdown=()=>{ SFX.tap();
        qdraft.length=qi; okCount=qdraft.filter(x=>x.ok).length; _quizEnded=false; answered=false; drawQuiz(); };
      try{ illuSetHp(qi); }catch(_){}
      return;
    }
    /* 试炼幻境视觉层（safe try-catch，失败不阻塞答题） */
    try{
      if(!_illu&&!readonly) openIllusion();
      if(_illu){ spawnFog(qi); illuSetHp(qi); }
    }catch(_){ /* illusion 异常不影响试炼正常进行 */ }
    const z=quiz[qi];
    /* v48：填空题防御——确保 a 为字符串、accept 为非空数组，杜绝卡住
       v62 Task5：multi 的 a 为数组（正确项集合），单独规整；wrongone 沿用字符串路径 */
    if(z.kind==="multi"){
      if(!Array.isArray(z.opts)||z.opts.length<2) z.opts=z.opts||[];
      let idxArr=Array.isArray(z.aIdx)?z.aIdx.map(Number):[];
      if(!idxArr.length&&Array.isArray(z.a)) idxArr=z.a.map(x=>z.opts.indexOf(x)).filter(i=>i>=0);
      idxArr=[...new Set(idxArr)].sort((a,b)=>a-b);
      z.aIdx=idxArr; z.a=idxArr.map(i=>z.opts[i]);
    } else if(z.kind!=="judge"){
      if(z.a==null||z.a===undefined) z.a="";
      z.a=String(z.a);
      if(!Array.isArray(z.accept)||!z.accept.length) z.accept=[z.a];
      z.accept=z.accept.map(x=>String(x));
      if(!z.accept.includes(z.a)) z.accept.unshift(z.a);
    }
    /* v62 Task12：英文版（灵脉补全后）渲染优先 */
    const en=z._en||null;
    const stemQ=en?en.q:z.q;
    const stemOpts=(en&&en.opts)?en.opts:z.opts;
    const pendingBanner=z._enPending
      ? `<div style="margin:0 0 10px;padding:6px 10px;border:1px dashed var(--gold);border-radius:8px;font-size:11.5px;color:var(--gold)">🌐 英文题面将在灵脉恢复后补全——先以当前题面作答，灵脉恢复后自动补英文版。</div>` : "";
    /* v44：NPC 串场词（AI 生成的 intro 优先，否则按 NPC 口癖池取） */
    const kindLabel=z.kind==="judge"?"是非判断":z.kind==="choice"?"选择作答":z.kind==="multi"?"多项选择":z.kind==="wrongone"?"选出错误项":z.kind==="trans"?"通界传译":z.kind==="oralrec"?"整段复述":z.kind==="recall"?"来客之问":"填空作答";
    const intro=(z.intro&&String(z.intro).trim())?String(z.intro).trim():"";
    const introPool=QUIZ_INTROS[npc.id]||QUIZ_INTROS_FALLBACK;
    const introTxt=intro||introPool[(q.id+"_"+qi).split("").reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,0)%introPool.length];
    const introHtml=`<div class="qreplwrap" style="margin:0 0 10px">
      <div class="qav" style="background:var(--cyber)">${esc(npcName[0]||"?")}</div>
      <div class="qbub" style="background:rgba(61,240,255,0.07);border:1px solid var(--cyber)">
        <div class="qname">${esc(npcName)}${npcTitle?` · ${esc(npcTitle)}`:""}</div>
        <div style="color:var(--fg2)">${esc(introTxt)}</div>
      </div></div>`;
    if(z.kind==="judge"){
      host.innerHTML=`${introHtml}${pendingBanner}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(stemQ)}</div>
        <div class="jbtns"><button class="btn" id="jTrue">真</button><button class="btn" id="jFalse">伪</button></div>
        <div class="fb" id="fb"></div>`;
      $("#jTrue",host).onpointerdown=()=>answer(z.a===true,"真");
      $("#jFalse",host).onpointerdown=()=>answer(z.a===false,"伪");
    } else if(z.kind==="choice"||z.kind==="wrongone"){
      host.innerHTML=`${introHtml}${pendingBanner}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(stemQ)}</div>
        <div class="jbtns choicebtns">${(stemOpts||[]).map((o,i)=>`<button class="btn" data-copt="${i}">${esc(o)}</button>`).join("")}</div>
        <div class="fb" id="fb"></div>`;
      host.querySelectorAll("[data-copt]").forEach(b=>{
        /* 按索引比对，兼容英化选项（wrongone=错误项索引） */
        b.onpointerdown=()=>{ const i=+b.dataset.copt, rightIdx=z.opts.indexOf(z.a);
          answer(i===rightIdx, stemOpts[i]); };
      });
    } else if(z.kind==="multi"){
      /* v62 Task5：多选——勾选多个，集合完全一致才过；少选/错选判错，差异进解析 */
      const picked=new Set();
      host.innerHTML=`${introHtml}${pendingBanner}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}（共 ${z.aIdx.length} 个正确项）</span>${esc(stemQ)}</div>
        <div class="jbtns choicebtns" id="multiBox">${(stemOpts||[]).map((o,i)=>`<button class="btn" data-mopt="${i}" type="button" style="text-align:left;white-space:normal">${esc(o)}</button>`).join("")}</div>
        <div class="jbtns"><button class="btn sm primary" id="multiSub" type="button">提交作答</button></div>
        <div class="fb" id="fb"></div>`;
      const box=$("#multiBox",host);
      const syncPick=()=>{ box.querySelectorAll("[data-mopt]").forEach(b=>{
        const on=picked.has(+b.dataset.mopt);
        b.style.outline=on?"2px solid var(--gold)":""; b.style.borderColor=on?"var(--gold)":"";
      }); const d=qdraft[qi]=qdraft[qi]||{}; d.picked=[...picked];
        if(!readonly) saveProg({stage:"quiz",qi, quiz:quiz.slice(), draft:qdraft.map(x=>Object.assign({},x)), ended:_quizEnded}); };
      box.querySelectorAll("[data-mopt]").forEach(b=>{
        b.onpointerdown=()=>{ SFX.tap(); const i=+b.dataset.mopt; if(picked.has(i))picked.delete(i); else picked.add(i); syncPick(); };
      });
      $("#multiSub",host).onpointerdown=()=>{
        if(!picked.size){ toast("先勾选再提交","dim"); return; }
        const want=new Set(z.aIdx), mine=[...picked].sort((a,b)=>a-b);
        const ok=z.aIdx.every(i=>picked.has(i))&&mine.every(i=>want.has(i));
        answer(ok, mine.map(i=>stemOpts[i]).join(" / "));
      };
      /* 重放未提交的勾选 */
      if(qdraft[qi]&&Array.isArray(qdraft[qi].picked)){ qdraft[qi].picked.forEach(i=>picked.add(i)); syncPick(); }
    } else if(z.kind==="trans"||z.kind==="oralrec"){
      /* v70：翻译题/整段复述题——保持传译与复述的本来形态，提交后逐词对照+三档自评（从不说"答错"）。
         草稿与揭示态随暂离存档；oralrec 必须先「整段回看」再遮文复述。 */
      const isRec=z.kind==="oralrec";
      const en2zh=z.dir==="en2zh";
      const tag=isRec?"整段回看 → 遮文整段复述":(en2zh?"彼界文 → 此界文":"此界文 → 彼界文");
      const ph=isRec?"凭记忆打出完整一段英文……":(en2zh?"在此写出对应中文…":"在此写出对应英文…");
      const gradeBtns=`<div style="margin-top:10px;font-size:12px;color:var(--fg2)">${isRec?"对照逐词差异，如实自评：":"传译允许与参考不同的表达——按信息传到的程度如实自评："}</div>
        <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm primary" data-gr="2" type="button">${isRec?"顺畅诵出":"大体无碍"}</button>
          <button class="btn sm" data-gr="1" type="button">${isRec?"断续想起":"磕绊可修"}</button>
          <button class="btn sm ghost" data-gr="0" type="button">${isRec?"雾未散":"没写出来"}</button>
        </div>`;
      const persistDraft=patch=>{ if(readonly)return; qdraft[qi]=Object.assign(qdraft[qi]||{},patch);
        saveProg({stage:"quiz",qi, quiz:quiz.slice(), draft:qdraft.map(x=>Object.assign({},x)), ended:_quizEnded}); };
      const showReview=(typed)=>{
        const fb=$("#fb",host);
        const refEn=isRec||!en2zh;
        fb.innerHTML=oralDiffHtml(typed,z.a,refEn)+gradeBtns;
        fb.querySelectorAll("[data-gr]").forEach(b=>b.onpointerdown=()=>{ SFX.tap();
          fb.querySelectorAll("[data-gr]").forEach(x=>x.disabled=true);
          const gr=+b.dataset.gr; z._grade=gr;
          if(z.kind==="trans") recordTransWrong({key:z.key,topic:z.topic},z.dir,typed,z.a,gr);
          persistDraft({review:true,answered:true});
          answer(gr>=2,gr>=2?(isRec?"自评·顺畅诵出":"自评·大体无碍"):(gr===1?(isRec?"自评·断续想起":"自评·磕绊可修"):(isRec?"自评·雾未散":"自评·没写出来")));
        });
      };
      const showInput=()=>{
        host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel} · ${tag}</span>${isRec?"原文已收起 · 凭记忆整段诵出":esc(z.q)}</div>
          <textarea id="spInp" style="width:100%;min-height:${isRec?170:90}px;margin-top:8px" placeholder="${ph}"></textarea>
          <div class="jbtns"><button class="btn sm primary" id="spSub" type="button">提交对照</button></div>
          <div class="fb" id="fb"></div>`;
        const inp=$("#spInp",host); if(inp){ inp.focus();
          const d0=qdraft[qi]; if(d0&&d0.typed) inp.value=d0.typed;
          inp.addEventListener("input",()=>persistDraft({typed:inp.value,review:false})); }
        $("#spSub",host).onpointerdown=()=>{ SFX.tap();
          const typed=(inp&&inp.value||"").trim();
          $("#spSub",host).disabled=true; if(inp)inp.disabled=true;
          persistDraft({typed,review:true});
          showReview(typed);
        };
        const d0=qdraft[qi];
        if(d0&&d0.review&&!d0.answered){ $("#spSub",host).disabled=true; if(inp)inp.disabled=true; showReview(d0.typed||""); }
      };
      if(isRec){
        const d0=qdraft[qi]||{};
        if(d0.oralPhase!=="input"){
          const sents=oralSplitSentences(z.a);
          host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel}</span>${esc(z.q)}</div>
            <div class="book" style="margin-top:8px"><div class="bp">整段原文 · 先通读一遍（合卷后凭记忆诵出）</div>
              <div style="font-size:14px;line-height:2">${sents.map(s=>hlOralAnchors(s)).join("<br>")}</div></div>
            <div class="jbtns"><button class="btn sm primary" id="orToRec" type="button">我记住了 · 遮文整段复述</button></div>
            <div class="fb" id="fb"></div>`;
          $("#orToRec",host).onpointerdown=()=>{ SFX.tap(); persistDraft({oralPhase:"input"}); showInput(); };
        } else showInput();
      } else {
        host.innerHTML=`${introHtml}<div class="qz"><span class="kk">试炼 ${qi+1}/${quiz.length} · ${kindLabel} · ${tag}</span>${esc(z.q)}</div>
          <textarea id="spInp" style="width:100%;min-height:90px;margin-top:8px" placeholder="${ph}"></textarea>
          <div class="jbtns"><button class="btn sm primary" id="spSub" type="button">提交对照</button></div>
          <div class="fb" id="fb"></div>`;
        const inp=$("#spInp",host); if(inp){ inp.focus();
          const d0=qdraft[qi]; if(d0&&d0.typed) inp.value=d0.typed;
          inp.addEventListener("input",()=>persistDraft({typed:inp.value,review:false})); }
        $("#spSub",host).onpointerdown=()=>{ SFX.tap();
          const typed=(inp&&inp.value||"").trim();
          $("#spSub",host).disabled=true; if(inp)inp.disabled=true;
          persistDraft({typed,review:true});
          showReview(typed);
        };
        const d0=qdraft[qi];
        if(d0&&d0.review&&!d0.answered){ $("#spSub",host).disabled=true; if(inp)inp.disabled=true; showReview(d0.typed||""); }
      }
    } else if(z.kind==="recall"&&z.lang==="en"){
      /* v80：AI 双语稿可能在题目构建后才到——渲染前用缓存实时覆盖题面/参考 */
      const live=wenqiQAOf(z.pid);
      if(live){ z.q=live.qen||live.qzh||z.q; if(live.aen)z.a=live.aen; z.cn={q:live.qzh,a:live.azh}; z.enOnly=live.zhOnly; }
      const persistDraft=patch=>{ if(readonly)return; qdraft[qi]=Object.assign(qdraft[qi]||{},patch);
        saveProg({stage:"quiz",qi, quiz:quiz.slice(), draft:qdraft.map(x=>Object.assign({},x)), ended:_quizEnded}); };
      const enRef=String(z.a||"");
      const cnRef=(z.cn&&z.cn.a)||"";
      const gradeBar=`<div style="margin-top:10px;font-size:12px;color:var(--fg2)">信息点传到了多少，如实自评：</div>
        <div style="margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm primary" data-gr="2" type="button">要点齐全</button>
          <button class="btn sm" data-gr="1" type="button">断续想起</button>
          <button class="btn sm ghost" data-gr="0" type="button">未想起</button>
        </div>`;
      const showReview=(typed)=>{
        const fb=$("#fb",host);
        fb.innerHTML=(enRef?oralDiffHtml(typed,enRef,true):`<div style="font-size:12px;color:var(--dim)">英文参考待灵脉补全——先对照中文要点。</div>`)

  function wrongLocalReply(z,mine,okA){

    let core="";

      const fact=quizFactOf(z);

      core=z.a===false
        ? (frag&&frag.to!==frag.from
          ? `错点就在「${frag.to}」这个词上——这里应为「${frag.from}」。正确说法是：「${fact}」。`
          : `题里「${esc(clipClause(stem,26))}」这个说法不成立哦。正确概念是「${esc(fact||okA)}」——记正解比记原句管用呀。`)

      const why=om&&om.t==="bad"
        ? `它把「${om.from}」写成了「${om.to}」，表述本身有误`
        : om&&om.t==="other"
          ? `它说的是「${quizOptPname(om.pid)}」的内容——这句话没错，只是答非本题所问`
          : om&&om.t==="fill"?"它与本题考点无关，是凑数项":"它不是本题要的那一项";
      core=`你选的「${esc(String(mine||"…"))}」——${why}。正解是「${esc(okA)}」。每个选项各自指什么、错在哪，我在下面逐条给你讲。`;
    } else if(z.kind==="wrongone"){

      core=`四个选项里与原文不符的是「${esc(okA)}」——${why}。其余三项各指什么、为什么成立，我在下面逐条讲清。`;
    } else if(z.kind==="multi"){

      core=`多选要集合完全一致才过——`
        +(missed.length?`漏了「${esc(missed.join("；"))}」`:"")
        +(missed.length&&extra.length?"，":"")

async function settleQuest(q,quizPerfect,ov){

  catch(e){
    console.error('[settleQuest]',e);
    try{ if(ov&&ov.remove) ov.remove(); }catch(_){}
    try{ save(); render(); }catch(_){}
    toast("力量交割时遇上一阵乱雾，进度已留存，再看一眼便好");
  }
}

  syncLibText(id, _htmlToText(text)); /* 富文本时仅把纯文本写回 canonical，出题/复述/评分仍干净 */
  save(); return true;
}
/* v25：校订写回运行库（pointsLib/oralLib/oralFull/clues 及用户新增卡原文） */
function syncLibText(id, text){
  try{
    const parts=id.split(":");
    if(parts[0]==="point"){ const p=(D.pointsLib||[]).find(x=>x.id===parts[1]); if(p) p.text=text;
      const uc=st.v25&&st.v25.cards&&(st.v25.cards.added||[]).find(x=>x.id===parts[1]); if(uc) uc.text=text; }
    else if(parts[0]==="oral"){ const x=(D.oralLib||[]).find(p=>p.id===parts[1]); if(x){ if(parts[2]==="zh") x.zh=text; else x.en=text; }
      const uc=st.v25&&st.v25.cards&&(st.v25.cards.added||[]).find(x=>x.id===parts[1]); if(uc){ if(parts[2]==="zh") uc.zh=text; else uc.text=text; } }
    else if(parts[0]==="full"){ const o=(D.oralFull||[]).find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; if(s){ if(s.text!==undefined) s.text=text; else s.en=text;
        /* 整节改文 → 正文若有段落层级，按空行重切，避免「节级编辑」与「段级编辑」两个源打架
           v113：段数不变时保留各段小标题/中文小注，避免整节保存把小注冲掉 */
        if(Array.isArray(s.paragraphs)&&s.paragraphs.length){
          const ps=String(text).split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
          if(ps.length===s.paragraphs.length) s.paragraphs=ps.map((t,i)=>Object.assign({},s.paragraphs[i],{n:i+1,text:t}));
          else if(ps.length>1) s.paragraphs=ps.map((t,i)=>({n:i+1, text:t}));
          else if(ps.length===1&&s.paragraphs.length===1) s.paragraphs=[{n:1, text:ps[0]}];
        } } }
    else if(parts[0]==="fullp"){ const o=(D.oralFull||[]).find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; const p=s&&Array.isArray(s.paragraphs)&&s.paragraphs[+parts[3]]; if(p) p.text=text;
      /* 段级改文 → 回写整节 text（修习室/导出仍读 s.text） */
      if(s&&Array.isArray(s.paragraphs)){ const joined=s.paragraphs.map(x=>x.text||"").join("\n\n"); if(s.text!==undefined) s.text=joined; } }
    else if(parts[0]==="clue"){ const c=(D.clues||[]).find(x=>x.id===parts[1]); if(c) c.text=text; }
  }catch(e){ console.error("[syncLibText]",e); }
}
function rollbackEdit(id, index){
  const arr=editVer(id); if(!arr[index]) return;
  const text=arr[index].text;
  arr.unshift({at:new Date().toISOString(), text});   // 回退即把旧版复制为最新
  syncLibText(id, text);
  save();
}

/* 据 editId 取官方原文（用于「恢复官方原文」） */
function originalOf(editId){
  const parts=editId.split(":");
  if(parts[0]==="point"){ const x=D.pointsLib.find(p=>p.id===parts[1]); return x?mdClean(x.text):""; }
  if(parts[0]==="oral"){ const x=D.oralLib.find(p=>p.id===parts[1]); return x?(parts[2]==="zh"?x.zh:x.en):""; }
  if(parts[0]==="full"){ const o=D.oralFull.find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; return s?(s.text||s.en||""):""; }
  if(parts[0]==="fullp"){ const o=D.oralFull.find(p=>p.id===parts[1]); const s=o&&o.sections[+parts[2]]; const p=s&&s.paragraphs&&s.paragraphs[+parts[3]]; return p?(p.text||""):""; }
  /* v113：整片修订稿的官方原文 = 快照（CSV 回灌后的定稿）序列化；快照缺失时回退当前库 */
  if(parts[0]==="fullsec"){
    try{
      const snap=(window.__wdOralOrig&&window.__wdOralOrig.find(p=>p.id===parts[1]))||D.oralFull.find(p=>p.id===parts[1]);
      const s=snap&&snap.sections&&snap.sections[+parts[2]];
      if(s){
        const ps=Array.isArray(s.paragraphs)&&s.paragraphs.length?s.paragraphs:[{text:s.text||s.en||""}];
        const lines=[];
        ps.forEach(p=>{ if(p.head)lines.push("【小标题】"+p.head); if(p.note)lines.push("【小注】"+p.note); lines.push(String(p.text||"").trim(),""); });
        return lines.join("\n").trim();
      }
    }catch(e){}
    return "";
  }
  if(parts[0]==="myoral"){ const m=(st.myOral||[]).find(x=>x.id===parts[1]); return m?("问："+m.q+"\n答："+m.a+(m.ref?"\n参考："+m.ref:"")):""; }
  if(parts[0]==="clue"){ const c=(D.clues||[]).find(x=>x.id===parts[1]); return c?mdClean(c.text):""; }
  return "";
}

   依据：项目理解与需求确认_v2.md 第 5、6 节（用户已批准）
   - 雾回潮五档阶梯：次日→3日→7日→14日→30日；三档自评（清晰/模糊/想不起来）
   - 四类任务：a 理经 / b 问契 / c 修诵 / d 传译 ＋ 消印（复习）
   - 排程硬约束：相邻任务不同大类；相邻理经不同科目
   - 1 现实日=1 自然日=次元内 1 周=5 纪日；正修纪日×3 ＋ 轻修纪日×2
   - 跳过的任务视作已做完，进入待消印集合（st.skipped × srs pending）
   - 旧 280 静态任务退役；FSRS 字段预留（约 1000 次复习后可升级）
   ============================================================ */
/* —— 1. SRS 内核（雾回潮期统一记忆调度）—— */
const SRS_TIERS=[1,3,7,14,30];
const srsToday=()=>new Date().toISOString().slice(0,10);
const srsAdd=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
function srsAll(){ if(!st.srs||typeof st.srs!=="object") st.srs={}; return st.srs; }
function srsGet(key){ const a=srsAll(); if(!a[key]) a[key]={tier:0,due:"1970-01-01",lastAt:"",streak:0,lapses:0,pending:false,fsrs:null}; return a[key]; }
/* srsMark：首学入档（档 1 · 明日回潮）——已入档的卡不动 */
function srsMark(key){ const r=srsGet(key); if(r.tier>0) return r; r.tier=1; r.due=srsAdd(SRS_TIERS[0]); r.lastAt=srsToday(); save(); return r; }
/* srsReview：三档自评——2 清晰→进档 / 1 模糊→停档重排 / 0 想不起来→退档+印记 */
function srsReview(key,grade){ const r=srsGet(key);
  if(grade>=2){ r.tier=Math.min(5,(r.tier||1)+1); r.due=srsAdd(SRS_TIERS[r.tier-1]); r.streak=(r.streak||0)+1; }
  else if(grade===1){ r.tier=Math.max(1,r.tier||1); r.due=srsAdd(SRS_TIERS[r.tier-1]); }
  else { r.tier=1; r.due=srsAdd(1); r.lapses=(r.lapses||0)+1; r.streak=0; }

  if(!valid.length) return [];
  valid.sort((a,b)=>(w[b].n-w[a].n)||(w[a].at-w[b].at));
  const picked=valid.slice(0,Math.max(1,Math.floor(limit/2)));

    if(z.kind==="blank"&&z.a) (blankUsed[ent.p.id]=blankUsed[ent.p.id]||[]).push(z.a);
    return z;
  };
  for(const c of cards){
    /* v70：oralLib 中英句对（WEL/FAR/CITY/…）即便被烘焙进 pointsLib，也只出翻译题，
       绝不出判断/填空/选择——从根上消灭「My name is ____」「注意安全（判断正误）」这类异化物 */
    if(isOralLibId(c)){
      const z=mkTransQuiz(c);
      if(z){ z.key=c; seenCov.add(quizNormKey(z)); out.push(z); }
      continue;
    }
    const ent=kws.find(x=>x.p.id===c);
    if(ent){
      /* v80：b 类问契 S5 → 中英双语来客之问（一问一答，离线用语料库/模板，在线由 ensureWenqiAI 升级） */
      if(/^S5-/.test(c)){
        const bq=wenqiQAOf(c)||{qzh:ptTitle(ent.p,c),qen:"",azh:cleanMd(ent.p.text),aen:"",zhOnly:true};
        const z=sanitizeQuiz({kind:"recall",lang:"en",key:c,pid:c,
          q:bq.qen||bq.qzh,
          a:bq.aen||bq.azh,
          cn:{q:bq.qzh,a:bq.azh},
          enOnly:!bq.aen,
          why:"中英问契 "+c});
        z.key=c; seenCov.add(quizNormKey(z)); out.push(z); continue;
      }
      /* v62 Task6：覆盖题也题面去重——5 类题型逐个试，题型前缀互异保证必然取到不重复题面 */
      let z=null;
      const ford=forms.slice().sort(()=>Math.random()-0.5);
      for(const fm of ford){
        const zz=genOne(ent,fm);
        if(!seenCov.has(quizNormKey(zz))){ z=zz; break; }
      }
      if(!z) z=genOne(ent,"judge");
      seenCov.add(quizNormKey(z)); z.key=c; z.pid=c; out.push(z); continue;
    }
    /* 非笔试卡：修诵段落 → 整段复述题（先回看再遮文诵）；传译句 → 翻译题；问契 → 来客之问（自评三档） */
    const cd=rtCardOf(c); if(!cd) continue;
    if(cd.cat==="c"){
      const z=mkOralRecQuiz(c);
      if(z){ z.key=c; seenCov.add(quizNormKey(z)); out.push(z); }
      continue;
    }
    if(cd.cat==="d"){
      const z=mkTransQuiz(c);
      if(z){ z.key=c; seenCov.add(quizNormKey(z)); out.push(z); }
      continue;
    }
    let qt="",at="",wy="先凭记忆作答，再对照要点自评——断续或未想起都会进入回潮名册。";
    if(cd.cat==="b"){
      if(/^QM-/.test(c)) qt=cd.title||"来客之问";
      else { const pp=D.pointsLib.find(x=>x.id===c); const sub=pp?moduleSubject(pp):""; qt=(sub?sub+" · ":"")+(cd.title||"来客之问"); }
      at=cd.text;
    }
    if(qt){ const z=sanitizeQuiz({kind:"recall",key:c,pid:c,q:qt,a:at,why:wy}); z.key=c; seenCov.add(quizNormKey(z)); out.push(z); }
  }
  /* 题量 = 显式 targetN（验界/守关 boss 传 8/10/12，不动）。
     v80：b 问契/口语/段落卡严格"一卡一题"（不追加笔试题）；纯 a 笔试点才按 2.2a 追加。 */
  const oneEach=cards.every(c=>/^S5-|^QM-/.test(c)||isOralLibId(c)||/^ORB-/.test(c));
  const target=targetN?Math.max(1,Math.round(targetN)):(oneEach?cards.length:Math.max(1,Math.round(quizTargetN(cards.length))));
  let guard=0;
  const seenQ=new Set(out.map(quizNormKey));
  while(out.length<target&&kws.length&&guard<target*4){ guard++;
    const cnt={}; out.forEach(z=>cnt[z.pid]=(cnt[z.pid]||0)+1);
    const pidPick=weightedPid(pids,cnt);
    if(!pidPick) break;
    /* v80：追加题只允许 S1-4 笔试点；S5 问契卡一律一卡一题，不得补判断/填空 */
    if(!/^S[1-4]-/.test(pidPick)) continue;
    const ent=kws.find(x=>x.p.id===pidPick);
    const z=genOne(ent,forms[Math.floor(Math.random()*forms.length)]);
    if(!z) continue;
    z.key=pidPick; z.pid=pidPick;
    if(seenQ.has(quizNormKey(z))) continue;
    seenQ.add(quizNormKey(z)); out.push(z);
  }
  return shuffleArr(out);
}
/* v64 p6：英文段落卡真实锚点——大写专名、数字事实、长实词按词边界标 em（与分站关键词同源） */
const ORAL_STARTER=new Set(["This","That","These","Those","There","Here","Today","Now","Then","After","Before","When","While","During","As","If","Once","Although","One","We","You","It","Its","Our","Their","They","Them","She","He","His","Her","The","A","An","In","On","At","By","For","From","Into","Inside","Outside","Over","Under","Near","Next","Each","Every","Some","Many","Most","Both","All","No","Not","Only","Just","So","But","And","Or","Yet","Also","Even","Still","Since","Until","Because","Another","Such","What","Why","How","Where"]);
function hlOralAnchors(text){
  const firstWord=(/^[A-Za-z]+/.exec(text||"")||[""])[0];
  const anchors=oralKeywords(text,6).filter(k=>!(ORAL_STARTER.has(k)&&k===firstWord));
  let out=richAware(text);   /* 校订富文本直接放行；纯文本 esc */
  anchors.forEach(k=>{
    const re=new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g");
    out=out.replace(re,m=>"<em>"+m+"</em>");
  });
  return out;
}
/* v80：传译/问契中文块标记——数字与计量单位、引号术语分别高亮 */
function hlTransZh(s){
  let h=richAware(s);   /* 校订富文本直接放行；纯文本 esc */
  h=h.replace(/\d[\d.,]*(?:\s?(?:万|亿|平方米|平方公里|公里|米|年|位|处|座|间|个|次|％|%))?/g,m=>`<em>${m}</em>`);
  h=h.replace(/(「[^」]*」|“[^”]*”|『[^』]*』)/g,m=>`<b style="color:var(--gold)">${m}</b>`);
  return h;
}

/* v81：整景理解本地概括——用景点中文名+功能画像组织"内容地图"，只就真正的年份/数字
   直问具体事实，绝不嵌英文小标题、不列英文词单。返回 {summary, questions[]}；
   AI 在线时由 aiOralBriefUpgrade 用真概括整体替换。 */
function localOralBrief(x){
  const {name,tags,nums,sentences}=x;
  const tagSet=new Set(tags||[]);
  const isYear=n=>/^(1\d{3}|20[0-9]\d)$/.test(n);   /* 1000–2099 才算年份，排除 654/600 等数量词 */
  const years=(nums||[]).filter(isYear);
  const measures=(nums||[]).filter(n=>!isYear(n)).slice(0,4);
  const site=name||"这处地方";
  let summary;
  if(tagSet.has("history")){
    summary="这一节按时间顺序讲「"+site+"」的来历与变迁"+(years.length?("，年份线索有 "+years.slice(0,4).join("、")):"")+"。读的时候把每个年份各自对应到一件事——始建、被毁、重建或列入遗产，时间线就清楚了。";
  } else if(tagSet.has("scale")){
    summary="这一节用数字交代「"+site+"」的规模与规制"+(measures.length?("（"+measures.join("、")+"）"):"")+"。读时弄清每个数字各自量的是什么——面积、高度、间数还是长度，别让它们互相串门。";
  } else if(tagSet.has("route")){
    summary="这一节是行进路线：按顺序交代从哪进入、依次经过哪几处、在哪收尾。跟着脚步记次序，不要跳。";
  } else if(tagSet.has("remind")){
    summary="这一节是当面叮嘱，提了几条要做与不要做的事。读时分清每条的要求与理由，这正是现场最容易考、也最实用的部分。";
  } else if(tagSet.has("meaning")){
    summary="这一节解释这处建筑或陈设的名称由来与规制寓意。读时抓住『字面意思—实际说法—象征什么』三层。";
  } else if(tagSet.has("greet")){
    summary="这是开场致意：问候来客、自我介绍、交代今日安排与注意事项。读时按『问候→介绍→路线→提醒』四环拆开，每环对应一句话。";
  } else if(tagSet.has("closing")){
    summary="这是收尾道别：总结行程、致谢、送上祝福。读时留意它按什么顺序收束，以及固定礼貌套话的说法。";
  } else {
    const dn=[...years,...measures].slice(0,4);
    summary="这一节共 "+(sentences||[]).length+" 句，围绕「"+site+"」展开"+(dn.length?("，读时先盯住数字（"+dn.join("、")+"）各自对应哪桩事实"):"")+"，再把句子串成一条线。";
  }
  const questions=[];
  if(tagSet.has("history")){
    years.slice(0,3).forEach(n=>questions.push(n+" 年这一年，原文说发生了什么事？"));
    questions.push("它后来获得了什么认定（世界遗产或文物保护单位）？是哪一年？");
  } else if(tagSet.has("scale")){
    measures.slice(0,3).forEach(n=>questions.push("数字 "+n+" 量的是哪一项——面积、高度、间数还是长度？"));
    if(!measures.length) questions.push("这一节报了哪些数字？各自量的是什么？");
  } else if(tagSet.has("route")){
    questions.push("按原文，行进路线从哪里开始、依次经过哪几处？");
    questions.push("路线的终点是哪里？中途最不能错过的一处是什么？");
  } else if(tagSet.has("remind")){
    questions.push("原文一共提了几条要求？哪几条是『要做』、哪几条是『不要做』？");
    questions.push("这些提醒各自的理由是什么？");
  } else if(tagSet.has("meaning")){
    questions.push("这处地方为什么叫这个名字？字面本义和实际说法分别是什么？");
    questions.push("它的规制或摆设象征什么？");
  } else {
    questions.push("用三句话说出这一节讲了哪几件事。");
    questions.push("这一节里最关键的一个数字或事实是什么？它支撑哪件事？");
  }
  if(!questions.length) questions.push("用三句话说出这一节讲了哪几件事。");
  return {summary,questions:questions.slice(0,3)};
}

function quizOrderSteps(s){

function quizOrderWhy(c,w){

      if(C[i]===W[i]) continue;
      const k=C.indexOf(W[i]);      /* 错放的环节在正解里的位次 */
      const j=W.indexOf(C[i]);      /* 应放的环节在错链里的位次 */
      if(k>=0&&j>=0) return `第 ${i+1} 位应是「${C[i]}」，这里却是「${W[i]}」——「${C[i]}」与「${W[i]}」次序颠倒：流程上先${C[i]}，之后才${W[i]}（正解分居第 ${i+1}、${k+1} 位）。`;
      if(k>=0) return `第 ${i+1} 位应是「${C[i]}」，「${W[i]}」被提前了——它在正解中到第 ${k+1} 位才出现。`;
      if(j>=0) return `第 ${i+1} 位应是「${C[i]}」；此选项把它放到了第 ${j+1} 位。`;
      return `第 ${i+1} 位应是「${C[i]}」，此选项此处为「${W[i]}」。`;

function quizOptSource(selfPid,text){
  const raw=String(text==null?"":text).trim();

  const mod=/^(S\d+-\d+)/.exec(selfPid||""), sub=/^(S\d+)/.exec(selfPid||"");
  const scopes=[];
  if(mod) scopes.push(D.pointsLib.filter(p=>(p.id||"").startsWith(mod[1])));
  if(sub) scopes.push(D.pointsLib.filter(p=>(p.id||"").startsWith(sub[1])));
  let best=null;
  for(const arr of scopes){
    for(const p of arr){
      if(p.id===selfPid) continue;
      const body=String(p.text||"");
      if(raw.length>=10&&body.indexOf(raw)>=0){ best={pid:p.id,name:ptTitle(p,p.id),cov:2}; break; }
      const sentences=body.split(/[。；;！？!?\n]/);
      for(const s0 of sentences){
        const sen=quizNormSent(s0);
        if(sen.length<8) continue;
        let cov=0;
        if(sen.includes(T)||T.includes(sen)) cov=Math.min(sen.length,T.length)/Math.max(sen.length,T.length);
        else{
          const mn=Math.min(sen.length,T.length);
          if(mn<10) continue;
          const ss=sen.length<=T.length?sen:T, ls=sen.length<=T.length?T:sen;
          let hit=0; for(let i=0;i<ss.length-1;i++){ if(ls.indexOf(ss.slice(i,i+2))>=0) hit++; }

          if(cov<0.8) cov=0;

}

function extractKeyWords(txt, tip, anchor){

  if(txt){

    (t.match(/\d{2,4}\s*年?[一-龥]{0,6}/g)||[]).slice(0,6).forEach(s=>push(s.replace(/\s+/g,"")));

/* v63：篡改必须真实发生——返回 {s, mod:{from,to}}（from=题面被改片段，to=正确写法）；

function distortTxt2(txt, keyWords){
  const s=String(txt||"");
  /* 优先篡改年份/数字——错点明确，玩家可判断 */
  const nums=s.match(/\d{2,4}\s*年?/g);
  if(nums&&nums.length){
    const n=nums[Math.floor(Math.random()*nums.length)];
    const num=parseInt(n,10);
    if(!isNaN(num)){
      const d=[2,3,5,10][Math.floor(Math.random()*4)]*(Math.random()<0.5?1:-1);
      const rep=String(Math.max(1,num+d))+(/年/.test(n)?"年":"");
      if(rep!==n) return {s:s.replace(n,rep),mod:{from:n,to:rep}};
    }
  }
  if(keyWords&&keyWords.length){
    const order=keyWords.slice().sort(()=>Math.random()-0.5);
    for(const w of order){
      if(w&&s.indexOf(w)>=0){ const rep=(w.length>=4?"并非":"不是")+w; return {s:s.replace(w,rep),mod:{from:w,to:rep}}; }
    }

  }).join("");

    </div>

    <div style="font-size:11.5px;color:var(--dim);margin-top:8px">${won?"想再量一次随时入阵；错题已送入星盘，稍后去清印。":"雾魁没破你的胆——回星盘清完错印再入阵，会更稳。"}</div>`;

/* v69：干扰句池归一——兼容旧字符串与新 {s,pid} 对象（pid 供解析归因“该选项属于哪个考点”） */
function qzPoolOf(arr){
  return (arr||[]).map(x=>typeof x==="string"?{s:x,pid:null}:(x&&x.s?{s:x.s,pid:x.pid||null}:null)).filter(x=>x&&x.s);
}
/* v109：选项质量守卫——「考察目标/重点提示/记忆锚点/新题源」这类命题说明是给我们自己看的元信息，
   绝不能进入题干或选项（截图里出现「此项叙述与考点「X」无关」「考察目标：…被列为正确项」即此类事故）。
   同时禁止「此项为无关叙述」这类一眼可辨的凑数占位句：凑不出足够真选项时，宁可把题型降级成判断题。 */
const _META_OPT_RE=/(考察目标|重点提示|记忆锚点|备考提示|命题提示|新题源|出处是|考察要点|考纲要求|本考点应|此题考查)/;
function _optOk(s){ const t=String(s||"").trim(); return t.length>=10 && !_META_OPT_RE.test(t); }
/* 降级判断题：判断题只需一个真句（可篡改），永远出得来，形态也比占位选项体面 */
function _genericTitle(t){ return String(t||"").length<10 || /^(地位|作用|特点|特征|分类|原则|要求|概念|定义|内容|流程|规范|职责|构成|条件|标准|方式|方法|意义|影响)/.test(String(t||"")); }
function _degradeJudge(pt,keyWords,pid){
  let core=ptKeySentence(pt)||(cleanMd(pt.text||"").length>120?clipClause(cleanMd(pt.text||""),120):cleanMd(pt.text||""));
  core=withSubject(core,pt);
  let a=Math.random()<0.5, body=core, mod=null;
  if(!a){ const r=distortTxt2(core,keyWords); if(r){ body=r.s; mod=r.mod; } else a=true; }
  const z={kind:"judge", q:body+"（判断正误）", a, pid, fact:core, why:"出自考点 "+pid};
  if(mod) z.mod=mod;
  return z;
}
/* v69：usedBlanks——同一考点本轮已挖过的答案词，再次出填空时换词换位置，杜绝原题重出 */
function genQuestion(form, pt, keyWords, pid, distractorSentences, usedBlanks){
  const txt=cleanMd(pt.text||"");
  const title=ptTitle(pt,pid);
  if(form==="judge"){
    let core=ptKeySentence(pt)||(txt.length>120?clipClause(txt,120):txt);
    core=withSubject(core,pt);
    /* v63：伪题必须真实篡改——篡改失败就地翻真，禁止"原句判伪"假题；记录篡改点 mod 供解析划线 */
    let a=Math.random()<0.5, body=core, mod=null;
    if(!a){ const r=distortTxt2(core,keyWords); if(r){ body=r.s; mod=r.mod; } else a=true; }
    const z={kind:"judge", q:body+"（判断正误）", a, pid, fact:core, why:"出自考点 "+pid};
    if(mod) z.mod=mod;
    return z;
  }
  if(form==="blank"){
    /* 候选词：anchor/正文关键词 → 三/四位完整年份 → 句中中文专名；
       在全文句子级逐个试挖，优先含数字的信息句。
       v69：usedBlanks 中已挖过的词直接跳过——同考点反复出填空时换词换位，不重出原题 */
    const used=Array.isArray(usedBlanks)?usedBlanks:[];
    const cands=[];
    (keyWords||[]).forEach(w=>{ if(w&&txt.indexOf(w)>=0&&!cands.includes(w)&&!used.includes(w)) cands.push(w); });
    (txt.match(/\d{3,4}\s*年?/g)||[]).forEach(s=>{ const w=s.replace(/\s+/g,""); if(!cands.includes(w)&&!used.includes(w)) cands.push(w); });
    const sents=txt.split(/(?<=[。！？；])/).map(s=>s.trim()).filter(s=>s.length>=8);
    if(!sents.length) sents.push(txt.slice(0,80));
    sents.sort((a,b)=>(/\d/.test(b)?1:0)-(/\d/.test(a)?1:0));
    let masked=null, ans="";
    /* v109：挖空位置须「有话可说」——空在句首、或去掉空后不足 8 字，会得到「____基本素质：…」这种空洞题干 */
    const _maskOk=m=>!!m&&!/^____/.test(m)&&m.replace(/____+/g,"").length>=8;
    for(const w0 of cands){
      for(const sent of sents){ const m=maskWord(sent,w0); if(_maskOk(m)){ masked=m; ans=w0; break; } }
      if(masked) break;
    }
    if(!masked){
      for(const sent of sents){
        const cw=sent.match(/[一-龥]{2,4}/g)||[];
        for(const w0 of cw){ if(KW_STOP.has(w0)||used.includes(w0)) continue; const m=maskWord(sent,w0); if(_maskOk(m)){ masked=m; ans=w0; break; } }
        if(masked) break;
      }
    }
    if(!masked){
      /* v109：挖不出词就降级判断题——「关于「X」，空缺处应填____」既空泛又必然暴露答案结构 */
      return _degradeJudge(pt,keyWords,pid);
    }
    return {kind:"blank", q:withSubject(masked,pt), a:ans, accept:[ans], pid, why:"出自考点 "+pid};
  }
  if(form==="choice"){
    /* 选项是完整陈述句：正确项=本考点核心句，干扰项=同模块其他考点的真句。
       v69：ometa 逐项记录错因（other=属其他考点/不符题意，bad=本身有误划错处，fill=凑数）供解析归因
       v109：真干扰句不足 3 个（或含元信息/占位句）时不凑数，直接降级判断，避免"此项为无关叙述"出现 */
    let ans=ptKeySentence(pt)||(txt.length>120?clipClause(txt,120):txt);
    ans=withSubject(ans,pt);
    const dpool=qzPoolOf(distractorSentences).filter(x=>x.s!==ans&&_optOk(x.s));
    if(dpool.length<3) return _degradeJudge(pt,keyWords,pid);
    const items=shuffleArr(dpool).slice(0,3).map(e=>({o:e.s,m:e.pid?{t:"other",pid:e.pid}:{t:"other"}}));
    const sh=shuffleArr([{o:ans,m:null}].concat(items.slice(0,3)));
    return {kind:"choice", q:(_genericTitle(title)?`下列表述正确的是？`:`关于「${title}」，以下说法正确的是？`), opts:sh.map(x=>x.o), ometa:sh.map(x=>x.m), a:ans, pid, why:"出自考点 "+pid};
  }
  if(form==="wrongone"){
    /* v62 Task5：选错误项——3 个同模块真句 + 1 个本考点篡改句（a=篡改句，点中即对）。
       v69：ometa 记录每项归属/错点，解析可逐项归因
       v109：真句不足或篡改失败 → 降级判断，绝不产出"此项关于「X」的叙述与事实不符" */
    let ans=ptKeySentence(pt)||(txt.length>120?clipClause(txt,120):txt);
    ans=withSubject(ans,pt);
    const dpool=qzPoolOf(distractorSentences).filter(x=>x.s!==ans&&_optOk(x.s));
    if(dpool.length<3) return _degradeJudge(pt,keyWords,pid);
    const items=shuffleArr(dpool).slice(0,3).map(e=>({o:e.s,m:{t:"other",pid:e.pid}}));
    let bad=null, badM=null;
    for(let k=0;k<6&&!bad;k++){ const r=distortTxt2(ans,keyWords); if(r&&r.s!==ans&&_optOk(r.s)&&!items.some(x=>x.o===r.s)){ bad=r.s; badM={t:"bad",from:r.mod.from,to:r.mod.to}; } }
    /* 关键句篡改失败时，取全文其他完整句做微篡改（选项形态逼真），胜过一眼可辨的元语句兜底 */
    if(!bad){
      const altS=shuffleArr(txt.split(/(?<=[。！？；])/).map(s=>s.trim()).filter(s=>s.length>=10&&s!==ans)).slice(0,4);
      for(const s0 of altS){ const r=distortTxt2(s0,keyWords); if(r&&r.s!==s0&&_optOk(r.s)&&!items.some(x=>x.o===r.s)){ bad=r.s; badM={t:"bad",from:r.mod.from,to:r.mod.to}; break; } }
    }
    if(!bad) return _degradeJudge(pt,keyWords,pid);
    const sh=shuffleArr(items.concat([{o:bad,m:badM}]));
    return {kind:"wrongone", q:(_genericTitle(title)?`下列表述错误的是？`:`关于「${title}」，以下说法错误的是？`), opts:sh.map(x=>x.o), ometa:sh.map(x=>x.m), a:bad, pid, why:"错误项篡改自考点 "+pid};
  }
  if(form==="multi"){
    /* v62 Task5：多选——2 正确陈述（本考点句+同模块真句）+ 2 篡改句；空池时多源兜底，保证四选项互异。
       v69：ometa 给错误项记错点（bad）或事实不符（mismatch），解析逐项归因
       v109：删掉 exam_tip 兜底（那正是「考察目标：…」被当成正确项的元凶）；凑不齐就降级判断 */
    let ans=ptKeySentence(pt)||(txt.length>120?clipClause(txt,120):txt);
    ans=withSubject(ans,pt);
    const dpool=qzPoolOf(distractorSentences).filter(x=>x.s!==ans&&_optOk(x.s));
    const true2=shuffleArr(dpool)[0]||null;
    if(!true2) return _degradeJudge(pt,keyWords,pid);
    const mkBad=s=>{ for(let k=0;k<6;k++){ const r=distortTxt2(s,keyWords); if(r&&r.s!==s&&_optOk(r.s)) return r; } return null; };
    const r1=mkBad(ans);
    if(!r1) return _degradeJudge(pt,keyWords,pid);
    let b1=r1.s, b1M={t:"bad",from:r1.mod.from,to:r1.mod.to};
    const r2=mkBad(true2.s);
    if(!r2||r2.s===b1||r2.s===ans||r2.s===true2.s) return _degradeJudge(pt,keyWords,pid);
    const b2=r2.s, b2M={t:"bad",from:r2.mod.from,to:r2.mod.to};
    const items=[{o:ans,m:null},{o:true2.s,m:null},{o:b1,m:b1M},{o:b2,m:b2M}];
    const sh=shuffleArr(items), opts=sh.map(x=>x.o);
    const aIdx=sh.map((x,i)=>(x.m===null?i:-1)).filter(i=>i>=0);
    return {kind:"multi", q:(_genericTitle(title)?`下列表述正确的有？（多选）`:`关于「${title}」，下列说法正确的有？（多选）`), opts, ometa:sh.map(x=>x.m), aIdx, a:aIdx.map(i=>opts[i]), pid, why:"出自考点 "+pid};
  }
  let _core=ptKeySentence(pt)||(txt.length>120?clipClause(txt,120):txt);
  _core=withSubject(_core,pt);
  return {kind:"judge", q:_core+"（判断正误）", a:true, pid, fact:_core, why:"出自考点 "+pid};
}
/* 兜底题库：AI 失败且本任务静态题为空时，本地算法造题，保证温故试炼永不 0/0 空转。
   v51：题量溢出（max(考点数*2, 考点数+4, 8)），每考点 1-2 题，形式随机（judge/blank/choice）。
   v53：干扰池改为"同模块其他考点的完整核心句"，选择题四个选项都是完整陈述，可正常作答。
   v69：同一轮题目绝不重复——题面归一化去重 + 同考点题型轮换（judge/blank/choice/multi/wrongone
   逐个轮）+ 填空换词换位（usedBlanks）。 */
function fallbackQuiz(q){
  const own=D.quizzes[q.id]||[];
  const pages=D.lectures[q.id]||[];
  const itemPids=[...new Set(pages.flatMap(p=>(p.items||[]).map(it=>it.id).filter(Boolean)))];
  const basePids=[...new Set((own||[]).map(z=>z.pid).filter(Boolean))];
  /* v70/v80：只有 S1-4 笔试点参与笔试补题；口语句/导游段落/S5 问契/QM 一律保留 own 原题（传译/复述/双语问契），不造异化题 */
  const pids=[...new Set([...basePids,...itemPids])].filter(p=>/^S[1-4]-/.test(p));
  /* 1. 已有静态题作为基底（过清洗） */
  const out=(own&&own.length)?own.slice().map(sanitizeQuiz):[];
  const covered=new Set(out.map(z=>z.pid).filter(Boolean));
  /* 2. 干扰句池：同 module 的其他考点完整核心句（排除本关考点），v69 带 pid 供解析归因 */
  const ownPts=D.pointsLib.filter(p=>pids.includes(p.id));
  const mods=new Set(ownPts.map(p=>p.module).filter(Boolean));
  const sentencePool=D.pointsLib
    /* FIX-P1：干扰项严格同 module（原 OR 同 subject 导致跨模块乱捞，约 39% 任务选项不相干） */
    .filter(p=>!pids.includes(p.id)&&(p.module&&mods.has(p.module)))
    .map(p=>({s:ptKeySentence(p),pid:p.id})).filter(x=>x.s);
  /* 3. v80：题量 = 非笔试原题（传译/复述/双语问契，一卡一题）+ 笔试点的 round(2.2a) */
  const fixedN=out.filter(z=>!/^S[1-4]-/.test(z.pid)).length;
  const targetN=fixedN+(pids.length?quizTargetN(pids.length):0);
  const FORMS=["judge","blank","choice","multi","wrongone"];
  /* v69：归一化去重 + 每考点题型轮换 + 填空换位 */
  const seenFQ=new Set(out.map(quizNormKey));
  const formsByPid={};
  const pickForm=pid=>{
    const arr=formsByPid[pid]||(formsByPid[pid]=FORMS.slice().sort(()=>Math.random()-0.5));
    return arr.shift()||FORMS[Math.floor(Math.random()*FORMS.length)];
  };
  const blankUsed={}; /* pid → 本轮已挖空过的答案词 */
  const make=(pid,form)=>{
    const pt=D.pointsLib.find(x=>x.id===pid); if(!pt) return null;
    const kw=extractKeyWords(pt.text,pt.exam_tip,pt.anchor);
    /* 干扰项只从当前考点同 module 里捞，杜绝跨模块张冠李戴（单元可能横跨多个模块） */
    const myPool=sentencePool.filter(e=>{ const op=D.pointsLib.find(x=>x.id===e.pid); return op&&op.module===pt.module; });
    const z=genQuestion(form||pickForm(pid),pt,kw,pid,myPool,blankUsed[pid]||[]);
    if(z&&z.kind==="blank"&&z.a) (blankUsed[pid]=blankUsed[pid]||[]).push(z.a);
    return z;
  };
  /* 4. 每个未覆盖考点造 1 题（先保证全覆盖），题面去重 */
  for(const pid of pids){
    if(covered.has(pid)) continue;
    const z=make(pid);
    if(z&&!seenFQ.has(quizNormKey(z))){ seenFQ.add(quizNormKey(z)); out.push(z); }
    covered.add(pid);
  }
  /* 5. 补足 b：重点/错题条目加权抽取，同条目不超 3、题面去重（重复即换题型重造） */
  let guard=0;
  while(out.length<targetN && pids.length && guard<targetN*6){
    guard++;
    const cnt={}; out.forEach(z=>cnt[z.pid]=(cnt[z.pid]||0)+1);
    const pidPick=weightedPid(pids,cnt);
    if(!pidPick) break;
    const z=make(pidPick);
    if(!z||seenFQ.has(quizNormKey(z))) continue;
    seenFQ.add(quizNormKey(z)); out.push(z);
  }
  /* 6. 极端情况下仍不足 b，从同幕题池随机补（题面去重） */
  if(out.length<targetN){
    const pool=[];
    DAYS.forEach(d=>d.quests.forEach(x=>{ if(x.act===q.act){ const zz=D.quizzes[x.id]; if(zz&&zz.length) pool.push(...zz); } }));
    const src=pool.length?pool:Object.values(D.quizzes).flat().filter(v=>v&&v.length);
    const used=new Set();
    while(out.length<targetN&&used.size<src.length){ const k=Math.floor(Math.random()*src.length); if(used.has(k))continue; used.add(k); const z=sanitizeQuiz(src[k]); if(seenFQ.has(quizNormKey(z)))continue; seenFQ.add(quizNormKey(z)); out.push(z); }
  }
  /* 7. 打乱顺序，出口统一清洗 */
  return shuffleArr(out).map(sanitizeQuiz);
}
/* v51：错题簿知识点化——按 pid 聚合，forms 上限 5，第1次重复原题/第2次刷新/此后轮转 */
function getWrongQuestion(we){
  if(!we||!we.forms||!we.forms.length) return null;
  const idx=we.seen % we.forms.length;
  return we.forms[idx];
}
function pushWrongEntry(qid, z){
  const pid=z.pid||"";
  const topic=wTopic({pid});
  let we=st.wrong.find(w=>w.pid===pid);
  if(!we){
    we={pid,topic,forms:[],seen:0,at:new Date().toISOString(),src:qid||"star",qid:qid||""};
    st.wrong.push(we);
  }
  if(we.forms.length<5){
    /* v69：归一化去重；保留 ometa/mod 供解析逐项归因与错点划线 */
    const fk=quizNormKey(z);
    if(!we.forms.some(f=>quizNormKey(f)===fk)){
      we.forms.push({kind:z.kind,q:z.q,a:z.a,accept:z.accept,opts:z.opts,ometa:z.ometa,why:z.why,fact:z.fact,mod:z.mod,pid:z.pid,okA:(z.kind==="judge"?(z.a?"真":"伪"):z.a)});
    }
  }
  we.at=new Date().toISOString();
}
/* v51：错题刷新——第2次起每次进入，forms 不足 5 时从考点本数据造新形式补足 */
function refreshWrongForms(we){
  if(!we||we.forms.length>=5) return;
  const pt=D.pointsLib.find(p=>p.id===we.pid); if(!pt) return;
  const kw=extractKeyWords(pt.text,pt.exam_tip,pt.anchor);
  const forms=["judge","blank","choice","multi","wrongone"];
  /* v53：干扰池用同模块其他考点的完整核心句。v69：带 pid 归因 + 归一化去重 + 填空换位 */
  const sentencePool=D.pointsLib
    /* FIX-P1：错题刷新干扰池严格同 module */
    .filter(p=>p.id!==we.pid&&(pt.module&&p.module===pt.module))
    .map(p=>({s:ptKeySentence(p),pid:p.id})).filter(x=>x.s);
  /* v69：已出过的填空词不再挖（同一知识点换词换位） */
  const usedBlanks=we.forms.filter(f=>f.kind==="blank"&&f.a).map(f=>f.a);
  let guard=0;
  while(we.forms.length<5 && guard<12){
    guard++;
    const form=forms[Math.floor(Math.random()*forms.length)];
    const nq=sanitizeQuiz(genQuestion(form,pt,kw,we.pid,sentencePool,usedBlanks));
    const fk=quizNormKey(nq);
    if(we.forms.some(f=>quizNormKey(f)===fk)) continue;
    if(nq.kind==="blank"&&nq.a) usedBlanks.push(nq.a);
    we.forms.push({kind:nq.kind,q:nq.q,a:nq.a,accept:nq.accept,opts:nq.opts,ometa:nq.ometa,why:nq.why,fact:nq.fact,mod:nq.mod,pid:nq.pid,okA:(nq.kind==="judge"?(nq.a?"真":"伪"):nq.a)});
  }
}

function pickFile(accept,cb){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.style.cssText="position:fixed;left:-9999px;top:-9999px";
  /* v58：input 必须持续挂载到文件处理结束——WebKit/Safari 中 file input 分离后，
     由其 File 创建的 blob: URL 加载会永久挂起（img 既不 onload 也不 onerror），
     表现为上传按钮一直停在“处理中…”。cb 可返回 Promise，settle 后才移除；
     不返回时（裁剪 UI 场景）由调用方通过返回值自行释放，10 分钟兜底回收。 */
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    try{ console.log("[立绘上传] 已选文件:",f.name,f.type,Math.round(f.size/1024)+"KB"); }catch(e){}
    let ret;
    try{ ret=cb(f); }
    catch(e){ setTimeout(()=>{ throw e; },0); ret=Promise.reject(e);
    }
    if(ret&&typeof ret.then==="function"){
      Promise.resolve(ret).then(()=>inp.remove(),()=>inp.remove());
    }
  };
  document.body.appendChild(inp); inp.click();
  setTimeout(()=>{ try{inp.remove();}catch(e){} }, 600000);
  return inp;
}

      const NOVELTY=/^(eddy|flo|reed|rocko|shelley|sandy|grandma|grandpa|alvin|jester|bahh|bubbles|cellos|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|kathy|ralph|hysterical|junior|deranged|nervous|good news|bad news|boing|karoo|toulouse|otis)/i;
      const rank=v=>({"高级":40,"增强":30,"神经网络":25,"Siri":20}[v.grade]||10)+(v.local?3:0);
      const arr=list.filter(v=>(wantZh?/^zh/i.test(v.lang):/^en/i.test(v.lang))&&!NOVELTY.test(v.name))
                    .sort((a,b)=>rank(b)-rank(a));
      const opts=(a)=>a.map(v=>`<option value="${esc(v.name)}"${v.name===cur?" selected":""}>${esc(v.name)}${gradeTag(v.grade)} · ${esc(v.lang)}${v.local?"":" · 网络"}</option>`).join("");
      sel.innerHTML=arr.length?`<optgroup label="${wantZh?"中文声音（高质量在前）":"英文声音（高质量在前）"}">${opts(arr)}</optgroup>`
        :`<option value="">（本浏览器未列出${wantZh?"中":"英"}文声音）</option>`;
      if(cur&&!sel.querySelector(`option[value="${CSS.escape(cur)}"]`)) sel.value=cur; /* 当前声音不在列表时保留显示 */
    };
    if(zhSel) mk(zhSel,true,(()=>{ try{return V25.ttsGetVoicePref("zh-CN")}catch(e){return ""} })());
    if(enSel) mk(enSel,false,(()=>{ try{return V25.ttsGetVoicePref("en-US")}catch(e){return ""} })());
  };
  if(zhSel) zhSel.onchange=()=>{ try{ V25.ttsSetVoicePref("zh-CN",zhSel.value); SFX.tap(); toast("中文音色已切换："+zhSel.value); }catch(e){} };

  const zPrev=$("#voiceZhPrev",ov), ePrev=$("#voiceEnPrev",ov);
  if(zPrev) zPrev.onpointerdown=()=>{ SFX.tap(); try{ V25.ttsPreview(zhSel&&zhSel.value||V25.ttsGetVoicePref("zh-CN")); }catch(e){} };

      :D.npcs.map(n=>({id:n.id,name:WDCfg.npcName(n.id,n.name)}));
    const kindTxt={npcAvatar:"头像",npcPortrait:"立绘",userAvatar:"我的头像"};
    box.innerHTML=`<div style="border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:12px;background:rgba(212,175,55,.06)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">

        ${(window.WDSync&&WDSync.enabled())?`<button class="btn sm" type="button" id="orphScan">从云端历史版本找回更多</button>`:""}
      </div>
      <div class="note" style="margin:4px 0 8px">角色体系历次更新时，老版本上传的图片不会被删除，都保留在这里。认出哪张是你要用的，点对应角色即可归位；确定不要的再丢弃。</div>
      <div id="avOrphProg" class="small" style="color:var(--cyber);margin-bottom:6px"></div>
      <div style="display:flex;flex-direction:column;gap:8px">${orph.map(x=>{
        const fromNm=x.fromId==="_player"?"我的头像":(OLD_NPC_NAME[x.fromId]||x.fromId||"未知角色");
        const hintN=x.toId?((npcs.find(n=>n.id===x.toId)||{}).name||x.toId):"";
        const hint=hintN?("建议归位："+hintN):"";
        const actions=x.bucket==="userAvatar"
          ?`<button type="button" data-claim="${x.i}" data-to="_player" class="btn sm primary">设为我的头像</button>`
          :npcs.map(n=>`<button type="button" data-claim="${x.i}" data-to="${n.id}" class="btn sm">给${esc(n.name)}</button>`).join("");
        return `<div style="display:flex;gap:10px;align-items:center;background:var(--paper2);border-radius:8px;padding:6px 8px">
          <img src="${esc(x.url)}" alt="" style="width:52px;height:52px;object-fit:contain;border-radius:6px;background:var(--ink);flex:none" onerror="this.style.opacity=.2">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;color:var(--ink)">来自「${esc(fromNm)}」的${kindTxt[x.bucket]||"图片"} · ${x.kb}KB${x.src?' · <span style="color:var(--cyber)">'+esc(x.src)+"</span>":""}</div>
            ${hint?`<div class="small" style="color:var(--dim)">${esc(hint)}</div>`:""}
            <div class="cfgrow" style="margin-top:4px;gap:6px;flex-wrap:wrap">${actions}
              <button type="button" data-drop="${x.i}" class="btn sm ghost">丢弃</button></div>
          </div></div>`;
      }).join("")}</div></div>`;
    box.querySelectorAll("[data-claim]").forEach(b=>b.onpointerdown=()=>{
      WDCfg.claimOrphan(+b.dataset.claim,b.dataset.to); SFX.tap();
      toast("已归位"); ov.remove(); renderCfg();

    box.querySelectorAll("[data-drop]").forEach(b=>b.onpointerdown=()=>{
      WDCfg.dropOrphan(+b.dataset.drop); SFX.tap(); paintOrphans(); paintGrid();

    const scan=$("#orphScan",box);
    if(scan) scan.onpointerdown=()=>{
      scan.disabled=true; const prog=$("#avOrphProg",box);
      prog.textContent="正在连接云端…";
      WDSync.scanHistoryMedia((d,t)=>{ prog.textContent="扫描云端历史版本 "+d+"/"+t+" …"; })
        .then(found=>{ const n=WDCfg.adoptOrphans(found);
          prog.textContent=n?("已找回 "+n+" 张新图片，请在下方认领。"):"云端最近 30 个历史版本里没有更多图片了。";
          scan.disabled=false; paintOrphans(); })
        .catch(e=>{ prog.textContent="扫描失败："+esc(e.message||e); scan.disabled=false; });

  let cropFile=null,cropURL="",cropInp=null;
  function startCrop(id){
    cropInp=pickFile("image/png,image/jpeg",f=>{
      cropFile=f;
      const box=$("#avCrop",ov); box.style.display="block";
      cropURL="";
      const im=$("#cropImg",ov); im.removeAttribute("src"); im.style.transform="scale(1)";
      const zr=$("#cropZoom",ov); zr.value="1";
      $("#cropMsg",ov).textContent=(f.type.includes("png")?"PNG":"JPEG")+" · "+Math.round(f.size/1024)+"KB · 读取中…";
      $("#cropMsg",ov).style.color="var(--dim)";
      /* v58b：裁剪预览同样走 FileReader dataURL，不用 blob: URL（WebKit 安全作用域挂起） */
      const fr=new FileReader();
      fr.onload=()=>{ cropURL=String(fr.result); im.src=cropURL;
        $("#cropMsg",ov).textContent=(f.type.includes("png")?"PNG":"JPEG")+" · "+Math.round(f.size/1024)+"KB"; };
      fr.onerror=()=>{ $("#cropMsg",ov).textContent="文件读取失败，请换图重试"; $("#cropMsg",ov).style.color="var(--danger)"; box.style.display="none"; cropFile=null; };
      fr.readAsDataURL(f);
      zr.oninput=()=>{ im.style.transform="scale("+zr.value+")"; };
      $("#cropOk",ov).onpointerdown=()=>{
        const btn=$("#cropOk",ov); btn.disabled=true; btn.textContent="读取中…";
        WDCfg.setAvatar(id,cropFile,+zr.value,s=>{ btn.textContent=(s==="read"?"读取中…":"生成中…"); }).then(r=>{
          toast("头像已更新（原图 "+r.w+"×"+r.h+"，存储约 "+r.kb+"KB）");

      };
      $("#cropNo",ov).onpointerdown=()=>{ box.style.display="none"; cropURL=""; cropFile=null;
        if(cropInp){ cropInp.remove(); cropInp=null; } };
    });
  }

/* ==================== NPC 记忆档案 / 数据质量监控（WDMem 面板） ==================== */
function memFmt(s){
  if(s<60) return s+"秒";
  if(s<3600) return Math.floor(s/60)+"分"+(s%60?Math.round(s%60)+"秒":"");
  return Math.round(s/360)/10+"小时";
}
function renderMem(){
  if(!window.WDMem){ toast("记忆模块未装载"); return; }
  SFX.tap();
  const q=WDMem.quality(), db=WDMem.stats();
  const rows=Object.keys(db.byNpc).sort().map(id=>{
    const r=db.byNpc[id], n=NPC[id]||NPC.yunting;
    const done=Object.keys(r.done), one=done.filter(x=>r.done[x].onePass).length;
    let best=1e9; done.forEach(x=>{ const d=r.done[x].durS; if(d>0&&d<best)best=d; });
    const wrongs=Object.keys(r.wrongs).map(k=>[k,r.wrongs[k].n]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const dig=WDMem.digest(id);
    return `<div class="memcard"><b>${esc(dName(id))}</b>${dTitle(id)?" · "+esc(dTitle(id)):""}
      <br>遇见 ${r.meet} · 对话 ${r.talks} · 同行修习 ${Math.round(r.learnMin)} 分钟
      <br>已净化 ${done.length} 个任务（一次通关 ${one}${best<1e9?" · 最快 "+memFmt(best):""}） · 在途 ${Object.keys(r.entered).length}
      ${wrongs.length?"<br>错题集中："+wrongs.map(x=>esc(x[0])+"×"+x[1]).join("、"):""}
      ${dig?`<div class="mdig">AI 认知画像：${esc(dig)}</div>`:""}
    </div>`;
  }).join("")||'<div class="missing">暂无互动档案——去对话流与 NPC 说句话吧。</div>';
  const ov=panel(`<h2>NPC 记忆档案</h2><div class="mt">每个 NPC 独立记忆 · 实时反馈 AI 决策 · 每日自动备份 ×5 份</div>
    <div class="statbar" style="position:static;box-shadow:none;border:0;padding:0;flex-wrap:wrap">
      <span>档案数 <b>${q.npcCount}</b></span><span>占用 <b>${q.bytesKB}KB</b></span>
      <span>校验拒收 <b>${q.rejected}</b></span><span>上次备份 <b>${q.lastBak||"—"}</b></span>
    </div>
    <div class="savegrid" style="margin:8px 0">
      <button class="btn sm" id="memBak" type="button">立即备份</button>
      <button class="btn sm" id="memExp" type="button">导出记忆 JSON</button>
      <button class="btn sm" id="memImp" type="button">导入记忆</button>
    </div>${rows}`);
  $("#memBak",ov).onpointerdown=()=>{ WDMem.backupNow(); SFX.tap(); ov.remove(); renderMem(); toast("已写入今日备份"); };
  $("#memExp",ov).onpointerdown=()=>{ SFX.tap(); downloadFile("wdzx-memory-"+new Date().toISOString().slice(0,10)+".json",WDMem.export()); toast("记忆档案已导出"); };
  $("#memImp",ov).onpointerdown=()=>{ SFX.tap();
    pickFile(".json,application/json",f=>readTextFile(f,t=>{
      try{ WDMem.import(t); ov.remove(); renderMem(); toast("记忆档案导入成功"); }
      catch(e){ toast(cfgErrText(e)); }
    }));
  };
}

function _aiSnapPut(ch,rec){

  const prev=_aiSnap[ch]||{};
  _aiSnap[ch]={at:new Date().toISOString(),model:rec.model||prev.model||"",kind:rec.kind||prev.kind||"",

    json:!!rec.json,tools:!!rec.tools,stream:!!rec.stream,
    ov:!!rec.ov,off:!!rec.off,notsent:!!rec.notsent,preview:!!rec.preview};
  try{
    let raw=JSON.stringify(_aiSnap);

      const ids=Object.keys(_aiSnap).sort((a,b)=>((_aiSnap[a].at||"")<(_aiSnap[b].at||"")?-1:1));
      while(raw.length>AI_SNAP_TOTAL_CAP&&ids.length){ delete _aiSnap[ids.shift()]; raw=JSON.stringify(_aiSnap); }
