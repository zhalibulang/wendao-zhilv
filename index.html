/* 角色别名 → npcId（含全名与常用称呼，均取自 D.npcs 真实名，避免错字） */
/* v2（R2.1）：@提及别名从角色注册表派生 */
const MENTION_ALIASES=(window.WDRegistry&&WDRegistry.aliasMap())||{};
function parseMention(text){
  const m=/@([A-Za-z0-9_\u4e00-\u9fa5]{2,8})/.exec(text);
  if(!m) return null;
  const tok=m[1];
  // @所有人/各位/全员/大家 → 全员应答
  if(/^(所有人|各位|全员|大家|全部|所有人呢|都有)$/.test(tok)) return "__ALL__";
  for(const id in MENTION_ALIASES){ if(MENTION_ALIASES[id].some(a=>tok===a||tok.startsWith(a)||a.startsWith(tok)&&tok.length>=2)) return id; }
  // 玩家自定义名/称号同样可被 @ 触发（ID 仍为系统固定值）
  if(window.WDCfg){
    for(const id of Object.keys(NPC)){
      const cn=WDCfg.npcName(id,""), ct=WDCfg.npcTitle(id,"");
      if((cn&&(tok===cn||tok.startsWith(cn)))||(ct&&(tok===ct||tok.startsWith(ct)))) return id;
    }
  }
  return null;
}

/* ==================== @ 提及弹窗选单 ==================== */
let _mentionPop=null;
const _mentionState={open:false,atPos:-1,token:"",list:[],sel:0};

function filterMentionList(token){
  const t=(token||"").trim();
  const out=[];
  const allKw=["所有人","各位","全员","大家","全部"];
  if(!t||allKw.some(k=>k.startsWith(t)||(t.length>=2&&k.includes(t)))){
    out.push({id:"__ALL__",name:"所有人",title:"全员应答",kind:"all"});
  }
  const seen=new Set(["__ALL__"]);
  for(const id in MENTION_ALIASES){
    const aliases=MENTION_ALIASES[id]||[];
    const hit=!t||aliases.some(a=>a===t||a.startsWith(t)||(t.length>=2&&a.includes(t)));
    if(!hit||seen.has(id)) continue;
    seen.add(id);
    out.push({id,name:dName(id),title:dTitle(id),kind:"npc"});
  }
  return out;
}

function insertMention(value,atPos,endPos,name){
  const before=value.slice(0,atPos+1);
  const after=value.slice(endPos);
  const next=before+name+after;
  return{value:next,caret:(before+name).length};
}

function onChatInput(inp){
  const pos=inp.selectionStart??inp.value.length;
  const upTo=inp.value.slice(0,pos);
  const m=upTo.match(/@([^\s@，。、,；;:！？!?]{0,8})$/);
  if(!m){closeMention();return;}
  _mentionState.atPos=m.index;
  _mentionState.token=m[1];
  openMention(inp,m[1]);
}

function openMention(inp,token){
  const list=filterMentionList(token);
  if(!list.length){closeMention();return;}
  _mentionState.list=list;_mentionState.sel=0;_mentionState.open=true;
  if(!_mentionPop){
    _mentionPop=document.createElement("div");
    _mentionPop.className="mention-pop";
    Object.assign(_mentionPop.style,{
      position:"absolute",zIndex:"9999",maxHeight:"42vh",overflowY:"auto",
      background:"var(--bg)",border:"1px solid var(--border-lit)",
      borderRadius:"6px",boxShadow:"0 2px 12px rgba(0,0,0,.35)",
      fontSize:"13px",fontFamily:"zpix,monospace",minWidth:"160px",
      padding:"4px"
    });
    document.body.appendChild(_mentionPop);
  }
  renderMentionList(inp);
  positionMention(inp);
}

function renderMentionList(inp){
  const items=_mentionState.list.map((it,i)=>{
    const sel=i===_mentionState.sel;

      +'<b>'+esc(it.name)+'</b> <span style="opacity:.7;font-size:11px">'+esc(it.title)+'</span></div>';
  }).join("");

function positionMention(inp){
  const r=inp.getBoundingClientRect();
  const popH=Math.min(_mentionPop.offsetHeight||160,220);
  _mentionPop.style.left=r.left+"px";
  _mentionPop.style.top=(r.top-popH-4)+"px";
  _mentionPop.style.width=Math.max(r.width,160)+"px";
}

function handleMentionKey(e,inp){
  if(!_mentionState.open) return false;
  const n=_mentionState.list.length;
  if(e.key==="ArrowDown"){e.preventDefault();_mentionState.sel=(_mentionState.sel+1)%n;renderMentionList(inp);return true;}
  if(e.key==="ArrowUp"){e.preventDefault();_mentionState.sel=(_mentionState.sel-1+n)%n;renderMentionList(inp);return true;}
  if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();selectMention(inp,_mentionState.sel);return true;}
  if(e.key==="Escape"){e.preventDefault();closeMention();return true;}
  return false;
}

function selectMention(inp,idx){
  const it=_mentionState.list[idx];if(!it) return;
  const end=inp.selectionStart??inp.value.length;
  const r=insertMention(inp.value,_mentionState.atPos,end,it.name);
  inp.value=r.value;
  try{inp.setSelectionRange(r.caret,r.caret);}catch(e){}
  closeMention();
  inp.focus();
}

function closeMention(){
  _mentionState.open=false;_mentionState.list=[];_mentionState.sel=0;_mentionState.atPos=-1;_mentionState.token="";
  if(_mentionPop){_mentionPop.remove();_mentionPop=null;}
}

const DEFAULT_INTRO_NARRATIVE="你意外降临「导游世界」——一个正被遗忘之雾吞噬的娘化世界。所有居民皆为女性，唯独你是男性外来者。这座次元最后的净土是北京。圣女云汀正在此举行神圣导游就职典礼，却在仪式中途遭遗忘之雾侵袭——你的降临打断了仪式，却也让你与云汀形成了绑定。次元精灵缇娜也在混乱中与你意外建立灵魂契约。四十五日之内，完成五幕试炼、踏上金榜台就职神圣导游，云汀就能恢复圣女之力，用导游圣器驱逐遗忘之雾。";
/* 从自定义世界观文本里取序章用的叙事开头：取前 2 个完整句、≤180 字；不足 10 个汉字视为无效 */
function narrativeLead(raw,prefix){
  const body=String(raw||"").replace(/[「」『』【】]/g,"").replace(/\s+/g," ").trim();
  const cjk=(body.match(/[\u4e00-\u9fff]/g)||[]).length;
  if(cjk<10) return "";
  const sentences=body.split(/(?<=[。！？!?…])/).map(s=>s.trim()).filter(Boolean);
  let out="";
  for(const s of sentences){
    if((out+s).length>180) break;
    out+=s;
    if(out.length>=60) break;   /* 已够一段，不必凑满 */
  }
  if(!out) out=body.slice(0,180);
  return (prefix||"")+out;
}
/* 递归收集 JSON brief 中的字符串值，优先取叙事性键名 */
function narrativeFromJson(obj){
  const KEYS=/世界观|世界设定|背景|故事|序章|简介|概述|设定|world|story|intro|setting/i;
  const found=[];
  const walk=o=>{
    if(o==null) return;
    if(typeof o==="string"){ return; }
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(typeof o==="object"){
      for(const k of Object.keys(o)){
        const v=o[k];
        if(typeof v==="string"){
          const cjk=(v.match(/[\u4e00-\u9fff]/g)||[]).length;
          if(cjk>=10) found.push({key:k,text:v,prio:KEYS.test(k)?0:1});
        }else if(typeof v==="object") walk(v);
      }
    }
  };
  walk(obj);
  if(!found.length) return "";
  found.sort((a,b)=>a.prio-b.prio||b.text.length-a.text.length);
  return narrativeLead(found[0].text);
}
function introNarrative(){
  /* v31：自定义 brief 可能是多行散文，也可能是配置面板里保存的 JSON（以「{」开头）；
     两种都要能取出一段人话；取不出有效叙事就回退默认长段，绝不能把「{」显示到序章 */
  try{
    const custom=(window.WDCfg&&WDCfg.customWorldBrief)?WDCfg.customWorldBrief():null;
    if(custom&&custom.trim()){
      const wb=WDChat.worldBrief();
      let lead="";
      if(typeof wb==="string"&&wb.trim()){
        const s=wb.trim();
        if(s[0]==="{"||s[0]==="["){ try{ lead=narrativeFromJson(JSON.parse(s)); }catch(e){} }
        if(!lead) lead=narrativeLead(s);
      }else if(wb&&typeof wb==="object"){
        lead=narrativeFromJson(wb);
      }
      /* v36：过滤 NPC 人设污染——如果 lead 里包含大量"X导游，XXXX"模式（NPC 列表描述），
         那是用户把 NPC 人设混在了世界观里，回退到默认叙事 */
      if(lead){
        const npcNoise=(lead.match(/导游/g)||[]).length;
        if(npcNoise>=3||/主引导导游|英语导游|藏经阁守护|英语导游|次元精灵|旅行社老板/.test(lead)&&/成熟|知性|腹黑|活泼|豪爽|温婉|机灵|神秘|妩媚|冷面/.test(lead)){
          lead="";
        }
      }
      if(lead) return lead;
    }
  }catch(e){}
  return DEFAULT_INTRO_NARRATIVE;
}

function renderTreeNode(node){

  return `<div class="tnode" data-level="${node.level}" data-has-children="${hasKids}" data-expanded="${expanded}" data-tid="${esc(node.id)}">
    <div class="trow${stateCls}${leafCls}" ${node.leaf?`data-leaf="${esc(node.id)}"`:`data-toggle="${esc(node.id)}"`}>

function bindTree(container, onLeaf){
  container.onpointerdown=e=>{
    /* 先查叶子：叶子行已不挂 data-toggle，此处顺序双保险 */
    const leaf=e.target.closest("[data-leaf]");
    if(leaf){ e.stopPropagation(); SFX.tap(); onLeaf&&onLeaf(leaf.dataset.leaf); return; }
    const tog=e.target.closest("[data-toggle]");

      const n=tog.closest(".tnode"); if(!n) return;

/* 构建 阶段→自然日(周)→游戏日→任务 四级树（v53：225 游戏日重排后） */
function questsOfGd(d, gd){
  /* d.gameDays 存 quest id 字符串数组，这里解析成 quest 对象数组 */
  const gdo=(d.gameDays||[]).find(g=>g.gd===gd);
  if(!gdo) return [];
  return (gdo.quests||[]).map(id=>QMAP[id]).filter(Boolean);
}
function buildQuestTree(){
  return STAGES.map(s=>{
    const days=DAYS.filter(d=>d.day>=s.days[0]&&d.day<=s.days[1]);
    let stgDone=0, stgAll=0;
    const dayNodes=days.map(d=>{
      const prog=dayProg(d); stgDone+=prog.n; stgAll+=prog.all;
      const isCur = d.day===st.day;
      /* 游戏日节点：本周 5 个游戏日（3 学习 + 2 休息） */
      const gdNodes=(d.gameDays||[]).map(g=>{
        const gqs=questsOfGd(d,g.gd);
        const gdDone=gqs.length?gqs.every(q=>qDone(q.id)):false;
        const gdLabel=g.kind==="study"
          ?`纪日 ${g.gd} · 学习`
          :`纪日 ${g.gd} · 休息`;
        const gdMeta=g.kind==="study"
          ?`${gdDone?'✓':gqs.length?(gqs.filter(q=>qDone(q.id)).length+"/"+gqs.length):'—'}`
          :"可约会 · 回访";
        const qNodes=gqs.map(q=>{
          const s2=qStage(q);
          return {id:q.id, level:3, leaf:true, state:s2.key, label:q.name, meta:q.tlabel+"·"+q.dur+"分"};
        });
        return {id:"gd:"+d.day+":"+g.gd, level:2, label:gdLabel, meta:gdMeta,
          state: g.kind==="rest"?"rest":(gdDone?"done":(isCur?"cur":"")),
          _defaultOpen:isCur, children:qNodes};
      });
      return {id:"day:"+d.day, level:1, label:`次元内 第 ${d.day} 周`, meta:prog.n+"/"+prog.all,
        state: prog.n===prog.all?"done":(isCur?"cur":""), _defaultOpen:isCur, children:gdNodes};
    });
    return {id:"stage:"+s.id, level:0, label:`第${s.id}阶段 · ${s.name}（第${s.days[0]}-${s.days[1]}周）`, meta:stgDone+"/"+stgAll,
      plot:s.plot, state: stgDone===stgAll?"done":"", _defaultOpen:true, children:dayNodes};
  });
}

/* v52 R6a：体量核查——遍历六篇输出 words/sections，缺篇缺段告警 */
function auditOralCoverage(){
  const report=[];
  ORAL_ORDER.forEach(aid=>{

/* v52 R6e：进度结构 st.oralProgress[aid]={read,sectionDone:[idx...],fullCert,fullAt} */
function oralProg(aid){
  st.oralProgress=st.oralProgress||{};
  if(!st.oralProgress[aid]) st.oralProgress[aid]={read:false,sectionDone:[],fullCert:false,fullAt:null};
  return st.oralProgress[aid];
}
function oralSplitSentences(text){
  return String(text||"").replace(/\s+/g," ").split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean);
}
/* 关键词提取：大写专有名词、数字短语、长实词（去停用词），取 n 个 */
const ORAL_STOP=new Set(["the","a","an","and","or","but","of","to","in","on","at","for","with","from","by","as","is","are","was","were","be","been","this","that","these","those","it","its","we","you","your","our","their","his","her","they","them","he","she","will","would","can","could","please","here","there","today","now","have","has","had","do","does","did","not","no","yes","if","then","than","so","such"]);
function oralKeywords(text,n){
  const set=new Set();
  String(text||"").replace(/[^A-Za-z0-9.\s%-]/g," ").split(/\s+/).forEach(w=>{
    const wd=w.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,"");
    if(!wd) return;
    if(/^\d/.test(wd)) { set.add(wd); return; }           /* 数字事实：35 meters、1420 */
    if(/^[A-Z]/.test(wd)&&wd.length>2) { set.add(wd); return; } /* 专有名词 */
    const lw=wd.toLowerCase();
    if(wd.length>=6&&!ORAL_STOP.has(lw)) set.add(wd);       /* 长实词 */
  });
  return [...set].slice(0,n||5);
}
/* 打字/背诵对照评分：归一化后按参考句词命中率（0-100） */
function oralScore(typed, refText){
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9\s'-]/g," ").split(/\s+/).filter(w=>w.length>1);
  const ref=norm(refText), got=norm(typed);
  if(!ref.length||!got.length) return 0;
  const miss={}; ref.forEach(w=>miss[w]=(miss[w]||0)+1);
  let hit=0;
  got.forEach(w=>{ if(miss[w]>0){ hit++; miss[w]--; } });
  return Math.round(hit/ref.length*100);
}
/* v52 R6e：30/45 日吟游学习计划
   30 日基础指标：六篇通读 + 分站段背诵；45 日考核标准：通篇背诵达标。
   按 ORAL_ORDER 将各篇节均摊到 day1-29，day30 分站补漏；day31-44 通篇轮考；day45 抽题模拟。 */
function oralPlanOf(day){
  const d=+day||1;
  if(d===1) return {aid:null,mode:"intro",label:"开场白与 Welcome 段通读 1 遍，出声跟读"};
  const plan=orderedOral();
  if(d<=29){
    /* 天 2-29 共 28 天均摊六篇节：按各篇节数加权切片 */
    const total=plan.reduce((s,o)=>s+o.sections.length,0);
    let acc=0, target=(d-1)/28*total;
    for(const o of plan){
      const start=acc; acc+=o.sections.length;
      if(target<acc){
        const idx=Math.min(o.sections.length-1, Math.floor(target-start));
        return {aid:o.aid,mode:"section",sec:idx,
          label:`《${o.name}》第 ${idx+1}/${o.sections.length} 节「${o.sections[idx].h}」——通读 + 逐句跟读 + 分站背诵`};
      }
    }
    const last=plan[plan.length-1];
    return {aid:last.aid,mode:"section",sec:last.sections.length-1,label:`《${last.name}》末节通读 + 分站背诵`};
  }
  if(d===30) return {aid:null,mode:"sweep",label:"六篇分站背诵补漏：回看所有未达标章节，清零错题"};
  if(d<=44){
    const idx=(d-31)%plan.length;
    const round=Math.floor((d-31)/plan.length)+1;
    const o=plan[idx];
    return {aid:o.aid,mode:"full",round,label:`《${o.name}》通篇背诵考核（第 ${round} 轮）——遮文复述，关键词覆盖 ≥70% 达标`};
  }
  return {aid:null,mode:"mock",label:"官方口试模拟：随机抽 1 景点 7 分钟完整讲解录音自评"};
}

        box.innerHTML=`<div style="font-size:12.5px;color:var(--gold);margin:6px 0">分站背诵考核 · ${esc(s.h)}：先遮英文出声背诵，再打字对照；勾选你确实说出的关键词，≥4/5 或文本覆盖 ≥70% 即达标。</div>
          <textarea data-secinp="${si}" placeholder="凭记忆打出本段英文……" style="width:100%;min-height:90px"></textarea>
          <div class="kwgrid" style="margin:6px 0">${kws.map((k,i)=>`<label style="font-size:12px;margin-right:10px"><input type="checkbox" data-kw="${i}"> ${esc(k)}</label>`).join("")}</div>
          <div class="kitbar"><button class="btn sm primary" data-secsubmit="${si}" type="button">提交考核</button>
          <button class="btn sm ghost" data-secblur="${si}" type="button">遮/显原文</button></div>
          <div data-secres="${si}" style="font-size:12.5px;margin-top:6px"></div>`;
        const sentsWrap=ov.querySelector('[data-sents="'+si+'"]');
        box.querySelector("[data-secblur]").onpointerdown=()=>{
          sentsWrap.style.filter=sentsWrap.style.filter==="blur(6px)"?"":"blur(6px)";
        };
        box.querySelector("[data-secsubmit]").onpointerdown=()=>{
          const typed=box.querySelector("textarea").value;
          const checkedKws=[...box.querySelectorAll("[data-kw]:checked")].length;
          const score=oralScore(typed,en);
          const pass=checkedKws>=4||score>=70;
          if(pass&&!prog.sectionDone.includes(si)){ prog.sectionDone.push(si); save(); }
          box.querySelector('[data-secres]').innerHTML=
            `<span style="color:${pass?"var(--ok)":"var(--gold)"}">${pass?"✓ 分站达标":"未达标"}</span> · 文本覆盖 ${score}% · 关键词 ${checkedKws}/5${pass?"（已记录，继续下一节）":"——再读两遍后重试"}`;
          if(pass){ setTimeout(render,700); }
        };
      };
    });
    /* 通篇背诵考核：遮全篇 + 打字对照整篇关键词，覆盖 ≥70 达标 → fullCert */
    ov.querySelector("[data-fulltest]").onpointerdown=()=>{
      const full=en0(o);
      const kws=oralKeywords(full,15);
      const box=document.createElement("div");
      box.className="ov";
      box.innerHTML=`<div class="dlg" style="max-width:760px"><button class="close" type="button">×</button>
        <h2>通篇背诵考核 · ${esc(o.name)}</h2>
        <div class="mt" style="font-size:12.5px;color:var(--dim)">遮去全文，凭记忆打出完整导游词（或先出声背诵录音，再打字对照）。参考词覆盖 ≥70% 即通过。</div>
        <textarea id="ftInp" placeholder="Type the full guide from memory…" style="width:100%;min-height:240px;margin:8px 0"></textarea>
        <div class="kitbar"><button class="btn sm primary" id="ftSubmit" type="button">提交通篇考核</button>
        <button class="btn sm ghost" id="ftRec" type="button">🎙️ 录音自评（可选）</button>
        ${asrSupport()?'<button class="btn sm ghost" id="ftAsr" type="button">🗣️ 语音转写</button>':""}
        <span id="ftRecSt" style="font-size:11.5px;color:var(--dim)"></span></div>
        <div id="ftRes" style="font-size:13px;margin-top:8px"></div></div>`;
      document.body.appendChild(box);
      box.querySelector(".close").onpointerdown=()=>box.remove();
      /* 最小录音：MediaRecorder 录后可自评播放，不做 ASR */
      let mediaRec=null, chunks=[], recUrl=null;
      box.querySelector("#ftRec").onpointerdown=function(){
        const stEl=box.querySelector("#ftRecSt");
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ stEl.textContent="当前环境不支持录音，请用打字对照"; return; }
        if(!mediaRec){
          navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
            chunks=[]; mediaRec=new MediaRecorder(stream);
            mediaRec.ondataavailable=e=>chunks.push(e.data);
            mediaRec.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); recUrl=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));
              stEl.innerHTML='<audio controls src="'+recUrl+'"></audio> 回放自评后，再打字对照'; };
            mediaRec.start(); this.textContent="■ 停止录音"; stEl.textContent="录音中……";
          }).catch(()=>stEl.textContent="麦克风不可用，请用打字对照");
        } else { mediaRec.stop(); mediaRec=null; this.textContent="🎙️ 录音自评（可选）"; }
      };
      /* 批5：语音转写——边诵边把转写文本填入对照框（识别失败静默回退打字） */
      const ftAsr=box.querySelector("#ftAsr");
      if(ftAsr) ftAsr.onpointerdown=function(){
        SFX.tap();
        const stEl=box.querySelector("#ftRecSt"), ta=box.querySelector("#ftInp");
        if(this._rec){ try{this._rec.stop();}catch(e){} this._rec=null; this.textContent="🗣️ 语音转写"; return; }
        const rec=asrOnce("en-US",(fin,inter)=>{
          const piece=(fin||inter||"").trim(); if(!piece) return;
          ta.value=(ta.value&&!/\s$/.test(ta.value)?ta.value+" ":"")+piece;
        },(msg)=>{ stEl.textContent=msg; });
        if(!rec) return;
        this._rec=rec; this.textContent="■ 结束转写"; stEl.textContent="转写中……诵读即可，说完再点一次结束";
        try{ rec.start(); }catch(e){ stEl.textContent="启动失败，请直接打字"; this._rec=null; this.textContent="🗣️ 语音转写"; }
      };
      box.querySelector("#ftSubmit").onpointerdown=()=>{
        const typed=box.querySelector("#ftInp").value;
        const score=oralScore(typed,full);
        const kwHit=kws.filter(k=>typed.toLowerCase().includes(k.toLowerCase())).length;
        const pass=score>=70;
        if(pass){ prog.fullCert=true; prog.fullAt=new Date().toISOString(); save(); }
        box.querySelector("#ftRes").innerHTML=
          `<div style="color:${pass?"var(--ok)":"var(--gold)"};font-size:15px;margin-bottom:6px">${pass?("✓ 通篇背诵达标！已计入 "+esc(o.name)+" 通关凭证"):("未达标 · 参考词覆盖 "+score+"%")}</div>
           <div style="font-size:12px;color:var(--dim)">关键词命中 ${kwHit}/${kws.length}：${kws.map(k=>`<span style="margin-right:6px;color:${typed.toLowerCase().includes(k.toLowerCase())?"var(--ok)":"var(--gold)"}">${esc(k)}</span>`).join("")}</div>
           ${pass?'<div style="margin-top:6px">吟游卷此篇已成诵——30/45 日进度已记录。</div>':"<div style='margin-top:6px'>建议：先回各节做分站背诵，再回来通篇考核。</div>"}`;
        if(pass) setTimeout(()=>{box.remove();render();},1500);
      };
    };
  }
  /* v58：通篇考核基准=各节最新校订版逐段拼接 */
  function en0(x){ return x.sections.map((s,si)=>getEdit("full:"+x.id+":"+si,String(s.text||s.en||""))).join(" "); }
  document.body.appendChild(ov); render();
}
function renderOralLine(){
  const stream=$("#stream");
  // 严格按日顺序（即原有先后与依赖），分离所有 oral 任务
  const orals=D.quests.filter(q=>q.type==="oral").sort((a,b)=>a.day-b.day||a.id.localeCompare(b.id));
  const doneN=orals.filter(q=>qDone(q.id)).length;
  const pct=Math.round(doneN/orals.length*100);
  // 按幕分组展示顺序链
  const groups=[];
  orals.forEach(q=>{
    const sg=stageOfDay(q.day);
    let g=groups.find(x=>x.stage===sg.id);
    if(!g){ g={stage:sg.id, stageName:sg.name, items:[]}; groups.push(g); }
    g.items.push(q);
  });
  groups.sort((a,b)=>a.stage-b.stage);
  const listHtml=groups.map(g=>{
    const rows=g.items.map((q,i)=>{
      const s=qStage(q);
      let btn;
      if(s.key==="done") btn=`<button class="btn sm ghost" data-oral="${q.id}" type="button">回看</button>`;
      else if(s.key==="active") btn=`<button class="btn sm primary" data-oral="${q.id}" type="button">进入背诵</button>`;
      else{
        /* v52 R6：明示解锁条件，不再让玩家猜前置 */
        const prevs=(q.prev||[]).map(p=>QMAP[p]?QMAP[p].name:p).filter(Boolean);
        const need=prevs.length?`需先完成：${prevs.join("、")}`:`主线推进至第 ${q.day} 日`;
        btn=`<span style="font-size:11px;color:var(--dim)" title="${esc(need)}">🔒 ${esc(need.length>14?need.slice(0,14)+"…":need)}</span>`;
      }
      return `<div class="qrow oral ${s.key}" style="border-left:3px solid var(--cyber)">
        <span class="qstage">${s.label}</span>
        <div class="qinfo"><div class="qn">次元内第${q.day}周 · 纪日${q.gd||((q.day-1)*5+1)} · ${esc(q.name)}</div>
        <div class="qmeta">${fmtDur(q.dur)} · 出声朗读 + 复述自评</div></div>
        <span class="qrew">+${q.xp}修行</span>
        ${btn}
      </div>`;
    }).join("");
    return `<div class="boardgroup"><h3>第${g.stage}阶段 · ${esc(g.stageName)}</h3>${rows}</div>`;
  }).join("");

  // v52 R6：六篇学习总进度（分站背诵 / 通篇考核）
  const six=orderedOral();
  const secTot=six.reduce((s,o)=>s+o.sections.length,0);
  const secDone=six.reduce((s,o)=>s+oralProg(o.aid).sectionDone.length,0);
  const certN=six.filter(o=>oralProg(o.aid).fullCert).length;
  const sixPct=Math.round((secDone/secTot)*100);
  /* v52 R6e：今日吟游安排（30/45 日计划） */
  const plan=oralPlanOf(st.day);
  const planO=plan.aid?oralByIdAid(plan.aid):null;
  const planHtml=`<div class="boardgroup" style="border-color:var(--gold)">
    <h3>今日吟游 · 次元内第 ${st.day}/45 周${planO?" · "+esc(planO.name):""}</h3>
    <div class="qrow oral active" style="border-left:3px solid var(--gold)">
      <div class="qinfo"><div class="qn">${esc(plan.label)}</div>
      <div class="qmeta">30 日：六篇通读+分站背诵成基础；45 日：通篇背诵达考核标准</div></div>
      ${planO?`<button class="btn sm primary" data-study="${planO.aid}" type="button">进入修习室</button>`
        :`<button class="btn sm ghost" data-study="${six[0]?six[0].aid:"GUG"}" type="button">打开吟游卷</button>`}
    </div></div>`;

  /* v52 R6b/c：六篇吟游卷——ORAL_ORDER 排序（故宫首位），主入口=吟游修习室（站/段/句+四模式） */
  const fullHtml=`<div class="boardgroup"><h3>吟游卷 · 六篇（起点：故宫）</h3>
    <div class="lmrow"><span>分站背诵进度</span><span>${secDone}/${secTot} 节 · ${sixPct}%${certN?` · 通篇 ${certN}/6`:""}</span></div>
    <div class="oralprog" style="margin-bottom:8px"><div style="width:${sixPct}%"></div></div>
    <div class="entrygrid">${six.map((o,i)=>{
      const pg=oralProg(o.aid);
      return `<div class="entrybtn" style="text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px" data-study="${o.aid}">
        <span class="ei">${pg.fullCert?"🏅":(pg.sectionDone.length?"📖":"🔖")}</span>
        <b>${i===0?"① ":""}${esc(o.name)}</b>
        <span style="font-size:10px;opacity:.78">${o.words}词 · ${o.sections.length}节</span>
        <span style="font-size:10px;color:${pg.fullCert?"var(--ok)":"var(--neon)"}">分站 ${pg.sectionDone.length}/${o.sections.length} · 通篇 ${pg.fullCert?"✓":"—"}</span>
        <span style="font-size:10px;opacity:.6" data-liblink="${o.aid}">藏经阁校订 ↗</span>
      </div>`;
    }).join("")}</div>
    <div class="ad">点卡片进入「吟游修习室」：阅读（中英对照）/ 逐句点读遮英复述 / 分站背诵考核 / 通篇背诵考核。右下角小字可跳藏经阁校订原文。</div>
  </div>`;

  stream.innerHTML=`
  <div class="sys daysep">吟游 · 英文导游词任务线</div>
  <div class="boardgroup">
    <div class="lmrow"><span>主线内吟游任务进度</span><span>${doneN}/${orals.length} · ${pct}%</span></div>
    <div class="oralprog"><div style="width:${pct}%"></div></div>
    <div class="ad">六篇导游词自成一线：故宫为起点，按 故宫→天安门→天坛→颐和园→长城→明十三陵 推进；主线推进到对应周目，吟游任务即解锁（不再被前序链卡死）。</div>
  </div>
  ${planHtml}
  ${fullHtml}
  ${listHtml}`;

  stream.querySelectorAll("[data-oral]").forEach(b=>b.onpointerdown=()=>{ SFX.tap(); openQuest(b.dataset.oral); });
  /* v52 R6：修习室入口（整卡可点） */
  stream.querySelectorAll("[data-study]").forEach(el=>{
    el.onpointerdown=e=>{
      if(e.target.closest("[data-liblink]")) return; /* 藏经阁链接单独处理 */
      SFX.tap(); openOralStudy(el.dataset.study);
    };
  });
  /* 藏经阁校订入口（保留旧能力） */
  stream.querySelectorAll("[data-liblink]").forEach(a=>{
    a.onpointerdown=e=>{
      e.stopPropagation(); SFX.tap();
      const aid=a.dataset.liblink;
      const idx=D.oralFull.findIndex(o=>o.aid===aid||o.id===ORAL_AID2ID[aid]);
      if(idx<0) return;
      const cards=buildCardPool();
      const target=cards.findIndex(c=>c.cat==="full" && c.id.startsWith(D.oralFull[idx].id+" §1"));
      st._libCat="full"; st._libQ=""; st._libIdx= target>=0?target:0; save();
      switchView("lib");
    };
  });
}
function renderCal(){
  const acts=[["act1","结界巡礼",1,8],["act2","藏经阁",9,20],["act3","行会风云",21,30],["act4","遗迹探秘",31,41],["act5","金榜台前",42,45]];
  const scene={act1:"M12 3 L20 17 H4 Z",act2:"M9 20 V8 L12 4 L15 8 V20 M6 20 H18",act3:"M4 20 V10 Q12 2 20 10 V20",act4:"M5 20 Q5 8 12 8 Q19 8 19 20 M12 8 V20",act5:"M6 20 V12 L12 6 L18 12 V20 H6 Z"};
  let h='<div class="dayinfo">旅程地图 · 九阶段 · 四十五周目 · 点击节点前往</div><div class="journey">';
  acts.forEach(function(a2){
    const aid=a2[0], aname=a2[1], a2a=a2[2], b2=a2[3];
    h+='<div class="jrow"><div class="jact"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="'+scene[aid]+'"/></svg><div class="an">'+esc(aname)+'</div></div><div class="jnodes">';
    for(let i=a2a;i<=b2;i++){
      const dd=byDay[i], pp=dayProg(dd);
      let cls = i===st.day?"cur":(i>st.unlocked?"future":(pp.n===pp.all&&pp.all>0?"done":(pp.n>0?"part":"")));
      const isBoss=dd.quests.some(q2=>q2.type==="boss"&&q2.kind==="main");
      h+='<div class="jnode '+cls+(isBoss?" boss":"")+'" data-day="'+i+'">'+i+'</div>';
    }
    h+='</div></div>';
  });
  h+='</div><div class="note">图例：墨块=圆满 · 朱框=今日 · 浅朱=进行中 · 双框=章节大试炼 · 半透明=未解锁</div>';
  const ov=panel('<h2>旅程</h2><div class="mt">九阶段 · 四十五周目 · 次元内第'+st.day+'周 · 纪日'+(st.gameDay||((st.day-1)*5+1))+'/225（已解锁至第'+st.unlocked+'周）</div>'+h);
  ov.querySelectorAll("[data-day]").forEach(n=>{
    n.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const day=+n.dataset.day;
      if(day>st.unlocked){ return; }
      st.day=day; save();
      ov.remove();
      document.querySelectorAll(".navline button").forEach(x=>x.classList.toggle("on",x.dataset.v==="chat"));
      view="chat";
      renderChat();
    });
  });
}
boot();
/* v2（R3.3）：主动触发器——boot 后 30s 检查一次（本地规则零成本，每日 ≤3 条，可在配置中心关闭） */
setTimeout(()=>{
  try{
    if(window.WDChat&&WDChat.checkProactive){
      const p=WDChat.checkProactive();
      if(p&&p.npc&&NPC[p.npc]){
        const aqP=firstActiveQuest();
        const m={role:"npc",npc:p.npc,text:p.text,at:new Date().toISOString(),day:st.day,proactive:p.reason};
        if(aqP) m.refs=[{qid:aqP.id}];
        st.dialogue.push(m);
        if(st.dialogue.length>200) st.dialogue=st.dialogue.slice(-200);
        save(); if(view==="chat") renderChat(true);
        toast(dName(p.npc)+"主动传音……","gold");
      }
    }
  }catch(e){}
},30000);
/* v2（R1.3b）：AI 健康徽标——对话页顶部状态点；aiHealth 由 dsChat 维护 */
window.addEventListener("wd:aicheck",()=>{ if(view==="chat") renderChat(true); });
// 注册 Service Worker 实现 PWA 离线 + 自动更新
// 关键：新 SW 激活时上报缓存版本，页面对比版本差异后精准重载一次——
// 否则大陆网络访问 github.io 不稳定时，旧 SW 会永远回落陈旧缓存（iPad 不刷新的根因）
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if(d.type === "swv" && d.v){
      const prev = localStorage.getItem("wdzx_swv");
      if(prev && prev !== d.v){ location.reload(); return; }
      localStorage.setItem("wdzx_swv", d.v);
    }
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      // 启动即检查 sw.js 更新；之后每 10 分钟再查一次（iOS 独立 PWA 无导航期更新保障）
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 10 * 60 * 1000);
      window.__wdzxReg = reg;
    }).catch(() => {});
  });
}
